. Asesora y asiste a los titulares de datos recibiendo denuncias y reclamos.", "lista": {"titulo": "Funciones de la AAIP (material, art. 29)", "items": ["Lleva el registro de las bases de datos.", "Asesora a los titulares.", "Recibe denuncias y reclamos contra los responsables de bases de datos.", "Aplica las sanciones administrativas."]}, "ejemplo": null, "articulos": ["Art. 29 Ley 25.326"], "fuente": "PPT+material", "ubicacion": "PPT slide 9; material p. 4", "alerta": null, "evidencia": [], "agregado": false, "b": 13, "nucleo": false}, {"id": "u13-dato", "seccion": "Conceptos", "termino": "Dato", "pregunta": "¿Qué es un dato?", "definicion": "Es el antecedente necesario para llegar al conocimiento exacto de una cosa.", "lista": null, "ejemplo": null, "articulos": [], "fuente": "PPT", "ubicacion": "PPT slide 7; material p. 2", "alerta": null, "evidencia": [], "agregado": false, "b": 13, "nucleo": false}, {"id": "u13-dato-personal", "seccion": "Conceptos", "termino": "Datos personales", "pregunta": "¿Qué es un dato personal?", "definicion": "Información de cualquier tipo referida a personas humanas o jurídicas determinadas o determinables.", "lista": null, "ejemplo": "Material: la palabra clave es «determinable»; no hace falta que figure el nombre. Un número de legajo, una dirección IP o una patente pueden identificar a alguien.", "articulos": ["Art. 2 Ley 25.326"], "fuente": "PPT+material", "ubicacion": "PPT slide 7; material p. 2", "alerta": null, "evidencia": ["quiz13", "tp7"], "agregado": false, "b": 13, "nucleo": true}, {"id": "u13-dato-sensible", "seccion": "Conceptos", "termino": "Datos sensibles", "pregunta": "¿Qué es un dato sensible?", "definicion": "Datos personales que revelan origen racial y étnico, opiniones políticas, convicciones religiosas, filosóficas o morales, afiliación sindical e información sobre la salud o la vida sexual.", "lista": {"titulo": "Revelan", "items": ["Origen racial y étnico", "Opiniones políticas", "Convicciones religiosas, filosóficas o morales", "Afiliación sindical", "Información sobre la salud", "Información sobre la vida sexual"]}, "ejemplo": "Material: tienen protección reforzada porque con ellos se puede discriminar a una persona. Biométricos (huella, rostro, iris) y geolocalización: la ley actual no los nombra; la reforma apunta a reconocerlos.", "articulos": ["Art. 2 Ley 25.326"], "fuente": "PPT+material", "ubicacion": "PPT slide 7; material p. 6", "alerta": null, "evidencia": ["quiz13", "tp7"], "agregado": false, "b": 13, "nucleo": true}, {"id": "u13-titular-usuario-responsable", "seccion": "Conceptos", "termino": "Titular, usuario y responsable de archivos", "pregunta": "¿Quién es el titular de los datos, el usuario y el responsable de archivos?", "definicion": "Titular: persona física o jurídica, cuyos datos sean objeto del tratamiento al que refiere la ley. Usuario: persona física o jurídica, pública o privada, que realice a su arbitrio tratamiento de datos. Responsables de archivos: persona física o de existencia ideal pública o privada, que es titular de un archivo, registro, base o banco de datos.", "lista": {"titulo": "Titular vs usuario vs responsable", "items": ["Titular de los datos: la persona protegida, a la que los datos pertenecen.", "Usuario: quien realiza el tratamiento, en bases propias o conectándose a bases de terceros (material).", "Responsable: titular de la base; quien decide para qué y cómo se usan los datos (material).", "Encargado del tratamiento (solo material): tercero que trata datos por cuenta del responsable, p. ej. empresa de nube o proveedor de software (art. 25)."]}, "ejemplo": "Material: no confundan al titular de la base (el responsable) con el titular de los datos (la persona protegida): significan lo opuesto.", "articulos": ["Art. 2 Ley 25.326", "Art. 25 Ley 25.326"], "fuente": "PPT+material", "ubicacion": "PPT slides 7-8; material pp. 5 y 11", "alerta": null, "evidencia": ["tp7"], "agregado": false, "b": 13, "nucleo": true}, {"id": "u13-archivo-tratamiento", "seccion": "Conceptos", "termino": "Archivo, registro, banco o base de datos / Tratamiento de datos", "pregunta": "¿Qué es un archivo o base de datos y qué es el tratamiento de datos?", "definicion": "Archivo, registro, banco o base de datos: conjunto organizado de datos personales que sean objeto de tratamiento o procesamiento, cualquiera que fuere la modalidad de su formación, almacenamiento, organización o acceso. Tratamiento de datos: operaciones y procedimientos sistemáticos, que permitan la recolección, conservación, ordenación, almacenamiento y en general el procesamiento de datos, así como también su cesión a terceros.", "lista": {"titulo": "Archivo vs tratamiento", "items": ["Qué es: archivo = el conjunto organizado (la cosa); tratamiento = las operaciones sobre los datos (la actividad).", "Material: archivo, registro, base o banco son, para la ley, lo mismo; da igual que sea una planilla de papel o una base en la nube.", "Material: el tratamiento incluye además modificar, evaluar, bloquear y destruir; casi cualquier cosa que un sistema haga con un dato personal es tratamiento."]}, "ejemplo": null, "articulos": ["Art. 2 Ley 25.326"], "fuente": "PPT+material", "ubicacion": "PPT slide 8; material p. 4", "alerta": "Verificado sobre la imagen del slide 8: el PPT asigna «Conjunto organizado de datos personales…» a ARCHIVO, REGISTRO, BANCO O BASE DE DATOS y «Operaciones y procedimientos sistemáticos…» a TRATAMIENTO DE DATOS. Material (p. 4, art. 2): misma asignación. PPT y material coinciden; si alguna extracción de texto o resumen los muestra cruzados, es un error de lectura del slide, no de la fuente.", "evidencia": [], "agregado": false, "b": 13, "nucleo": true}, {"id": "u13-disociacion", "seccion": "Conceptos", "termino": "Disociación de datos", "pregunta": "¿Qué es la disociación de datos?", "definicion": "Todo tratamiento de datos personales de manera que la información obtenida no pueda asociarse a persona determinada o determinable.", "lista": null, "ejemplo": "Material: disociar es, básicamente, anonimizar; permite usar datos (Big Data, IA, estadística) sin violar la intimidad. Datos disociados se pueden ceder sin consentimiento (art. 11, inc. 3, e).", "articulos": ["Art. 2 Ley 25.326"], "fuente": "PPT+material", "ubicacion": "PPT slide 8; material pp. 5 y 10", "alerta": null, "evidencia": ["quiz13"], "agregado": false, "b": 13, "nucleo": true}, {"id": "u13-destinados-informes", "seccion": "Conceptos", "termino": "Destinados a proveer informes", "pregunta": "¿Qué significa que un archivo o base de datos esté destinado a proveer informes?", "definicion": "Estar destinados a dar informes significa que un archivo, registro o banco de datos se crea con el propósito de generar información y descripciones sobre personas, ya sea para uso interno de una organización o para compartirla con terceros. La ley de protección de datos personales en Argentina exige que estos bancos de datos se inscriban en el Registro Nacional de Bases de Datos Personales y que se proteja la información de las personas que los componen.", "lista": null, "ejemplo": null, "articulos": ["Arts. 21 y 24 Ley 25.326"], "fuente": "PPT", "ubicacion": "PPT slide 9; material p. 5", "alerta": null, "evidencia": ["quiz13"], "agregado": false, "b": 13, "nucleo": true}, {"id": "u13-honor-intimidad", "seccion": "Conceptos", "termino": "Derecho al honor y a la intimidad", "pregunta": "¿Qué protege el derecho al honor y qué el derecho a la intimidad?", "definicion": "El derecho al honor protege la reputación y la dignidad de una persona, mientras que el derecho a la intimidad protege el ámbito privado de su vida, permitiéndole controlar la información que desea compartir. Ambos son derechos fundamentales que impiden injerencias arbitrarias o ataques ilegales a la persona y su esfera personal, y ambos tienen protección legal.", "lista": null, "ejemplo": null, "articulos": ["Art. 19 CN", "Art. 11 Convención Americana sobre Derechos Humanos", "Arts. 52 y 1770 CCyC"], "fuente": "PPT+material", "ubicacion": "PPT slide 10; material pp. 2-3", "alerta": null, "evidencia": [], "agregado": false, "b": 13, "nucleo": true}, {"id": "u13-por-que-protegemos", "seccion": "Principios generales", "termino": "¿Por qué protegemos datos?", "pregunta": "¿Por qué el derecho protege los datos?", "definicion": "Se trata de proteger los datos, en su carácter de medios, porque manipulando datos es posible dañar otros bienes jurídicos valiosos.", "lista": {"titulo": "Bienes jurídicos que se pueden dañar", "items": ["Intimidad", "Honor", "Imagen", "Identidad"]}, "ejemplo": "Material: el dato es la llave; lo que está detrás de la puerta es la vida privada de alguien.", "articulos": ["Arts. 52 y 53 CCyC"], "fuente": "PPT+material", "ubicacion": "PPT slide 12; material p. 2", "alerta": null, "evidencia": [], "agregado": false, "b": 13, "nucleo": false}, {"id": "u13-calidad", "seccion": "Principios generales", "termino": "Principio de la calidad de los datos (pertinencia)", "pregunta": "¿Qué exige el principio de calidad de los datos?", "definicion": "Los datos deben ser siempre: ciertos (correcto, exacto); adecuados y pertinentes (tiene que tener sentido usarlo para la finalidad pertinente); no excesivos en relación a la finalidad para la cual han sido obtenidos.", "lista": {"titulo": "Los datos deben ser", "items": ["Ciertos: correcto, exacto.", "Adecuados y pertinentes: tiene que tener sentido usarlo para la finalidad pertinente.", "No excesivos en relación a la finalidad para la cual han sido obtenidos."]}, "ejemplo": "Material: «no excesivos» es el principio de pertinencia o minimización. Formulario de una app de delivery: no pidan grupo sanguíneo ni religión. Además (material, art. 4): no usar para finalidades distintas (inc. 3), mantenerlos exactos y actualizados (inc. 4), destruirlos cuando dejen de ser necesarios (inc. 7).", "articulos": ["Art. 4 inc. 1 Ley 25.326"], "fuente": "PPT+material", "ubicacion": "PPT slide 13; material p. 7", "alerta": null, "evidencia": ["tp7"], "agregado": false, "b": 13, "nucleo": true}, {"id": "u13-licitud", "seccion": "Principios generales", "termino": "Licitud de la base de datos", "pregunta": "¿Cuándo es lícita la formación de una base de datos?", "definicion": "Material: la formación de una base de datos es lícita solo cuando está debidamente inscripta y no tiene finalidades contrarias a la ley o a la moral pública. Una base clandestina, no registrada, ya nace ilegal.", "lista": null, "ejemplo": null, "articulos": ["Art. 3 Ley 25.326"], "fuente": "material", "ubicacion": "material p. 6", "alerta": "El PPT no enuncia el principio de licitud; solo dice que toda base pública y privada destinada a informes debe inscribirse en el Registro. Desarrollo solo de material.", "evidencia": ["tp7"], "agregado": false, "b": 13, "nucleo": false}, {"id": "u13-consentimiento", "seccion": "Principios generales", "termino": "Consentimiento", "pregunta": "¿Cuándo es ilícito el tratamiento de datos y cuándo no hace falta el consentimiento?", "definicion": "El tratamiento de datos personales es ilícito cuando el titular no hubiere prestado su consentimiento libre, expreso e informado, el que deberá constar por escrito, o por otro medio que se permita.", "lista": {"titulo": "No será necesario el consentimiento cuando", "items": ["a) Los datos se obtengan de fuentes de acceso público irrestricto;", "b) Se recaben para el ejercicio de funciones propias de los poderes del Estado o en virtud de una obligación legal;", "c) Se trate de listados limitados a nombre, DNI, CUIT/CUIL, ocupación, fecha de nacimiento y domicilio;", "d) Deriven de una relación contractual, científica o profesional y sean necesarios para cumplirla;", "e) Sean operaciones de entidades financieras (art. 39, Ley 21.526)."]}, "ejemplo": "Material: libre = sin engaños ni presiones; expreso = debe constar por escrito o medio equivalente; informado = la persona sabía a qué decía que sí. Puede revocarse, sin efectos retroactivos (Decreto 1558/2001).", "articulos": ["Art. 5 inc. 1 Ley 25.326", "Art. 5 inc. 2 Ley 25.326", "Art. 39 Ley 21.526"], "fuente": "PPT+material", "ubicacion": "PPT slide 14; material pp. 7-8", "alerta": null, "evidencia": ["tp7"], "agregado": false, "b": 13, "nucleo": true}, {"id": "u13-informacion-titular", "seccion": "Principios generales", "termino": "Información para el titular", "pregunta": "¿Qué se le debe informar al titular cuando se recaban sus datos?", "definicion": "Cuando se recaben datos personales se deberá informar previamente a sus titulares en forma expresa y clara:", "lista": {"titulo": "Se debe informar", "items": ["La finalidad para la que serán tratados.", "La existencia del archivo, registro o base de datos.", "La identidad y el domicilio del responsable.", "El carácter obligatorio o facultativo de las respuestas.", "Las consecuencias de dar los datos, de negarse o de darlos inexactos.", "Sus derechos de acceso, rectificación y supresión."]}, "ejemplo": "Material: es lo que hay detrás de las políticas de privacidad; bien hechas, cumplen este deber.", "articulos": ["Art. 6 Ley 25.326"], "fuente": "PPT+material", "ubicacion": "PPT slide 15; material p. 8", "alerta": null, "evidencia": ["tp7"], "agregado": false, "b": 13, "nucleo": true}, {"id": "u13-prohibicion-sensibles", "seccion": "Principios generales", "termino": "Prohibición de recolección (datos sensibles)", "pregunta": "¿Se puede obligar a alguien a dar datos sensibles? ¿Cuáles son las excepciones?", "definicion": "Ninguna persona puede ser obligada a proporcionar datos sensibles.", "lista": {"titulo": "Salvo", "items": ["Razones de interés general autorizadas por la ley.", "Finalidad estadística o científica.", "Las asociaciones religiosas y las organizaciones políticas y sindicales pueden llevar registros de sus miembros."]}, "ejemplo": "Material: la finalidad estadística o científica exige que los titulares no puedan ser identificados (previa disociación); en principio está prohibido armar bases que revelen información sensible.", "articulos": ["Art. 7 inc. 1 Ley 25.326", "Art. 7 incs. 2 y 3 Ley 25.326"], "fuente": "PPT+material", "ubicacion": "PPT slide 16; material p. 6", "alerta": null, "evidencia": ["tp7"], "agregado": false, "b": 13, "nucleo": true}, {"id": "u13-datos-salud", "seccion": "Principios generales", "termino": "Datos de salud y antecedentes penales", "pregunta": "¿Puede un establecimiento sanitario tratar datos de salud de sus pacientes?", "definicion": "Material: los establecimientos sanitarios y los profesionales de la salud pueden recolectar y tratar los datos de salud de sus pacientes, porque los necesitan para atenderlos, pero siempre respetando el secreto profesional. Los datos sobre antecedentes penales o contravencionales solo pueden ser tratados por las autoridades públicas competentes.", "lista": null, "ejemplo": null, "articulos": ["Art. 8 Ley 25.326", "Art. 7 inc. 4 Ley 25.326"], "fuente": "material", "ubicacion": "material p. 6", "alerta": "No está en el PPT: solo material. Lo pide el TP7 (consigna a).", "evidencia": ["tp7"], "agregado": false, "b": 13, "nucleo": false}, {"id": "u13-recoleccion", "seccion": "Principios generales", "termino": "Recolección de un dato", "pregunta": "¿Cómo debe ser la recolección de un dato?", "definicion": "La recolección debe ser siempre: leal (no puede hacerse por medios desleales, fraudulentos o contrarios a la ley); con finalidad específica (los datos no pueden ser utilizados con una finalidad distinta o incompatible); y deben contar con el consentimiento informado del titular.", "lista": {"titulo": "La recolección debe ser", "items": ["Leal: no puede hacerse por medios desleales, fraudulentos o contrarios a la ley.", "Con finalidad específica: los datos no pueden ser utilizados con una finalidad distinta o incompatible.", "Con el consentimiento informado del titular."]}, "ejemplo": "Material: capturar datos a escondidas, o decir que se usan para una cosa y usarlos para otra, viola este principio.", "articulos": ["Art. 4 inc. 2 Ley 25.326", "Art. 4 inc. 3 Ley 25.326"], "fuente": "PPT+material", "ubicacion": "PPT slide 17; material p. 8", "alerta": null, "evidencia": [], "agregado": false, "b": 13, "nucleo": true}, {"id": "u13-seguridad", "seccion": "Seguridad de los datos", "termino": "Seguridad de los datos", "pregunta": "¿Qué deber de seguridad tiene el responsable o usuario de datos?", "definicion": "El responsable o usuario de datos debe adoptar medidas técnicas y organizativas para garantizar la seguridad y confidencialidad de los datos personales, y evitar la adulteración, pérdida, consulta o tratamiento no autorizado, y detectar desviaciones.", "lista": {"titulo": "Medidas concretas (PPT)", "items": ["1- Control de accesos y MFA", "2- Cifrado en tránsito y en reposo", "3- Backups cifrados y verificados", "4- Auditoría de logs y monitoreo"]}, "ejemplo": "Material: también prohíbe registrar datos en bases que no reúnan condiciones técnicas de integridad y seguridad (art. 9, inc. 2). Guía AAIP: Res. 47/2018. Cencosud (Res. AAIP 146/2021) es el ejemplo clásico de incumplimiento del art. 9.", "articulos": ["Art. 9 inc. 1 Ley 25.326", "Art. 9 inc. 2 Ley 25.326"], "fuente": "PPT+material", "ubicacion": "PPT slide 18; material pp. 8-10", "alerta": null, "evidencia": ["tp7"], "agregado": false, "b": 13, "nucleo": true}, {"id": "u13-control-accesos-mfa", "seccion": "Seguridad de los datos", "termino": "Control de accesos y MFA", "pregunta": "¿Qué son los controles de acceso y el MFA?", "definicion": "Controles de acceso: mecanismos técnicos y organizativos que determinan quién puede entrar, a qué recursos y bajo qué condiciones dentro de una base de datos; objetivo: principio de mínimo privilegio (que cada persona tenga acceso solo a lo que necesita para trabajar). MFA (autenticación multifactor): capa extra de seguridad para verificar la identidad de un usuario, que combina dos o más factores distintos de autenticación.", "lista": {"titulo": "Factores del MFA", "items": ["Algo que sabés: contraseña, PIN.", "Algo que tenés: un token, celular con app de autenticación, tarjeta inteligente.", "Algo que sos: huella digital, reconocimiento facial, iris."]}, "ejemplo": "No todos los empleados pueden ver los legajos de RRHH; solo el área de RRHH. Homebanking: usuario y clave (algo que sabés) + código por SMS o app (algo que tenés).", "articulos": [], "fuente": "PPT", "ubicacion": "PPT slides 19-20; material pp. 9-10", "alerta": null, "evidencia": ["tp7"], "agregado": false, "b": 13, "nucleo": false}, {"id": "u13-cifrado", "seccion": "Seguridad de los datos", "termino": "Cifrado en tránsito y en reposo", "pregunta": "¿Qué diferencia hay entre cifrado en tránsito y cifrado en reposo?", "definicion": "Cifrado en tránsito: proteger los datos mientras viajan de un punto a otro (entre cliente y servidor, entre dos servidores), para que aunque alguien «escuche» la comunicación no pueda leer la información. Cifrado en reposo: proteger los datos guardados en un servidor, disco duro, base de datos o backup, para que si alguien roba un disco, copia un backup o accede sin permisos, no pueda leer el contenido sin la clave de descifrado.", "lista": {"titulo": "Tránsito vs reposo", "items": ["Cuándo: tránsito, mientras viajan; reposo, mientras están almacenados.", "Ejemplos: tránsito, HTTPS (usa TLS) o VPN corporativa; reposo, BitLocker o FileVault, archivos cifrados en la nube."]}, "ejemplo": "Si roban un disco rígido de un servidor de una universidad con datos de alumnos, no deberían poder leer nada sin la clave de cifrado.", "articulos": [], "fuente": "PPT", "ubicacion": "PPT slides 21-22; material p. 9", "alerta": null, "evidencia": ["tp7"], "agregado": false, "b": 13, "nucleo": false}, {"id": "u13-backups", "seccion": "Seguridad de los datos", "termino": "Backups cifrados y verificados", "pregunta": "¿Qué es un backup cifrado y qué uno verificado?", "definicion": "Backups cifrados: copias de seguridad que, además de guardarse, se almacenan cifradas, para que si alguien roba el backup no pueda leer los datos sin la clave. Backups verificados: no alcanza con guardar el backup; hay que probar periódicamente que funciona y que se puede restaurar (el archivo no está corrupto, incluye todos los datos, la restauración es posible en un entorno de prueba).", "lista": null, "ejemplo": null, "articulos": [], "fuente": "PPT", "ubicacion": "PPT slide 23; material p. 9", "alerta": null, "evidencia": [], "agregado": false, "b": 13, "nucleo": false}, {"id": "u13-logs-monitoreo", "seccion": "Seguridad de los datos", "termino": "Auditoría de logs y monitoreo", "pregunta": "¿Qué diferencia hay entre la auditoría de logs y el monitoreo?", "definicion": "Log: registro automático de actividades dentro de un sistema (quién entró, desde dónde, qué hizo, si falló un acceso). Auditar los logs: revisar y analizar esos registros para detectar irregularidades, abusos o accesos indebidos; sirve para cumplir con la trazabilidad. Monitoreo: vigilar en tiempo real la actividad de sistemas, redes y bases de datos con alertas y herramientas automáticas; se diferencia de la auditoría porque no solo revisa a posteriori sino que avisa en el momento.", "lista": null, "ejemplo": "Auditoría: un usuario de RRHH intentó acceder a 500 legajos en un día. Monitoreo: alerta si alguien intenta entrar al servidor a las 3 AM desde otro país.", "articulos": [], "fuente": "PPT", "ubicacion": "PPT slides 24-25; material pp. 9-10", "alerta": null, "evidencia": ["tp7"], "agregado": false, "b": 13, "nucleo": false}, {"id": "u13-derechos-titular", "seccion": "Derechos del titular y hábeas data", "termino": "Derechos del titular", "pregunta": "¿Qué derechos tiene el titular de los datos?", "definicion": "Lo que cualquier persona puede pedir, y lo que el responsable de la base tiene que poder responder.", "lista": {"titulo": "Derechos del titular, paso a paso", "items": ["Información (art. 13): consultar a la AAIP qué bases de datos existen, para qué y quién es el responsable. Es público y gratuito.", "Acceso (art. 14): pedir los datos propios que tiene una base. Plazo para responder: 10 días corridos. Gratis cada 6 meses, o antes si hay interés legítimo.", "Rectificar, actualizar, suprimir (art. 16): plazo 5 días hábiles. Mientras se revisa, el dato se bloquea o se informa que está en revisión.", "Gratuidad (art. 19): corregir, actualizar o borrar datos inexactos o incompletos no le cuesta nada al titular.", "Valoraciones personales (art. 20): un acto judicial o administrativo no puede basarse solo en un perfil hecho por un sistema automatizado. Clave frente a la IA.", "Si no responden: denuncia ante la AAIP o acción de hábeas data ante la Justicia (arts. 33 y siguientes)."]}, "ejemplo": null, "articulos": ["Art. 13 Ley 25.326", "Art. 14 Ley 25.326", "Art. 16 Ley 25.326", "Art. 19 Ley 25.326", "Art. 20 Ley 25.326", "Arts. 33 y siguientes Ley 25.326"], "fuente": "PPT+material", "ubicacion": "PPT slide 27; material pp. 11-12", "alerta": null, "evidencia": ["tp7"], "agregado": false, "b": 13, "nucleo": true}, {"id": "u13-rectificacion-supresion", "seccion": "Derechos del titular y hábeas data", "termino": "Rectificación, actualización y supresión (art. 16)", "pregunta": "¿Cómo funciona el derecho de rectificación, actualización y supresión y cuándo no procede la supresión?", "definicion": "Toda persona tiene derecho a que sean rectificados, actualizados y, cuando corresponda, suprimidos o sometidos a confidencialidad los datos personales de los que sea titular, que estén incluidos en un banco de datos.", "lista": {"titulo": "Reglas (PPT)", "items": ["1. Derecho a rectificar, actualizar y, cuando corresponda, suprimir o someter a confidencialidad los datos propios incluidos en un banco de datos.", "2. El responsable o usuario debe proceder a la rectificación, supresión o actualización en el plazo máximo de cinco días hábiles de recibido el reclamo.", "3. El incumplimiento dentro del término habilita al interesado a promover la acción de protección de los datos personales o de hábeas data.", "4. La supresión no procede cuando pudiese causar perjuicios a derechos o intereses de terceros, o cuando existiera una obligación legal de conservar los datos.", "5. Durante la verificación y rectificación, el responsable o usuario debe bloquear el archivo o consignar al proveer información que se encuentra sometida a revisión."]}, "ejemplo": "Material: un banco no puede borrar los registros de una operación solo porque el cliente lo pide, si una ley lo obliga a conservarlos.", "articulos": ["Art. 16 Ley 25.326"], "fuente": "PPT+material", "ubicacion": "PPT slide 28; material pp. 11-12", "alerta": null, "evidencia": ["tp7"], "agregado": false, "b": 13, "nucleo": false}, {"id": "u13-valoraciones-personales", "seccion": "Derechos del titular y hábeas data", "termino": "Valoraciones personales (art. 20)", "pregunta": "¿Puede una decisión administrativa basarse solo en un perfil automatizado?", "definicion": "Un acto judicial o administrativo no puede basarse solo en un perfil hecho por un sistema automatizado. Clave frente a la IA.", "lista": null, "ejemplo": "Material: el art. 20 declara insanablemente nulos los actos que violen esta regla.", "articulos": ["Art. 20 Ley 25.326"], "fuente": "PPT+material", "ubicacion": "PPT slide 27; material p. 12", "alerta": null, "evidencia": [], "agregado": false, "b": 13, "nucleo": false}, {"id": "u13-registro", "seccion": "Registro y circulación de datos", "termino": "Inscripción en el Registro de bases de datos", "pregunta": "¿Qué bases deben inscribirse y qué debe comprender el registro?", "definicion": "Todo archivo, registro, base o banco de datos público, y privado destinado a proporcionar informes debe inscribirse en el Registro.", "lista": {"titulo": "El registro debe comprender como mínimo", "items": ["Nombre y domicilio del responsable;", "Características y finalidad del archivo;", "Naturaleza de los datos personales contenidos en cada archivo;", "Forma de recolección y actualización de datos;", "Destino de los datos y personas físicas o jurídicas a las que pueden ser útil;", "Modo de interrelacionar la información registrada;", "Medios utilizados para garantizar la seguridad de los datos;", "Tiempo de conservación de los datos;", "Forma y condiciones en que las personas pueden acceder a los datos y los procedimientos a realizar para la rectificación o actualización de los datos."]}, "ejemplo": "Material: el Registro Nacional de Bases de Datos lo lleva la AAIP; la inscripción es la que hace lícita a la base (art. 3).", "articulos": ["Art. 21 inc. 1 Ley 25.326", "Art. 21 inc. 2 Ley 25.326"], "fuente": "PPT+material", "ubicacion": "PPT slides 29-30; material pp. 11-12", "alerta": null, "evidencia": ["tp7"], "agregado": false, "b": 13, "nucleo": false}, {"id": "u13-cesion", "seccion": "Registro y circulación de datos", "termino": "Cesión de datos", "pregunta": "¿Cuándo se pueden ceder datos personales a un tercero?", "definicion": "Material: los datos personales solo pueden cederse para fines directamente relacionados con el interés legítimo de quien cede y de quien recibe, con consentimiento previo del titular, al que se le informa la finalidad y quién los recibe. El cesionario queda sujeto a las mismas obligaciones que el cedente. Si los datos se disociaron, no hace falta consentimiento.", "lista": null, "ejemplo": "PPT (caso automotriz, Res. AAIP 170/2025): respondió en forma solidaria por ser la beneficiaria (art. 11). Lección: quien encarga o se beneficia del tratamiento responde aunque lo ejecute un tercero.", "articulos": ["Art. 11 inc. 1 Ley 25.326", "Art. 11 inc. 4 Ley 25.326", "Art. 11 inc. 3 e Ley 25.326"], "fuente": "material", "ubicacion": "material p. 10; PPT slide 52 (solo mención del art. 11)", "alerta": "El PPT no desarrolla la cesión: solo cita el art. 11 en el caso de la automotriz y la nombra dentro de la definición de tratamiento. Reglas de cesión: solo material.", "evidencia": ["tp7"], "agregado": false, "b": 13, "nucleo": false}, {"id": "u13-transferencia-internacional", "seccion": "Registro y circulación de datos", "termino": "Transferencia internacional (art. 12)", "pregunta": "¿Se pueden transferir datos personales a otro país?", "definicion": "El art. 12 prohíbe transferir datos a países sin protección adecuada. Usar la nube es transferir: importa dónde están los servidores y quién accede.", "lista": null, "ejemplo": "PPT: TikTok (2025), la autoridad de Irlanda le impuso €530 millones por transferir datos de europeos a China sin garantías equivalentes y no informarlo. Material: la prohibición cede, entre otros, en colaboración judicial internacional, intercambio de datos médicos, transferencias bancarias o bursátiles, o tratado internacional (art. 12, inc. 2).", "articulos": ["Art. 12 inc. 1 Ley 25.326", "Art. 12 inc. 2 Ley 25.326"], "fuente": "PPT+material", "ubicacion": "PPT slide 51 (caso TikTok); material pp. 10-11", "alerta": null, "evidencia": ["tp7"], "agregado": false, "b": 13, "nucleo": false}, {"id": "u13-sanciones", "seccion": "Sanciones y responsabilidad", "termino": "Sanciones", "pregunta": "¿Qué tipos de sanciones prevé la Ley 25.326? Enumere.", "definicion": "Tipos de sanciones: administrativas y penales.", "lista": {"titulo": "Administrativas y penales (PPT)", "items": ["Administrativas: apercibimiento, suspensión, multa, clausura, cancelación.", "Penal: 1 mes a 2 años: el que inserte datos falsos en un archivo de datos personales (art. 117 bis CP).", "Penal: 6 meses a 3 años: el que proporcione a un tercero información falsa de un archivo de datos.", "Penal: la escala aumenta en la mitad si resulta perjudicada alguna persona.", "Penal: si el responsable es funcionario público, se agrega la inhabilitación.", "Penal: 1 mes a 2 años: el que a sabiendas e ilegítimamente, o violando sistemas de seguridad, acceda a un banco de datos personales (art. 157 bis CP).", "Penal: 1 mes a 2 años: el que revele información de un banco de datos que por ley debía mantener en secreto."]}, "ejemplo": "Material: un mismo hecho puede disparar responsabilidad civil, administrativa y penal a la vez.", "articulos": ["Art. 31 Ley 25.326", "Art. 117 bis CP", "Art. 157 bis CP"], "fuente": "PPT+material", "ubicacion": "PPT slides 31-32; material pp. 13-14", "alerta": "PPT: dos tipos de sanciones (administrativas y penales); material: tres clases de responsabilidad (civil, administrativa y penal), con la civil = reparar el daño (art. 31 inc. 1 y arts. 1716, 1737, 1738 y 1741 CCyC). Si preguntan «tipos de sanciones» van las dos del PPT; si preguntan «clases de responsabilidad» (programa), agregar la civil del material.", "evidencia": ["tp7"], "agregado": false, "b": 13, "nucleo": true}, {"id": "u13-sanciones-hoy", "seccion": "Sanciones y responsabilidad", "termino": "Sanciones administrativas hoy (art. 31 y Res. AAIP 126/2024)", "pregunta": "¿Quién aplica hoy las sanciones administrativas y cómo se gradúan?", "definicion": "Las aplica la AAIP según el art. 31 de la Ley 25.326 y la Res. AAIP 126/2024 (vigente desde el 1/6/2024).", "lista": {"titulo": "Detalle", "items": ["Qué puede aplicar (art. 31): apercibimiento, suspensión, multa de $1.000 a $100.000, clausura o cancelación del archivo. La multa se aplica por cada infracción, por eso los montos se suman.", "Cómo se gradúan: infracciones leves, graves y muy graves. Pesan, entre otras cosas, la condición económica del infractor y si reconoce la falta. Si paga dentro de 20 días hábiles, la multa baja un 50%.", "Además de la multa: la AAIP puede imponer una «obligación de hacer» para que cese el incumplimiento y ordenar capacitación obligatoria. La sanción se anota en el Registro de Infractores."]}, "ejemplo": "Cencosud, $290.000 por 4 infracciones (2021). Una automotriz, $3.000.000 por llamadas a inscriptos en el «No Llame» (2025).", "articulos": ["Art. 31 Ley 25.326", "Res. AAIP 126/2024"], "fuente": "PPT+material", "ubicacion": "PPT slide 33; material p. 13", "alerta": null, "evidencia": [], "agregado": false, "b": 13, "nucleo": false}, {"id": "u13-propiedad-intelectual-bd", "seccion": "Sanciones y responsabilidad", "termino": "Propiedad intelectual de las bases de datos", "pregunta": "¿Qué protege la Ley 11.723 y qué la Ley 25.326 sobre una misma base de datos?", "definicion": "Material: una base de datos puede ser una obra protegida por el derecho de autor; la Ley 11.723 incluye entre las obras protegidas a las compilaciones de datos. No se protegen los datos individuales sino la selección y organización originales. La Ley 25.326 protege a las personas que están adentro de la base; la Ley 11.723 protege al creador de la base como autor de una obra.", "lista": null, "ejemplo": "Material: una base de clientes está protegida dos veces y por motivos opuestos: hacia adentro protege a los clientes, hacia afuera a la empresa que la armó.", "articulos": ["Art. 1 Ley 11.723", "Ley 25.036", "Decreto 165/94", "Directiva 96/9/CE", "Art. 10.2 ADPIC (Ley 24.425)", "Art. 5 Tratado OMPI sobre Derecho de Autor (Ley 25.140)"], "fuente": "material", "ubicacion": "material pp. 12-13", "alerta": "No está en el PPT B13 (solo material; enlaza con B8). Lo pide el programa y el TP7 (consigna g).", "evidencia": ["tp7"], "agregado": false, "b": 13, "nucleo": false}, {"id": "u13-renaper", "seccion": "Casos y buenas prácticas", "termino": "Caso RENAPER (2021)", "pregunta": "¿Qué pasó en el caso RENAPER y qué enseña?", "definicion": "En 2021, un usuario con credenciales habilitadas del Ministerio de Salud sacó provecho de accesos legítimos al sistema de RENAPER para descargar imágenes de DNI, fotos, número de trámite, etc. No era un «hackeo» externo per se, sino un uso indebido de permisos interno.", "lista": {"titulo": "Claves del caso", "items": ["Confirmado: uso indebido de claves autorizadas para consultas que devolvían más datos de los estrictamente necesarios; se filtraron imágenes y datos personales; no se confirmó que toda la base haya sido comprometida.", "Respuesta: ahora, cuando un organismo solicita datos, el sistema devuelve solo respuestas del tipo «verdadero/falso» o «vigente/no vigente».", "Riesgos: suplantación de identidad, uso ilegítimo de la información, daño a la privacidad, pérdida de confianza ciudadana."]}, "ejemplo": "Material: la amenaza muchas veces viene de adentro (permisos mal controlados); devolver «verdadero/falso» es el principio de minimización en acción (art. 4, inc. 1); mínimo privilegio, control de accesos y logs (art. 9).", "articulos": ["Art. 9 Ley 25.326", "Art. 4 inc. 1 Ley 25.326"], "fuente": "PPT+material", "ubicacion": "PPT slides 41-45; material pp. 14-15", "alerta": null, "evidencia": ["tp7"], "agregado": false, "b": 13, "nucleo": false}, {"id": "u13-beneficios", "seccion": "Casos y buenas prácticas", "termino": "Beneficios de las buenas prácticas", "pregunta": "¿Qué beneficios trae cumplir con la Ley 25.326?", "definicion": "Cumplir con la Ley 25.326 no es solo evitar sanciones: aumenta la confianza de usuarios, fortalece la reputación, facilita la innovación y la expansión global, y abre la puerta a inversiones y crecimiento sostenible.", "lista": {"titulo": "Beneficios (PPT)", "items": ["Confianza de usuarios", "Menor riesgo de filtraciones y ciberataques", "Ventajas competitivas", "Acceso a mercados internacionales", "Evitar sanciones y bloqueos", "Mejora la calidad de los datos", "Innovación responsable (uso de datos disociados)", "Atracción de inversión (privacidad = confianza = capital)"]}, "ejemplo": null, "articulos": [], "fuente": "PPT", "ubicacion": "PPT slides 34-39; material p. 15", "alerta": null, "evidencia": [], "agregado": false, "b": 13, "nucleo": false}, {"id": "u14-problema", "seccion": "El problema", "termino": "Por qué usuario y contraseña ya no alcanzan", "pregunta": "¿Qué problemas viene a resolver la firma digital?", "definicion": "Usuario y contraseña ya no alcanzan. Necesitamos dos cosas: saber quién firmó y que el documento no cambió.", "lista": {"titulo": "Problemas", "items": ["Suplantación: phishing, cuentas robadas, alguien que firma “como si fuera” otro.", "Alteración: un PDF se edita y nadie lo nota a simple vista.", "Factor humano: el secreto viaja, se adivina o se comparte por descuido."]}, "ejemplo": null, "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slide 3 (El problema); material §1", "alerta": null, "evidencia": [], "agregado": false, "b": 14, "nucleo": false}, {"id": "u14-criptografia", "seccion": "La base técnica", "termino": "Criptografía", "pregunta": "¿Qué es la criptografía?", "definicion": "La criptografía es el arte de transformar un mensaje para que solo pueda leerlo quien tenga permiso.", "lista": {"titulo": "Operaciones", "items": ["Cifrar: volver ilegible el mensaje.", "Descifrar: devolverlo a su forma original."]}, "ejemplo": null, "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slide La base técnica; material §2", "alerta": null, "evidencia": [], "agregado": false, "b": 14, "nucleo": false}, {"id": "u14-simetrica-asimetrica", "seccion": "La base técnica", "termino": "Criptografía simétrica vs. asimétrica", "pregunta": "Diferencie criptografía simétrica y asimétrica. ¿Cuál usa la firma digital y por qué?", "definicion": "Simétrica: una sola clave para cerrar y abrir. Asimétrica: un par de claves, privada y pública; lo que cierra una, solo lo abre la otra. La firma digital usa la asimétrica, porque con una llave compartida no podés probar quién fue: para firmar necesitás algo que tenga una sola persona, y eso solo te lo da la clave privada.", "lista": {"titulo": "Simétrica vs. asimétrica", "items": ["Claves: simétrica, una sola clave para cerrar y abrir; asimétrica, un par: privada y pública.", "Velocidad: simétrica, rápida (el PPT no caracteriza la velocidad de la asimétrica).", "Ejemplo: simétrica, el cifrado César (cada letra corre 3 lugares: A→D); asimétrica, mandarle algo privado a David cerrándolo con su llave pública.", "Problema: simétrica, ¿cómo le paso la clave al otro sin que la intercepten?; asimétrica, lo resuelve: ya no hace falta mandar ningún secreto.", "Manejo de claves: asimétrica, la privada la guarda el titular; la pública se reparte. Es imposible, en la práctica, deducir una de la otra.", "Para firmar: simétrica, no sirve (si Ana y David tienen la misma clave, cualquiera de los dos pudo haber escrito el mensaje); asimétrica, sí (solo el titular tiene la privada)."]}, "ejemplo": "Cifrado César: A→D.", "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slides La base técnica / Por qué importa; material §2", "alerta": null, "evidencia": [], "agregado": false, "b": 14, "nucleo": true}, {"id": "u14-dos-usos", "seccion": "La base técnica", "termino": "El mismo par, dos usos opuestos (confidencialidad y firma)", "pregunta": "¿Qué se logra cifrando con la clave pública del destinatario y qué firmando con la clave privada propia?", "definicion": "Con el mismo par de llaves se pueden hacer dos cosas distintas, y lo que decide cuál estás haciendo es con qué llave cerrás el mensaje.", "lista": {"titulo": "Dos usos", "items": ["Confidencialidad: cifro con la clave pública del destinatario; solo su clave privada lo abre: solo él puede leerlo.", "Firma: firmo con mi clave privada; cualquiera verifica con mi clave pública: solo yo pude haberlo firmado. Firmar no oculta el contenido: prueba quién lo firmó."]}, "ejemplo": "Ana cierra con la pública de David → solo David puede leerlo. David cierra con su privada → cualquiera lo abre con la pública de David, y queda probado que fue David.", "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slide El mismo par, dos usos opuestos; material §2", "alerta": null, "evidencia": [], "agregado": false, "b": 14, "nucleo": false}, {"id": "u14-hash", "seccion": "La base técnica", "termino": "Función hash (huella)", "pregunta": "¿Qué es una función hash y qué papel cumple en la firma digital?", "definicion": "Una función hash resume cualquier archivo en una cadena fija. Cambiás una coma y la huella cambia por completo. Se firma la huella, no el archivo entero. Verificar = recalcular la huella y compararla con la firmada.", "lista": null, "ejemplo": "“Pago a Juan $1.000” → 232cd60c…; “Pago a Juan $1.000,” → b2df9aad…; “Pago a Juan $9.000” → a0510c48… (SHA-256).", "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slide Por dentro; material §2 (el hash)", "alerta": null, "evidencia": [], "agregado": false, "b": 14, "nucleo": true}, {"id": "u14-pasos-firma", "seccion": "La base técnica", "termino": "Paso a paso: firma y verificación", "pregunta": "Describa los pasos para firmar digitalmente un documento y verificarlo.", "definicion": "Si las huellas coinciden: lo firmó Ana y nadie lo tocó. Si no coinciden: algo cambió o la firma no es de ella.", "lista": {"titulo": "Pasos", "items": ["1. Huella: Ana calcula el hash del contrato.", "2. Firma: cifra esa huella con su clave privada. Eso es la firma.", "3. Envío: manda el contrato, la firma y su certificado (con su clave pública).", "4. Verificación: David recalcula el hash, abre la firma con la clave pública de Ana y compara."]}, "ejemplo": null, "articulos": [], "fuente": "PPT", "ubicacion": "PPT slide Paso a paso", "alerta": null, "evidencia": [], "agregado": false, "b": 14, "nucleo": false}, {"id": "u14-propiedades", "seccion": "Qué garantiza", "termino": "Propiedades técnicas de la firma digital", "pregunta": "¿Qué garantiza la firma digital? Enumere sus tres propiedades técnicas.", "definicion": "Tres propiedades técnicas. La ley toma estas propiedades y las convierte en presunciones.", "lista": {"titulo": "Propiedades", "items": ["Autoría: sé quién firmó: solo el titular tiene la clave privada.", "Integridad: sé que no cambió: la huella coincide.", "No repudio: el firmante no puede negar después que fue él."]}, "ejemplo": null, "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slide Lo que garantiza; material §2", "alerta": null, "evidencia": [], "agregado": false, "b": 14, "nucleo": true}, {"id": "u14-marco-legal", "seccion": "Marco legal y concepto", "termino": "Marco legal: de la Ley 25.506 a hoy", "pregunta": "¿Qué norma regula la firma digital en Argentina y cómo evolucionó?", "definicion": "La Ley 25.506 (sancionada el 14/11/2001) regula firma digital, electrónica y documento digital. Tucumán adhirió a la Ley 25.506 por Ley provincial 7.291.", "lista": {"titulo": "Línea de tiempo", "items": ["2001 · Ley 25.506: sancionada el 14/11/2001. Firma digital, electrónica y documento digital.", "2017 · Dec. 892/2017: crea la Plataforma de Firma Digital Remota.", "2018 · Ley 27.446: simplificación del Estado. Actualiza la 25.506.", "2019 · Dec. 182/2019: reglamentación vigente de la ley.", "2024 · Dec. 743/2024: chau presencialidad obligatoria para tramitarla.", "2025 · Res. SICyT 11/2025: nuevas reglas para los certificadores."]}, "ejemplo": null, "articulos": ["Ley 25.506", "Dec. 892/2017", "Ley 27.446", "Dec. 182/2019", "Dec. 743/2024", "Res. SICyT 11/2025", "Ley 7.291 (Tucumán)"], "fuente": "PPT+material", "ubicacion": "PPT slide El marco legal; material §3 y Bibliografía", "alerta": "PPT: Dec. 892/2017 crea la Plataforma de Firma Digital Remota y Dec. 182/2019 es la reglamentación vigente; material: trae restos de edición que atribuyen la habilitación de la firma remota al Dec. 182/2019 y, en la misma frase, a la Plataforma creada por el Dec. 892/2017. Va lo del PPT.", "evidencia": [], "agregado": false, "b": 14, "nucleo": false}, {"id": "u14-firma-digital", "seccion": "Marco legal y concepto", "termino": "Firma digital (concepto, art. 2)", "pregunta": "¿Qué es la firma digital según la Ley 25.506?", "definicion": "Un procedimiento matemático: requiere información que solo conoce el firmante (su clave privada) y la pueden verificar terceros (art. 2). Material: es el resultado de aplicar a un documento digital un procedimiento matemático que requiere información de exclusivo conocimiento del firmante, encontrándose ésta bajo su absoluto control; debe ser susceptible de verificación por terceras partes, de tal modo que esa verificación permita, a la vez, identificar al firmante y detectar cualquier alteración del documento posterior a la firma.", "lista": null, "ejemplo": "La “información de exclusivo conocimiento del firmante” es su clave privada; la “verificación por terceras partes” es la comprobación con la clave pública.", "articulos": ["Art. 2 Ley 25.506"], "fuente": "PPT+material", "ubicacion": "PPT slide Qué dice la ley (Art. 2); material §3", "alerta": null, "evidencia": [], "agregado": false, "b": 14, "nucleo": true}, {"id": "u14-equivalencia-exclusiones", "seccion": "Marco legal y concepto", "termino": "Equivalencia con la manuscrita (art. 3) y exclusiones (art. 4)", "pregunta": "¿Qué valor tiene la firma digital frente a la manuscrita? ¿Dónde no se aplica?", "definicion": "Art. 3: cuando la ley exige firma manuscrita, la firma digital cumple esa exigencia (vale como la manuscrita). Art. 4: no se aplica a disposiciones por causa de muerte, actos de familia, actos personalísimos y formalidades incompatibles.", "lista": {"titulo": "Exclusiones (art. 4)", "items": ["Disposiciones por causa de muerte (p. ej., un testamento).", "Actos de familia (p. ej., un matrimonio).", "Actos personalísimos.", "Formalidades incompatibles (por disposición legal o acuerdo de partes)."]}, "ejemplo": "¿Puedo firmar un testamento con firma digital? No: está excluido (art. 4).", "articulos": ["Art. 3 Ley 25.506", "Art. 4 Ley 25.506"], "fuente": "PPT+material", "ubicacion": "PPT slides Qué dice la ley y Repaso rápido; material §3", "alerta": null, "evidencia": [], "agregado": false, "b": 14, "nucleo": true}, {"id": "u14-digital-vs-electronica", "seccion": "Firma digital vs. firma electrónica", "termino": "Firma digital vs. firma electrónica", "pregunta": "Diferencie firma digital y firma electrónica. ¿Quién tiene que probar si se la desconoce?", "definicion": "La distinción más preguntada. La pregunta clave: ¿quién tiene que probar? Firma digital: certificado de un certificador licenciado, presunciones de autoría e integridad (arts. 7 y 8); si se la desconoce, quien la niega debe probar. Firma electrónica: le falta algún requisito legal, no tiene presunciones; si se la desconoce, quien la invoca debe probar (art. 5).", "lista": {"titulo": "Firma digital vs. firma electrónica", "items": ["Certificado: digital, de un certificador licenciado; electrónica, le falta algún requisito legal.", "Presunciones: digital, autoría e integridad (arts. 7 y 8); electrónica, ninguna.", "Si se la desconoce: digital, quien la niega debe probar; electrónica, quien la invoca debe probar (art. 5).", "Ejemplos: digital, token, firma remota oficial; electrónica, clic en “acepto”, PIN, certificado no licenciado."]}, "ejemplo": "IGJ: entrar al S.O.D.A. con Clave Fiscal de ARCA nivel 3 funciona como firma electrónica; las constancias firmadas por el funcionario llevan firma digital. “Usuario y clave = firma electrónica. Certificado de un certificador licenciado = firma digital.”", "articulos": ["Art. 5 Ley 25.506", "Art. 7 Ley 25.506", "Art. 8 Ley 25.506"], "fuente": "PPT+material", "ubicacion": "PPT slide La distinción más preguntada y Noticia IGJ; material §4", "alerta": null, "evidencia": [], "agregado": false, "b": 14, "nucleo": true}, {"id": "u14-firma-electronica", "seccion": "Firma digital vs. firma electrónica", "termino": "Firma electrónica (concepto)", "pregunta": "¿Qué es la firma electrónica?", "definicion": "Firma a la que le falta algún requisito legal para ser firma digital; no tiene presunciones y, si es desconocida, quien la invoca debe probar (art. 5). Material: conjunto de datos electrónicos integrados, ligados o asociados de manera lógica a otros datos electrónicos, que el firmante utiliza como su medio de identificación, pero que carece de alguno de los requisitos legales para ser considerada firma digital.", "lista": {"titulo": "Ejemplos", "items": ["Clic en “acepto”.", "PIN.", "Certificado no licenciado.", "Clave Fiscal de ARCA nivel 3 en el S.O.D.A. (funciona como firma electrónica).", "Imagen escaneada de la firma (material; en el caso Moisá, “como mucho” firma electrónica)."]}, "ejemplo": null, "articulos": ["Art. 5 Ley 25.506"], "fuente": "PPT+material", "ubicacion": "PPT slides La distinción más preguntada, IGJ, Moisá; material §4", "alerta": null, "evidencia": [], "agregado": false, "b": 14, "nucleo": false}, {"id": "u14-cidi", "seccion": "Firma digital vs. firma electrónica", "termino": "Firma CiDi: por qué un PIN puede ser firma digital", "pregunta": "¿Por qué la Firma CiDi de Córdoba, que se confirma con PIN, es firma digital y no electrónica?", "definicion": "Porque detrás usa certificados emitidos dentro de la infraestructura oficial de firma digital. El PIN solo “abre” la clave privada guardada en forma remota. Por eso tiene las presunciones de la Ley 25.506.", "lista": {"titulo": "Pasos", "items": ["1. Entrás con tu cuenta de Ciudadano Digital (CiDi) nivel 2, en firma.cba.gov.ar.", "2. Subís el documento en formato digital que querés firmar.", "3. Confirmás con tu PIN de seguridad. El documento queda firmado."]}, "ejemplo": null, "articulos": [], "fuente": "PPT", "ubicacion": "PPT slide Noticia Córdoba, mayo 2026", "alerta": null, "evidencia": [], "agregado": false, "b": 14, "nucleo": false}, {"id": "u14-presunciones-validez", "seccion": "Presunciones y validez", "termino": "Presunciones de autoría (art. 7) e integridad (art. 8); validez (art. 9)", "pregunta": "¿Qué presume la ley respecto de la firma digital? ¿Cuándo es válida?", "definicion": "Lo técnico, convertido en derecho. Art. 7, autoría: se presume, salvo prueba en contrario, que la firma pertenece al titular del certificado que la verifica. Art. 8, integridad: si la verificación da verdadero, se presume que el documento no se modificó desde la firma. Art. 9, validez: creada con certificado vigente, verificada con sus datos y emitida por un certificador licenciado.", "lista": {"titulo": "Requisitos de validez (art. 9)", "items": ["Creada con certificado vigente (durante su período de vigencia).", "Verificada con los datos del certificado.", "Certificado emitido por un certificador licenciado."]}, "ejemplo": "¿Cómo sé si un PDF está bien firmado? 1) La firma es válida: el lector recalcula la huella y la compara. 2) No hubo cambios. 3) Confío en el certificado: vigente al firmar y emitido por un certificador licenciado. Los tres sí son los tres requisitos de validez del art. 9.", "articulos": ["Art. 7 Ley 25.506", "Art. 8 Ley 25.506", "Art. 9 Ley 25.506"], "fuente": "PPT+material", "ubicacion": "PPT slides Presunciones y validez, Práctico; material §5 y §7", "alerta": null, "evidencia": [], "agregado": false, "b": 14, "nucleo": true}, {"id": "u14-digital-digitalizado", "seccion": "Documento, original y archivo", "termino": "Digital no es lo mismo que digitalizado (arts. 6, 11 y 12)", "pregunta": "Diferencie documento digitalizado y documento digital firmado. ¿Qué dicen los arts. 6, 11 y 12?", "definicion": "Digitalizado: una foto de un papel; un escaneo reproduce un original en papel, no trae ninguna garantía propia: se puede editar, recortar o pegar en otro archivo. Digital firmado: nace y vive electrónico; es un documento electrónico con firma digital; la firma viaja con él y delata cualquier cambio.", "lista": {"titulo": "Documento, original y archivo", "items": ["Art. 6 · Documento escrito vs. digital: el documento digital cumple el requisito de “por escrito”.", "Art. 11 · Original en papel vs. digital: el firmado digitalmente es original, y sus copias idénticas también valen.", "Art. 12 · Archivo en papel vs. digital: guardarlo firmado cumple la obligación de conservar documentos."]}, "ejemplo": null, "articulos": ["Art. 6 Ley 25.506", "Art. 11 Ley 25.506", "Art. 12 Ley 25.506"], "fuente": "PPT+material", "ubicacion": "PPT slide Documento, original y archivo; material §6", "alerta": null, "evidencia": [], "agregado": false, "b": 14, "nucleo": true}, {"id": "u14-certificado", "seccion": "Certificado y cadena de confianza", "termino": "Certificado digital (arts. 13-14)", "pregunta": "¿Qué es el certificado digital y qué debe contener?", "definicion": "El certificado (art. 13-14) es un documento firmado por el certificador que dice: “esta clave pública es de esta persona”. Responde a la pregunta ¿cómo sé que esa clave pública es de David?", "lista": {"titulo": "Qué tiene que decir un certificado (art. 14)", "items": ["Quién: identifica al titular y al certificador que lo emitió, con un número único.", "Hasta cuándo: tiene período de vigencia y se puede consultar si fue revocado.", "Con qué: trae la clave pública y los datos necesarios para verificar la firma.", "Bajo qué reglas: indica la política de certificación aplicada y distingue lo verificado de lo no verificado.", "Vence y se revoca: si roban o pierden la clave, el certificador lo revoca y lo publica en una lista de revocados."]}, "ejemplo": null, "articulos": ["Art. 13 Ley 25.506", "Art. 14 Ley 25.506"], "fuente": "PPT+material", "ubicacion": "PPT slides El certificado y la cadena de confianza, Art. 14; material §8", "alerta": null, "evidencia": [], "agregado": false, "b": 14, "nucleo": true}, {"id": "u14-cadena-confianza", "seccion": "Certificado y cadena de confianza", "termino": "Cadena de confianza", "pregunta": "Describa la cadena de confianza de la firma digital y el rol de cada actor.", "definicion": "La seguridad descansa en una cadena: clave privada que identifica · certificado que la respalda · certificador que responde.", "lista": {"titulo": "Actores", "items": ["Autoridad de aplicación: Jefatura de Gabinete, vía la Secretaría de Innovación, Ciencia y Tecnología. Licencia y controla.", "Certificador licenciado: emite y revoca certificados. Ej.: AC ONTI, AC Modernización-PFDR.", "Autoridad de registro: valida la identidad. Ej.: la Corte de Tucumán.", "Titular: recibe un certificado que vincula su clave pública con su identidad."]}, "ejemplo": null, "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slides El certificado y la cadena de confianza, cierre; material §8-9", "alerta": null, "evidencia": [], "agregado": false, "b": 14, "nucleo": true}, {"id": "u14-deberes", "seccion": "Deberes, responsabilidad y sanciones", "termino": "Deberes del certificador (art. 19) y del titular (art. 25)", "pregunta": "¿Qué deberes tienen el certificador licenciado y el titular del certificado?", "definicion": "Quién hace qué: el certificador emite, identifica, conserva, revoca y publica; el titular custodia su clave privada y pide la revocación si se compromete.", "lista": {"titulo": "Certificador (art. 19) vs. titular (art. 25)", "items": ["Certificador: recibir solicitudes y emitir certificados.", "Certificador: identificar cada certificado sin ambigüedad.", "Certificador: conservar copia de lo emitido.", "Certificador: revocar cuando corresponde.", "Certificador: publicar el estado de los certificados.", "Titular: mantener el control exclusivo de su clave privada.", "Titular: no compartirla ni prestar el token.", "Titular: pedir la revocación si la clave se compromete.", "Titular: avisar si cambian sus datos."]}, "ejemplo": null, "articulos": ["Art. 19 Ley 25.506", "Art. 25 Ley 25.506"], "fuente": "PPT+material", "ubicacion": "PPT slide Quién hace qué; material §9", "alerta": null, "evidencia": [], "agregado": false, "b": 14, "nucleo": true}, {"id": "u14-responsabilidad-sanciones", "seccion": "Deberes, responsabilidad y sanciones", "termino": "Responsabilidad y sanciones del certificador", "pregunta": "¿Cuándo responde el certificador y qué sanciones puede recibir?", "definicion": "Arts. 38-39: responde por daños por errores, omisiones o no revocar a tiempo; no responde si el titular dio datos falsos y él actuó con diligencia. Art. 41: tres sanciones: apercibimiento, multa o caducidad de la licencia; pagar la multa no libera de los daños. Arts. 44-46: la caducidad inhabilita 10 años; se recurre ante la justicia federal contencioso administrativa.", "lista": {"titulo": "Sanciones (art. 41)", "items": ["Apercibimiento.", "Multa.", "Caducidad de la licencia (la más grave: inhabilita 10 años)."]}, "ejemplo": null, "articulos": ["Art. 38 Ley 25.506", "Art. 39 Ley 25.506", "Art. 41 Ley 25.506", "Art. 44 Ley 25.506", "Art. 45 Ley 25.506", "Art. 46 Ley 25.506"], "fuente": "PPT+material", "ubicacion": "PPT slide Si el certificador falla; material §9", "alerta": null, "evidencia": [], "agregado": false, "b": 14, "nucleo": false}, {"id": "u14-token-remota", "seccion": "Formas de firmar y novedades", "termino": "Firma con token vs. firma remota", "pregunta": "Compare la firma digital con token y la firma digital remota.", "definicion": "Dos formas de firmar; las dos son firma digital válida. Cambia dónde vive la clave privada. La Plataforma de Firma Digital Remota del Estado se creó por Decreto 892/2017.", "lista": {"titulo": "Token vs. remota", "items": ["¿Dónde está la clave privada?: token, en un dispositivo USB o tarjeta que tiene el titular; remota, en un equipo criptográfico seguro (HSM) del certificador.", "¿Cómo firmo?: token, conecto el token y pongo su PIN; remota, entro a una plataforma web con usuario, contraseña y un segundo factor.", "Ventaja: token, la clave nunca sale de mis manos; remota, firmo desde cualquier lado, sin hardware.", "Riesgo: token, perder el token o prestarlo; remota, que me roben las credenciales de acceso."]}, "ejemplo": "UNT: las nuevas autoridades firman resoluciones en Sudocu con token. Lakaut (certificador licenciado privado) lanzó FID: firma remota, 100% online, la clave vive en sus servidores. IGJ: firma digital remota, gratuita y sin token para el S.O.D.A.", "articulos": ["Dec. 892/2017"], "fuente": "PPT+material", "ubicacion": "PPT slides Dos formas de firmar, Dos modelos de guardar la clave, 2026 en titulares; material §10", "alerta": "PPT: la Plataforma de Firma Digital Remota se creó por Decreto 892/2017; material: en una versión del párrafo dice que el Decreto 182/2019 habilitó la firma remota y en la corregida que la Plataforma creada por el Dec. 892/2017 fue incorporada a la reglamentación vigente (Dec. 182/2019). Va el PPT: 892/2017 crea la Plataforma.", "evidencia": [], "agregado": false, "b": 14, "nucleo": true}, {"id": "u14-validacion-remota", "seccion": "Formas de firmar y novedades", "termino": "Validación remota de identidad (Dec. 743/2024 y Res. SICyT 11/2025)", "pregunta": "¿Qué cambió el Decreto 743/2024 para obtener la firma digital?", "definicion": "Chau turno presencial. Antes: ir en persona con el DNI, turno en una autoridad de registro, validación cara a cara y, muchas veces, un token USB. Ahora: biometría remota contra el RENAPER; la identidad se valida a distancia para emitir, renovar o revocar el certificado. La firma puede ser remota, sin token.", "lista": null, "ejemplo": null, "articulos": ["Dec. 743/2024", "Res. SICyT 11/2025"], "fuente": "PPT+material", "ubicacion": "PPT slide Noticia Decreto 743/2024 y Res. 11/2025; material §8 y §10", "alerta": null, "evidencia": [], "agregado": false, "b": 14, "nucleo": false}, {"id": "u14-eidas", "seccion": "Formas de firmar y novedades", "termino": "eIDAS 2.0 (Unión Europea)", "pregunta": "¿Qué es eIDAS 2.0 y cómo se parece a la ley argentina?", "definicion": "El Reglamento UE 2024/1183 actualizó la regla europea de identidad y firma electrónica. Cada país debe ofrecer, a fines de 2026, una app oficial para identificarse, mostrar credenciales y firmar. Distingue firma simple, avanzada y cualificada; la cualificada equivale a la manuscrita, como nuestra firma digital. Su uso es voluntario para las personas; el sector privado regulado deberá aceptarla hacia fines de 2027.", "lista": null, "ejemplo": null, "articulos": ["Reglamento UE 2024/1183"], "fuente": "PPT+material", "ubicacion": "PPT slide Mirada global UE; material §10", "alerta": null, "evidencia": [], "agregado": false, "b": 14, "nucleo": false}, {"id": "u14-cccn-288-319", "seccion": "CCCN y caso Moisá", "termino": "Arts. 288 y 319 CCCN", "pregunta": "¿Qué dicen los arts. 288 y 319 del CCCN sobre la firma en instrumentos electrónicos?", "definicion": "Art. 288 · Firma: la firma prueba la autoría. En los instrumentos generados por medios electrónicos, el requisito de firma se cumple con una firma digital que asegure indubitablemente autoría e integridad. Art. 319 · Valor probatorio: cuando no hay firma con plena fuerza, el juez valora la prueba según el caso, entre otras cosas por la confiabilidad de los soportes y procedimientos técnicos usados. Es decir: firma digital, valor pleno. Firma electrónica, el juez decide cuánto vale.", "lista": null, "ejemplo": null, "articulos": ["Art. 288 CCCN", "Art. 319 CCCN"], "fuente": "PPT", "ubicacion": "PPT slide Antes del caso: el Código Civil y Comercial", "alerta": null, "evidencia": [], "agregado": false, "b": 14, "nucleo": false}, {"id": "u14-caso-moisa", "seccion": "CCCN y caso Moisá", "termino": "Caso Moisá (firma escaneada)", "pregunta": "Resuma el caso Moisá y las dos posturas.", "definicion": "El camarista Moisá (Cámara Civil y Comercial Común, Sala II, “Romano c/ AG Naum S.A.”) rechazó un escrito en el que el cliente firmó en papel y la abogada lo escaneó y lo subió con su firma digital; exigió que ambos firmen digitalmente. La Corte Suprema de Tucumán actuó de oficio y le aplicó un llamado de atención (Acordada 288/2026); Moisá demanda a la Provincia para anular la sanción.", "lista": {"titulo": "Postura A vs. Postura B", "items": ["Postura A (Moisá) “digitalizado no es digital”: el art. 288 CCCN exige firma digital en instrumentos electrónicos; un código procesal provincial no puede contradecir una ley nacional (art. 31 CN) y legislar sobre la firma es materia de la Nación (art. 75 inc. 12); la imagen de una firma es, como mucho, firma electrónica, sin presunciones y con el valor relativo del art. 319. Precedente: “Aiziczon c/ López” (sent. 109, 25/02/2025).", "Postura B (la Corte) “es firma electrónica y alcanza”: el art. 170 del código procesal de Tucumán prevé que el cliente firma en papel, el abogado sube la imagen con su firma digital y guarda el original; la firma escaneada es firma electrónica, y la digital es una especie de ese género; rechazar el escrito es la opción más gravosa y afecta el acceso a la justicia. Precedentes: “Sal” (dic. 2024), “Domínguez” (abr. 2025), “Santucho” (sep. 2025: criterio obligatorio para tribunales inferiores).", "Mirada de informático: sí está garantizado el PDF que subió la abogada (su firma digital cubre todo el archivo, imagen incluida); no está garantizada la firma del cliente (la prueba es el papel original que guarda la abogada)."]}, "ejemplo": null, "articulos": ["Art. 288 CCCN", "Art. 319 CCCN", "Art. 31 CN", "Art. 75 inc. 12 CN", "Art. 170 código procesal de Tucumán", "Acordada CSJT 288/2026"], "fuente": "PPT", "ubicacion": "PPT slides Noticia, El caso Moisá (hechos, postura A, postura B), Mirada de informático", "alerta": null, "evidencia": [], "agregado": false, "b": 14, "nucleo": false}, {"id": "u15-bases-cn", "seccion": "Las bases", "termino": "Bases constitucionales del derecho del trabajo", "pregunta": "¿Qué establecen los arts. 14 y 14 bis CN sobre el trabajo? ¿Por qué el derecho del trabajo es protectorio?", "definicion": "Art. 14 CN: todos los habitantes tienen derecho a trabajar y ejercer toda industria lícita, conforme a las leyes que reglamenten su ejercicio. Art. 14 bis CN: el trabajo goza de la protección de las leyes. El derecho del trabajo es protectorio: compensa la desigualdad real entre las partes.", "lista": {"titulo": "Art. 14 bis asegura", "items": ["Condiciones dignas", "Jornada limitada", "Salario mínimo", "Protección contra el despido arbitrario", "Seguridad social"]}, "ejemplo": null, "articulos": ["Art. 14 CN", "Art. 14 bis CN"], "fuente": "PPT+material", "ubicacion": "PPT slide 3; material p. 2", "alerta": null, "evidencia": [], "agregado": false, "b": 15, "nucleo": false}, {"id": "u15-lct-reformas", "seccion": "Las bases", "termino": "La Ley de Contrato de Trabajo y sus reformas", "pregunta": "¿Qué es la LCT y qué reformas tuvo?", "definicion": "La Ley 20.744 (LCT), de 1974/1976, regula el trabajo en relación de dependencia en el sector privado. La LCT no fue derogada: es la misma ley, con muchos artículos con texto nuevo.", "lista": {"titulo": "Línea de tiempo", "items": ["1974 / 1976 · Ley 20.744 (LCT): regula el trabajo en relación de dependencia en el sector privado.", "Julio 2024 · Ley 27.742 (Ley Bases): período de prueba de 6 meses y fin de las multas por falta de registro.", "Marzo 2026 · Ley 27.802 de Modernización Laboral: reforma más de 50 artículos de la LCT."]}, "ejemplo": null, "articulos": ["Ley 20.744", "Ley 27.742", "Ley 27.802"], "fuente": "PPT+material", "ubicacion": "PPT slide 4; material p. 1-2 y p. 15", "alerta": null, "evidencia": ["quiz15"], "agregado": false, "b": 15, "nucleo": true}, {"id": "u15-vigencia-reforma", "seccion": "Las bases", "termino": "Vigencia de la reforma 2026", "pregunta": "¿La reforma de 2026 está vigente?", "definicion": "Sí: la Ley 27.802 se publicó y entró en vigencia el 6/3/2026; el 30/3/2026 una cautelar pedida por la CGT suspendió unos 80 artículos; en julio de 2026 la cautelar quedó revocada y firme: la ley rige. El juicio de fondo sobre su constitucionalidad sigue abierto en la justicia.", "lista": {"titulo": "Cronología", "items": ["6/3/2026: se publica la Ley 27.802 y entra en vigencia.", "30/3/2026: una cautelar pedida por la CGT suspende unos 80 artículos.", "Julio 2026: la cautelar queda revocada y firme: la ley rige."]}, "ejemplo": null, "articulos": ["Ley 27.802"], "fuente": "PPT+material", "ubicacion": "PPT slide 5; material p. 15", "alerta": null, "evidencia": [], "agregado": false, "b": 15, "nucleo": false}, {"id": "u15-principios", "seccion": "Las bases", "termino": "Principios que protegen al trabajador", "pregunta": "Enumere y explique los principios del derecho del trabajo.", "definicion": "Principios que protegen al trabajador (PPT): irrenunciabilidad, norma más favorable, continuidad, primacía de la realidad, no discriminación y gratuidad.", "lista": {"titulo": "Principios", "items": ["Irrenunciabilidad (art. 12): no se puede renunciar a derechos de la ley o del convenio.", "Norma más favorable (art. 9): ante la duda, se aplica lo más favorable al trabajador.", "Continuidad (art. 10): ante la duda, el contrato sigue.", "Primacía de la realidad (art. 14): importan los hechos, no el nombre del contrato.", "No discriminación (arts. 17 y 81): igualdad de trato.", "Gratuidad (art. 20): los trámites y juicios no le cuestan al trabajador."]}, "ejemplo": "Material: si el trabajador firma aceptando cobrar menos que el mínimo, esa cláusula es nula y se reemplaza por la norma legal (irrenunciabilidad).", "articulos": ["Art. 9 LCT", "Art. 10 LCT", "Art. 12 LCT", "Art. 14 LCT", "Art. 17 LCT", "Art. 81 LCT", "Art. 20 LCT"], "fuente": "PPT+material", "ubicacion": "PPT slide 6; material p. 3", "alerta": null, "evidencia": ["quiz15"], "agregado": false, "b": 15, "nucleo": true}, {"id": "u15-buena-fe", "seccion": "Las bases", "termino": "Buena fe", "pregunta": "¿Qué es el principio de buena fe en el contrato de trabajo?", "definicion": "Buena fe (art. 63): las dos partes deben actuar con lealtad durante todo el contrato.", "lista": null, "ejemplo": null, "articulos": ["Art. 63 LCT"], "fuente": "material", "ubicacion": "material p. 3 y p. 7", "alerta": "Solo en el material: el PPT lista 6 principios y no incluye la buena fe. Para «enumere» usar la lista del PPT.", "evidencia": [], "agregado": false, "b": 15, "nucleo": false}, {"id": "u15-trabajo", "seccion": "Conceptos", "termino": "Trabajo (art. 4 LCT)", "pregunta": "¿Qué es trabajo para la LCT?", "definicion": "«Toda actividad lícita que se preste en favor de quien tiene la facultad de dirigirla, mediante una remuneración» (art. 4).", "lista": {"titulo": "Notas", "items": ["Licitud: la actividad es legal.", "Dirección: otro organiza y dirige.", "Personal: lo presta el propio trabajador.", "Remuneración: hay un pago a cambio."]}, "ejemplo": null, "articulos": ["Art. 4 LCT"], "fuente": "PPT", "ubicacion": "PPT slide 7; material p. 3", "alerta": null, "evidencia": ["quiz15"], "agregado": false, "b": 15, "nucleo": true}, {"id": "u15-contrato-relacion", "seccion": "Conceptos", "termino": "Contrato, relación y presunción", "pregunta": "¿Qué diferencia hay entre contrato de trabajo y relación de trabajo? ¿Qué presume el art. 23?", "definicion": "Contrato (art. 21): el acuerdo: una persona humana presta servicios bajo dependencia a cambio de una remuneración. Relación (art. 22): el hecho: la prestación efectiva del trabajo; se protege aunque no haya nada escrito. Presunción (art. 23): prestar servicios hace presumir el contrato; desde 2026 no rige si hay facturación y pago bancarizado. Clave para informáticos monotributistas: lo que decide es la dependencia real.", "lista": {"titulo": "Contrato vs relación vs presunción", "items": ["Contrato (art. 21): el acuerdo; persona humana, servicios bajo dependencia, remuneración.", "Relación (art. 22): el hecho; prestación efectiva, protegida aunque no haya nada escrito.", "Presunción (art. 23): prestar servicios hace presumir el contrato; desde 2026 no rige si hay facturación y pago bancarizado."]}, "ejemplo": null, "articulos": ["Art. 21 LCT", "Art. 22 LCT", "Art. 23 LCT"], "fuente": "PPT+material", "ubicacion": "PPT slide 8; material p. 4", "alerta": "Matiz (no contradicción): el material precisa que la excepción rige cuando se contratan obras, servicios profesionales o de oficios y la relación se instrumenta con facturación y pagos bancarizados, y que la presunción admite prueba en contrario.", "evidencia": [], "agregado": false, "b": 15, "nucleo": true}, {"id": "u15-partes", "seccion": "Conceptos", "termino": "Partes del contrato de trabajo", "pregunta": "¿Quiénes pueden ser trabajador y empleador?", "definicion": "El trabajador es la persona humana que se obliga a prestar servicios (art. 25); nunca puede ser una persona jurídica: el trabajo es personal e infungible. El empleador puede ser persona humana o jurídica, tenga o no fines de lucro (art. 26).", "lista": null, "ejemplo": null, "articulos": ["Art. 25 LCT", "Art. 26 LCT"], "fuente": "material", "ubicacion": "material p. 4", "alerta": "Solo en el material; el PPT solo dice «persona humana» en el art. 21 y «Personal» en el art. 4.", "evidencia": [], "agregado": false, "b": 15, "nucleo": false}, {"id": "u15-dependencia", "seccion": "Conceptos", "termino": "Dependencia (triple sentido)", "pregunta": "¿Qué es la dependencia y en qué sentidos se da?", "definicion": "La dependencia, en triple sentido: jurídica, técnica y económica. Lo que define el contrato es la dependencia real, no el nombre ni la factura.", "lista": {"titulo": "Dependencia", "items": ["Jurídica: el empleador da órdenes y el trabajador debe cumplirlas. Es la nota decisiva.", "Técnica: el empleador decide cómo, cuándo y dónde se trabaja.", "Económica: el trabajador vive de su sueldo; el riesgo del negocio es del empleador."]}, "ejemplo": "PPT: «Para pensar: ¿un programador con horario fijo, jefe y una sola empresa, que factura, es independiente?» Material: por primacía de la realidad, todo indica dependencia.", "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slide 9 y 33; material p. 4-5", "alerta": null, "evidencia": [], "agregado": false, "b": 15, "nucleo": true}, {"id": "u15-requisitos", "seccion": "Conceptos", "termino": "Requisitos del contrato de trabajo", "pregunta": "¿Cuáles son los requisitos del contrato de trabajo?", "definicion": "Capacidad, consentimiento, objeto y forma.", "lista": {"titulo": "Requisitos", "items": ["Capacidad: plena desde los 18; de 16 a 18, con autorización; prohibido antes de los 16.", "Consentimiento: acuerdo libre entre las partes.", "Objeto: actividad lícita y no prohibida.", "Forma: libre, verbal o escrito (art. 48), salvo excepciones."]}, "ejemplo": "Material: objeto ilícito → contrato nulo sin efectos para nadie; objeto prohibido (p. ej. contratar a un menor de 16) → prohibición dirigida al empleador, el trabajador conserva sus derechos. Excepción de forma: el plazo fijo va por escrito.", "articulos": ["Art. 48 LCT"], "fuente": "PPT+material", "ubicacion": "PPT slide 10; material p. 5", "alerta": null, "evidencia": [], "agregado": false, "b": 15, "nucleo": true}, {"id": "u15-periodo-prueba", "seccion": "Conceptos", "termino": "Período de prueba (art. 92 bis)", "pregunta": "¿Qué es el período de prueba y cuánto dura?", "definicion": "Período de prueba (art. 92 bis): 6 meses como regla general desde la Ley 27.742; 8 meses por convenio en empresas de 6 a 100 trabajadores; 1 año por convenio en empresas de hasta 5 trabajadores. Sin indemnización y, desde 2026, sin preaviso; con registro desde el primer día; con derechos (sueldo, aportes, obra social y ART).", "lista": {"titulo": "Claves", "items": ["6 meses: regla general desde la Ley 27.742.", "8 meses: por convenio, en empresas de 6 a 100 trabajadores.", "1 año: por convenio, en empresas de hasta 5 trabajadores.", "Sin indemnización; y desde 2026, sin preaviso.", "Con registro desde el primer día.", "Con derechos: sueldo, aportes, obra social y ART."]}, "ejemplo": null, "articulos": ["Art. 92 bis LCT", "Ley 27.742"], "fuente": "PPT+material", "ubicacion": "PPT slide 11; material p. 5", "alerta": "Material: rige para todo contrato por tiempo indeterminado; antes de la Ley 27.742 eran tres meses (dato histórico, no del PPT).", "evidencia": [], "agregado": false, "b": 15, "nucleo": true}, {"id": "u15-registro", "seccion": "Conceptos", "termino": "Trabajo registrado y no registrado", "pregunta": "¿Qué diferencia hay entre trabajo registrado y no registrado?", "definicion": "Registrado: alta digital en ARCA (ex AFIP) desde el primer día; da jubilación, obra social, ART, asignaciones familiares y seguro de desempleo. No registrado: el «trabajo en negro» deja al trabajador sin ninguna de esas coberturas y en situación de desprotección. Ojo: la Ley 27.742 derogó las multas de las Leyes 24.013 y 25.323; la obligación de registrar sigue.", "lista": {"titulo": "Registrado vs no registrado", "items": ["Alta: registrado, digital en ARCA desde el primer día; no registrado, sin alta («en negro»).", "Coberturas: registrado, jubilación, obra social, ART, asignaciones familiares y seguro de desempleo; no registrado, ninguna.", "Multas: la Ley 27.742 derogó las de las Leyes 24.013 y 25.323; la obligación de registrar sigue."]}, "ejemplo": null, "articulos": ["Ley 27.742", "Ley 24.013", "Ley 25.323", "Art. 52 LCT"], "fuente": "PPT+material", "ubicacion": "PPT slide 12; material p. 5-6", "alerta": null, "evidencia": [], "agregado": false, "b": 15, "nucleo": false}, {"id": "u15-modalidades", "seccion": "Modalidades", "termino": "Modalidades del contrato", "pregunta": "¿Qué modalidades del contrato de trabajo existen?", "definicion": "Tiempo indeterminado (art. 90): el contrato común, sin fecha de fin; es la regla y se presume. Las demás son excepciones: plazo fijo, de temporada, eventual, tiempo parcial y teletrabajo.", "lista": {"titulo": "Modalidades (qué es · para recordar)", "items": ["Tiempo indeterminado (art. 90): el contrato común, sin fecha de fin · es la regla y se presume.", "Plazo fijo (arts. 93-95): tiempo cierto, hasta 5 años · por escrito, justificado y con preaviso.", "De temporada (arts. 96-98): actividades que se repiten cada año · ej.: zafra o turismo de verano.", "Eventual (arts. 99-100): necesidades extraordinarias y transitorias · reemplazos o picos de trabajo.", "Tiempo parcial (art. 92 ter): jornada menor a la normal · desde 2026 sin el tope de 2/3.", "Teletrabajo (art. 102 bis): trabajo a distancia con TIC · la Ley 27.555 se deroga el 1/1/2027."]}, "ejemplo": null, "articulos": ["Art. 90 LCT", "Arts. 93-95 LCT", "Arts. 96-98 LCT", "Arts. 99-100 LCT", "Art. 92 ter LCT", "Art. 102 bis LCT", "Ley 27.555"], "fuente": "PPT+material", "ubicacion": "PPT slide 13; material p. 6", "alerta": "El material agrega «De equipo (art. 101): un grupo de trabajadores contratado como tal; ej.: una orquesta». No está en el PPT: no entra en la lista para «enumere».", "evidencia": [], "agregado": false, "b": 15, "nucleo": true}, {"id": "u15-figuras-nuevas", "seccion": "Modalidades", "termino": "Independiente con colaboradores y trabajo en plataformas", "pregunta": "¿Qué figuras nuevas crearon las reformas?", "definicion": "Independiente con colaboradores (Ley 27.742): un autónomo puede trabajar con hasta tres colaboradores independientes sin relación de dependencia. Trabajo en plataformas (Ley 27.802): régimen propio para delivery y transporte por app, fuera de la LCT; uno de los puntos más discutidos.", "lista": null, "ejemplo": "Material: un desarrollador que arma un equipo chico para un proyecto (independiente con colaboradores).", "articulos": ["Ley 27.742", "Ley 27.802"], "fuente": "PPT+material", "ubicacion": "PPT slide 14; material p. 7", "alerta": null, "evidencia": [], "agregado": false, "b": 15, "nucleo": false}, {"id": "u15-facultades", "seccion": "Derechos y obligaciones", "termino": "Facultades del empleador", "pregunta": "¿Cuáles son las facultades (derechos) del empleador?", "definicion": "Organización, dirección, ius variandi, disciplina y control.", "lista": {"titulo": "Facultades", "items": ["Organización (art. 64): organizar la empresa.", "Dirección (art. 65): dar órdenes, respetando la dignidad.", "Ius variandi (art. 66): cambios razonables, sin dañar al trabajador.", "Disciplina (art. 67): sanciones proporcionales.", "Control (art. 70): discreto y razonable: correo, pantalla, GPS."]}, "ejemplo": "Material: el ius variandi permite cambiar, p. ej., horario o lugar, si no es irrazonable, no altera lo esencial ni causa perjuicio material o moral; el control debe ser conocido, razonable y proporcional.", "articulos": ["Art. 64 LCT", "Art. 65 LCT", "Art. 66 LCT", "Art. 67 LCT", "Art. 70 LCT"], "fuente": "PPT+material", "ubicacion": "PPT slide 15; material p. 7", "alerta": "Material agrega que el trabajador puede cuestionar las sanciones dentro de los 30 días (dato solo del material).", "evidencia": ["quiz15"], "agregado": false, "b": 15, "nucleo": true}, {"id": "u15-deberes-empleador", "seccion": "Derechos y obligaciones", "termino": "Deberes del empleador", "pregunta": "Enumere los deberes del empleador.", "definicion": "Pagar el sueldo, seguridad, ocupación efectiva, diligencia, certificados, igualdad y registro.", "lista": {"titulo": "Deberes del empleador", "items": ["Pagar el sueldo (art. 74): en tiempo y forma.", "Seguridad (art. 75): proteger la vida y la salud.", "Ocupación efectiva (art. 78): dar tareas.", "Diligencia (art. 79): aportes y documentación al día.", "Certificados (art. 80): al terminar; hoy pueden ser digitales.", "Igualdad y registro (arts. 81 y 52): trato igual y alta digital."]}, "ejemplo": "Material: no se puede tener a alguien sin tareas como forma de castigo (ocupación efectiva).", "articulos": ["Art. 74 LCT", "Art. 75 LCT", "Art. 78 LCT", "Art. 79 LCT", "Art. 80 LCT", "Art. 81 LCT", "Art. 52 LCT"], "fuente": "PPT+material", "ubicacion": "PPT slide 16; material p. 8", "alerta": null, "evidencia": ["quiz15"], "agregado": false, "b": 15, "nucleo": true}, {"id": "u15-deberes-trabajador", "seccion": "Derechos y obligaciones", "termino": "Deberes del trabajador", "pregunta": "Enumere los deberes del trabajador.", "definicion": "Diligencia, fidelidad, obediencia, no concurrencia y responsabilidad por daños.", "lista": {"titulo": "Deberes del trabajador", "items": ["Diligencia (art. 84): trabajar con cuidado y responsabilidad.", "Fidelidad (art. 85): reserva sobre código, datos y credenciales.", "Obediencia (art. 86): cumplir órdenes legítimas.", "No concurrencia (art. 88): no competir con el empleador.", "Daños (art.
