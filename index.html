87): responde solo por dolo o culpa grave."]}, "ejemplo": null, "articulos": ["Art. 84 LCT", "Art. 85 LCT", "Art. 86 LCT", "Art. 88 LCT", "Art. 87 LCT"], "fuente": "PPT+material", "ubicacion": "PPT slide 17; material p. 8", "alerta": null, "evidencia": ["quiz15"], "agregado": false, "b": 15, "nucleo": true}, {"id": "u15-software-trabajo", "seccion": "Derechos y obligaciones", "termino": "Titularidad del software creado en el trabajo", "pregunta": "¿De quién es el software que escribe un trabajador?", "definicion": "Del empleador: lo creado en cumplimiento de las tareas para las que me contrataron (arts. 82 y 83 LCT; Ley 11.723). Mío: lo que creo por mi cuenta, fuera de mis tareas y sin recursos de la empresa. Por eso conviene leer con atención las cláusulas de propiedad intelectual del contrato.", "lista": null, "ejemplo": null, "articulos": ["Arts. 82 y 83 LCT", "Ley 11.723"], "fuente": "PPT+material", "ubicacion": "PPT slide 18; material p. 8", "alerta": "Material agrega: según la Ley 11.723, el software desarrollado por trabajadores contratados para eso pertenece al empleador, salvo pacto en contrario.", "evidencia": [], "agregado": false, "b": 15, "nucleo": false}, {"id": "u15-remuneracion", "seccion": "Derechos y obligaciones", "termino": "Remuneración (art. 103)", "pregunta": "¿Qué es la remuneración y qué reglas la rigen?", "definicion": "Se paga por poner la capacidad de trabajo a disposición, aunque no haya tareas (art. 103). Nunca menos que el salario mínimo, vital y móvil. Salario dinámico: desde 2026, los convenios pueden atar una parte al desempeño. Pago en dinero, por banco; inembargable hasta el mínimo, salvo alimentos.", "lista": {"titulo": "La remuneración", "items": ["Concepto (art. 103): se paga por poner la capacidad de trabajo a disposición, aunque no haya tareas.", "Salario mínimo: nunca menos que el salario mínimo, vital y móvil.", "Salario dinámico: desde 2026, los convenios pueden atar una parte al desempeño.", "Pago e inembargabilidad: en dinero, por banco; inembargable hasta el mínimo, salvo alimentos."]}, "ejemplo": null, "articulos": ["Art. 103 LCT"], "fuente": "PPT+material", "ubicacion": "PPT slide 19; material p. 8-9", "alerta": null, "evidencia": [], "agregado": false, "b": 15, "nucleo": false}, {"id": "u15-remunerativo", "seccion": "Derechos y obligaciones", "termino": "Remunerativo vs no remunerativo", "pregunta": "¿Qué diferencia hay entre conceptos remunerativos y no remunerativos?", "definicion": "Remunerativo: básico, antigüedad, horas extras, comisiones y adicionales de convenio; genera aportes y cuenta para aguinaldo, vacaciones e indemnización. No remunerativo: beneficios sociales, viáticos con comprobante y sumas pactadas como tales; no genera aportes ni suma para esos cálculos.", "lista": {"titulo": "Remunerativo vs no remunerativo", "items": ["Ejemplos: remunerativo, básico, antigüedad, horas extras, comisiones, adicionales de convenio; no remunerativo, beneficios sociales, viáticos con comprobante, sumas pactadas como tales.", "Aportes: remunerativo genera; no remunerativo no genera.", "Cálculos: remunerativo cuenta para aguinaldo, vacaciones e indemnización; no remunerativo no suma."]}, "ejemplo": "PPT: cuando te ofrecen un paquete, preguntá cuánto es sueldo y cuánto es beneficio.", "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slide 20; material p. 9", "alerta": null, "evidencia": [], "agregado": false, "b": 15, "nucleo": false}, {"id": "u15-aguinaldo", "seccion": "Derechos y obligaciones", "termino": "Sueldo anual complementario (aguinaldo)", "pregunta": "¿Qué es el SAC y cuándo se paga?", "definicion": "Cada cuota es el 50% de la mayor remuneración mensual del semestre; fecha límite de la primera cuota 30/6 y de la segunda 18/12 (arts. 121 y 122 LCT). Si el contrato termina antes, se cobra proporcional.", "lista": null, "ejemplo": null, "articulos": ["Arts. 121 y 122 LCT"], "fuente": "PPT+material", "ubicacion": "PPT slide 21; material p. 9", "alerta": null, "evidencia": [], "agregado": false, "b": 15, "nucleo": false}, {"id": "u15-jornada", "seccion": "Derechos y obligaciones", "termino": "Jornada, vacaciones y licencias", "pregunta": "¿Qué establece la LCT sobre jornada, vacaciones y licencias?", "definicion": "Jornada: 8 h diarias o 48 semanales; desde 2026, banco de horas con 12 h de descanso entre jornadas. Vacaciones: 14, 21, 28 o 35 días según antigüedad; entre el 1/10 y el 30/4, fraccionables de a 7 días. Licencias: matrimonio 10 días, maternidad 90; enfermedad: 3 o 6 meses pagos; certificado con firma digital.", "lista": {"titulo": "Jornada, vacaciones y licencias", "items": ["Jornada: 8 h diarias o 48 semanales; desde 2026, banco de horas con 12 h de descanso entre jornadas.", "Vacaciones: 14, 21, 28 o 35 días según antigüedad; entre el 1/10 y el 30/4, fraccionables de a 7 días.", "Licencias: matrimonio 10 días, maternidad 90; enfermedad: 3 o 6 meses pagos; certificado con firma digital."]}, "ejemplo": null, "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slide 22; material p. 9", "alerta": "Material precisa (sin contradecir): vacaciones 14 días hasta 5 años, 21 de 5 a 10, 28 de 10 a 20, 35 con más de 20 (art. 150); enfermedad 3 meses con menos de 5 años de antigüedad y 6 con más, el doble con cargas de familia (art. 208); también 35 h de descanso semanal.", "evidencia": [], "agregado": false, "b": 15, "nucleo": false}, {"id": "u15-seguridad-social", "seccion": "Beneficios sociales", "termino": "Beneficios de la seguridad social", "pregunta": "¿Qué beneficios da el trabajo registrado?", "definicion": "Lo que da el trabajo registrado: jubilación (SIPA, Ley 24.241), obra social (para el trabajador y su familia), asignaciones (por hijo, nacimiento y más), ART (accidentes y enfermedades) y desempleo (seguro si pierde el empleo). Se financia con los aportes del trabajador (alrededor del 17% del bruto) y las contribuciones del empleador.", "lista": {"titulo": "Beneficios", "items": ["Jubilación: SIPA, Ley 24.241.", "Obra social: para el trabajador y su familia.", "Asignaciones: por hijo, nacimiento y más.", "ART: accidentes y enfermedades.", "Desempleo: seguro si pierde el empleo."]}, "ejemplo": null, "articulos": ["Ley 24.241"], "fuente": "PPT+material", "ubicacion": "PPT slide 23; material p. 10", "alerta": null, "evidencia": [], "agregado": false, "b": 15, "nucleo": false}, {"id": "u15-103bis", "seccion": "Beneficios sociales", "termino": "Beneficios sociales del art. 103 bis", "pregunta": "¿Qué son los beneficios sociales del art. 103 bis?", "definicion": "Prestaciones no remunerativas, no dinerarias y no sustituibles en dinero, que mejoran la calidad de vida del trabajador y su familia. La Ley 27.802 amplió y reordenó la lista.", "lista": {"titulo": "Ejemplos (PPT)", "items": ["Comedor, y reintegro de gastos médicos.", "Ropa de trabajo, y elementos de seguridad.", "Guardería, y útiles escolares.", "Capacitación, y gastos de sepelio."]}, "ejemplo": null, "articulos": ["Art. 103 bis LCT", "Ley 27.802"], "fuente": "PPT+material", "ubicacion": "PPT slide 24; material p. 10", "alerta": "Material agrega: son prestaciones de seguridad social, no acumulables, que el empleador otorga voluntariamente, y no son salario en especie; por eso no generan aportes ni cuentan para la indemnización.", "evidencia": [], "agregado": false, "b": 15, "nucleo": false}, {"id": "u15-extincion", "seccion": "Extinción", "termino": "Extinción del contrato", "pregunta": "¿Cómo termina el contrato de trabajo y en qué casos hay indemnización por antigüedad?", "definicion": "Lo que se cobra depende de la causa de extinción.", "lista": {"titulo": "Causa → ¿indemnización por antigüedad?", "items": ["Renuncia (art. 240): no; cobra la liquidación final.", "Mutuo acuerdo (art. 241): no, salvo lo que se pacte.", "Despido con justa causa (art. 242): no.", "Despido sin causa (art. 245): sí, completa.", "Despido indirecto (art. 246): sí, completa.", "Fuerza mayor o falta de trabajo (art. 247): sí, el 50%.", "Muerte del trabajador (art. 248): sí, el 50% para sus derechohabientes.", "Jubilación (art. 252): no."]}, "ejemplo": null, "articulos": ["Art. 240 LCT", "Art. 241 LCT", "Art. 242 LCT", "Art. 245 LCT", "Art. 246 LCT", "Art. 247 LCT", "Art. 248 LCT", "Art. 252 LCT"], "fuente": "PPT+material", "ubicacion": "PPT slide 25; material p. 11", "alerta": "El material agrega dos causas que el PPT no lista: vencimiento del plazo (arts. 95 y 250: indemnización reducida si duró más de un año) e incapacidad absoluta (arts. 212 y 254: equivalente a la del art. 245).", "evidencia": [], "agregado": false, "b": 15, "nucleo": true}, {"id": "u15-justa-causa-indirecto", "seccion": "Extinción", "termino": "Despido con justa causa y despido indirecto", "pregunta": "¿Qué es el despido con justa causa y qué es el despido indirecto?", "definicion": "Justa causa (arts. 242-244): incumplimiento grave del trabajador; se comunica por escrito y la causa no se puede cambiar después; el abandono exige intimar antes. Despido indirecto (art. 246): el empleador incumple gravemente; el trabajador lo intima y, si no responde, se considera despedido con derecho a indemnización.", "lista": {"titulo": "Justa causa vs despido indirecto", "items": ["Quién incumple: justa causa, el trabajador; indirecto, el empleador.", "Cómo: justa causa, comunicación por escrito, causa inmodificable, abandono previa intimación; indirecto, el trabajador intima y, si no hay respuesta, se considera despedido.", "Indemnización por antigüedad: justa causa, no; indirecto, sí, completa."]}, "ejemplo": "Material: incumplimientos graves del empleador: no paga el sueldo, no registra al trabajador, lo maltrata.", "articulos": ["Arts. 242-244 LCT", "Art. 246 LCT"], "fuente": "PPT+material", "ubicacion": "PPT slide 26; material p. 12", "alerta": null, "evidencia": [], "agregado": false, "b": 15, "nucleo": false}, {"id": "u15-renuncia-mutuo", "seccion": "Extinción", "termino": "Renuncia y mutuo acuerdo", "pregunta": "¿Cómo se formalizan la renuncia y el mutuo acuerdo?", "definicion": "Renuncia (art. 240): por telegrama o ante la autoridad laboral; el trabajador debe dar 15 días de preaviso. Mutuo acuerdo (art. 241): por escritura pública o ante la autoridad judicial o administrativa; reformado en 2026.", "lista": null, "ejemplo": null, "articulos": ["Art. 240 LCT", "Art. 241 LCT"], "fuente": "PPT+material", "ubicacion": "PPT slide 27; material p. 11", "alerta": null, "evidencia": [], "agregado": false, "b": 15, "nucleo": false}, {"id": "u15-preaviso", "seccion": "Extinción", "termino": "Preaviso e integración del mes", "pregunta": "¿Qué es el preaviso y cuánto dura? ¿Qué es la integración del mes?", "definicion": "Preaviso del empleador: 1 mes hasta 5 años de antigüedad; 2 meses con más de 5 años. Preaviso del trabajador que renuncia: 15 días. Sustitutiva (art. 232): si no hay preaviso, se paga. Integración (art. 233): días hasta fin de mes. Período de prueba: sin preaviso desde 2026.", "lista": {"titulo": "Claves", "items": ["1 mes: preaviso del empleador hasta 5 años de antigüedad.", "2 meses: preaviso del empleador con más de 5 años.", "15 días: preaviso del trabajador que renuncia.", "Sustitutiva (art. 232): si no hay preaviso, se paga.", "Integración (art. 233): días hasta fin de mes.", "Período de prueba: sin preaviso desde 2026."]}, "ejemplo": null, "articulos": ["Art. 232 LCT", "Art. 233 LCT"], "fuente": "PPT+material", "ubicacion": "PPT slide 28; material p. 12", "alerta": null, "evidencia": [], "agregado": false, "b": 15, "nucleo": false}, {"id": "u15-indemnizacion", "seccion": "Indemnizaciones", "termino": "Indemnización por antigüedad (art. 245)", "pregunta": "¿Cómo se calcula la indemnización por antigüedad?", "definicion": "Fórmula: un sueldo por año o fracción mayor de 3 meses. Base: mejor sueldo mensual del último año, sin aguinaldo ni lo no mensual. Tope: 3 veces el promedio del convenio colectivo. Piso: al menos el 67% del sueldo real (Vizzoti, 2004). Nunca puede ser menor a un sueldo. La reforma de 2026 cambió la base, no la fórmula.", "lista": {"titulo": "Componentes", "items": ["Fórmula: un sueldo por año o fracción mayor de 3 meses.", "Base: mejor sueldo mensual del último año, sin aguinaldo ni lo no mensual.", "Tope: 3 veces el promedio del convenio colectivo.", "Piso: al menos el 67% del sueldo real (Vizzoti, 2004).", "Mínimo: nunca puede ser menor a un sueldo."]}, "ejemplo": "PPT: Lucía, 4 años y 8 meses, sueldo $1.000.000, despedida sin causa ni preaviso el día 10: antigüedad 5 sueldos (8 meses > 3) = $5.000.000; preaviso 1 mes (menos de 5 años) = $1.000.000; integración (20 días restantes) y días trabajados, SAC y vacaciones proporcionales: a calcular en clase.", "articulos": ["Art. 245 LCT", "Art. 232 LCT", "Art. 233 LCT"], "fuente": "PPT+material", "ubicacion": "PPT slides 29-30; material p. 12-13", "alerta": "Matiz: el material dice que la base excluye además las vacaciones y que para remuneraciones variables se toma un promedio; el piso se expresa como «el tope no puede reducir la base en más de un 33%».", "evidencia": [], "agregado": false, "b": 15, "nucleo": true}, {"id": "u15-agravadas", "seccion": "Indemnizaciones", "termino": "Indemnizaciones agravadas", "pregunta": "¿Cuáles son las indemnizaciones agravadas?", "definicion": "Matrimonio (art. 182): despido 3 meses antes o 6 después del casamiento: suma un año de sueldos. Maternidad (art. 178): despido 7 meses y medio antes o después del parto: suma un año de sueldos. Discriminatorio: Ley 27.742, indemnización agravada, sin reinstalación; lo prueba quien lo alega.", "lista": null, "ejemplo": null, "articulos": ["Art. 182 LCT", "Art. 178 LCT", "Ley 27.742"], "fuente": "PPT+material", "ubicacion": "PPT slide 31; material p. 14", "alerta": "Material: en matrimonio y maternidad la ley presume que el despido en esos plazos se debe a esa causa.", "evidencia": [], "agregado": false, "b": 15, "nucleo": false}, {"id": "u15-novedades-2026", "seccion": "Indemnizaciones", "termino": "Otras novedades de 2026", "pregunta": "¿Qué otras novedades indemnizatorias trajo la reforma de 2026?", "definicion": "Actualización: IPC más 3% anual hasta el pago (art. 276). Pago en cuotas: según el tamaño de la empresa (art. 277). Reingreso: se descuenta lo ya cobrado, actualizado (art. 255). Fondo FAL: aporte mensual del empleador; arranca el 1/12/2026.", "lista": null, "ejemplo": null, "articulos": ["Art. 276 LCT", "Art. 277 LCT", "Art. 255 LCT"], "fuente": "PPT+material", "ubicacion": "PPT slide 32; material p. 14", "alerta": null, "evidencia": [], "agregado": false, "b": 15, "nucleo": false}, {"id": "u17-confidencialidad", "seccion": "Concepto y marco legal", "termino": "Confidencialidad", "pregunta": "¿Qué es la confidencialidad?", "definicion": "La RAE define confidencialidad como la cualidad de confidencial. Esto se refiere a lo que se hace o se dice en confianza y con reserva entre dos o más personas, garantizando que se mantendrá la discreción sobre la información compartida. Es información que da una ventaja competitiva a la empresa y cuya divulgación podría causarle perjuicio.", "lista": null, "ejemplo": null, "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slides 2 y 5; material §1", "alerta": null, "evidencia": ["quiz17"], "agregado": false, "b": 17, "nucleo": true}, {"id": "u17-ley-24766", "seccion": "Concepto y marco legal", "termino": "Ley 24.766 (marco legal)", "pregunta": "¿Cuál es el marco legal de la confidencialidad en Argentina?", "definicion": "Ley N° 24.766. Secretos Comerciales y de Confidencialidad. Sancionada en 1996, protege la información confidencial y los secretos comerciales o industriales en el ámbito de la competencia desleal.", "lista": null, "ejemplo": null, "articulos": ["Ley 24.766"], "fuente": "PPT+material", "ubicacion": "PPT slide 3; material §2 (sancionada en diciembre de 1996; nace del art. 39 del ADPIC, aprobado por Ley 24.425)", "alerta": null, "evidencia": ["tp6"], "agregado": false, "b": 17, "nucleo": true}, {"id": "u17-info-confidencial", "seccion": "Requisitos de la información confidencial", "termino": "Información confidencial (requisitos)", "pregunta": "¿Qué requisitos debe reunir la información para ser confidencial?", "definicion": "Define como información confidencial toda aquella que: sea secreta; tenga valor comercial por ser secreta; haya sido objeto de medidas razonables de protección para mantener su confidencialidad. La ley protege la información no divulgada si cumple los tres requisitos simultáneamente. Texto legal (PPT): «A los efectos de esta ley, se considera información no divulgada aquella información que una persona legítimamente posea, que sea secreta, que tenga valor comercial por ser secreta, y que haya sido objeto de medidas razonables para mantener su carácter secreto.»", "lista": {"titulo": "Requisitos (simultáneos)", "items": ["Sea secreta: no conocida ni fácilmente accesible para quienes habitualmente manejan ese tipo de información.", "Tenga valor comercial por ser secreta: su valor proviene justamente de que no es pública.", "Haya sido objeto de medidas razonables de protección para mantener su confidencialidad: el titular adoptó medidas para mantenerla en reserva (contratos, seguridad, acceso limitado, etc.)."]}, "ejemplo": null, "articulos": ["Art. 1 Ley 24.766"], "fuente": "PPT+material", "ubicacion": "PPT slides 4, 20-21; material §2-3 (el material ubica el texto en el art. 1; el PPT no numera el artículo)", "alerta": null, "evidencia": ["quiz17", "tp6"], "agregado": false, "b": 17, "nucleo": true}, {"id": "u17-secreta", "seccion": "Requisitos de la información confidencial", "termino": "Requisito 1: que la información sea secreta", "pregunta": "¿Qué significa que la información sea secreta?", "definicion": "Significa que no es generalmente conocida ni fácilmente accesible por personas del ámbito donde normalmente se usa ese tipo de información. O sea, no se trata de algo público o evidente.", "lista": null, "ejemplo": "La fórmula de la Pepsi, el algoritmo de recomendación de Netflix, o la lista de clientes estratégicos de una empresa.", "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slide 23; material §3", "alerta": null, "evidencia": ["tp6"], "agregado": false, "b": 17, "nucleo": false}, {"id": "u17-valor-comercial", "seccion": "Requisitos de la información confidencial", "termino": "Requisito 2: que tenga valor comercial por ser secreta", "pregunta": "¿Qué significa que la información tenga valor comercial por ser secreta?", "definicion": "No basta con que sea desconocida: tiene que tener valor económico justamente porque no todos la conocen. El hecho de que se mantenga en reserva da una ventaja competitiva a su titular. El valor proviene del secreto, no solo del contenido.", "lista": null, "ejemplo": "Una base de datos exclusiva de hábitos de consumo de los clientes permite diseñar estrategias más eficaces que la competencia; si se hace pública, pierde su valor.", "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slide 22; material §3", "alerta": null, "evidencia": ["tp6"], "agregado": false, "b": 17, "nucleo": false}, {"id": "u17-medidas-razonables", "seccion": "Requisitos de la información confidencial", "termino": "Requisito 3: protección razonable", "pregunta": "¿Qué son las medidas razonables de protección? Dé ejemplos.", "definicion": "La ley exige que el titular haya tomado medidas razonables para mantener el secreto. No tiene que ser un búnker, pero sí debe demostrar que se preocupó por resguardar la información. Si no hay protección, no hay secreto.", "lista": {"titulo": "Ejemplos de medidas razonables (PPT)", "items": ["Firmar acuerdos de confidencialidad (NDA) con empleados, proveedores o socios.", "Restringir el acceso a la información solo a quienes la necesitan.", "Usar contraseñas, servidores seguros o políticas internas de seguridad."]}, "ejemplo": "Si la empresa deja los documentos sensibles tirados en un escritorio o no controla quién accede a los archivos, después no puede reclamar que alguien «violó su confidencialidad». El material agrupa las medidas en contractuales, técnicas y organizativas.", "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slides 24-25; material §8", "alerta": null, "evidencia": ["tp6"], "agregado": false, "b": 17, "nucleo": false}, {"id": "u17-preguntas-guia", "seccion": "Requisitos de la información confidencial", "termino": "Preguntas guía: ¿es un secreto comercial?", "pregunta": "¿Qué preguntas permiten determinar si una información es confidencial?", "definicion": "El PPT propone una serie de preguntas para analizar el caso concreto; el material las ordena según los tres requisitos.", "lista": {"titulo": "Preguntas por requisito", "items": ["Secreta: ¿es conocida fuera de la empresa? ¿Es fácilmente accesible o deducible por cualquier persona del sector? ¿Qué tan difundida está dentro de la organización? ¿Quienes acceden la necesitan para su trabajo? ¿Se compartió con terceros y bajo qué condiciones? ¿Podría un competidor obtenerla legítimamente (ingeniería inversa, observación o investigación pública)?", "Valor comercial: ¿otorga una ventaja competitiva por mantenerse reservada? ¿Qué perjuicio económico sufriría la empresa si se hiciera pública? ¿Cuánto tiempo, dinero o esfuerzo demandó? ¿Podría un competidor ahorrar recursos si accediera a ella? ¿Alguien estaría dispuesto a pagar por conocerla?", "Medidas razonables: ¿existen acuerdos de confidencialidad? ¿Se restringe efectivamente el acceso? ¿Los empleados fueron informados de que es confidencial? ¿Se adoptan medidas concretas (etiquetarla, custodiarla, controlar su salida)?"]}, "ejemplo": null, "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slides 26-27; material §7", "alerta": null, "evidencia": [], "agregado": false, "b": 17, "nucleo": false}, {"id": "u17-decision-estrategica", "seccion": "Decisión estratégica de protección", "termino": "Decisión estratégica de protección", "pregunta": "¿De qué factores depende la decisión estratégica de cómo proteger un resultado de innovación?", "definicion": "En todo proceso de innovación o I+D, los resultados (producto, proceso, diseño, software o fórmula) constituyen activos intangibles con valor económico. Una vez obtenido un resultado relevante, la organización debe evaluar cómo protegerlo antes de difundirlo o implementarlo, porque cualquier innovación puede ser fácilmente copiada si no cuenta con un marco legal de protección. Decidir qué tipo de protección aplicar es una decisión estratégica que depende de múltiples factores.", "lista": {"titulo": "Factores", "items": ["Tipo y características del resultado: no toda innovación puede patentarse (procedimiento interno, algoritmo o método que no cumple los requisitos de patentabilidad); en esos casos puede convenir mantenerlo en secreto.", "Posibilidad de ingeniería inversa: si el producto final permite descubrir fácilmente su funcionamiento, no conviene basar la protección en la confidencialidad; una patente ofrece mejor resguardo.", "Duración del valor competitivo: si es de corto plazo, pueden bastar acuerdos de confidencialidad; si es una ventaja a largo plazo, conviene una protección formal.", "Costos y tiempos: tramitar una patente implica costos y plazos (a veces largos); mantener un secreto comercial depende de las medidas internas de seguridad.", "Estrategia de mercado: si la empresa planea licenciar o comercializar la tecnología, una patente brinda seguridad jurídica a los contratos; si busca mantener el control exclusivo, el secreto comercial puede ser más conveniente."]}, "ejemplo": null, "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slides 7-12; material §5", "alerta": null, "evidencia": ["tp6"], "agregado": false, "b": 17, "nucleo": true}, {"id": "u17-alternativas", "seccion": "Decisión estratégica de protección", "termino": "Alternativas de protección jurídica", "pregunta": "¿Qué alternativas de protección jurídica tiene un resultado de innovación? ¿Cuándo es útil la confidencialidad?", "definicion": "Frente a cada desarrollo, el equipo debe analizar las alternativas de protección jurídica disponibles. No existe una única forma de proteger la innovación. La confidencialidad es una alternativa estratégica, particularmente útil cuando no se cumplen los requisitos de patentabilidad, o la revelación pública (como exige la patente) sería perjudicial para el negocio.", "lista": {"titulo": "Alternativas", "items": ["Patentes de invención o modelos de utilidad (si el resultado cumple los requisitos de novedad, altura inventiva y aplicación industrial).", "Derechos de autor (por ejemplo, para programas informáticos, bases de datos o contenidos creativos).", "Marcas o diseños industriales (para signos distintivos o aspectos estéticos).", "Protección por confidencialidad o secreto comercial (Ley 24.766), cuando no conviene revelar la información."]}, "ejemplo": "Algoritmo de detección de fraude bancario creado por alumnos: si puede descubrirse al analizar su código, registrarlo como obra intelectual (software); si su valor está en un modelo matemático o método no evidente, mantenerlo como secreto comercial con acuerdos de confidencialidad con todos los colaboradores; si se desarrolla un sistema técnico o dispositivo físico, podría optarse por una patente.", "articulos": ["Ley 24.766"], "fuente": "PPT+material", "ubicacion": "PPT slides 8, 13-15; material §5", "alerta": null, "evidencia": ["tp6"], "agregado": false, "b": 17, "nucleo": true}, {"id": "u17-valor-informacion", "seccion": "Decisión estratégica de protección", "termino": "La información como activo", "pregunta": "¿Por qué la información es un activo y dónde radica su valor?", "definicion": "En el mundo actual, la información es uno de los activos más valiosos que posee una organización: conocimiento estratégico que otorga una ventaja competitiva, que permite innovar o que diferencia a una empresa del resto. El valor radica en su exclusividad; una vez que se divulga, pierde su carácter de ventaja. Por eso protegerla (patente, derecho de autor o secreto comercial) es una decisión esencial para la supervivencia y el crecimiento de la empresa.", "lista": null, "ejemplo": "La fórmula de Pepsi nunca fue patentada, justamente para evitar su divulgación pública (requisito de las patentes); se mantuvo bajo estrictas medidas de confidencialidad.", "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slides 16-19; material §1", "alerta": null, "evidencia": [], "agregado": false, "b": 17, "nucleo": false}, {"id": "u17-tipos", "seccion": "Tipos de información", "termino": "Tipos de información confidencial", "pregunta": "¿Qué tipos de información se consideran confidenciales?", "definicion": "Cuatro tipos de información pueden constituir un secreto comercial: financiera, técnica y científica, comercial y negativa.", "lista": {"titulo": "Tipos (orden del PPT)", "items": ["Financiera: datos económicos o contables que muestran la situación, desempeño o estrategias de una empresa; no son públicos y su difusión podría afectar la posición competitiva o el valor de la compañía. Ej.: márgenes de ganancia y estructuras de costos, políticas internas de precios o descuentos, presupuestos de inversión o proyecciones de ventas.", "Técnica y científica: abarca conocimientos aplicados al diseño, desarrollo o mejora de productos y procesos; suele provenir de I+D y es la categoría más intuitiva. Ej.: fórmulas químicas, algoritmos de software o métodos de encriptación, planos o prototipos no patentados, procedimientos de producción.", "Comercial: incluye todo aquello que da ventaja en la gestión del negocio, las ventas o las relaciones con clientes y proveedores; no es técnica, pero sí estratégica. Ej.: listas de clientes o distribuidores clave, estrategias de marketing, acuerdos de precios especiales con proveedores, estudios de mercado.", "Negativa: el conocimiento sobre lo que no funciona, es decir, resultados de pruebas, ensayos o experiencias que fracasan o no dan el resultado esperado. Ej.: experimentos fallidos, procedimientos descartados, configuraciones tecnológicas que no dieron resultado."]}, "ejemplo": null, "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slides 30-40; material §6", "alerta": null, "evidencia": ["quiz17", "tp6"], "agregado": false, "b": 17, "nucleo": true}, {"id": "u17-negativa", "seccion": "Tipos de información", "termino": "Información negativa", "pregunta": "¿Qué es la información negativa y por qué tiene valor?", "definicion": "Se trata del conocimiento sobre lo que no funciona. Es decir, resultados de pruebas, ensayos o experiencias que fracasan o no dan el resultado esperado. Es secreta porque saber «qué no sirve» ahorra tiempo y dinero a quien lo conoce: si un competidor accede a esa información, puede evitar los mismos errores sin invertir en esas pruebas.", "lista": null, "ejemplo": "Thomas Edison probó más de mil materiales antes de encontrar el filamento de su lámpara; esa «lista de materiales que no funcionaban» sería hoy información negativa valiosa.", "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slides 39-42; material §6", "alerta": null, "evidencia": ["quiz17", "tp6"], "agregado": false, "b": 17, "nucleo": false}, {"id": "u17-responsabilidad-civil", "seccion": "Responsabilidad", "termino": "Responsabilidad civil por violación de la confidencialidad", "pregunta": "¿Qué responsabilidad civil tiene quien usa o divulga información confidencial?", "definicion": "La ley reconoce derechos y prevé acciones para reclamar daños: «Quien hubiere obtenido, utilizado o divulgado información confidencial en forma contraria a los usos comerciales honestos será responsable de los daños y perjuicios ocasionados.» Además de sanciones penales, el titular de la información puede iniciar una acción civil de daños y perjuicios.", "lista": null, "ejemplo": null, "articulos": ["Art. 6 Ley 24.766"], "fuente": "PPT", "ubicacion": "PPT slide 43; material §11", "alerta": "PPT: ubica la responsabilidad civil por daños en el art. 6 de la Ley 24.766; material: las acciones civiles (medidas cautelares y reparación) están en el art. 11, y los arts. 4 a 10 regulan la información presentada ante la autoridad sanitaria. Para el parcial: idea «acción civil de daños y perjuicios», sin arriesgar el número salvo que pregunten.", "evidencia": ["tp6"], "agregado": false, "b": 17, "nucleo": true}, {"id": "u17-art991", "seccion": "Responsabilidad", "termino": "Deber de confidencialidad en las negociaciones (CCyC)", "pregunta": "¿Qué dice el CCyC sobre la confidencialidad en las tratativas?", "definicion": "El CCyC no regula expresamente un «contrato de confidencialidad», pero sí reconoce el deber de guardar reserva como una obligación accesoria en varias figuras contractuales y dentro del principio general de buena fe. «Las partes deben conducirse de buena fe durante las tratativas y guardar confidencialidad sobre la información que reciban, aun cuando el contrato no llegue a celebrarse.»", "lista": null, "ejemplo": null, "articulos": ["Art. 991 CCyC"], "fuente": "PPT", "ubicacion": "PPT slide 44; material §9", "alerta": "PPT: cita el deber de confidencialidad en las negociaciones como art. 991 CCyC; material: el art. 991 regula la buena fe en las tratativas en general y el deber de confidencialidad es el art. 992 (quien recibió información confidencial no debe revelarla ni usarla inapropiadamente; si incumple, repara el daño, y si obtuvo ventaja, indemniza en la medida de su enriquecimiento). El material insiste: «el 992, no el 991».", "evidencia": ["tp6"], "agregado": false, "b": 17, "nucleo": true}, {"id": "u17-penal", "seccion": "Responsabilidad", "termino": "Responsabilidad penal (Ley 24.766)", "pregunta": "¿Qué sanción penal prevé la Ley 24.766?", "definicion": "La Ley 24.766 protege los secretos comerciales y establece sanciones si alguien accede o usa esa información de forma indebida. El núcleo penal castiga a quien «por cualquier medio indebido obtuviere, revelare o utilizare información confidencial con la intención de beneficiarse o de beneficiar a un tercero, o de causar un perjuicio».", "lista": {"titulo": "Según el PPT", "items": ["Pena: prisión de 1 mes a 1 año, y multa de hasta 300.000 pesos (ajustable por inflación según la norma vigente).", "Acción penal: es de instancia privada, es decir, solo se inicia por denuncia del titular del secreto."]}, "ejemplo": "Un ex empleado copia la base de datos de clientes antes de irse a trabajar a la competencia; si la empresa lo denuncia, puede iniciarse una causa penal bajo esta ley.", "articulos": ["Art. 10 Ley 24.766"], "fuente": "PPT", "ubicacion": "PPT slides 46-47; material §11", "alerta": "PPT: núcleo penal en el art. 10 de la Ley 24.766, prisión de 1 mes a 1 año y multa de hasta 300.000 pesos, acción de instancia privada; material: el art. 12 de la Ley 24.766 no crea un delito propio sino que remite al Código Penal; la figura central es el art. 156 CP (multa e inhabilitación especial de seis meses a tres años a quien revele sin justa causa un secreto conocido por su oficio, empleo o profesión), de acción privada (art. 73 CP); «la ley no fija penas de prisión propias». Contradicción fuerte: preguntar a la cátedra. En el examen va el PPT.", "evidencia": ["tp6"], "agregado": false, "b": 17, "nucleo": true}, {"id": "u17-laboral", "seccion": "Responsabilidad", "termino": "Confidencialidad en el ámbito laboral", "pregunta": "¿Qué base laboral tiene la obligación de confidencialidad y qué consecuencias tiene violarla?", "definicion": "La obligación de confidencialidad también tiene una base laboral, más allá de la Ley 24.766: el trabajador debe «observar todos los deberes de fidelidad» hacia el empleador. Esto incluye no revelar información confidencial o estratégica de la empresa, incluso después de terminada la relación laboral, cuando se trata de datos sensibles.", "lista": {"titulo": "Consecuencias", "items": ["Despido con causa.", "Acciones civiles por daños y perjuicios.", "Posible denuncia penal si se trata de información protegida por la Ley 24.766."]}, "ejemplo": "Un diseñador gráfico que trabaja para una marca de bebidas sin alcohol no puede divulgar diseños o campañas aún después de renunciar.", "articulos": ["Art. 85 LCT"], "fuente": "PPT+material", "ubicacion": "PPT slides 47-50; material §9 (suma el deber de no concurrencia del art. 88 LCT)", "alerta": null, "evidencia": ["tp6"], "agregado": false, "b": 17, "nucleo": true}, {"id": "u17-nda", "seccion": "Acuerdo de confidencialidad", "termino": "Acuerdo de confidencialidad (NDA)", "pregunta": "¿Qué es un NDA y cuál es su estructura básica?", "definicion": "Non Disclosure Agreement: convenio de confidencialidad por el cual una o ambas partes se comprometen a no revelar ni usar indebidamente la información que reciben (material). Puede ser unilateral o mutuo (material).", "lista": {"titulo": "Estructura básica (PPT)", "items": ["Identificación de las partes: quién revela la información («Parte Reveladora») y quién la recibe («Parte Receptora»).", "Definición de información confidencial: qué tipo de información se considera protegida (ej.: técnica, comercial, financiera, etc.).", "Obligaciones de la parte receptora: usar la información solo para el propósito autorizado; no divulgarla a terceros; adoptar medidas razonables de seguridad.", "Excepciones: información que ya era pública, conocida o que se obtiene por otros medios lícitos.", "Plazo de vigencia: durante cuánto tiempo dura la obligación de confidencialidad (puede extenderse incluso después del contrato principal).", "Sanciones o consecuencias por incumplimiento: responsabilidad civil, rescisión de contrato, etc.", "Jurisdicción o ley aplicable: dónde se resolverán los conflictos."]}, "ejemplo": null, "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slide 51; material §10", "alerta": null, "evidencia": ["tp6"], "agregado": false, "b": 17, "nucleo": true}, {"id": "u17-sin-exclusividad", "seccion": "Solo material", "termino": "Lo que la ley no protege", "pregunta": "¿Qué deja afuera la protección del secreto comercial?", "definicion": "La protección no crea derechos exclusivos a favor de quien posee o desarrolló la información: la ley castiga la forma deshonesta de obtenerla, no que otro llegue a lo mismo. No viola nada el desarrollo independiente ni, en principio, la ingeniería inversa lícita; la información de dominio público deja de estar protegida; y la persona puede usar los conocimientos y la experiencia general que adquirió trabajando.", "lista": null, "ejemplo": null, "articulos": ["Art. 11 Ley 24.766"], "fuente": "material", "ubicacion": "material §4 (no está en el PPT)", "alerta": null, "evidencia": [], "agregado": false, "b": 17, "nucleo": false}, {"id": "u17-deber-reserva-art3", "seccion": "Solo material", "termino": "Deber de reserva de quien accede por su trabajo", "pregunta": "¿Qué deber tiene quien accede a información confidencial por su trabajo o relación de negocios?", "definicion": "Toda persona que, con motivo de su trabajo, empleo, cargo, puesto, profesión o relación de negocios, tenga acceso a información que reúna las condiciones del art. 1, y sobre cuya confidencialidad se le haya prevenido, debe abstenerse de usarla y de revelarla sin causa justificada o sin consentimiento de quien la guarda. De ahí la importancia de los NDA y de marcar los documentos.", "lista": null, "ejemplo": null, "articulos": ["Art. 3 Ley 24.766"], "fuente": "material", "ubicacion": "material §2 (no está en el PPT)", "alerta": null, "evidencia": [], "agregado": false, "b": 17, "nucleo": false}, {"id": "u17-politica-proteccion", "seccion": "Solo material", "termino": "Política de protección de la información", "pregunta": "¿Qué pasos sigue una política de protección de la información?", "definicion": "Forma ordenada en que una organización cumple con los requisitos de protección: un conjunto de decisiones que acompañan el ciclo de vida de la información y de las personas que acceden a ella.", "lista": {"titulo": "Pasos (material)", "items": ["Inventariar y clasificar la información por niveles (pública, interna, confidencial, restringida).", "Limitar el acceso según la necesidad de saber.", "Formalizar compromisos: NDA al ingresar y cláusulas de reserva con proveedores, clientes y colaboradores.", "Aplicar controles técnicos (cifrado, autenticación, registros de acceso, control de dispositivos y de salida).", "Capacitar y marcar.", "Cuidar la salida de las personas: revocar credenciales el mismo día del egreso, recuperar equipos y recordar por escrito las obligaciones vigentes.", "Estar preparado para incidentes, conservando los registros como prueba."]}, "ejemplo": null, "articulos": [], "fuente": "material", "ubicacion": "material §12 (no está en el PPT)", "alerta": null, "evidencia": [], "agregado": false, "b": 17, "nucleo": false}, {"id": "u19-profesion", "seccion": "Profesión", "termino": "Profesión", "pregunta": "¿Qué es una profesión?", "definicion": "Actividad especializada basada en conocimientos técnicos y científicos. Implica responsabilidad social, ya que las decisiones del profesional impactan en terceros. Requiere formación continua y actualización permanente.", "lista": null, "ejemplo": "En el caso de informática: atraviesa todas las industrias (salud, finanzas, educación, gobierno, entretenimiento, etc.).", "articulos": [], "fuente": "PPT", "ubicacion": "PPT slide 2", "alerta": null, "evidencia": [], "agregado": false, "b": 19, "nucleo": true}, {"id": "u19-tipos", "seccion": "Profesión", "termino": "Tipos de ejercicio profesional", "pregunta": "¿De qué formas puede ejercerse una profesión? Caracterice cada una.", "definicion": "Un profesional puede ejercer de forma independiente (profesión liberal), trabajar para una organización (relación de dependencia), o cumplir un rol dentro del Estado (función pública).", "lista": {"titulo": "Tipos", "items": ["Profesiones liberales: ejercidas de manera independiente, sin relación de dependencia; requieren título habilitante, matriculación en un colegio o consejo profesional y responsabilidad civil y ética propia. El profesional se responsabiliza personalmente por su actuación; hay aranceles orientativos y códigos de ética; se presta un servicio técnico-científico a un cliente particular. Ej.: abogados, ingenieros, médicos, contadores, arquitectos, psicólogos.", "Profesiones en relación de dependencia: ejercidas dentro de una organización pública o privada, bajo un contrato de trabajo. Hay subordinación jurídica, técnica y económica; hay horarios, salario y estructura jerárquica; el empleador asume gran parte de la responsabilidad frente a terceros. Ej.: programador contratado por una empresa, ingeniero en una fábrica, analista en un banco, docente universitario regular.", "Funciones o profesiones públicas: el profesional ejerce dentro del Estado y cumple un rol público. Se rigen por el derecho administrativo; existe responsabilidad del Estado, pero también personal del funcionario; deben cumplir principios de legalidad, transparencia e imparcialidad. Ej.: magistrados; funcionarios de organismos técnicos (ARCA, INTA, áreas de sistemas estatales); profesionales en hospitales públicos, escuelas públicas, organismos regulatorios."]}, "ejemplo": null, "articulos": [], "fuente": "PPT", "ubicacion": "PPT slides 4-7 (slide 3 es imagen sin texto)", "alerta": null, "evidencia": [], "agregado": false, "b": 19, "nucleo": true}, {"id": "u19-ley7490", "seccion": "Ley 7490 y Colegio", "termino": "Ley 7490 de Tucumán (Colegio de Graduados en Ciencia y Tecnología Informática)", "pregunta": "¿Qué establece la Ley 7490 de Tucumán?", "definicion": "La Ley Provincial 7490 (2004) crea el Colegio de Graduados en Ciencia y Tecnología Informática en Tucumán, con personería jurídica pública no estatal y actuación en toda la provincia, y establece las reglas básicas para el ejercicio profesional de la informática dentro de la provincia. Está reglamentada por el Decreto 3910/2007.", "lista": {"titulo": "Qué significa: una institución oficial que", "items": ["Los representa.", "Regula la matrícula.", "Controla el ejercicio profesional.", "Fija reglas éticas."]}, "ejemplo": null, "articulos": ["Ley 7490 (Tucumán)", "Dec. 3910/2007"], "fuente": "PPT", "ubicacion": "PPT slides 8-9", "alerta": null, "evidencia": [], "agregado": false, "b": 19, "nucleo": true}, {"id": "u19-finalidades", "seccion": "Ley 7490 y Colegio", "termino": "Finalidades del Colegio", "pregunta": "Enumere las finalidades del Colegio de Graduados en Ciencia y Tecnología Informática.", "definicion": "Finalidades del Colegio creado por la Ley 7490.", "lista": {"titulo": "Finalidades", "items": ["Regular la matrícula profesional: registrar y habilitar a los graduados para ejercer la profesión.", "Dictar y aplicar un Código de Ética: promueve buenas prácticas y sanciona faltas disciplinarias.", "Certificar dictámenes y actuaciones profesionales: certifica las firmas y actuaciones de sus matriculados en informes, auditorías, pericias, etc.", "Actualizar y sugerir honorarios profesionales: publica tablas orientativas para que los profesionales informáticos independientes no queden desprotegidos.", "Defender el ejercicio legal de la profesión: actúa frente a casos de ejercicio ilegal o cuando otra disciplina ocupe espacios que corresponden a profesionales informáticos.", "Fomentar la capacitación: promueve cursos, seminarios, becas y formación continua."]}, "ejemplo": null, "articulos": [], "fuente": "PPT", "ubicacion": "PPT slides 10-11", "alerta": null, "evidencia": [], "agregado": false, "b": 19, "nucleo": true}, {"id": "u19-matriculacion", "seccion": "Ley 7490 y Colegio", "termino": "Obligación de matriculación", "pregunta": "¿Cuándo debe matricularse un profesional informático en Tucumán y qué debe presentar?", "definicion": "Para ejercer profesionalmente en Tucumán dentro del ámbito de consultoría, pericias, auditorías, certificaciones y dictámenes técnicos, el profesional debe estar matriculado en el Colegio.", "lista": {"titulo": "Documentación a presentar", "items": ["Diploma original.", "Fotocopias reducidas del diploma de ambos lados (tamaño A4).", "Fotocopia del certificado analítico.", "Foto tipo carnet 4×4 color, actualizada.", "Fotocopia DNI (frente y reverso).", "Certificado de conducta."]}, "ejemplo": null, "articulos": [], "fuente": "PPT", "ubicacion": "PPT slides 12 y 28", "alerta": null, "evidencia": [], "agregado": false, "b": 19, "nucleo": true}, {"id": "u19-tribunal-disciplina", "seccion": "Ley 7490 y Colegio", "termino": "Tribunal de Disciplina", "pregunta": "¿Qué función cumple el Tribunal de Disciplina del Colegio?", "definicion": "El Colegio tiene un tribunal interno que juzga faltas éticas, aplica sanciones y protege el honor y la calidad profesional del colectivo. Esto jerarquiza la profesión y la asemeja a las profesiones liberales tradicionales (abogados, contadores, ingenieros, médicos).", "lista": null, "ejemplo": null, "articulos": [], "fuente": "PPT", "ubicacion": "PPT slide 13", "alerta": null, "evidencia": [], "agregado": false, "b": 19, "nucleo": false}, {"id": "u19-funciones-importancia", "seccion": "Ley 7490 y Colegio", "termino": "Funciones institucionales del Colegio e importancia de la ley", "pregunta": "¿Qué puede hacer el Colegio y por qué es importante la Ley 7490?", "definicion": "Funciones institucionales: el Colegio puede administrar bienes; celebrar convenios; representar a los profesionales ante el Estado; participar en procesos legislativos relacionados con informática; cuidar la independencia de intereses partidarios o religiosos.", "lista": {"titulo": "Importancia de la ley", "items": ["Reconoce formalmente la profesión informática en Tucumán.", "La coloca al nivel de otras profesiones liberales.", "Brinda un marco ético y reglas de trabajo formal.", "Permite ejercer como perito informático (clave para salida laboral).", "Les asegura respaldo institucional en el ejercicio profesional."]}, "ejemplo": null, "articulos": [], "fuente": "PPT", "ubicacion": "PPT slides 14-15", "alerta": null, "evidencia": [], "agregado": false, "b": 19, "nucleo": false}, {"id": "u19-etica", "seccion": "Ética profesional", "termino": "Ética profesional", "pregunta": "¿Qué es la ética profesional y cuáles son sus características clave?", "definicion": "La ética profesional es el conjunto de principios, valores y normas que guían la conducta de una persona cuando ejerce su profesión. En palabras simples: es lo que indica cómo debe comportarse un buen profesional, más allá de lo que dice la ley.", "lista": {"titulo": "Características clave", "items": ["Va más allá de cumplir la ley: la ley marca lo mínimo obligatorio; la ética marca lo correcto y lo que se espera de un profesional serio.", "Protege al cliente, al usuario y a la sociedad: todos toman decisiones que afectan a otros.", "Se basa en valores universales: honestidad, confidencialidad, responsabilidad, justicia, respeto, integridad, competencia profesional.", "Se aplica a situaciones reales de trabajo."]}, "ejemplo": "No copiar código sin permiso. No manipular datos. No falsear informes. No aprovecharse de información confidencial. No prometer lo que no se puede cumplir. No usar información del trabajo para beneficio propio.", "articulos": [], "fuente": "PPT", "ubicacion": "PPT slides 17-20", "alerta": null, "evidencia": [], "agregado": false, "b": 19, "nucleo": true}, {"id": "u19-finalidad-etica", "seccion": "Ética profesional", "termino": "Finalidad de la ética profesional", "pregunta": "¿Cuál es la finalidad de la ética profesional?", "definicion": "Finalidades de la ética profesional según el PPT.", "lista": {"titulo": "Finalidades", "items": ["Proteger a los usuarios.", "Evitar daños.", "Garantizar calidad y confiabilidad.", "Mantener el honor de la profesión.", "Generar confianza pública.", "Guiar decisiones en situaciones donde la ley no es suficiente."]}, "ejemplo": null, "articulos": [], "fuente": "PPT", "ubicacion": "PPT slide 21", "alerta": null, "evidencia": [], "agregado": false, "b": 19, "nucleo": false}], "mc": [{"id": "m8-q1", "b": 8, "tipo": "simple", "origen": "quiz", "pregunta": "¿Qué es el derecho intelectual?", "opciones": ["La facultad del Estado de registrar obras en la DNDA y signos distintivos en el INPI, sin la cual no hay derecho.", "El derecho del autor a que figure su nombre y no se altere su obra, que no puede venderse (art. 52 Ley 11.723).", "El derecho exclusivo del autor o inventor sobre su obra, invento o descubrimiento, por el término que le acuerde la ley (art. 17 CN).", "El derecho exclusivo y perpetuo del creador sobre su obra, que pasa a sus herederos sin ningún límite temporal."], "correctas": [2], "explicacion": "Es la fórmula del art. 17 CN que trae el PPT: derecho exclusivo (el creador puede impedir que otros usen su creación sin permiso) y temporal (dura lo que fija la ley). No es la paternidad e integridad del art. 52, que son solo los derechos morales, una parte del derecho de autor. No es una facultad registral del Estado: el derecho nace con la creación. Tampoco es perpetuo: vencido el plazo la obra pasa a ser de todos.", "ref": "u8-derecho-intelectual"}, {"id": "m8-q2", "b": 8, "tipo": "simple", "origen": "quiz", "pregunta": "Según el mapa de la propiedad intelectual del PPT, ¿qué protege el modelo de utilidad (Ley 24.481)?", "opciones": ["Información valiosa que se mantiene en reserva.", "Una mejora práctica en la forma de un objeto.", "Una invención nueva, inventiva y con aplicación industrial.", "La forma o apariencia estética de un producto."], "correctas": [1], "explicacion": "El modelo de utilidad protege la mejora práctica en la forma de un objeto, con registro en el INPI por 10 años. No es la forma o apariencia estética: eso es el diseño industrial (Dto.-Ley 6673/63). No es la invención nueva, inventiva y con aplicación industrial: esa es la patente de invención, 20 años. No es la información valiosa en reserva: ese es el secreto comercial de la Ley 24.766, que no requiere registro.", "ref": "u8-herramientas"}, {"id": "m8-q3", "b": 8, "tipo": "simple", "origen": "quiz", "pregunta": "¿Qué obras protege la Ley 11.723? ¿Cuál de estas figura expresamente en su art. 1 (texto según Ley 25.036)?", "opciones": ["Las invenciones nuevas, inventivas y con aplicación industrial.", "Los signos que distinguen productos o servicios en el mercado.", "Los algoritmos de ordenamiento considerados en sí mismos.", "Los programas de computación fuente y objeto."], "correctas": [3], "explicacion": "El art. 1 incluye los programas fuente y objeto y las compilaciones de datos (bases de datos), junto con escritos, planos, fotografías, música, etc., en una lista abierta. El algoritmo en sí no se protege: es idea o método, y el último párrafo del art. 1 solo protege la expresión. Los signos distintivos son marcas (Ley 22.362, INPI). Las invenciones con aplicación industrial son materia de patente (Ley 24.481), no de derecho de autor.", "ref": "u8-obras-protegidas"}, {"id": "m8-q4", "b": 8, "tipo": "simple", "origen": "quiz", "pregunta": "¿Qué NO se protege por derecho de autor según el PPT?", "opciones": ["La documentación y los diagramas de esa app.", "El diseño de las pantallas de esa app.", "La idea de una app para pedir comida.", "La estructura de la base de datos de esa app."], "correctas": [2], "explicacion": "Se protege la expresión, no la idea (art. 1, último párrafo): la idea de una app para pedir comida no es de nadie. No es la estructura de la base de datos, que el PPT pone expresamente en la columna «sí se protege». Tampoco el diseño de las pantallas ni la documentación y los diagramas: son expresión concreta del desarrollo y también figuran como protegidos. Programar desde cero algo que hace lo mismo no es copiar.", "ref": "u8-idea-expresion"}, {"id": "m8-q5", "b": 8, "tipo": "simple", "origen": "quiz", "pregunta": "¿Cuánto dura el derecho de autor como regla general?", "opciones": ["10 años desde el registro, renovables sin límite.", "Toda la vida del autor y 70 años más, desde el 1 de enero siguiente a su muerte.", "50 años desde la muerte del último colaborador.", "20 años desde la primera publicación de la obra."], "correctas": [1], "explicacion": "La regla general es la vida del autor y 70 años más, contados desde el 1 de enero siguiente a su muerte, y no depende del registro. Los 20 años desde la primera publicación son el plazo de las obras fotográficas (art. 34). Los 50 años desde la muerte del último colaborador son de las obras cinematográficas (art. 34). Los 10 años renovables sin límite corresponden a la marca ante el INPI, no al derecho de autor.", "ref": "u8-duracion"}, {"id": "m8-01", "b": 8, "tipo": "simple", "origen": "nueva", "pregunta": "Una software factory tucumana contrata a Sofía en relación de dependencia para programar; en horario laboral y con equipos de la empresa escribe un módulo. No firmaron nada sobre derechos. ¿De quién es el software?", "opciones": ["De la empresa, salvo pacto en contrario (art. 4 inc. d).", "De Sofía como autora; la empresa solo tiene el uso que se acordó.", "De Sofía, porque el inc. d solo rige si hubo una cesión inscripta.", "De ambas en partes iguales, como obra en colaboración (art. 16)."], "correctas": [0], "explicacion": "El art. 4 inc. d atribuye el software hecho por dependientes contratados para programar, en sus funciones, a la persona física o jurídica empleadora, salvo pacto en contrario. No hace falta cesión inscripta: esa (arts. 51 y 53) es la vía para el freelance. La regla del «uso acordado» es la del independiente sin cláusula, no la del empleado. Y no es obra en colaboración: el art. 16 se refiere a coautores, no a la relación empleador-empleado.", "ref": "u8-titulares"}, {"id": "m8-02", "b": 8, "tipo": "simple", "origen": "nueva", "pregunta": "Un freelance desarrolla un sistema para una distribuidora; el contrato fija precio y plazo pero no dice nada sobre derechos. La distribuidora quiere revenderlo a otras empresas. ¿Puede?", "opciones": ["Sí: al pagar el precio adquirió la propiedad del programa.", "Sí: el art. 4 inc. d atribuye el software a quien lo encarga y paga.", "No: el código sigue siendo del freelance y el cliente solo tiene el uso acordado; para revenderlo necesitaba una cláusula de cesión.", "No: sin registro en la DNDA el sistema queda en dominio público."], "correctas": [2], "explicacion": "El inc. d del art. 4 habla de dependientes, no de independientes: si el contrato del freelance no dice nada, el código es suyo y el cliente solo tiene el uso acordado; por eso el PPT aconseja «Cliente: pedir cesión». No es que el inc. d alcance a quien encarga, eso confunde dependiente con independiente. Pagar no transfiere la propiedad: licenciar o encargar no es vender. Y la falta de registro no manda la obra al dominio público: el derecho nace con la creación.", "ref": "u8-quien-es-codigo"}, {"id": "m8-03", "b": 8, "tipo": "simple", "origen": "nueva", "pregunta": "¿Cuál de estos es un beneficio de registrar una obra según el PPT?", "opciones": ["Extiende la protección a 70 años contados desde el registro.", "Permite patentar el programa ante el INPI como invención.", "Presunción de autoría.", "Hace nacer el derecho de autor, que sin registro no existe."], "correctas": [2], "explicacion": "El PPT enumera cuatro beneficios: fecha cierta, presunción de autoría (se presume autor quien figura en el certificado), carga de la prueba y elemento de comparación ante plagio. No hace nacer el derecho: por el Convenio de Berna (art. 5.2) nace con la creación. No cambia el plazo: el PPT aclara que no depende del registro y se cuenta desde la muerte del autor. Y el programa en sí no es invención patentable (art. 6 inc. c Ley 24.481).", "ref": "u8-beneficios-registro"}, {"id": "m8-04", "b": 8, "tipo": "simple", "origen": "nueva", "pregunta": "Una startup quiere proteger un software que todavía no lanzó y que solo muestra a posibles inversores. ¿Qué trámite le corresponde?", "opciones": ["Inscripción de obra publicada en la DNDA, con una copia completa.", "Registro de la app como marca en las clases 9 y 42 ante el INPI.", "Depósito en custodia de obra inédita ante la DNDA, en sobre cerrado y firmado o en archivo digital encriptado y firmado.", "Solicitud de patente ante el INPI, porque el software no es público."], "correctas": [2], "explicacion": "El software que no se lanzó o solo se negocia con interesados es inédito: va al depósito en custodia, con las partes suficientes para identificarlo, vigencia de 36 meses renovable. No es inscripción de obra publicada: esa exige que el software ya esté publicado antes del trámite. No es patente: el programa en sí no es invención (art. 6 inc. c Ley 24.481). La marca protege el nombre y el logo, no el código.", "ref": "u8-inedita-publicada"}, {"id": "m8-05", "b": 8, "tipo": "simple", "origen": "nueva", "pregunta": "Juan dice «me compré Windows 11». Según el PPT, ¿qué adquirió jurídicamente?", "opciones": ["Una cesión de los derechos patrimoniales, inscripta en la DNDA.", "Una licencia: permiso para usarlo en ciertas condiciones, mientras los derechos siguen siendo de Microsoft.", "Una copia de salvaguardia que lo autoriza a redistribuirlo.", "La propiedad del programa, aunque no sus derechos intelectuales."], "correctas": [1], "explicacion": "Licenciar no es vender: compró una licencia, contrato reconocido por el art. 55 bis, casi siempre por adhesión. No compró la propiedad del programa: el PPT dice que el licenciatario nunca la adquiere. Tampoco hubo cesión de derechos patrimoniales (arts. 51 y 53), que transfiere la titularidad y exige inscripción. Y la copia de salvaguardia del art. 9 es una única copia de resguardo para reemplazar el original, nunca para redistribuir.", "ref": "u8-licencia"}, {"id": "m8-06", "b": 8, "tipo": "simple", "origen": "nueva", "pregunta": "¿Cuál de estas afirmaciones sobre software libre, código abierto y gratis es correcta?", "opciones": ["El código abierto exige que el software se distribuya sin costo alguno.", "El freeware garantiza las cuatro libertades, incluida la de estudiar el código.", "Un software libre se puede vender, y un freeware puede ser totalmente cerrado.", "Libre y gratis son sinónimos: todo software libre es freeware."], "correctas": [2], "explicacion": "El PPT es explícito: libre no significa gratis; un software libre se puede vender y un freeware puede ser totalmente cerrado. No son sinónimos: lo libre se define por las cuatro libertades (usar, estudiar y modificar, distribuir copias y versiones modificadas), no por el precio. El freeware no da acceso al código ni permiso para modificar. Y el código abierto (Open Source Initiative, 1998) pone el foco en el modelo de desarrollo, no en la gratuidad.", "ref": "u8-libre-abierto-gratis"}, {"id": "m8-07", "b": 8, "tipo": "simple", "origen": "nueva", "pregunta": "¿Qué caracteriza a una licencia con copyleft como la GPL?", "opciones": ["Quien distribuye una obra derivada debe hacerlo bajo la misma licencia.", "Permite acceder al servicio mientras se paga, sin recibir una copia.", "Permite usar el programa en las condiciones fijadas y prohíbe ver el código.", "Permite usarla en productos cerrados conservando el aviso de copyright."], "correctas": [0], "explicacion": "El copyleft usa el derecho de autor «al revés»: la obra derivada que se distribuye debe ir bajo la misma licencia. Usarla en productos cerrados conservando el aviso es lo propio de las permisivas (MIT, BSD, Apache). Usar en condiciones fijadas prohibiendo copiar, modificar y ver el código describe la licencia propietaria (EULA). Acceder mientras se paga sin recibir copia es la suscripción o SaaS. Son cuatro familias distintas del cuadro del PPT.", "ref": "u8-copyleft-permisiva"}, {"id": "m8-08", "b": 8, "tipo": "simple", "origen": "nueva", "pregunta": "Una plataforma SaaS tucumana incorpora un componente con licencia AGPL que modificó. Según el PPT, ¿qué obligación tiene?", "opciones": ["Dejar de usarlo, porque esa licencia prohíbe todo uso comercial.", "Solo conservar el aviso de copyright; el código puede quedar cerrado.", "Ninguna: como no distribuye copias, el copyleft no la alcanza.", "Ofrecer el código a quienes usan el servicio por la red."], "correctas": [3], "explicacion": "La AGPL extiende el copyleft al software ofrecido como servicio por la red: con un componente AGPL modificado hay que ofrecer el código a los usuarios del servicio. Decir que no hay obligación por no distribuir copias vale para la GPL, no para la AGPL. Conservar solo el aviso es la exigencia de las permisivas como MIT. Prohibir el uso comercial es propio de la licencia CC BY-NC (íconos), no de la AGPL.", "ref": "u8-puedo-usar"}, {"id": "m8-09", "b": 8, "tipo": "simple", "origen": "nueva", "pregunta": "En las capas de protección de una app, ¿con qué se protegen los algoritmos, modelos y parámetros no publicados?", "opciones": ["Con la marca ante el INPI (Ley 22.362).", "Con el secreto comercial (Ley 24.766).", "Con la patente de invención (Ley 24.481).", "Con la ley penal de delitos informáticos (Ley 26.388)."], "correctas": [1], "explicacion": "El PPT asigna los algoritmos, modelos y parámetros no publicados al secreto comercial de la Ley 24.766, que dura mientras la información siga siendo secreta. No a la patente: el programa en sí no es invención (art. 6 inc. c Ley 24.481). La marca protege el nombre y el logo (clases 9 y 42). La Ley 26.388 es la capa penal frente a accesos indebidos y daño a sistemas, no la que protege la información reservada.", "ref": "u8-capas-software"}, {"id": "m8-10", "b": 8, "tipo": "simple", "origen": "nueva", "pregunta": "¿Qué pena prevé el art. 71 Ley 11.723 para quien defrauda los derechos de propiedad intelectual?", "opciones": ["Solo la reparación civil de daños y perjuicios (arts. 1716 y ss. CCyC).", "Prisión de 3 meses a 2 años, más multa.", "La pena de la estafa (art. 172 CP).", "Despido con causa por violar el deber de fidelidad (arts. 85 y 88 LCT)."], "correctas": [2], "explicacion": "El art. 71 remite a la pena de la estafa del art. 172 CP: prisión de 1 mes a 6 años. Los 3 meses a 2 años más multa son la pena del art. 31 de la Ley 22.362 de marcas (Bolilla 10). La reparación de daños es la consecuencia civil, que convive con la penal pero no la reemplaza. El despido con causa por fidelidad es la consecuencia laboral, otro de los tres planos del PPT, y no es una pena.", "ref": "u8-consecuencias"}, {"id": "m8-11", "b": 8, "tipo": "simple", "origen": "nueva", "pregunta": "Una docente de FACET quiere incluir fragmentos de un libro técnico en un apunte con comentarios críticos. ¿Qué le permite el derecho de cita?", "opciones": ["Cualquier uso transformador, crítico o paródico, por la cláusula de fair use.", "Hacer una única copia de resguardo identificada para reemplazar el original.", "Reproducir la obra completa en braille o audio para estudiantes ciegos.", "Fines didácticos o científicos: hasta 1.000 palabras, solo lo indispensable."], "correctas": [3], "explicacion": "El derecho de cita (art. 10) admite, con fines didácticos o científicos, hasta 1.000 palabras u 8 compases, solo lo indispensable. En Argentina no hay fair use amplio: eso es EE.UU. (Oracle vs. Google). La copia única de resguardo es la copia de salvaguardia del software (art. 9). La reproducción en braille o audio es la excepción de accesibilidad (art. 36, Ley 26.285), que no cubre el uso que plantea la docente.", "ref": "u8-excepciones"}, {"id": "m8-12", "b": 8, "tipo": "simple", "origen": "nueva", "pregunta": "El jefe de sistemas de una pyme instaló programas sin licencia y, ante el reclamo, alega que «no sabía» que era ilegal. ¿Lo exime?", "opciones": ["Sí, si compra las licencias después, porque eso repara el daño.", "No: cuanto mayor el deber de obrar con prudencia y conocimiento, mayor la diligencia exigida (art. 1725 CCyC).", "Sí: solo hay infracción si el software instalado se llega a usar.", "No, aunque responde solo la empresa y nunca el profesional."], "correctas": [1], "explicacion": "El PPT dice que «no sabía» no alcanza: el art. 1725 CCyC exige más diligencia a quien debe obrar con más conocimiento, y el art. 1768 regula a los profesionales liberales. Instalar sin licencia ya es infracción aunque no se use (Microsoft c/ Matriplast). Comprar las licencias después no salvó a la demandada en Microsoft c/ P. A. S.A. Y el material aclara que el responsable de sistemas puede quedar personalmente involucrado.", "ref": "u8-responsabilidad-profesional"}, {"id": "m8-13", "b": 8, "tipo": "multiple", "origen": "nueva", "pregunta": "¿Cuáles de estas obras protege el art. 1 Ley 11.723? Seleccioná todas las correctas.", "opciones": ["Un algoritmo de ordenamiento considerado en sí mismo.", "La idea de una app para pedir comida.", "Fotografías, música y obras cinematográficas.", "Programas de computación fuente y objeto.", "Planos, mapas y obras de arquitectura."], "correctas": [2, 3, 4], "explicacion": "El art. 1 (texto según Ley 25.036) incluye programas fuente y objeto, planos, mapas y obras de arquitectura, y fotografías, música y obras cinematográficas, en una lista abierta. No protege la idea de una app para pedir comida ni un algoritmo de ordenamiento en sí: el último párrafo del mismo artículo protege la expresión y no las ideas, procedimientos o métodos. Son los ejemplos que el PPT pone en la columna «no se protege».", "ref": "u8-obras-protegidas"}, {"id": "m8-14", "b": 8, "tipo": "multiple", "origen": "nueva", "pregunta": "Según el PPT, ¿cuáles son beneficios de registrar una obra? Seleccioná todas las correctas.", "opciones": ["La protección dura mientras la obra siga registrada en la DNDA, sin plazo fijo.", "Fecha cierta.", "Carga de la prueba: quien diga lo contrario tiene que probarlo.", "Elemento de comparación ante plagio o piratería.", "Hace nacer el derecho de autor."], "correctas": [1, 2, 3], "explicacion": "Fecha cierta, carga de la prueba y elemento de comparación son tres de los cuatro beneficios del PPT (el cuarto es la presunción de autoría). No hace nacer el derecho: nace con la creación (Berna art. 5.2), aunque en obras publicadas la falta de inscripción lo suspende hasta inscribir (arts. 57 y 63). Y el plazo no depende del registro: se cuenta desde la muerte del autor; «mientras siga» es la lógica del secreto comercial.", "ref": "u8-beneficios-registro"}, {"id": "m8-15", "b": 8, "tipo": "multiple", "origen": "nueva", "pregunta": "¿Cuáles de estas capas de protección de una app están bien asignadas a su norma? Seleccioná todas las correctas.", "opciones": ["Nombre y logo: marca ante el INPI, Ley 22.362.", "Código y documentación: derecho de autor, Ley 11.723.", "Algoritmos no publicados: derecho de cita, art. 10 Ley 11.723.", "El programa en sí: patente de invención, Ley 24.481.", "Accesos indebidos y daño a sistemas: ley penal, Ley 26.388."], "correctas": [0, 1, 4], "explicacion": "El PPT asigna el código y la documentación al derecho de autor, el nombre y el logo a la marca y los accesos indebidos a la Ley 26.388. El programa en sí no es patentable: el art. 6 inc. c Ley 24.481 dice que no es invención. Los algoritmos no publicados se protegen con el secreto comercial (Ley 24.766); el derecho de cita es una excepción para usar obras ajenas con fines didácticos, no una capa de protección.", "ref": "u8-capas-software"}, {"id": "m8-16", "b": 8, "tipo": "multiple", "origen": "nueva", "pregunta": "¿Quiénes son titulares del derecho de propiedad intelectual según el art. 4 Ley 11.723? Seleccioná todas las correctas.", "opciones": ["El autor de la obra.", "Sus herederos o derechohabientes.", "La DNDA, una vez que la obra queda registrada.", "El cliente que encargó un software a un freelance, aunque el contrato no diga nada.", "Quien, con permiso del autor, la traduce, adapta o modifica, sobre la nueva obra."], "correctas": [0, 1, 4], "explicacion": "El art. 4 enumera al autor, a sus herederos o derechohabientes, a quien traduce, adapta o modifica con permiso (sobre la nueva obra) y al empleador del software hecho por dependientes. El cliente de un freelance no es titular si no hay cesión: el inc. d habla de dependientes. La DNDA registra obras y cesiones pero no es titular; el Estado solo lo sería si la herencia del autor es vacante (art. 5).", "ref": "u8-titulares"}, {"id": "m8-17", "b": 8, "tipo": "vf", "origen": "nueva", "pregunta": "El derecho de autor nace con la creación de la obra, aunque registrarla siempre conviene.", "opciones": ["Verdadero", "Falso"], "correctas": [0], "explicacion": "Verdadero. Por la regla del Convenio de Berna (art. 5.2), del que Argentina es parte, el derecho nace con la creación. Igual conviene registrar: da fecha cierta, presunción de autoría, invierte la carga de la prueba y sirve de elemento de comparación. Además, en obras publicadas la ley argentina pide depósito y la falta de inscripción suspende el derecho hasta que se inscribe (arts. 57 y 63).", "ref": "u8-beneficios-registro"}, {"id": "m8-18", "b": 8, "tipo": "vf", "origen": "nueva", "pregunta": "Si DataSur programa desde cero una app de turnos con las mismas funciones que la de SoftNorte, copia una obra protegida y viola la Ley 11.723.", "opciones": ["Verdadero", "Falso"], "correctas": [1], "explicacion": "Falso. Se protege la expresión, no la idea (art. 1, último párrafo Ley 11.723). El PPT lo dice textual: programar desde cero algo que hace lo mismo no es copiar; copiar el código y cambiar nombres de variables, sí. La funcionalidad de una app de turnos es una idea y queda libre; para proteger una idea técnica habría que recurrir a otras herramientas, como el secreto comercial.", "ref": "u8-idea-expresion"}, {"id": "m8-19", "b": 8, "tipo": "vf", "origen": "nueva", "pregunta": "En Argentina un programa de computación puede patentarse en sí mismo, porque es una invención con aplicación industrial.", "opciones": ["Verdadero", "Falso"], "correctas": [1], "explicacion": "Falso. El PPT, en las capas de protección, dice que la patente no alcanza al programa en sí: no es invención (art. 6 inc. c Ley 24.481). El legislador eligió proteger el software por el derecho de autor (art. 1 Ley 11.723). Según el material, lo discutible es patentar una invención técnica que incluye software, como un dispositivo nuevo, pero nunca el programa como tal.", "ref": "u8-capas-software"}, {"id": "m8-20", "b": 8, "tipo": "vf", "origen": "nueva", "pregunta": "Una librería con licencia MIT puede usarse dentro de una app comercial cerrada, siempre que se conserve el aviso de copyright y el texto de la licencia.", "opciones": ["Verdadero", "Falso"], "correctas": [0], "explicacion": "Verdadero. Las licencias permisivas (MIT, BSD, Apache) se pueden usar dentro de productos cerrados conservando el aviso de copyright y el texto de la licencia; por eso dominan en entornos comerciales. Borrar ese aviso sí viola la licencia. Distinto es el copyleft (GPL), donde la obra derivada distribuida debe ir bajo la misma licencia y con código.", "ref": "u8-copyleft-permisiva"}, {"id": "m10-q1", "b": 10, "tipo": "simple", "origen": "quiz", "pregunta": "¿Cuáles son las funciones de la marca?", "opciones": ["Derecho exclusivo de uso, protección frente a imitaciones, activo intangible y expansión comercial", "Distintiva, de identificación de origen, de garantía de calidad y publicitaria", "Denominativa, figurativa, mixta y tridimensional", "Distintiva, de garantía de calidad, publicitaria y de exclusividad territorial"], "correctas": [1], "explicacion": "El PPT enumera cuatro funciones: distintiva (la esencial), de identificación de origen, de garantía de calidad y publicitaria. No son las de exclusividad, imitaciones, activo intangible y expansión: esos son los beneficios de registrar la marca. Denominativa, figurativa, mixta y tridimensional son los tipos de marca, no sus funciones. Y la \"exclusividad territorial\" no es una función: la territorialidad es un principio sobre el alcance del registro.", "ref": "u10-funciones"}, {"id": "m10-q2", "b": 10, "tipo": "simple", "origen": "quiz", "pregunta": "¿Cuáles son los tipos de marca?", "opciones": ["De fantasía, arbitraria, evocativa y descriptiva", "Distintiva, de identificación de origen, de garantía de calidad y publicitaria", "Denominativa, figurativa, mixta y tridimensional", "Genérica, descriptiva, de uso general y de forma del producto"], "correctas": [2], "explicacion": "El PPT clasifica las marcas en denominativa (solo palabras, letras o números), figurativa (solo dibujo), mixta (palabras + diseño, tipografía o colores) y tridimensional (forma del envase o producto). La escala fantasía-arbitraria-evocativa-descriptiva mide la fuerza distintiva (material), no el tipo. Distintiva, origen, calidad y publicitaria son funciones. Genérica, descriptiva, uso general y forma son signos que el art. 2 dice que no son marca.", "ref": "u10-tipos"}, {"id": "m10-q3", "b": 10, "tipo": "simple", "origen": "quiz", "pregunta": "¿Qué es una marca?", "opciones": ["Un signo con capacidad distintiva que permite identificar productos o servicios y diferenciarlos de otros de la misma especie", "Un derecho exclusivo sobre el producto que impide a terceros fabricar otro de la misma especie", "Un signo que identifica un producto cuya calidad o reputación se debe a su origen geográfico", "La propiedad exclusiva del autor sobre su obra, por el término que le acuerde la ley"], "correctas": [0], "explicacion": "Es la definición del PPT (Ley 22.362): signos con capacidad distintiva que identifican productos o servicios y los diferencian de otros de la misma especie. No protege el producto en sí: cualquiera puede fabricar una gaseosa cola, lo que no puede es usar el signo ajeno. El signo atado al origen geográfico es la indicación geográfica, que pertenece a todos los productores de la zona. La propiedad del autor sobre su obra es el derecho intelectual del art. 17 CN, no la marca.", "ref": "u10-marca"}, {"id": "m10-01", "b": 10, "tipo": "simple", "origen": "nueva", "pregunta": "Una startup tucumana usa hace tres años la marca \"Tukipay\" para su app de pagos, sin registrarla. Un tercero la registra en el INPI y obtiene el título. ¿Quién tiene la exclusividad?", "opciones": ["La startup, porque en Argentina el derecho nace del primer uso en el comercio", "El tercero, porque Argentina adopta el principio atributivo: la propiedad se obtiene con el registro", "Ambos en forma compartida, porque el uso y el registro generan derechos equivalentes", "La startup, porque el uso continuado de tres años convierte a la marca en notoria"], "correctas": [1], "explicacion": "El art. 4 de la Ley 22.362 dice que la propiedad de una marca y la exclusividad de uso se obtienen con su registro (principio atributivo): no soy dueño porque la uso, sino porque la registré. Que el derecho nazca del primer uso es el sistema declarativo, que Argentina no adopta. Uso y registro no generan derechos equivalentes: el uso sirve para conservar la marca y en ciertos conflictos. Y tres años de uso no hacen notoria a una marca: notoria es la que conoce el público o su sector.", "ref": "u10-nacimiento-derecho"}, {"id": "m10-02", "b": 10, "tipo": "simple", "origen": "nueva", "pregunta": "¿Cuál es la función esencial de toda marca, según el PPT?", "opciones": ["La función de identificación de origen, que asocia el producto con una fuente empresarial", "La función de garantía de calidad, que remite a una experiencia previa del consumidor", "La función publicitaria, que construye prestigio y valor económico propio", "La función distintiva, que diferencia productos o servicios de los competidores"], "correctas": [3], "explicacion": "El PPT dice textualmente que la función distintiva es la función esencial de toda marca: sin marcas, todos los productos serían anónimos. La identificación de origen existe, pero asocia el producto con una empresa y no es la que el PPT llama esencial. La garantía de calidad solo permite asociar la marca con una experiencia previa, sin garantía legal. La publicitaria construye prestigio con el tiempo; es una función derivada, no la esencial.", "ref": "u10-funciones"}, {"id": "m10-03", "b": 10, "tipo": "simple", "origen": "nueva", "pregunta": "¿Qué afirma el PPT sobre la función de garantía de calidad de la marca?", "opciones": ["Obliga al titular a mantener un estándar de calidad que el INPI controla en cada renovación", "No garantiza una calidad determinada por ley: permite asociar la marca con una experiencia previa", "Asocia el producto con una empresa aunque el consumidor no sepa quién lo fabrica", "Permite que la marca supere el valor de los bienes materiales de la empresa"], "correctas": [1], "explicacion": "El PPT aclara que la garantía de calidad no significa que la marca garantice una calidad determinada por ley, sino que permite asociarla con una experiencia previa: si fue positiva, se repite la compra. El INPI no controla estándares de calidad; examina requisitos formales y prohibiciones. Asociar el producto con una empresa sin saber quién lo fabrica es la función de identificación de origen. Superar el valor de los bienes materiales describe la función publicitaria.", "ref": "u10-funciones"}, {"id": "m10-04", "b": 10, "tipo": "simple", "origen": "nueva", "pregunta": "El logo de YPF tal como aparece en las estaciones de servicio (palabra con tipografía y colores propios) es una marca:", "opciones": ["Denominativa", "Figurativa", "Mixta", "Tridimensional"], "correctas": [2], "explicacion": "Es el ejemplo de marca mixta del PPT: palabras más diseño, tipografía o colores, protegidas como conjunto. No es denominativa, porque esta protege solo palabras, letras o números sin diseño (MERCADO LIBRE en cualquier tipografía). No es figurativa, porque esta es solo un dibujo sin palabras (la manzana de Apple). Tampoco tridimensional, que es la forma del envase o del producto, como una botella con forma distintiva.", "ref": "u10-tipos"}, {"id": "m10-05", "b": 10, "tipo": "simple", "origen": "nueva", "pregunta": "Una consultora de Yerba Buena registró su nombre como marca mixta y ahora rediseña por completo el logo. Según el PPT, ¿qué puede pasar?", "opciones": ["Nada: la mixta protege el nombre en sí, sin importar cómo se dibuje", "Debe pedir la caducidad parcial de su marca anterior ante el INPI", "Puede hacer falta un nuevo registro, porque la mixta protege el conjunto", "Debe informar el cambio en la declaración jurada de uso de medio término"], "correctas": [2], "explicacion": "El tip práctico del PPT: la mixta protege el conjunto (palabra + diseño), así que si cambia el logo puede hacer falta un nuevo registro. Proteger el nombre sin importar el dibujo es lo propio de la denominativa, no de la mixta. La caducidad la pide un tercero por falta de uso, no es un trámite para cambiar el diseño. La DJ de medio término declara el uso durante los primeros cinco años, no modifica la marca registrada.", "ref": "u10-tipos"}, {"id": "m10-06", "b": 10, "tipo": "simple", "origen": "nueva", "pregunta": "Un proveedor de internet quiere registrar \"Súper Rápido\" para su servicio. ¿Qué responde la ley?", "opciones": ["No es marca (art. 2): es descriptiva de las cualidades del servicio", "No es marca (art. 2): es la designación necesaria o habitual del servicio", "Está prohibida (art. 3): es engañosa sobre la calidad del servicio", "Está prohibida (art. 3): es confundible con marcas ya registradas"], "correctas": [0], "explicacion": "Es el ejemplo del PPT de signo descriptivo: describe la naturaleza, función o cualidades del producto, le falta capacidad distintiva y el art. 2 dice que no es marca. No es genérico: genérico es la designación necesaria o habitual (\"Gaseosa\" para gaseosas). Engañosa sería si indujera a error sobre calidad u origen, y nada indica eso. La confundibilidad del art. 3 exige una marca anterior idéntica o similar, que el caso no menciona.", "ref": "u10-no-registrables"}, {"id": "m
