10-07", "b": 10, "tipo": "simple", "origen": "nueva", "pregunta": "Un emprendedor pide registrar como marca de ropa el nombre de un cantante famoso, sin consentimiento de este. ¿Qué corresponde?", "opciones": ["Es registrable, porque la lista del art. 1 es enunciativa", "No es marca (art. 2), por falta de capacidad distintiva", "Es registrable si la pide en una clase distinta de la que usa el cantante, por especialidad", "Está prohibida (art. 3): nombre, seudónimo o retrato de una persona sin su consentimiento"], "correctas": [3], "explicacion": "El art. 3 prohíbe registrar el nombre, seudónimo o retrato de alguien sin su consentimiento o el de sus herederos (lo recuerda el caso Maradona del PPT). Que el art. 1 sea enunciativo amplía qué signos pueden ser marca, pero no levanta las prohibiciones. No es un problema del art. 2: un nombre propio puede ser perfectamente distintivo. Y la especialidad permite coexistir a marcas idénticas en clases distintas, no saltear la falta de consentimiento.", "ref": "u10-no-registrables"}, {"id": "m10-08", "b": 10, "tipo": "simple", "origen": "nueva", "pregunta": "\"Delta\" identifica a la vez una aerolínea y una marca de grifería. ¿Qué principio explica esa coexistencia?", "opciones": ["Principio de territorialidad", "Principio atributivo", "Principio de especialidad", "Protección de la marca notoria"], "correctas": [2], "explicacion": "El PPT usa este ejemplo para el principio de especialidad: una marca puede coexistir con otra idéntica si operan en clases distintas de Niza. La territorialidad dice que el registro protege solo en el país donde se otorgó, no explica convivir en clases. El atributivo explica cuándo nace el derecho (con el registro). La marca notoria va en sentido contrario: rompe en parte la especialidad y extiende la protección a otras clases.", "ref": "u10-niza-especialidad"}, {"id": "m10-09", "b": 10, "tipo": "simple", "origen": "nueva", "pregunta": "Publicada una solicitud en el Boletín de Marcas, ¿qué plazo tienen los terceros para oponerse?", "opciones": ["Tres meses desde la notificación", "Treinta días desde la publicación", "Seis meses desde la primera solicitud", "Cinco años desde la concesión"], "correctas": [1], "explicacion": "Paso 6 del PPT: desde la publicación comienza un plazo de treinta días para que terceros formulen oposiciones. Los tres meses corren después, para que el solicitante notificado negocie con el oponente. Los seis meses son el derecho de prioridad del Convenio de París para presentar en otros países. Los cinco años son el plazo de no uso que habilita la caducidad, no un plazo de oposición.", "ref": "u10-registro-pasos"}, {"id": "m10-10", "b": 10, "tipo": "simple", "origen": "nueva", "pregunta": "Hubo oposición y, pasados los tres meses, las partes no llegaron a un acuerdo. ¿Quién resuelve hoy?", "opciones": ["Un juez federal, en un juicio que debe iniciar el solicitante", "El INPI, y su decisión se puede recurrir ante la Cámara Nacional de Apelaciones en lo Civil y Comercial Federal", "NIC Argentina, que administra los registros de nombres en el país", "La OMPI, porque administra la Clasificación de Niza"], "correctas": [1], "explicacion": "Desde la Ley 27.444 (2018), sin acuerdo resuelve el INPI, y lo que decida se puede recurrir ante la Cámara Nacional de Apelaciones en lo Civil y Comercial Federal. El juicio iniciado por el solicitante era el sistema anterior a esa reforma. NIC Argentina administra dominios .ar, no marcas, y no revisa conflictos marcarios al asignar. La OMPI administra el Arreglo de Niza, pero no resuelve oposiciones en el registro argentino.", "ref": "u10-registro-pasos"}, {"id": "m10-11", "b": 10, "tipo": "simple", "origen": "nueva", "pregunta": "¿Cuánto dura el registro de una marca?", "opciones": ["10 años desde la solicitud, renovables por única vez", "5 años desde la concesión, renovables si se presentó la DJ de medio término", "Mientras se use, sin necesidad de renovarla", "10 años desde la concesión, renovables indefinidamente por períodos iguales"], "correctas": [3], "explicacion": "El PPT: 10 años desde la concesión, renovables indefinidamente por períodos iguales (siempre que haya uso en los últimos 5 años). No se cuentan desde la solicitud ni se renuevan una sola vez: la renovación es indefinida. Los 5 años no son la vigencia, sino el plazo de no uso que habilita la caducidad; la DJ se presenta a mitad de la vigencia. Y el uso no basta: si no se renueva a tiempo, el registro se pierde.", "ref": "u10-vigencia"}, {"id": "m10-12", "b": 10, "tipo": "simple", "origen": "nueva", "pregunta": "Un perfil de Instagram vende zapatillas con una marca registrada copiada en forma tan burda que nadie las confundiría con las originales. ¿Qué vía tiene el titular?", "opciones": ["Solo la civil, porque una copia burda no engaña a nadie y no hay delito", "Solo la administrativa: pedir la nulidad ante el INPI", "También la penal (art. 31): una copia burda igual es delito", "Ninguna, salvo que haya registrado el @usuario en el INPI"], "correctas": [2], "explicacion": "El caso \"zapatillas por Facebook\" del PPT: la Cámara dijo que una copia burda igual es delito, porque la ley también protege al consumidor; el art. 31 pena con prisión de 3 meses a 2 años más multa. No queda solo la vía civil: las vías se pueden combinar. La nulidad ante el INPI ataca una marca mal concedida, no la venta de copias. Y los @usuario no se registran en el INPI: lo que hay que probar es que la marca está registrada.", "ref": "u10-copia-vias"}, {"id": "m10-13", "b": 10, "tipo": "multiple", "origen": "nueva", "pregunta": "¿Qué puede pedir el titular por la vía administrativa (INPI)? Seleccioná todas las correctas.", "opciones": ["Oposición a una solicitud ajena", "Cese de uso e indemnización de daños y perjuicios", "Pedido de caducidad por falta de uso", "Secuestro de mercadería como medida cautelar", "Pedido de nulidad de una marca mal concedida"], "correctas": [0, 2, 4], "explicacion": "Según el cuadro del PPT, la vía administrativa ante el INPI comprende la oposición a una solicitud ajena, el pedido de caducidad por falta de uso y el pedido de nulidad de una marca mal concedida (trámites que la Ley 27.444 pasó al INPI). El cese de uso con indemnización de daños y perjuicios pertenece a la vía civil, ante la justicia. El secuestro de mercadería también es civil: es una medida cautelar que dicta un juez, no el INPI.", "ref": "u10-copia-vias"}, {"id": "m10-14", "b": 10, "tipo": "multiple", "origen": "nueva", "pregunta": "¿Qué principios rompe en parte la protección de la marca notoria? Seleccioná todas las correctas.", "opciones": ["Territorialidad, porque el Convenio de París (art. 6 bis) la protege aunque no esté registrada en el país", "Carácter enunciativo del art. 1", "Especialidad, porque el ADPIC (art. 16) la extiende a productos o servicios distintos", "Prioridad unionista de 6 meses"], "correctas": [0, 2], "explicacion": "El PPT dice que la marca notoria rompe en parte dos principios: territorialidad (París art. 6 bis obliga a protegerla aunque no esté registrada en el país) y especialidad (ADPIC art. 16 extiende la protección a productos o servicios distintos cuando el uso sugiere una conexión con el titular y lo perjudica). El carácter enunciativo del art. 1 no se rompe: define qué signos pueden ser marca. La prioridad de 6 meses es otra regla del Convenio de París, ajena a la notoriedad.", "ref": "u10-marca-notoria"}, {"id": "m10-15", "b": 10, "tipo": "multiple", "origen": "nueva", "pregunta": "Según el PPT, ¿qué debe hacer el titular para mantener su marca? Seleccioná todas las correctas.", "opciones": ["Usarla, porque sin uso en los 5 años anteriores al pedido puede declararse su caducidad", "Registrar el dominio .com.ar equivalente en NIC Argentina", "Presentar la DJ de uso de medio término a mitad de la vigencia", "Renovarla a tiempo, desde 6 meses antes del vencimiento", "Inscribirla por el Protocolo de Madrid para extenderla al Mercosur"], "correctas": [0, 2, 3], "explicacion": "El slide de vigencia y mantenimiento pide usar la marca (5 años sin uso habilitan la caducidad, incluso parcial), presentar la DJ de uso de medio término (Decreto 242/2019) y renovar desde 6 meses antes del vencimiento o hasta 6 meses después con recargo. Registrar el dominio es recomendable, pero no conserva la marca: dominio y marca van por registros distintos. El Protocolo de Madrid no aplica: Argentina todavía no adhirió.", "ref": "u10-vigencia"}, {"id": "m10-16", "b": 10, "tipo": "multiple", "origen": "nueva", "pregunta": "¿Cuáles de estos signos están PROHIBIDOS por el art. 3 (y no excluidos por el art. 2)? Seleccioná todas las correctas.", "opciones": ["Una marca engañosa sobre el origen del producto", "\"Gaseosa\" para gaseosas", "Un escudo o símbolo patrio", "Un solo color aplicado sobre la superficie del producto", "Una denominación de origen"], "correctas": [0, 2, 4], "explicacion": "El art. 3 prohíbe lo que afecta derechos de terceros o el orden público: engañosas sobre naturaleza, calidad u origen; símbolos patrios y emblemas oficiales; denominaciones de origen, entre otras. \"Gaseosa\" para gaseosas es genérico: el art. 2 dice que no es marca por falta de capacidad distintiva, no que esté prohibida. Un solo color aplicado sobre el producto también es art. 2 (colores), no art. 3.", "ref": "u10-no-registrables"}, {"id": "m10-17", "b": 10, "tipo": "vf", "origen": "nueva", "pregunta": "La lista de signos del art. 1 de la Ley 22.362 es taxativa: solo puede registrarse lo que está enumerado.", "opciones": ["Verdadero", "Falso"], "correctas": [1], "explicacion": "Falso. El PPT aclara que la lista del art. 1 es enunciativa: vale cualquier signo con capacidad distintiva (incluye \"todo otro signo que permita distinguir productos o servicios\"). Por eso, aunque la ley argentina no menciona olores ni sonidos, la puerta queda abierta. Lo que limita el registro no es la lista, sino los arts. 2 (falta de distintividad) y 3 (prohibiciones).", "ref": "u10-que-puede-ser"}, {"id": "m10-18", "b": 10, "tipo": "vf", "origen": "nueva", "pregunta": "El Convenio de París (art. 6 bis) obliga a proteger la marca notoria aunque no esté registrada en el país.", "opciones": ["Verdadero", "Falso"], "correctas": [0], "explicacion": "Verdadero. Es una de las dos excepciones que el PPT marca para la marca notoria: rompe la territorialidad porque París art. 6 bis exige protegerla aun sin registro local. La otra es la especialidad (ADPIC art. 16), que extiende la protección a otras clases. La jurisprudencia argentina rechaza solicitudes que intentan aprovechar el prestigio ajeno, aunque estén en otra clase.", "ref": "u10-marca-notoria"}, {"id": "m10-19", "b": 10, "tipo": "vf", "origen": "nueva", "pregunta": "Una denominación de origen, como una marca, puede cederse o licenciarse a una empresa de otra provincia.", "opciones": ["Verdadero", "Falso"], "correctas": [1], "explicacion": "Falso. El cuadro del PPT: la marca es de una persona o empresa y se cede o licencia; la IG/DO es de todos los productores de la zona que cumplen las reglas y no se puede vender, porque está atada al lugar. Además, la marca identifica quién fabrica el producto y la IG/DO de dónde viene. Por eso las denominaciones de origen no se pueden registrar como marca (art. 3).", "ref": "u10-do-ig"}, {"id": "m10-20", "b": 10, "tipo": "vf", "origen": "nueva", "pregunta": "Una startup tucumana con marca registrada en el INPI queda protegida también en Chile y Brasil, porque esos países integran el Protocolo de Madrid.", "opciones": ["Verdadero", "Falso"], "correctas": [1], "explicacion": "Falso. Por territorialidad, una marca registrada en el INPI protege solo en Argentina; para otros países hay que registrar país por país. El Protocolo de Madrid permite una solicitud internacional ante la OMPI, pero Argentina todavía no adhirió, así que no sirve aunque Chile y Brasil sí sean parte. Lo que sí ayuda es el derecho de prioridad de 6 meses del Convenio de París.", "ref": "u10-territorialidad"}, {"id": "m11-q1", "b": 11, "tipo": "simple", "origen": "quiz", "pregunta": "¿Qué es un contrato informático?", "opciones": ["Un acuerdo legal entre dos o más partes para establecer derechos y obligaciones sobre bienes o servicios informáticos como hardware y software.", "Un contrato que se celebra a través de medios electrónicos, con independencia de cuál sea su objeto.", "El acto jurídico mediante el cual dos o más partes manifiestan su consentimiento para crear, regular, modificar, transferir o extinguir relaciones jurídicas patrimoniales.", "Aquel redactado unilateralmente por el proveedor de tecnología, que el usuario solo puede aceptar o rechazar en bloque."], "correctas": [0], "explicacion": "Es la definición del PPT (la que copió el Quiz 11): el contrato informático se define por su objeto, los bienes o servicios informáticos. No es la definición de contrato electrónico, que mira el medio por el que se celebra y no la materia. Tampoco es la definición general de contrato del art. 957 CCyC, que es el género del que el informático es una especie. Y no es el contrato de adhesión, que se define por cómo se redacta (predisponente/adherente), no por su objeto.", "ref": "u11-contrato-informatico"}, {"id": "m11-01", "b": 11, "tipo": "simple", "origen": "nueva", "pregunta": "Un centro odontológico de Yerba Buena compra cinco computadoras a una casa de informática, que pasan a ser de su propiedad. ¿Cómo se clasifica ese contrato según el objeto y según el negocio jurídico?", "opciones": ["Equipamiento; locación.", "Equipamiento; compraventa.", "Equipamiento; leasing con opción de compra.", "Servicios informáticos; prestación de servicios."], "correctas": [1], "explicacion": "Por el objeto es de equipamiento (adquisición de hardware) y por el negocio es compraventa, porque se transmiten derechos de propiedad sobre un bien informático. No es locación, porque la locación concede el uso sin transferir la propiedad, y acá las computadoras pasan a ser del consultorio. No es leasing, que da el uso con opción de compra al final, no la propiedad inmediata. Y no es de servicios ni de prestación de servicios, porque se entrega un bien y no se busca una actividad técnica.", "ref": "u11-clasif-naturaleza"}, {"id": "m11-02", "b": 11, "tipo": "simple", "origen": "nueva", "pregunta": "Una empresa alquila una impresora multifunción por un canon mensual; la impresora sigue siendo del proveedor y no hay opción de compra. Según el negocio jurídico, ¿qué contrato es?", "opciones": ["Leasing.", "Compraventa.", "Locación.", "Prestación de servicios."], "correctas": [2], "explicacion": "Es locación: se concede el uso de un bien informático sin transferir la propiedad (el PPT pone como ejemplo el alquiler mensual de impresoras). No es leasing porque el leasing da el uso con opción de compra al final, y el caso aclara que no la hay. No es compraventa porque no se transmite la propiedad: la impresora sigue siendo del proveedor. Y no es prestación de servicios, que busca una actividad o resultado técnico y no el uso de un bien.", "ref": "u11-clasif-naturaleza"}, {"id": "m11-03", "b": 11, "tipo": "simple", "origen": "nueva", "pregunta": "Valentina, programadora freelance, es contratada para desarrollar un sistema de turnos a medida. Según el negocio jurídico, ¿qué tipo de contrato es?", "opciones": ["De prestación de servicios, porque busca una actividad técnica funcional como el mantenimiento.", "De locación, porque el cliente usa el sistema sin adquirir su propiedad.", "De prestaciones intelectuales, porque su objeto es el trabajo intelectual de un programador.", "De compraventa, porque se transmiten los derechos sobre un software on premise."], "correctas": [2], "explicacion": "Los contratos de prestaciones intelectuales tienen por objeto el trabajo intelectual de programadores, diseñadores o analistas; el PPT da como ejemplo al desarrollador freelance que crea una app. No es prestación de servicios, que es trabajo técnico o material con resultado funcional (mantenimiento, hosting). No es locación, que concede el uso de un bien ya existente. Y no es compraventa, que transmite la propiedad de un bien ya hecho, no encarga su desarrollo.", "ref": "u11-clasif-naturaleza"}, {"id": "m11-04", "b": 11, "tipo": "simple", "origen": "nueva", "pregunta": "Según el PPT, ¿cuál es el objeto de los contratos informáticos?", "opciones": ["Únicamente el hardware, porque el software es un bien inmaterial protegido por el derecho de autor.", "Puede ser múltiple: bienes informáticos (hardware y software) y servicios informáticos de apoyo, como el diseño, el análisis y el mantenimiento del sistema.", "Únicamente las licencias de uso de software estándar (enlatado).", "Cualquier bien, siempre que el contrato se celebre por medios electrónicos."], "correctas": [1], "explicacion": "El PPT dice que el objeto generalmente puede ser múltiple: bienes informáticos (hardware y software) y servicios informáticos de apoyo. No se limita al hardware: el software también es bien informático aunque sea inmaterial. No se limita a licencias de software enlatado, porque también incluye software a medida, equipos y servicios. Y lo que define al contrato informático es el objeto, no el medio electrónico de celebración, que es el criterio del contrato electrónico.", "ref": "u11-objeto"}, {"id": "m11-05", "b": 11, "tipo": "simple", "origen": "nueva", "pregunta": "¿Cómo define el PPT al software como bien informático?", "opciones": ["Conjunto de dispositivos y elementos mecánicos, magnéticos, eléctricos y electrónicos del sistema.", "Conjunto de bienes inmateriales que constituyen el soporte lógico del sistema, incluyendo los programas de base y los aplicativos.", "Servicio de apoyo como el diseño, el análisis y el mantenimiento del sistema.", "Componentes independientes que encapsulan funcionalidades y se comunican mediante interfaces definidas."], "correctas": [1], "explicacion": "El software es el conjunto de bienes inmateriales que constituyen el soporte lógico del sistema, con programas de base y aplicativos. La definición de dispositivos y elementos mecánicos, magnéticos, eléctricos y electrónicos corresponde al hardware. El diseño, análisis y mantenimiento son los servicios informáticos de apoyo, la otra parte del objeto. Y los componentes independientes con interfaces definidas describen la modularidad, una propiedad arquitectónica, no un bien.", "ref": "u11-objeto"}, {"id": "m11-06", "b": 11, "tipo": "simple", "origen": "nueva", "pregunta": "¿Qué es la escalabilidad?", "opciones": ["La capacidad de un producto para funcionar con otros sistemas, plataformas, formatos o versiones sin errores.", "La propiedad por la cual un sistema se divide en módulos independientes que se comunican mediante interfaces definidas.", "La capacidad de intercambiar datos y trabajar conjuntamente con sistemas de terceros.", "La capacidad de un sistema para mantener o mejorar su rendimiento cuando aumenta la carga de trabajo y crecer sin rediseñarlo todo."], "correctas": [3], "explicacion": "La escalabilidad es mantener o mejorar el rendimiento cuando aumenta la carga (más usuarios, transacciones o datos) y crecer sin rediseñar todo el sistema. Funcionar con otras plataformas, formatos o versiones es la compatibilidad. Dividir el sistema en módulos independientes es la modularidad. E intercambiar datos y trabajar con sistemas de terceros es la interoperabilidad, que el PPT incluye como una dimensión de la compatibilidad.", "ref": "u11-escalabilidad"}, {"id": "m11-07", "b": 11, "tipo": "simple", "origen": "nueva", "pregunta": "Una startup tucumana prevé un pico de usuarios y el contrato exige que el proveedor pueda agregar más servidores web que trabajen en paralelo. ¿Qué está exigiendo?", "opciones": ["Escalabilidad vertical (scale up).", "Escalabilidad horizontal (scale out).", "Compatibilidad de versiones (backward/forward).", "Modularidad del sistema."], "correctas": [1], "explicacion": "Añadir más nodos o instancias que trabajen en paralelo (réplicas, servidores web adicionales) es escalabilidad horizontal o scale out. La vertical o scale up consiste en aumentar la capacidad de un mismo nodo (más CPU, memoria o disco), no en sumar servidores. La compatibilidad de versiones trata de que el producto funcione con versiones anteriores o posteriores, no del crecimiento de la carga. Y la modularidad es dividir el sistema en componentes, no multiplicar la infraestructura.", "ref": "u11-escalabilidad"}, {"id": "m11-08", "b": 11, "tipo": "simple", "origen": "nueva", "pregunta": "Una tienda online descubre que los clientes que entran desde iPhone no pueden pagar porque el sistema no funciona en Safari. ¿Qué característica técnica debió quedar especificada en el contrato?", "opciones": ["Compatibilidad de navegadores.", "Escalabilidad horizontal.", "Modularidad.", "Compatibilidad de versiones (backward/forward)."], "correctas": [0], "explicacion": "Que el sistema funcione en Chrome, Firefox, Edge y Safari es la compatibilidad de navegadores, una de las dimensiones de la compatibilidad que el PPT manda detallar en el contrato. La escalabilidad horizontal resuelve aumentos de carga, no fallas en un navegador. La modularidad facilita mantener y reemplazar partes del sistema, pero no garantiza que corra en Safari. Y la compatibilidad de versiones mira versiones anteriores o posteriores del producto, no navegadores distintos.", "ref": "u11-compatibilidad"}, {"id": "m11-09", "b": 11, "tipo": "simple", "origen": "nueva", "pregunta": "¿En qué consiste el deber de consejo del proveedor?", "opciones": ["En comunicar con veracidad las características, funciones y limitaciones del producto o servicio.", "En orientar al cliente para que pueda elegir la opción más adecuada a sus necesidades.", "En detallar sus necesidades y especificaciones, colaborando activamente con el proveedor.", "En garantizar el correcto funcionamiento del sistema durante el período acordado."], "correctas": [1], "explicacion": "El deber de consejo obliga al proveedor a orientar al cliente para que elija la opción más adecuada a sus necesidades. Comunicar con veracidad características, funciones y limitaciones es el deber de información, el otro deber especial del proveedor. Detallar necesidades y especificaciones es la colaboración que se le exige al usuario, no un deber del proveedor. Y garantizar el funcionamiento durante el período acordado corresponde a la etapa postcontractual de garantía.", "ref": "u11-deber-informacion"}, {"id": "m11-10", "b": 11, "tipo": "simple", "origen": "nueva", "pregunta": "Un proveedor de software le envía a una pyme un contrato modelo, igual para todos sus clientes, que la pyme solo puede firmar o rechazar. ¿Qué es, según su forma de celebración?", "opciones": ["Un contrato de adhesión: redactado unilateralmente por el predisponente, sin posibilidad real de negociación por el adherente.", "Un contrato a unidad de medida, porque el precio se fija igual para todos los clientes.", "Un contrato por recursos (contracting for resources).", "Un contrato de locación de software."], "correctas": [0], "explicacion": "Es de adhesión: lo redacta unilateralmente una parte (predisponente) y la otra (adherente) solo acepta o rechaza en bloque; el PPT cita como ejemplo los contratos tipo o standard. El contrato a unidad de medida es una forma de fijar el precio por unidad, no de redactar las cláusulas. Contracting for resources describe qué compromete el proveedor (recursos y no resultados), no cómo se celebra. Y la locación es un negocio jurídico según el objeto, que nada dice sobre la negociación.", "ref": "u11-adhesion"}, {"id": "m11-11", "b": 11, "tipo": "simple", "origen": "nueva", "pregunta": "¿Qué refleja, según el PPT, la distinción anglosajona entre contracting for results y contracting for resources?", "opciones": ["La diferencia entre el contrato informático, que mira el objeto, y el contrato electrónico, que mira el medio.", "La diferencia entre la prestación de servicios y las prestaciones intelectuales.", "Que el usuario busca resultados concretos y funcionales, mientras el proveedor tiende a garantizar solo la funcionalidad técnica general.", "La diferencia entre la escalabilidad vertical y la horizontal."], "correctas": [2], "explicacion": "La distinción refleja los objetivos distintos de las partes: el usuario busca resultados concretos y el proveedor tiende a comprometer solo la funcionalidad técnica general. No es la diferencia informático/electrónico, que se basa en objeto versus medio. Tampoco es el cuadro de prestación de servicios versus prestaciones intelectuales, que compara naturaleza del trabajo y especialización. Y nada tiene que ver con las formas de escalar (aumentar un nodo o agregar nodos).", "ref": "u11-objetivos-partes"}, {"id": "m11-12", "b": 11, "tipo": "simple", "origen": "nueva", "pregunta": "Durante un mes el cliente prueba el software para verificar que emite bien sus reportes contables y documenta el resultado en un acta. ¿En qué etapa del contrato está?", "opciones": ["Etapa de entrega, instalación y puesta en marcha.", "Etapa de aceptación.", "Etapa de garantía, mantenimiento o soporte.", "Etapa de verificación: test de aceptación."], "correctas": [3], "explicacion": "Es la etapa de verificación o test de aceptación: el usuario prueba el sistema, se documenta en un acta de aceptación o rechazo y el proveedor corrige fallas antes de la aceptación definitiva (es el ejemplo del PPT). La entrega e instalación es la ejecución inicial, antes de probar. La aceptación es la aprobación formal posterior, una vez superado el test. Y la garantía es la fase postcontractual, cuando el sistema ya fue aceptado.", "ref": "u11-etapas"}, {"id": "m11-13", "b": 11, "tipo": "multiple", "origen": "nueva", "pregunta": "Según el cuadro del PPT, ¿qué rasgos corresponden a la prestación de servicios (y no a las prestaciones intelectuales)? Seleccioná todas las correctas.", "opciones": ["Naturaleza del trabajo técnica o material.", "Grado de especialización que puede ser bajo o medio.", "Resultado esperado innovador o analítico (desarrollo, diseño, consultoría).", "Resultado esperado funcional (mantenimiento/soporte).", "Alto nivel técnico o profesional."], "correctas": [0, 1, 3], "explicacion": "La prestación de servicios tiene trabajo técnico o material, especialización baja o media y un resultado funcional, como mantenimiento o soporte; su ejemplo típico es el hosting. El resultado innovador o analítico (desarrollo, diseño, consultoría) es propio de las prestaciones intelectuales, no de los servicios. Y el alto nivel técnico o profesional también corresponde a las prestaciones intelectuales, cuyo ejemplo típico es el desarrollo de software.", "ref": "u11-servicios-vs-intelectuales"}, {"id": "m11-14", "b": 11, "tipo": "multiple", "origen": "nueva", "pregunta": "¿Qué actividades corresponden a la etapa precontractual (fase de análisis, negociación y planificación)? Seleccioná todas las correctas.", "opciones": ["Definir la necesidad del usuario y analizar la solución técnica posible.", "Hacer una evaluación comparativa de proveedores.", "Definir las obligaciones de resultado o de medios del proveedor en el contrato principal.", "Firmar, eventualmente, acuerdos de confidencialidad.", "Capacitar al personal del usuario."], "correctas": [0, 1, 3], "explicacion": "En la etapa precontractual se define la necesidad, se analiza la solución técnica, se comparan proveedores y puede firmarse un acuerdo de confidencialidad; además rigen los deberes de información y consejo. Definir las obligaciones de resultado o de medios pertenece a la etapa de formalización, cuando se redacta y firma el contrato principal. Y capacitar al personal del usuario es parte de la etapa de entrega, instalación y puesta en marcha.", "ref": "u11-etapas"}, {"id": "m11-15", "b": 11, "tipo": "multiple", "origen": "nueva", "pregunta": "¿Cuáles son beneficios de la modularidad según el PPT? Seleccioná todas las correctas.", "opciones": ["Mantenimiento más sencillo.", "Mantener el rendimiento cuando aumenta la carga de trabajo.", "Reutilización de módulos (plugins, librerías).", "Reduce riesgos en cambios.", "Funcionar en distintas plataformas y navegadores sin errores."], "correctas": [0, 2, 3], "explicacion": "El PPT enumera como beneficios de la modularidad el mantenimiento más sencillo, la reutilización de módulos, la facilidad de actualización, la mejor legibilidad y testabilidad y la reducción de riesgos en cambios. Mantener el rendimiento ante más carga es la definición de escalabilidad, no un beneficio de la modularidad. Y funcionar en distintas plataformas y navegadores es la compatibilidad, otra característica que el contrato debe especificar por separado.", "ref": "u11-modularidad"}, {"id": "m11-16", "b": 11, "tipo": "multiple", "origen": "nueva", "pregunta": "¿Cuáles son dimensiones de la compatibilidad según el PPT? Seleccioná todas las correctas.", "opciones": ["Compatibilidad de plataforma/OS.", "Escalabilidad vertical (scale up).", "Compatibilidad de interfaces/datos (APIs, formatos JSON/XML, protocolos).", "Compatibilidad de navegadores.", "Reutilización de módulos."], "correctas": [0, 2, 3], "explicacion": "Las dimensiones de la compatibilidad son plataforma/OS, navegadores, versiones, interfaces/datos e interoperabilidad. La escalabilidad vertical es una forma de escalar (aumentar la capacidad de un nodo), una característica distinta que responde al aumento de carga. Y la reutilización de módulos es un beneficio de la modularidad, no una dimensión de la compatibilidad.", "ref": "u11-compatibilidad"}, {"id": "m11-17", "b": 11, "tipo": "vf", "origen": "nueva", "pregunta": "Un contrato de desarrollo de software firmado en papel no es un contrato informático, porque no se celebró por medios electrónicos.", "opciones": ["Verdadero", "Falso"], "correctas": [1], "explicacion": "Falso. El contrato informático se define por su objeto: derechos y obligaciones sobre bienes o servicios informáticos como hardware y software. El medio de celebración no importa; eso define al contrato electrónico, que es una clasificación independiente (material). Un desarrollo de software firmado en papel, con lapicera, sigue siendo un contrato informático.", "ref": "u11-contrato-informatico"}, {"id": "m11-18", "b": 11, "tipo": "vf", "origen": "nueva", "pregunta": "Según el PPT, en informática las obligaciones del proveedor suelen ser obligaciones de resultado, porque si el sistema no cumple los objetivos funcionales pierde valor económico.", "opciones": ["Verdadero", "Falso"], "correctas": [0], "explicacion": "Verdadero. Es textual del PPT en «Objetivos perseguidos por las partes»: las obligaciones del proveedor suelen ser de resultado porque, si el sistema no cumple los objetivos funcionales, pierde valor económico. Por eso es fundamental definir claramente el objeto de la prestación, con un objeto cierto y determinado coincidente entre oferta y aceptación.", "ref": "u11-objetivos-partes"}, {"id": "m11-19", "b": 11, "tipo": "vf", "origen": "nueva", "pregunta": "Los deberes de información y de consejo del proveedor surgen del principio de buena fe en la etapa precontractual.", "opciones": ["Verdadero", "Falso"], "correctas": [0], "explicacion": "Verdadero. El PPT dice que, para equilibrar la desigualdad técnica entre proveedor y usuario, la doctrina y la jurisprudencia imponen al proveedor el deber de información y el deber de consejo, y que estos deberes surgen del principio de buena fe en la etapa precontractual: cada parte debe actuar con lealtad y transparencia.", "ref": "u11-deber-informacion"}, {"id": "m11-20", "b": 11, "tipo": "vf", "origen": "nueva", "pregunta": "El contrato de leasing concede el uso de un bien informático sin transferir la propiedad y sin opción de compra.", "opciones": ["Verdadero", "Falso"], "correctas": [1], "explicacion": "Falso. Esa es la definición de la locación: se concede el uso de un bien informático sin transferir la propiedad. El leasing, en cambio, da el uso de un equipo o sistema con opción de compra al final; el ejemplo del PPT es una empresa que adquiere equipos mediante leasing financiero por tres años, con opción de compra.", "ref": "u11-clasif-naturaleza"}, {"id": "m12-q1", "b": 12, "tipo": "simple", "origen": "quiz", "pregunta": "¿Qué es un delito informático?", "opciones": ["Toda operación ilícita y culpable (dolosa o por negligencia) que se realiza por medio de la informática, o que tiene como objetivo destruir o dañar computadoras, medios electrónicos y redes", "Toda acción dolosa de quien rompe o vulnera los sistemas de seguridad para robar, dañar o alterar datos, buscando un beneficio propio o el perjuicio ajeno", "Toda conducta típica, antijurídica y culpable descripta en la Ley 26.388, que funciona como un código penal informático separado del Código Penal y con sus propias penas", "Todo acceso a sabiendas, por cualquier medio, sin la debida autorización o excediendo la que se posea, a un sistema o dato informático de acceso restringido"], "correctas": [0], "explicacion": "La definición del PPT (y del Quiz 11) es «toda operación ilícita y culpable (con intención dolosa o por negligencia) que se realiza por medio de la informática, o bien que tiene como objetivo destruir o dañar computadoras, medios electrónicos y redes»: abre las dos puertas, la computadora como arma y como víctima. No es la que habla de un código separado, porque la Ley 26.388 no creó un código aparte sino que modificó el Código Penal. No es la del acceso sin autorización, porque esa es la conducta típica de una sola figura, el art. 153 bis. Tampoco es la de romper sistemas de seguridad: eso define al cracker, un sujeto activo, no al delito.", "ref": "u12-delito-informatico"}, {"id": "m12-q2", "b": 12, "tipo": "simple", "origen": "quiz", "pregunta": "Tipos de delito: ¿cuál de estas caracterizaciones es la correcta?", "opciones": ["Delito civil: acto ilícito con intención de dañar; cuasidelito civil: conducta tipificada sin pena; delito penal: cualquier acto ilícito que obligue a indemnizar al damnificado por el perjuicio causado", "Delito civil: acto ilícito con intención de dañar; cuasidelito civil: sin intención de dañar, con daño por negligencia o imprudencia; delito penal: conducta tipificada en la ley penal", "Delito civil: daño por negligencia o imprudencia; cuasidelito civil: conducta tipificada en la ley penal; delito penal: acto ilícito con intención de dañar a otro", "Delito civil: conducta tipificada en la ley penal; cuasidelito civil: acto ilícito con intención de dañar; delito penal: daño causado por negligencia o imprudencia"], "correctas": [1], "explicacion": "Según el PPT, el delito civil es el acto ilícito ejecutado con intención de dañar a otro; el cuasidelito civil, el daño sin intención pero por negligencia o imprudencia (ambos se reparan con indemnización), y el delito penal, la conducta tipificada, es decir, expresamente mencionada en la ley penal, cuya consecuencia es una pena. Las dos primeras alternativas falsas permutan las definiciones entre las tres clases. La que habla de «conducta tipificada sin pena» y de «cualquier acto ilícito que obligue a indemnizar» confunde la faceta civil (reparar) con la penal (pena): lo que define al delito penal es la tipificación.", "ref": "u12-tipos-delito"}, {"id": "m12-q3", "b": 12, "tipo": "multiple", "origen": "quiz", "pregunta": "¿Cuáles son rasgos propios de los delitos informáticos según la caracterización de Téllez Valdés? Seleccioná todas las correctas.", "opciones": ["De necesidad: se explican por falta de recursos o de educación", "Cifra negra: muchos casos, pocas denuncias", "Ocupacionales: muchas veces se cometen desde adentro", "Fácil comprobación: el rastro técnico queda siempre registrado", "De oportunidad: aprovechan o fabrican la ocasión"], "correctas": [1, 2, 4], "explicacion": "Los ocho rasgos del PPT son: conocimiento técnico, «cuello blanco», ocupacionales, de oportunidad, pérdidas económicas, cifra negra, difícil comprobación y tienden a proliferar; cifra negra, ocupacionales y de oportunidad están en la lista. No es «fácil comprobación», porque el rasgo es exactamente el opuesto: difícil comprobación, con prueba técnica, frágil e internacional. Tampoco «de necesidad»: el rasgo de cuello blanco sostiene que la conducta no se explica por necesidad ni por falta de educación.", "ref": "u12-rasgos"}, {"id": "m12-q4", "b": 12, "tipo": "simple", "origen": "quiz", "pregunta": "¿Qué es un hacker?", "opciones": ["Persona que usa sus conocimientos de telefonía para utilizar las telecomunicaciones gratis, aprovechando fallas de las redes", "Persona que entra a sistemas sin permiso pero sin causar daño, cuya situación es siempre lícita porque no tiene intención de perjudicar", "Delincuente informático propiamente dicho, que rompe o vulnera los sistemas de seguridad para robar, dañar o alterar datos en beneficio propio", "Persona con altos conocimientos informáticos que accede a sistemas para explorar vulnerabilidades o aprender, no necesariamente con mala intención"], "correctas": [3], "explicacion": "El PPT define al hacker como «persona con altos conocimientos informáticos que accede a sistemas para explorar vulnerabilidades o aprender, no necesariamente con mala intención»: hacker no es sinónimo de delincuente. No es la del delincuente que rompe sistemas, porque esa es la definición de cracker. No es la del que entra sin permiso sin dañar, porque describe al gray hat y además es falsa: su situación es ambigua y el acceso sin autorización ya puede ser delito (art. 153 bis). La de la telefonía define al phreaker.", "ref": "u12-hacker"}, {"id": "m12-q5", "b": 12, "tipo": "simple", "origen": "quiz", "pregunta": "¿Qué es un cracker?", "opciones": ["Quien ingresa a un sistema ajeno para introducir virus y alterar o inutilizar la información; su conducta encaja en el daño informático del art. 183, segundo párrafo", "El delincuente informático propiamente dicho: rompe o vulnera los sistemas de seguridad para robar, dañar o alterar datos, buscando un beneficio propio o el perjuicio ajeno", "Quien reproduce, vende o usa software sin licencia, violando los arts. 71 y 72 de la Ley 11.723 de propiedad intelectual", "El «cracker de hardware»: quien falsifica y piratea tarjetas inteligentes, figura que la doctrina distingue del hacker"], "correctas": [1], "explicacion": "El cracker es, según el PPT, el delincuente informático propiamente dicho, que «rompe» o vulnera los sistemas de seguridad para robar, dañar o alterar datos, buscando un beneficio propio o el perjuicio ajeno. No es el que introduce virus en sistemas ajenos: ese es el virucher. No es el que reproduce o vende software sin licencia: ese es el pirata informático (Ley 11.723, arts. 71 y 72). Y el «cracker de hardware» que falsifica tarjetas inteligentes es el copyhacker, otra figura distinta.", "ref": "u12-cracker"}, {"id": "m12-q6", "b": 12, "tipo": "simple", "origen": "quiz", "pregunta": "¿Qué es la ingeniería social?", "opciones": ["Técnica que adultera el servidor DNS o el archivo hosts para que el usuario llegue a una página falsa sin hacer clic en nada", "Práctica legítima de obtener información confidencial de los usuarios, que el hacker ético realiza con permiso del dueño del sistema", "Práctica ilegítima de obtener información confidencial manipulando a los propios usuarios: en lugar de atacar la máquina, se ataca a la persona", "Correo con cualquier excusa («validá tus datos») que busca el clic de la víctima para llevarla a una página falsa del banco"], "correctas": [2], "explicacion": "El PPT la define como la «práctica ilegítima de obtener información confidencial manipulando a los propios usuarios»: se ataca a la persona y no a la máquina, porque el usuario suele ser el eslabón débil. Ojo: el apunte manuscrito del quiz dice «legítima», pero el PPT dice ilegítima, y por eso falla la opción de la práctica legítima del hacker ético. La que adultera el DNS o el archivo hosts es el pharming, y la del correo que busca el clic es el phishing: son modalidades que se apoyan en la ingeniería social, no su definición.", "ref": "u12-ingenieria-social"}, {"id": "m12-01", "b": 12, "tipo": "simple", "origen": "nueva", "pregunta": "Según el PPT, además de que la conducta sea típica, antijurídica y culpable, ¿cuál es el «cuarto elemento que suele olvidarse» del delito?", "opciones": ["El dolo, es decir, que la persona haya actuado a sabiendas y con intención de dañar", "La antijuridicidad, es decir, que la conducta sea contraria a Derecho y no solo inmoral", "La relación de causalidad entre la conducta y el resultado", "La tipicidad, es decir, que la conducta esté descripta por una ley anterior al hecho"], "correctas": [2], "explicacion": "El PPT enumera conducta típica, antijurídica y culpable, y agrega como cuarto elemento que suele olvidarse la relación de causalidad: un vínculo real entre lo que hizo (o dejó de hacer) la persona y el resultado dañoso; no alcanza con estar cerca del problema. No es la antijuridicidad ni la tipicidad, porque ya forman parte de los tres elementos clásicos. Tampoco el dolo: es una de las formas de la culpabilidad (dolo o, al menos, culpa), no un elemento aparte.", "ref": "u12-delito"}, {"id": "m12-02", "b": 12, "tipo": "simple", "origen": "nueva", "pregunta": "Un administrador de una pyme tucumana se olvida, por descuido, de aplicar un parche de seguridad y eso provoca la pérdida de datos de un cliente. No quería dañar a nadie. Si se le atribuyera responsabilidad, ¿a qué título sería?", "opciones": ["A título de dolo, porque casi todos los delitos informáticos del Código Penal son dolosos", "A título de culpa: negligencia, sin intención de dañar", "A ningún título, porque si no hay intención de dañar no puede haber culpabilidad de ningún tipo", "A título de dolo, porque como administrador sabía que el sistema tenía una vulnerabilidad sin corregir"], "correctas": [1], "explicacion": "El PPT distingue dolo (a sabiendas y con intención: sabe lo que hace y quiere el resultado) de culpa (negligencia, imprudencia o impericia: no hay intención, pero el daño se produce por no actuar con el cuidado debido). El descuido sin intención es culpa. No es dolo por saber que existía la falla, porque el dolo exige querer el resultado. No es cierto que sin intención no haya culpabilidad: la culpabilidad es con dolo o, al menos, con culpa. Y que casi todos los delitos informáticos sean dolosos no transforma en dolosa una conducta negligente.", "ref": "u12-dolo-culpa"}, {"id": "m12-03", "b": 12, "tipo": "simple", "origen": "nueva", "pregunta": "Alguien borra los datos de un sistema ajeno (art. 183, 2º párr.). Según los criterios de clasificación del PPT, ¿qué papel cumple la informática?", "opciones": ["Instrumento o medio: la tecnología comete el delito, porque se usa una computadora para borrar", "Ninguno de los dos criterios: es un delito contra la administración de justicia (art. 255)", "Instrumento o medio: es un delito «de toda la vida» que solo cambia de herramienta", "Fin u objeto: la tecnología padece el delito"], "correctas": [3], "explicacion": "En el PPT, el daño informático (borrar o alterar datos, art. 183, 2º párr.) figura en el grupo fin u objeto: el ataque recae sobre el sistema o el dato, la tecnología padece el delito. No es instrumento o medio aunque se use una computadora, porque ese grupo comprende delitos tradicionales con otra herramienta, como la falsificación computarizada o el fraude del art. 173 inc. 16. Tampoco es un delito contra la administración de justicia: el art. 255 castiga destruir objetos destinados a servir de prueba, no cualquier dato.", "ref": "u12-criterios"}, {"id": "m12-04", "b": 12, "tipo": "simple", "origen": "nueva", "pregunta": "Una fintech tucumana descubre que la vulneraron y decide no denunciarlo para que sus clientes no se enteren. ¿Qué rasgo propio de los delitos informáticos ilustra?", "opciones": ["La cifra negra, por miedo al descrédito", "El carácter ocupacional, porque estos delitos se cometen muchas veces desde adentro de la organización", "El carácter de oportunidad, porque el atacante aprovecha o fabrica la ocasión propicia para actuar", "La tendencia a proliferar, porque la ley debe actualizarse para contemplar las nuevas conductas"], "correctas": [0], "explicacion": "La cifra negra significa muchos casos y pocas denuncias; el PPT explica que se debe al miedo al descrédito (a la organización le aterra que se sepa que la vulneraron, porque golpea su reputación y la confianza de sus clientes) y a los vacíos de regulación. No es el carácter ocupacional, que mira al autor que actúa desde adentro. No es el de oportunidad, que describe cómo el atacante aprovecha o fabrica la ocasión. Y la tendencia a proliferar alude a que la ley debe actualizarse, no a la falta de denuncias.", "ref": "u12-rasgos"}, {"id": "m12-05", "b": 12, "tipo": "simple", "origen": "nueva", "pregunta": "Un atacante vacía las cuentas de una cooperativa de Yerba Buena. Respecto del delito, ¿qué es la cooperativa?", "opciones": ["Un tercero ajeno, porque solo una persona humana puede ser víctima de un delito", "El sujeto pasivo: el ente sobre el cual recae la conducta", "El sujeto activo, si el ataque lo cometió un empleado (delito ocupacional)", "El sujeto activo, porque es la organización titular del sistema informático vulnerado"], "correctas": [1], "explicacion": "El PPT define al sujeto pasivo como la víctima, el ente sobre el cual recae la conducta: una persona, una institución, un gobierno o una empresa, cualquiera que use sistemas informáticos. No es sujeto activo por ser titular del sistema: el activo es quien comete el delito. Es falso que solo una persona humana pueda ser víctima, porque el PPT incluye instituciones y empresas. Y que el autor sea un empleado (rasgo ocupacional) no convierte a la organización en autora: sigue siendo la víctima.", "ref": "u12-sujetos"}, {"id": "m12-06", "b": 12, "tipo": "simple", "origen": "nueva", "pregunta": "Antes de 2008 había conductas informáticas dañinas que no podían castigarse. ¿Cómo resolvió el problema el legislador argentino?", "opciones": ["Con la Ley 26.904, que sumó al Código Penal el acceso no autorizado y la estafa informática", "Con la Ley 26.388, que creó un código penal informático separado, con figuras y penas propias para estas conductas", "Con la Ley 25.930, que tipificó el acceso ilegítimo y el daño informático dentro del Código Penal", "Con la Ley 26.388, que no creó un código aparte: modificó el Código Penal para incorporarle diversos delitos informáticos"], "correctas": [3], "explicacion": "El PPT explica que, por el principio de legalidad (art. 18 CN), sin ley previa no hay delito; la solución fue la Ley 26.388 de 2008, que no creó un código aparte sino que modificó el Código Penal para incorporarle diversos delitos informáticos, ampliando conceptos que ya usaba. Falla la del código separado por eso mismo. La Ley 25.930 (2004) incorporó el fraude con tarjetas y sus datos (art. 173 inc. 15), no el acceso ni el daño. La Ley 26.904 (2013) sumó el grooming (art. 131).", "ref": "u12-legalidad-ley26388"}, {"id": "m12-07", "b": 12, "tipo": "simple", "origen": "nueva", "pregunta": "Una programadora freelance terminó hace meses el sistema de turnos de una clínica. Conservó sus credenciales y hoy entra «para ver cómo anda». ¿Cómo se califica la conducta?", "opciones": ["Acceso excediendo la autorización (art. 153 bis), porque todavía tiene un usuario válido en el sistema", "Acceso sin la debida autorización (art. 153 bis): su permiso para entrar al sistema terminó con el contrato que la vinculaba a la clínica", "No es delito: entró con su propia contraseña y no «rompió» nada en sentido técnico", "Interrupción de comunicaciones (art. 197), porque ingresó a un sistema que estaba en funcionamiento"], "correctas": [1], "explicacion": "Es el caso del PPT: el desarrollador que termina un proyecto, conserva sus credenciales y entra meses después accede sin la debida autorización, porque su permiso terminó con el contrato; encuadra en el art. 153 bis. No es «excediendo la autorización», que supone un permiso vigente cuyo alcance se supera. No vale que no haya roto nada: el PPT aclara que la conducta puede ser delictiva aunque nadie haya roto nada en sentido técnico. Y el art. 197 castiga interrumpir o entorpecer comunicaciones, cosa que aquí no ocurre.", "ref": "u12-acceso-153bis"}, {"id": "m12-08", "b": 12, "tipo": "simple", "origen": "nueva", "pregunta": "Un empleado de soporte tiene acceso a la base de datos de clientes para mantenimiento, y la consulta para espiar los datos personales de un conocido. ¿Qué figuras pueden aplicarse?", "opciones": ["Art. 153 bis por exceder la autorización, más art. 157 bis", "El art. 153 por violación de comunicación electrónica, porque leyó información que no le estaba dirigida", "Ninguna: tenía acceso legítimo a la base, así que cualquier consulta dentro de ella está permitida", "Solo el art. 153 bis por acceder sin la debida autorización, ya que nunca tuvo permiso sobre esos datos"], "correctas": [0], "explicacion": "El PPT pone este ejemplo: el empleado de soporte que tiene acceso para mantenimiento pero consulta para espiar a un conocido excede la autorización que posee (art. 153 bis), y si era un banco de datos personales puede sumarse el art. 157 bis. No es acceso «sin autorización», porque sí tenía un permiso, cuyo alcance superó. Es falso que con acceso pueda hacerse cualquier cosa: salirse del permiso es justamente exceder la autorización. Y el art. 153 protege comunicaciones (correos, cartas), no bancos de datos.", "ref": "u12-sin-vs-excediendo"}, {"id": "m12-09", "b": 12, "tipo": "simple", "origen": "nueva", "pregunta": "En el art. 153 (violación de comunicación electrónica), ¿qué significa la palabra clave «indebidamente»?", "opciones": ["Comunicando o publicando el contenido de la comunicación ajena a otra persona", "Con negligencia o imprudencia: abrir por descuido una comunicación que no le estaba dirigida", "Excediendo la autorización: abrir una casilla de correo a la que se tenía acceso técnico para realizar otra tarea distinta, como el mantenimiento", "Sin derecho: la comunicación no estaba dirigida a quien la abre y esa persona no estaba autorizada"], "correctas": [3], "explicacion": "El PPT explica que «indebidamente» significa sin derecho: la comunicación no estaba dirigida a quien la abre y esa persona no estaba autorizada; es un delito doloso. No es negligencia: acceder a la casilla de otro «sin querer» no es este delito. «Excediendo la autorización» es la fórmula del art. 153 bis, no la palabra clave del art. 153. Y comunicar o publicar el contenido no define la conducta básica: es un agravante.", "ref": "u12-art153"}, {"id": "m12-10", "b": 12, "tipo": "simple", "origen": "nueva", "pregunta": "Un comerciante contrata a alguien para que sature con miles de solicitudes el servidor de la tienda online de su competidor, que deja de responder durante el Hot Sale. ¿En qué artículo encuadra principalmente el ataque?", "opciones": ["Art. 157 bis: acceso ilegítimo a un banco de datos personales de los clientes", "Art. 153 bis: acceso no autorizado a un sistema o dato informático de acceso restringido", "Art. 197: interrumpir o entorpecer una comunicación", "Art. 173 inc. 16: defraudación mediante manipulación informática del sistema ajeno"], "correctas": [2], "explicacion": "El ataque descripto es una denegación de servicio (DoS): satura el servidor hasta que deja de responder al tráfico legítimo. El PPT dice que eso es, jurídicamente, entorpecer o interrumpir una comunicación (art. 197); en el cuadro síntesis, el art. 197 protege «que las comunicaciones fluyan». No es art. 153 bis, porque no hay ingreso al sistema. No es art. 173 inc. 16, porque no hay defraudación patrimonial mediante manipulación. Y no es art. 157 bis, porque no se accede a ningún banco de datos personales.", "ref": "u12-sintesis-cp"}, {"id": "m12-11", "b": 12, "tipo": "simple", "origen": "nueva", "pregunta": "Una usuaria escribe a mano la dirección correcta de su banco y, sin hacer clic en ningún enlace, llega a una página falsa que le roba las claves. ¿Qué modalidad sufrió?", "opciones": ["Hoax: una desinformación en cadena que se propaga porque las personas la reenvían", "Troyano: un programa aparentemente legítimo le abrió a un atacante el acceso remoto al equipo", "Phishing: un correo con una excusa la llevó a hacer clic y a entrar a una página falsa del banco", "Pharming: el DNS o el archivo hosts fueron adulterados"], "correctas": [3], "explicacion": "El pharming «adultera la agenda»: con el DNS o el archivo hosts adulterado, el usuario escribe la dirección correcta y llega igual a la página falsa, sin hacer clic en nada; por eso el PPT lo considera más peligroso que el phishing. No es phishing, porque el phishing necesita el clic en un correo. No es un troyano, que se instala en el equipo y abre acceso remoto o registra teclas. Y el hoax es desinformación en cadena, no un mecanismo de robo de claves.", "ref": "u12-phishing-pharming"}, {"id": "m12-12", "b": 12, "tipo": "simple", "origen": "nueva", "pregunta": "¿Por qué el PPT dice que el art. 173 inc. 16 es «amplio a propósito»?", "opciones": ["Porque fue incorporado por la Ley 25.930 para abarcar todo uso de tarjetas y sus datos", "Porque comprende el abuso de una firma en blanco, incluida la firma electrónica", "Porque tipifica de manera autónoma y general el robo de identidad por medios digitales", "Porque no se ata a una técnica que mañana quedaría obsoleta: es el paraguas de las modalidades"], "correctas": [3], "explicacion": "El art. 173 inc. 16 castiga defraudar mediante cualquier técnica de manipulación informática que altere el normal funcionamiento de un sistema o la transmisión de datos; el PPT destaca que no se ata a una técnica concreta y que es el «paraguas» de phishing, pharming, troyanos y robo de identidad. No lo incorporó la Ley 25.930: esa ley agregó el inc. 15 (tarjetas). El abuso de firma en blanco es el inc. 4. Y el robo de identidad sigue sin figura penal autónoma.", "ref": "u12-inc16"}, {"id": "m12-13", "b": 12, "tipo": "multiple", "origen": "nueva", "pregunta": "En una distribuidora de San Miguel de Tucumán detectan un ingreso indebido al servidor que probablemente termine en denuncia. ¿Qué debería hacer el área de sistemas? Seleccioná todas las correctas.", "opciones": ["Copiar los logs y la evidencia antes de que se roten o se pierdan", "Aislar el equipo, cortando el contacto con la red sin borrar ni reinstalar nada", "Correr una limpieza completa y borrar los archivos sospechosos", "Documentar qué se hizo, quién lo hizo y cuándo", "Formatear y reinstalar el servidor para restablecer rápido el servicio"], "correctas": [0, 1, 3], "explicacion": "El PPT resume la conducta ante un incidente en «preservar, no limpiar»: aislar el equipo sin borrar ni reinstalar, resguardar los registros antes de que se roten, documentar todo (qué, quién, cuándo) y tocar lo mínimo; eso es preservar la cadena de custodia. No corresponde formatear y reinstalar, porque destruye la evidencia y borrar deliberadamente prueba puede ser delito (art. 255). Tampoco correr una limpieza y borrar archivos sospechosos: es manipular la evidencia más de lo imprescindible, y modificar la prueba, aun con buena intención, puede arruinar la investigación.", "ref": "u12-cadena-custodia"}, {"id": "m12-14", "b": 12, "tipo": "multiple", "origen": "nueva", "pregunta": "¿Qué conductas castiga el art. 183, 2º párrafo, del Código Penal? Seleccioná todas las correctas.", "opciones": ["Interrumpir o entorpecer una comunicación, o resistir violentamente su restablecimiento", "Vender, distribuir, hacer circular o introducir en un sistema un programa destinado a causar daños", "Alterar, destruir o inutilizar datos, documentos, programas o sistemas informáticos", "La acción normal de un antivirus, o de una medida de protección legítima como el DRM, que altera o elimina archivos del equipo"], "correctas": [1, 2], "explicacion": "El art. 183, 2º párrafo, castiga dos momentos: el daño en sí (alterar, destruir o inutilizar datos, documentos, programas o sistemas informáticos) y hacer circular malware (vender, distribuir, hacer circular o introducir un programa destinado a causar daños), aunque el autor no lo haya ejecutado en la máquina de la víctima. No comprende la acción normal de un antivirus ni las medidas de protección legítimas como el DRM: proteger lo propio no es sabotear. Interrumpir o entorpecer comunicaciones es el art. 197.", "ref": "u12-dano-183"}, {"id": "m12-15", "b": 12, "tipo": "multiple", "origen": "nueva", "pregunta": "¿Qué características corresponden al gusano y no al virus? Seleccioná todas las correctas.", "opciones": ["Se clasifica en de archivo, de script, de boot y de macro", "Daña aunque sea consumiendo ancho de banda; a veces se usa en ataques DoS", "Necesita un archivo que lo aloje para copiarse", "Se propaga por la red local, internet, el correo o fallas del sistema operativo", "Es un programa independiente que no necesita archivo anfitrión"], "correctas": [1, 3, 4], "explicacion": "El PPT traza la frontera así: el virus depende de un archivo para copiarse; el gusano se replica por sí mismo a través de la red. Del gusano dice que es un programa independiente, que se propaga por red local, internet, correo o fallas del sistema operativo, que busca llegar a la mayor cantidad de equipos y que a veces se usa en ataques DoS. Necesitar un archivo anfitrión es propio del virus, y la clasificación en de archivo, de script, de boot y de macro corresponde a los tipos de virus.", "ref": "u12-virus-gusano"}, {"id": "m12-16", "b": 12, "tipo": "multiple", "origen": "nueva", "pregunta": "Según el cuadro síntesis del PPT, ¿qué pares «delito – qué protege» son correctos? Seleccioná todas las correctas.", "opciones": ["Destrucción de prueba informática (art. 255) – la administración de justicia", "Violación a bancos de datos (art. 157 bis) – la intimidad de las comunicaciones electrónicas privadas de los usuarios", "Estafa informática (arts. 172 y 173) – el patrimonio", "Interrupción de comunicaciones (art. 197) – el patrimonio", "Acceso no autorizado (art. 153 bis) – la integridad del sistema o dato restringido"], "correctas": [0, 2, 4], "explicacion": "El cuadro síntesis asigna al art. 153 bis la integridad del sistema o dato restringido, al art. 255 la administración de justicia y a la estafa informática (arts. 172 y 173 incs. 15 y 16) el patrimonio. Es incorrecto atribuir el patrimonio al art. 197: protege que las comunicaciones fluyan. Y el art. 157 bis protege los datos personales; la intimidad de las comunicaciones es el bien que protege el art. 153 (violación de comunicación electrónica).", "ref": "u12-sintesis-cp"}, {"id": "m12-17", "b": 12, "tipo": "vf", "origen": "nueva", "pregunta": "Desde la Ley 26.388, el robo de identidad por medios tecnológicos tiene una figura penal autónoma y general en el Código Penal.", "opciones": ["Verdadero", "Falso"], "correctas": [1], "explicacion": "Falso. El PPT dice que el robo de identidad sigue sin tener, hasta hoy, una figura penal autónoma y general, aunque hay proyectos legislativos; en la práctica se lo persigue como estafa (arts. 172 y 173) cuando el engaño sobre la identidad sirve para defraudar, y a través de los demás delitos que se cometen al usar la identidad usurpada. Lo que sí se tipificó después fue el grooming (Ley 26.904, art. 131, en 2013).", "ref": "u12-robo-identidad"}, {"id": "m12-18", "b": 12, "tipo": "vf", "origen": "nueva", "pregunta": "Un gray hat que entra sin permiso a un sistema ajeno pero no causa ningún daño no comete delito, porque no tiene intención de perjudicar.", "opciones": ["Verdadero", "Falso"], "correctas": [1], "explicacion": "Falso. El PPT describe al gray hat como quien entra sin permiso pero sin causar daño, y aclara que su situación es ambigua: acceder sin autorización ya puede ser delito aunque no quiera perjudicar (art. 153 bis). El dolo del art. 153 bis es saber que se entra sin permiso («a sabiendas»), no querer dañar. Solo el white hat, que prueba los sistemas con permiso del dueño, hace trabajo legítimo.", "ref": "u12-hacker"}, {"id": "m12-19", "b": 12, "tipo": "vf", "origen": "nueva", "pregunta": "Borrar o alterar deliberadamente la prueba de un delito informático puede ser, en sí mismo, un delito contra la administración de justicia, además del delito original.", "opciones": ["Verdadero", "Falso"], "correctas": [0], "explicacion": "Verdadero. El art. 255 castiga a quien sustrae, altera, oculta, destruye o inutiliza objetos destinados a servir de prueba ante la autoridad; el PPT lo llama «doble problema»: borrar o alterar deliberadamente la prueba informática (un log, un correo, el contenido de un disco, metadatos) puede ser un delito contra la administración de justicia además del delito que se intentaba ocultar. Incluso prevé multa para el depositario que la deja perder por imprudencia o negligencia.", "ref": "u12-destruccion-prueba"}, {"id": "m12-20", "b": 12, "tipo": "vf", "origen": "nueva", "pregunta": "Quien fabrica y distribuye un programa destinado a causar daños puede responder penalmente aunque no haya sido él quien lo ejecutó en la máquina de la víctima.", "opciones": ["Verdadero", "Falso"], "correctas": [0], "explicacion": "Verdadero. El art. 183, 2º párrafo, castiga dos momentos distintos: el daño en sí (alterar, destruir o inutilizar datos, programas o sistemas) y hacer circular (vender, distribuir, hacer circular o introducir en un sistema un programa destinado a causar daños). Por eso el PPT concluye que quien fabrica y reparte malware ya puede responder penalmente aunque no lo haya ejecutado en la máquina de la víctima.", "ref": "u12-dano-183"}, {"id": "m13-q1", "b": 13, "tipo": "simple", "origen": "quiz", "pregunta": "¿Cuál es el objeto de la Ley 25.326 de protección de datos personales?", "opciones": ["Obligar al responsable o usuario a adoptar medidas técnicas y organizativas que garanticen la seguridad y confidencialidad de los datos y eviten su adulteración, pérdida o consulta no autorizada.", "La protección integral de los datos personales asentados en archivos, registros, bancos de datos u otros medios técnicos de tratamiento, públicos o privados destinados a dar informes, para garantizar el honor, la intimidad y el acceso a la información que sobre las personas se registre.", "Regular la acción que permite a toda persona tomar conocimiento de los datos a ella referidos y de su finalidad, y exigir su supresión, rectificación, confidencialidad o actualización en caso de falsedad o discriminación ante un juez.", "Proteger la selección y la organización originales de las bases de datos como obra de quien las construyó, para que terceros no puedan copiarlas ni explotarlas sin autorización."], "correctas": [1], "explicacion": "El objeto (art. 1, textual del PPT y del quiz) es la protección integral de los datos personales asentados en archivos, registros o bancos públicos o privados destinados a dar informes, para garantizar honor, intimidad y acceso a la información, conforme al art. 43 CN. No es la descripción del hábeas data: esa es la garantía del art. 43 CN que la ley reglamenta, no su objeto. No es proteger la base como obra: eso lo hace la Ley 11.723 sobre la selección y organización. No es el deber de seguridad: es una obligación puntual del art. 9, no el objeto de toda la ley.", "ref": "u13-objeto-ley"}, {"id": "m13-q2", "b": 13, "tipo": "simple", "origen": "quiz", "pregunta": "¿Qué significa que un archivo o banco de datos esté «destinado a proveer informes»?", "opciones": ["Que pertenece a un organismo del Estado y sus datos se recaban para el ejercicio de funciones propias de los poderes del Estado o por una obligación legal.", "Que se crea con el propósito de generar información y descripciones sobre personas, ya sea para uso interno de una organización o para compartirla con terceros.", "Que solo contiene datos disociados, que no pueden asociarse a persona determinada o determinable, y por eso pueden cederse a terceros sin pedir el consentimiento.", "Que cualquier persona puede consultarlo ante la AAIP en forma pública y gratuita para saber qué bases existen, para qué y quién es el responsable de cada una."], "correctas": [1], "explicacion": "Según el PPT, estar destinado a dar informes significa que el archivo se crea para generar información y descripciones sobre personas, para uso interno o para compartir con terceros; por eso la ley exige inscribirlo en el Registro. No es el derecho de información del art. 13, que es la consulta pública y gratuita ante la AAIP. No son datos disociados: la disociación impide asociar la información a una persona, justo lo opuesto a describir personas. No es una base estatal: las públicas se inscriben siempre; el destino a informes es el criterio para las privadas.", "ref": "u13-destinados-informes"}, {"id": "m13-q3", "b": 13, "tipo": "simple", "origen": "quiz", "pregunta": "¿Qué es un dato personal según el PPT?", "opciones": ["Información que revela origen racial y étnico, opiniones políticas, convicciones religiosas o información sobre la salud.", "Información de cualquier tipo referida a personas humanas o jurídicas determinadas o determinables.", "El antecedente necesario para llegar al conocimiento exacto de una cosa, sea referido o no a una persona.", "Información referida únicamente a personas humanas que figuren identificadas con su nombre completo y su número de DNI en la base."], "correctas": [1], "explicacion": "Dato personal es información de cualquier tipo referida a personas humanas o jurídicas determinadas o determinables (art. 2). No se limita a personas humanas identificadas con nombre y DNI: alcanza a las jurídicas y basta con que sean determinables (un legajo, una IP o una patente pueden identificar a alguien). No es la definición genérica de dato, que es el antecedente para conocer una cosa. No es la definición de dato sensible, que es solo una categoría especial dentro de los datos personales con protección reforzada.", "ref": "u13-dato-personal"}, {"id": "m13-q4", "b": 13, "tipo": "simple", "origen": "quiz", "pregunta": "¿Qué es un dato sensible según el PPT?", "opciones": ["Los factores que verifican la identidad de un usuario: algo que sabe, algo que tiene y algo que es.", "Los listados limitados a nombre, DNI, CUIT/CUIL, ocupación, fecha de nacimiento y domicilio de una persona.", "Los datos personales que revelan origen racial y étnico, opiniones políticas, convicciones religiosas, filosóficas o morales, afiliación sindical e información sobre la salud o la vida sexual.", "Los datos personales obtenidos de fuentes de acceso público irrestricto, cuyo tratamiento no requiere el consentimiento del titular."], "correctas": [2], "explicacion": "Los datos sensibles son los que revelan origen racial y étnico, opiniones políticas, convicciones religiosas, filosóficas o morales, afiliación sindical e información sobre la salud o la vida sexual; nadie puede ser obligado a darlos. No son los de fuentes de acceso público irrestricto: esa es una excepción al consentimiento. No son los listados de nombre, DNI y domicilio: son datos comunes y otra excepción al consentimiento. No son los factores del MFA: eso es una medida de seguridad, aunque use huella o rostro.", "ref": "u13-dato-sensible"}, {"id": "m13-q5", "b": 13, "tipo": "simple", "origen": "quiz", "pregunta": "¿Qué es la disociación de datos?", "opciones": ["El cifrado de los datos guardados en un servidor, disco duro o backup para que nadie pueda leerlos sin la clave de descifrado.", "El bloqueo del dato mientras el responsable verifica un pedido de rectificación, o la indicación de que está sometido a revisión.", "Todo tratamiento de datos personales de manera que la información obtenida no pueda asociarse a persona determinada o determinable.", "La cesión de datos personales a un tercero para fines relacionados con el interés legítimo de quien cede y de quien recibe."], "correctas": [2], "explicacion": "La disociación es todo tratamiento de datos personales de manera que la información obtenida no pueda asociarse a persona determinada o determinable (definición textual del PPT y del quiz); en el material, es básicamente anonimizar. No es el bloqueo durante la verificación: eso es una regla del art. 16 para la rectificación. No es la cesión: ceder es entregar datos a un tercero, que siguen siendo identificables. No es el cifrado en reposo: el dato cifrado se recupera completo con la clave, el disociado ya no identifica a nadie.", "ref": "u13-disociacion"}, {"id": "m13-01", "b": 13, "tipo": "simple", "origen": "nueva", "pregunta": "Una startup tucumana arma el registro de su app de delivery y pide nombre, domicilio, teléfono, grupo sanguíneo y religión. ¿Qué principio viola, en primer lugar, al pedir los dos últimos?", "opciones": ["Prohibición de transferencia internacional: los datos podrían terminar en servidores ubicados en otro país.", "Calidad de los datos: no son adecuados ni pertinentes y son excesivos para la finalidad.", "Información al titular: no informó previamente la identidad y el domicilio del responsable de la base de datos.", "Seguridad de los datos: no adoptó medidas técnicas y organizativas para cifrarlos ni controlar quién accede a ellos."], "correctas": [1], "explicacion": "Grupo sanguíneo y religión no tienen sentido para entregar un pedido: violan la calidad de los datos (adecuados, pertinentes y no excesivos, art. 4); el material usa este mismo ejemplo para el principio de pertinencia. No es seguridad: el caso no dice nada sobre cifrado o accesos. No es información al titular: el enunciado no dice que se omitiera informar al responsable. No es transferencia internacional: no hay ningún dato sobre servidores en el exterior. Ojo: además son datos sensibles que nadie puede ser obligado a dar.", "ref": "u13-calidad"}, {"id": "m13-02", "b": 13, "tipo": "simple", "origen": "nueva", "pregunta": "Según el PPT, ¿cómo debe ser el consentimiento del titular para que el tratamiento de sus datos sea lícito?", "opciones": ["Cierto, adecuado y pertinente, y no excesivo en relación con la finalidad para la que se obtuvieron los datos.", "Previo y gratuito, y renovado por el titular cada seis meses ante el responsable de la base.", "Libre, expreso e informado, y debe constar por escrito o por otro medio que se permita.", "Leal, con finalidad específica y nunca obtenido por medios desleales, fraudulentos o contrarios a la ley."], "correctas": [2], "explicacion": "El PPT dice que el tratamiento es ilícito cuando el titular no prestó consentimiento libre, expreso e informado, que debe constar por escrito u otro medio permitido (art. 5). No es «cierto, adecuado, pertinente y no excesivo»: esos son los caracteres de los datos según el principio de calidad. No es «leal y con finalidad específica»: así debe ser la recolección. No es «gratuito cada seis meses»: eso corresponde al derecho de acceso, que es gratis cada 6 meses, no a una renovación del consentimiento.", "ref": "u13-consentimiento"}, {"id": "m13-03", "b": 13, "tipo": "simple", "origen": "nueva", "pregunta": "Una consultora arma un listado de profesionales con nombre, DNI, ocupación, fecha de nacimiento y domicilio. Según el PPT, ¿necesita el consentimiento de cada uno?", "opciones": ["No, porque los listados limitados a esos datos son uno de los casos en que el consentimiento no es necesario.", "No, porque las bases privadas no están alcanzadas por la ley salvo que traten datos de salud.", "Sí, porque el DNI es un dato sensible y ninguna persona puede ser obligada a proporcionarlo.", "Sí, porque solo se exceptúan del consentimiento los datos recabados por los poderes del Estado."], "correctas": [0], "explicacion": "El PPT enumera como excepción al consentimiento los listados limitados a nombre, DNI, CUIT/CUIL, ocupación, fecha de nacimiento y domicilio (inciso c). No es correcto que el DNI sea sensible: sensibles son origen racial, opiniones políticas, religión, afiliación sindical, salud y vida sexual. Tampoco es cierto que solo se exceptúe al Estado: hay cinco excepciones (fuentes públicas, Estado u obligación legal, listados, relación contractual y entidades financieras). Y las bases privadas sí están alcanzadas, sobre todo las destinadas a dar informes.", "ref": "u13-consentimiento"}, {"id": "m13-04", "b": 13, "tipo": "simple", "origen": "nueva", "pregunta": "Una persona le pide a una fintech que le muestre qué datos suyos tiene en su base (derecho de acceso). Según el PPT, ¿en qué plazo debe responder?", "opciones": ["10 días corridos para responder.", "20 días hábiles.", "6 meses.", "Cinco días hábiles."], "correctas": [0], "explicacion": "El derecho de acceso (art. 14) tiene un plazo de respuesta de 10 días corridos, y es gratis cada 6 meses o antes si hay interés legítimo. Los cinco días hábiles son el plazo para rectificar, actualizar o suprimir (art. 16), no para dar acceso. Los 20 días hábiles corresponden a otra cosa: es el plazo para pagar una multa de la AAIP con 50% de reducción según la Res. 126/2024. Los 6 meses no son un plazo de respuesta sino la periodicidad con que el acceso es gratuito.", "ref": "u13-derechos-titular"}, {"id": "m13-05", "b": 13, "tipo": "simple", "origen": "nueva", "pregunta": "Una clínica recibe el reclamo de un paciente para que corrija un dato erróneo de su historia. ¿Qué plazo máximo tiene y qué pasa si no cumple?", "opciones": ["Cinco días hábiles; si no cumple, el paciente queda habilitado para promover la acción de hábeas data.", "Cinco días hábiles; si no cumple, el dato erróneo se considera suprimido de pleno derecho.", "Veinte días hábiles; si no cumple, se reduce a la mitad cualquier multa que le corresponda.", "Diez días corridos; si no cumple, la AAIP cancela automáticamente la base de datos de la clínica."], "correctas": [0], "explicacion": "El art. 16 (PPT) obliga al responsable a rectificar, suprimir o actualizar en un plazo máximo de cinco días hábiles de recibido el reclamo, y el incumplimiento habilita al interesado a promover la acción de hábeas data. Los diez días corridos son del derecho de acceso y la cancelación no es automática: es una sanción que aplica la AAIP. El dato no se suprime de pleno derecho; mientras se verifica, se bloquea o se informa que está en revisión. Los veinte días hábiles y la reducción del 50% son del pago de multas (Res. AAIP 126/2024).", "ref": "u13-rectificacion-supresion"}, {"id": "m13-06", "b": 13, "tipo": "simple", "origen": "nueva", "pregunta": "Un centro odontológico tiene una base con los datos de sus pacientes, desarrollada por una consultora externa. Según el PPT, ¿quién es el responsable del archivo?", "opciones": ["El centro odontológico, como persona de existencia ideal que es titular de la base de datos.", "La consultora, porque diseñó la estructura de la base y por eso la base le pertenece a ella.", "Cada paciente, porque es la persona cuyos datos son objeto del tratamiento que regula la ley.", "La AAIP, porque es el organismo que lleva el registro de las bases de datos y recibe reclamos."], "correctas": [0], "explicacion": "Responsable es la persona física o de existencia ideal, pública o privada, titular de un archivo, registro, base o banco de datos: acá, el centro. El paciente es el titular de los datos, no de la base; el material advierte que son conceptos opuestos. La AAIP es la autoridad de control que lleva el registro, no responsable de cada base inscripta. La consultora trata los datos por cuenta del centro (encargado, según el material); haber diseñado la base no la hace responsable ni dueña de los datos.", "ref": "u13-titular-usuario-responsable"}, {"id": "m13-07", "b": 13, "tipo": "simple", "origen": "nueva", "pregunta": "Según el PPT, ¿qué es el «tratamiento de datos»?", "opciones": ["Medidas técnicas y organizativas que garanticen la seguridad y la confidencialidad de los datos personales.", "Todo procedimiento sobre datos personales de manera que la información obtenida no pueda asociarse a persona determinada o determinable.", "Conjunto organizado de datos personales que sean objeto de tratamiento o procesamiento, cualquiera que fuere la modalidad de su formación, almacenamiento, organización o acceso.", "Operaciones y procedimientos sistemáticos que permitan la recolección, conservación, ordenación, almacenamiento y en general el procesamiento de datos, así como su cesión a terceros."], "correctas": [3], "explicacion": "Tratamiento son las operaciones y procedimientos sistemáticos de recolección, conservación, ordenación, almacenamiento y procesamiento, incluida la cesión a terceros: es la actividad. El conjunto organizado de datos es la definición de archivo, registro, banco o base de datos: es la cosa sobre la que se hace el tratamiento. El procedimiento que impide asociar la información a una persona es la disociación, que es una clase de tratamiento. Las medidas técnicas y organizativas corresponden al deber de seguridad, no a la definición de tratamiento.", "ref": "u13-archivo-tratamiento"}, {"id": "m13-08", "b": 13, "tipo": "simple", "origen": "nueva", "pregunta": "Para entrar a su homebanking, Lucía pone usuario y clave y después un código que le llega por SMS. ¿Qué medida de seguridad del PPT es esa?", "opciones": ["Cifrado en tránsito mediante HTTPS y TLS.", "MFA o autenticación multifactor.", "Monitoreo en tiempo real.", "Backups verificados."], "correctas": [1], "explicacion": "Es MFA: combina dos factores distintos, algo que sabés (usuario y clave) y algo que tenés (el celular que recibe el código); el PPT usa este mismo ejemplo. No es cifrado en tránsito, que protege los datos mientras viajan (HTTPS, TLS, VPN) y no verifica identidad. No es monitoreo, que vigila en tiempo real la actividad y alerta ante algo raro. No son backups verificados, que consisten en probar que las copias de seguridad funcionan y se pueden restaurar.", "ref": "u13-control-accesos-mfa"}, {"id": "m13-09", "b": 13, "tipo": "simple", "origen": "nueva", "pregunta": "Revisando los registros del sistema al cierre del mes, el área de sistemas descubre que un usuario de RRHH abrió 500 legajos en un solo día. ¿Qué herramienta del PPT permitió detectarlo?", "opciones": ["Auditoría de logs.", "Monitoreo en tiempo real.", "Cifrado en reposo.", "Control de accesos por roles."], "correctas": [0], "explicacion": "Es auditoría de logs: revisar a posteriori los registros automáticos de actividad (quién entró, qué hizo) para detectar irregularidades; el PPT trae este mismo ejemplo de los 500 legajos. No es monitoreo, porque el monitoreo avisa en el momento, no al revisar el mes. No es cifrado en reposo, que protege datos almacenados de quien no tiene la clave, pero no detecta abusos de un usuario habilitado. No es control de accesos: ese mecanismo limita quién entra, pero acá el usuario tenía permiso y el abuso se detectó después.", "ref": "u13-logs-monitoreo"}, {"id": "m13-10", "b": 13, "tipo": "simple", "origen": "nueva", "pregunta": "Según el PPT, ¿quiénes pueden llevar registros de sus miembros aunque contengan datos sensibles?", "opciones": ["Las empresas privadas destinadas a dar informes, siempre que estén inscriptas en el Registro.", "Las asociaciones religiosas y las organizaciones políticas y sindicales.", "Los organismos del Estado que recaben datos en virtud de una obligación legal.", "Las entidades financieras, en las operaciones que realicen con sus clientes."], "correctas": [1], "explicacion": "La regla es que nadie puede ser obligado a dar datos sensibles; el PPT exceptúa las razones de interés general autorizadas por ley, la finalidad estadística o científica, y que asociaciones religiosas y organizaciones políticas y sindicales lleven registros de sus miembros. Las entidades financieras aparecen como excepción al consentimien
