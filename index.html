<style>

    --accent: #86A6FF; --accent-ink: #0E1320; --ok: #6BD49A; --ok-bg: #173826; --bad: #FF8B97; --bad-bg: #3E1C22;
    --warn: #F2BE68; --warn-bg: #3A2C12; --hl-s: 70%; --hl-l: 42%; --hl-a: .55; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11151D; --surface: #191F2B; --sunk: #222938; --ink: #E8EBF1; --ink-2: #A0A9BA; --rule: #2C3444;
  --accent: #86A6FF; --accent-ink: #0E1320; --ok: #6BD49A; --ok-bg: #173826; --bad: #FF8B97; --bad-bg: #3E1C22;
  --warn: #F2BE68; --warn-bg: #3A2C12; --hl-s: 70%; --hl-l: 42%; --hl-a: .55; color-scheme: dark;
}

[data-b="13"]{--hl-h:204} [data-b="14"]{--hl-h:268} [data-b="15"]{--hl-h:18} [data-b="17"]{--hl-h:176}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 1rem; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 48rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--rule); }
.top .row { display: flex; align-items: center; gap: 12px; padding-block: 10px 6px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 800; font-stretch: 78%; font-size: 1.25rem; letter-spacing: .01em; line-height: 1.1; }
.brand small { display: block; font-family: var(--f-body); font-weight: 400; font-stretch: 100%; font-size: .78rem; color: var(--ink-2); letter-spacing: 0; }
.count { margin-left: auto; text-align: right; font-size: .8rem; color: var(--ink-2); line-height: 1.25; }
.count b { display: block; font-family: var(--f-display); font-stretch: 80%; font-size: 1.15rem; color: var(--ink); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-inline: -4px; padding-bottom: 2px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: none; padding: 8px 10px 9px; font-family: var(--f-display); font-weight: 600; font-stretch: 85%; font-size: .98rem; color: var(--ink-2); border-bottom: 3px solid transparent; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; padding-block: 12px 4px; }
.chip { border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: .86rem; line-height: 1.3; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip.b[aria-pressed="true"] { background: hsl(var(--hl-h) var(--hl-s) var(--hl-l) / 1); color: #121212; border-color: transparent; }
.sep { width: 1px; height: 22px; background: var(--rule); }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: .86rem; color: var(--ink-2); }
.toggle input { accent-color: var(--accent); width: 16px; height: 16px; }

main { padding-block: 8px 64px; }
section[data-tab] { display: grid; gap: 18px; }
h2 { font-family: var(--f-display); font-weight: 750; font-stretch: 80%; font-size: 1.6rem; line-height: 1.15; margin: 10px 0 0; text-wrap: balance; }
h3 { font-family: var(--f-display); font-weight: 700; font-stretch: 85%; font-size: 1.15rem; margin: 0; text-wrap: balance; }
h4 { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); margin: 0; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--ink-2); }
.small { font-size: .86rem; }
.lead { color: var(--ink-2); max-width: 40rem; }

.hl { background: linear-gradient(100deg, transparent 0 2%, hsl(var(--hl-h, 52) var(--hl-s) var(--hl-l) / var(--hl-a)) 3% 97%, transparent 98%) 0 60% / 100% 62% no-repeat; padding: 0 .12em; border-radius: 2px; color: inherit; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.bt { display: inline-block; font-family: var(--f-mono); font-size: .72rem; font-weight: 600; padding: 1px 7px; border-radius: 4px; background: hsl(var(--hl-h) var(--hl-s) var(--hl-l) / var(--hl-a)); color: var(--ink); vertical-align: 1px; }
.badge { display: inline-block; font-size: .72rem; font-weight: 700; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--rule); color: var(--ink-2); white-space: nowrap; }
.badge.star { border-color: transparent; background: var(--warn-bg); color: var(--warn); }
.art { font-family: var(--f-mono); font-size: .78rem; background: var(--sunk); padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
.alerta { border-left: 3px solid var(--warn); background: var(--warn-bg); padding: 8px 12px; border-radius: 0 6px 6px 0; font-size: .9rem; }
.alerta b { color: var(--warn); }

.btn { border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-weight: 700; font-size: .92rem; }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ok { background: var(--ok); color: var(--surface); border-color: var(--ok); }
.btn.bad { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.btn:disabled { opacity: .45; cursor: default; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }

/* entries (glosario) */
.entry { display: grid; gap: 6px; padding-block: 14px; border-top: 1px solid var(--rule); min-width: 0; }
.entry .head { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: baseline; }
.entry .term { font-family: var(--f-display); font-weight: 700; font-stretch: 88%; font-size: 1.12rem; }
.entry .def { max-width: 44rem; }
.entry ul, .card ul { margin: 2px 0 0; padding-left: 1.2em; display: grid; gap: 3px; }
.entry .ej { font-size: .9rem; color: var(--ink-2); }
.entry .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .78rem; color: var(--ink-2); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--rule); }
.dot.s { background: var(--ok); } .dot.r { background: var(--bad); }
.secc { font-family: var(--f-display); font-stretch: 85%; font-weight: 650; font-size: 1rem; color: var(--ink-2); margin-top: 18px; }
.bhead { display: flex; align-items: baseline; gap: 10px; margin-top: 22px; }
.bhead .num { font-family: var(--f-display); font-weight: 800; font-stretch: 70%; font-size: 2.2rem; line-height: 1; }

.search { width: 100%; border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; padding: 10px 12px; font-size: 1rem; }

/* plan */
.days { display: grid; gap: 14px; }
.day { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; }
.day.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.day .dh { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.day .dh .tag { font-size: .75rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .08em; }
.block { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: start; padding-block: 8px; border-top: 1px dashed var(--rule); }
.block:first-of-type { border-top: 0; }
.block input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--ok); }
.block .bt-row { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; }
.block .bt-row button { font-size: .8rem; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--rule); background: var(--paper); }
.block.done .bl-title { text-decoration: line-through; color: var(--ink-2); }
.howto { background: var(--sunk); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 8px; }
.howto ol { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; }
.prog { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 8px; }
.pbox { border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; background: var(--surface); display: grid; gap: 4px; font-size: .82rem; }
.bar { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); }

/* punteros */
.deckbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 22px 20px; min-height: 52vh; display: flex; flex-direction: column; gap: 14px; cursor: pointer; user-select: none; -webkit-user-select: none; }
.card .q { font-family: var(--f-display); font-weight: 750; font-stretch: 82%; font-size: clamp(1.5rem, 6vw, 2.1rem); line-height: 1.15; text-wrap: balance; }
.card .tapto { margin-top: auto; color: var(--ink-2); font-size: .88rem; }
.card .ans { display: grid; gap: 10px; font-size: 1.1rem; line-height: 1.5; }
.card .ans ul { font-size: 1.04rem; }
.cardbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cardbtns .btn { padding: 14px; font-size: 1.05rem; }
.cnt { font-family: var(--f-mono); font-size: .85rem; color: var(--ink-2); }

/* MC */
.qbox { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 18px; display: grid; gap: 14px; }
.qbox .qt { font-size: 1.12rem; font-weight: 700; line-height: 1.4; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1.5px solid var(--rule); background: var(--paper); border-radius: 10px; padding: 11px 14px; display: flex; gap: 10px; align-items: flex-start; line-height: 1.4; }
.opt .mk { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ink-2); display: grid; place-items: center; font-size: .75rem; margin-top: 1px; }
.opt.multi .mk { border-radius: 5px; }
.opt[aria-pressed="true"] { border-color: var(--accent); }
.opt[aria-pressed="true"] .mk { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt.right { border-color: var(--ok); background: var(--ok-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.expl { border-radius: 10px; padding: 12px 14px; font-size: .95rem; display: grid; gap: 6px; }
.expl.ok { background: var(--ok-bg); } .expl.no { background: var(--bad-bg); }
.expl b.v { font-size: 1rem; }
.setup { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.score { font-family: var(--f-display); font-weight: 800; font-stretch: 75%; font-size: 3rem; line-height: 1; }

/* casos */
.caso { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); }

.caso .cbody { padding: 0 16px 16px; display: grid; gap: 14px; }
.pie { border-left: 3px solid var(--ink); padding: 4px 0 4px 14px; font-style: italic; max-width: 44rem; }
.cq { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--rule); }
.cq textarea { width: 100%; min-height: 84px; border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; background: var(--paper); resize: vertical; font-size: .95rem; }
.reveal { border-radius: 8px; background: var(--sunk); padding: 10px 12px; display: grid; gap: 6px; }
.concepts { display: flex; flex-wrap: wrap; gap: 6px; }
.concepts button { border: 0; padding: 2px 9px; border-radius: 4px; font-size: .82rem; background: hsl(var(--hl-h, 52) var(--hl-s) var(--hl-l) / var(--hl-a)); }

.punto { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; }
.punto ol { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 12px; }
.punto li > p:first-child { font-weight: 700; }
.lbl { font-family: var(--f-mono); font-weight: 600; margin-right: 6px; }

.bgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.btile { text-align: left; border: 1px solid var(--rule); background: var(--surface); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 6px; }
.btile .n { font-family: var(--f-display); font-weight: 800; font-stretch: 70%; font-size: 1.9rem; line-height: 1; }
.tbl { overflow-x: auto; }
.tbl table { border-collapse: collapse; width: 100%; font-size: .88rem; }
.tbl th, .tbl td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.st { font-size: .72rem; font-weight: 700; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
.st.cubierto { background: var(--ok-bg); color: var(--ok); }
.st.solo_material { background: var(--warn-bg); color: var(--warn); }
.st.sin_fuente { background: var(--sunk); color: var(--ink-2); }
.foot { font-size: .82rem; color: var(--ink-2); border-top: 1px solid var(--rule); padding-top: 14px; display: grid; gap: 6px; }
.empty { padding: 24px 16px; text-align: center; color: var(--ink-2); border: 1px dashed var(--rule); border-radius: var(--r); }
@media (prefers-reduced-motion: no-preference) { .card, .opt { transition: border-color .15s, background-color .15s; } }
</style>

Profesión", "Ley 7490 y Colegio", "Ética profesional"], "programa": [{"item": "Programa oficial de la Bolilla 19: no encontrado en las fuentes.", "estado": "sin_fuente", "ids": []}, {"item": "Honorarios (slides 22-27 del PPT, imágenes sin texto; remiten a colegioinfotuc.com.ar)", "estado": "sin_fuente", "ids": []}], "notas": "Cobertura liviana: solo glosario, sin MC ni casos. Sin material de lectura ni quiz de B19: evidencia vacía. Los slides 3 (Tipos de profesión) y 22-27 (Honorarios) son imágenes sin texto extraíble; tipos se cubre con los slides 4-7; honorarios queda sin fuente textual (no se inventan montos ni tablas)."}], "entradas": [{"id": "u8-derecho-intelectual", "seccion": "Producción intelectual y mapa de la propiedad intelectual", "termino": "Derecho intelectual (base constitucional)", "pregunta": "¿Qué es el derecho intelectual? ¿Dónde está su base?", "definicion": "Art. 17 CN: «Todo autor o inventor es propietario exclusivo de su obra, invento o descubrimiento, por el término que le acuerde la ley.»", "lista": {"titulo": "Las dos ideas del art. 17", "items": ["Derecho exclusivo: el creador puede impedir que otros usen su creación sin permiso.", "Derecho temporal: dura lo que fija la ley. Después, la obra pasa a ser de todos."]}, "ejemplo": null, "articulos": ["Art. 17 CN"], "fuente": "PPT+material", "ubicacion": "PPT slide 5; material §1 p. 2", "alerta": null, "evidencia": ["quiz8", "parcial2018"], "agregado": false, "b": 8, "nucleo": true}, {"id": "u8-produccion-intelectual", "seccion": "Producción intelectual y mapa de la propiedad intelectual", "termino": "Producción intelectual", "pregunta": "¿Qué es la producción intelectual?", "definicion": "Conjunto de creaciones que nacen del trabajo de la mente humana. Su valor no está en el soporte material (papel, disco, pendrive) sino en la creación misma, que puede copiarse infinitas veces sin desgastarse; por eso el derecho las trata como bienes inmateriales y les da una protección especial.", "lista": null, "ejemplo": "Una novela, una canción, una fotografía, un invento, el plano de un puente o un sistema informático.", "articulos": [], "fuente": "material", "ubicacion": "material §1 p. 2 (el PPT solo titula la sección «Qué es, por qué se protege»)", "alerta": "El PPT no define producción intelectual: solo el art. 17 CN. Definición tomada del material.", "evidencia": [], "agregado": false, "b": 8, "nucleo": false}, {"id": "u8-herramientas", "seccion": "Producción intelectual y mapa de la propiedad intelectual", "termino": "Herramientas de la propiedad intelectual (mapa)", "pregunta": "¿Qué protege cada herramienta de la propiedad intelectual?", "definicion": "Bajo «propiedad intelectual» conviven varias herramientas, cada una con su norma, lo que protege y su régimen de registro y duración.", "lista": {"titulo": "Herramienta: norma · qué protege · registro y duración", "items": ["Derecho de autor: Ley 11.723 · la expresión de una obra: texto, plano, programa · nace con la creación; registro en DNDA; vida del autor + 70 años.", "Patente de invención: Ley 24.481 · invención nueva, inventiva y con aplicación industrial · solo con registro en INPI; 20 años.", "Modelo de utilidad: Ley 24.481 · mejora práctica en la forma de un objeto · INPI; 10 años.", "Diseño industrial: Dto.-Ley 6673/63 · forma o apariencia estética de un producto · INPI; 5 años, renovable hasta 15.", "Marca: Ley 22.362 · signo que distingue productos o servicios · INPI; 10 años, renovable sin límite.", "Secreto comercial: Ley 24.766 · información valiosa que se mantiene en reserva · sin registro; mientras siga siendo secreta."]}, "ejemplo": null, "articulos": ["Ley 11.723", "Ley 24.481", "Dto.-Ley 6673/63", "Ley 22.362", "Ley 24.766"], "fuente": "PPT", "ubicacion": "PPT slide 6; material §1 p. 3", "alerta": "PPT: modelo de utilidad = «mejora práctica en la forma de un objeto»; material: «de una herramienta u objeto». Diferencia de redacción, no de fondo.", "evidencia": ["quiz8"], "agregado": false, "b": 8, "nucleo": true}, {"id": "u8-historia-software", "seccion": "Ley 11.723: qué protege", "termino": "Cómo llegó el software a la ley", "pregunta": "¿Cómo se incorporó el software a la Ley 11.723?", "definicion": "1933 Ley 11.723 de Propiedad Intelectual · 1967 Argentina adhiere al Convenio de Berna (Ley 17.251) · 1994 Decreto 165/94 (software y bases de datos) · 1997 caso Autodesk: la CSJN dice que copiar software no era delito · 1998 Ley 25.036 incorpora el software al art. 1 · 2024 Decreto 972/2024: nuevo régimen del depósito de inéditas.", "lista": {"titulo": "Por qué importa 1997", "items": ["Principio de legalidad penal (art. 18 CN): no se podía extender el delito por analogía.", "El Congreso reaccionó con la Ley 25.036.", "El ADPIC (art. 10) ya protegía los programas como obras literarias."]}, "ejemplo": null, "articulos": ["Ley 11.723", "Ley 25.036", "Decreto 165/94", "Decreto 972/2024", "Art. 18 CN", "Ley 17.251"], "fuente": "PPT+material", "ubicacion": "PPT slide 8; material §2 p. 4 (nota 1: CSJN «Pellicori», 23/12/1997)", "alerta": null, "evidencia": [], "agregado": false, "b": 8, "nucleo": false}, {"id": "u8-obras-protegidas", "seccion": "Ley 11.723: qué protege", "termino": "Obras protegidas por la Ley 11.723", "pregunta": "¿Qué obras protege la ley?", "definicion": "Art. 1 Ley 11.723 (texto según Ley 25.036). La lista es abierta: «…en fin, toda producción científica, literaria, artística o didáctica, sea cual fuere el procedimiento de reproducción.»", "lista": {"titulo": "Obras protegidas (art. 1)", "items": ["Programas de computación fuente y objeto", "Compilaciones de datos (bases de datos)", "Planos, mapas y obras de arquitectura", "Obras de arte o ciencia aplicadas a la industria", "Escritos de toda naturaleza y extensión", "Fotografías, música y obras cinematográficas"]}, "ejemplo": null, "articulos": ["Art. 1 Ley 11.723", "Ley 25.036"], "fuente": "PPT", "ubicacion": "PPT slide 9; material §2 p. 4", "alerta": null, "evidencia": ["quiz8", "tp7"], "agregado": false, "b": 8, "nucleo": true}, {"id": "u8-idea-expresion", "seccion": "Ley 11.723: qué protege", "termino": "Idea vs. expresión", "pregunta": "¿Qué no protege el derecho de autor? ¿Se protege la idea?", "definicion": "Se protege la expresión, no la idea (art. 1, último párrafo Ley 11.723). Programar desde cero algo que hace lo mismo no es copiar. Copiar el código y cambiar nombres de variables, sí.", "lista": {"titulo": "No se protege vs. sí se protege", "items": ["No: la idea de una app para pedir comida · Sí: el código concreto que implementa la idea.", "No: un algoritmo de ordenamiento en sí · Sí: la documentación y los diagramas.", "No: la función «deslizar para ver el próximo perfil» · Sí: el diseño de las pantallas.", "No: la idea de sacar una foto en la playa · Sí: la estructura de la base de datos; la foto concreta que sacaste."]}, "ejemplo": "Material: la idea de fotografiar una puesta de sol no se protege; la foto concreta que tomó el fotógrafo sí.", "articulos": ["Art. 1 Ley 11.723"], "fuente": "PPT+material", "ubicacion": "PPT slide 10; material §2 p. 4-5", "alerta": null, "evidencia": ["quiz8", "tp7"], "agregado": false, "b": 8, "nucleo": true}, {"id": "u8-obras-ingenieria", "seccion": "Ley 11.723: qué protege", "termino": "Aplicación a las obras de ingeniería", "pregunta": "¿Cómo se aplica la Ley 11.723 a las obras de ingeniería?", "definicion": "El art. 1 menciona planos, mapas y obras de arquitectura y obras de ciencia aplicadas a la industria. Se protege la expresión: el plano de un puente está protegido como plano; la solución técnica que incorpora no se protege por derecho de autor (podrá patentarse si reúne los requisitos). Quien encarga un proyecto paga para usarlo en el fin pedido, pero no se vuelve titular de los derechos si el contrato no dice otra cosa.", "lista": {"titulo": "Obra protegida en un proyecto de ingeniería (material)", "items": ["Planos y croquis", "Memorias de cálculo y descriptivas", "Informes técnicos", "Maquetas", "El software que se desarrolla para el proyecto"]}, "ejemplo": null, "articulos": ["Art. 1 Ley 11.723"], "fuente": "PPT+material", "ubicacion": "PPT slides 7 y 9 (solo enumera planos/arquitectura); material §2 p. 5", "alerta": "El PPT solo menciona las obras de ingeniería en el título de la sección y en la lista del art. 1; el desarrollo es del material.", "evidencia": [], "agregado": false, "b": 8, "nucleo": false}, {"id": "u8-oracle-google", "seccion": "Ley 11.723: qué protege", "termino": "Oracle vs. Google y fair use", "pregunta": "¿Qué resolvió Oracle vs. Google y qué pasa en Argentina?", "definicion": "Google reimplementó en Android unas 11.500 líneas de «declaraciones» de la API de Java con código propio; la Corte Suprema de EE.UU. (6 a 2) resolvió que fue «fair use» (uso legítimo). En Argentina no hay una cláusula amplia de fair use: solo excepciones puntuales; la discusión sería si la forma de una API es expresión protegida o una idea/método de operación.", "lista": null, "ejemplo": null, "articulos": [], "fuente": "PPT", "ubicacion": "PPT slide 11 (Google v. Oracle, 593 U.S. 1 (2021))", "alerta": null, "evidencia": [], "agregado": false, "b": 8, "nucleo": false}, {"id": "u8-morales-patrimoniales", "seccion": "Alcance de los derechos: titulares, plazos y excepciones", "termino": "Derechos morales y patrimoniales", "pregunta": "¿Qué son los derechos morales y los patrimoniales del autor? ¿Cuáles se pueden ceder?", "definicion": "El derecho de autor es un conjunto de facultades. Los derechos morales protegen el vínculo personal entre el autor y su obra: no tienen contenido económico directo y no se pueden vender. Los derechos patrimoniales permiten explotar económicamente la obra y sí pueden transferirse.", "lista": {"titulo": "Morales vs. patrimoniales", "items": ["Contenido: morales: decidir si la obra se da a conocer o queda inédita, paternidad (que figure su nombre) e integridad (que no se la deforme); patrimoniales (art. 2): disponer, publicar, ejecutar, representar y exponer en público, enajenar, traducir, adaptar o autorizar su traducción y reproducir en cualquier forma.", "Transmisión: morales: no se venden; aunque el autor enajene la obra conserva el derecho a exigir fidelidad de texto y título y la mención de su nombre (art. 52); patrimoniales: se ceden total o parcialmente (art. 51), con cesión inscripta en el registro «sin cuyo requisito no tendrá validez» (art. 53), o se licencian (art. 55 bis).", "Duración: morales: según la doctrina acompañan a la obra aun después de vencidos los económicos; patrimoniales: los plazos de los arts. 5 y 34."]}, "ejemplo": null, "articulos": ["Art. 2 Ley 11.723", "Art. 51 Ley 11.723", "Art. 52 Ley 11.723", "Art. 53 Ley 11.723", "Art. 55 bis Ley 11.723", "Art. 6 bis Convenio de Berna"], "fuente": "material", "ubicacion": "material §3 p. 6-7; PPT slide 12 solo lo nombra en el título; PPT slide 14 cita «Arts. 51 y 53 (cesión inscripta)»", "alerta": "El PPT nombra «derechos morales y patrimoniales» en el título de la sección 03 pero no tiene slide que los desarrolle: todo sale del material.", "evidencia": ["tp7"], "agregado": false, "b": 8, "nucleo": false}, {"id": "u8-titulares", "seccion": "Alcance de los derechos: titulares, plazos y excepciones", "termino": "Titulares del derecho de propiedad intelectual", "pregunta": "¿Quiénes son titulares del derecho de propiedad intelectual?", "definicion": "Art. 4 Ley 11.723. Si el autor muere sin herederos y la herencia es vacante, los derechos pasan al Estado (art. 5).", "lista": {"titulo": "Titulares (art. 4)", "items": ["a) El autor de la obra.", "b) Sus herederos o derechohabientes.", "c) Quienes, con permiso del autor, la traducen, adaptan o modifican, sobre la nueva obra.", "d) Las personas físicas o jurídicas cuyos dependientes, contratados para programar, produjeron el software en sus funciones, salvo pacto en contrario."]}, "ejemplo": null, "articulos": ["Art. 4 Ley 11.723", "Art. 5 Ley 11.723"], "fuente": "PPT", "ubicacion": "PPT slide 13; material §3 p. 7", "alerta": null, "evidencia": ["tp7"], "agregado": false, "b": 8, "nucleo": true}, {"id": "u8-quien-es-codigo", "seccion": "Alcance de los derechos: titulares, plazos y excepciones", "termino": "¿De quién es el código? (casos de titularidad)", "pregunta": "¿De quién es el software hecho por un empleado, por un freelance o por un freelance con cesión?", "definicion": "El inc. d del art. 4 habla de dependientes, no de independientes. Cliente: pedir cesión · Dev: leerla.", "lista": {"titulo": "Situación: de quién es · por qué", "items": ["Empleada de una software factory programa en sus funciones: de la empresa, salvo pacto en contrario · art. 4 inc. d.", "Freelance desarrolla un sistema y el contrato no dice nada: del freelance; el cliente solo tiene el uso acordado · el inc. d habla de dependientes, no de independientes.", "Freelance que firmó una cláusula de cesión de derechos: del cliente, en los términos de la cesión · arts. 51 y 53 (cesión inscripta).", "Empleado que se va y se lleva «su» código a la competencia: sigue siendo del ex empleador · art. 4 inc. d, secreto comercial (Ley 24.766), deber de fidelidad (LCT)."]}, "ejemplo": null, "articulos": ["Art. 4 inc. d Ley 11.723", "Art. 51 Ley 11.723", "Art. 53 Ley 11.723", "Ley 24.766"], "fuente": "PPT", "ubicacion": "PPT slide 14; material §3 p. 7 (idea fuerza)", "alerta": null, "evidencia": ["tp7"], "agregado": false, "b": 8, "nucleo": false}, {"id": "u8-varios-autores", "seccion": "Alcance de los derechos: titulares, plazos y excepciones", "termino": "Obras con varios autores", "pregunta": "¿Qué pasa cuando una obra tiene varios autores?", "definicion": "Art. 16: los colaboradores tienen derechos iguales, salvo convenio. Art. 17: hay colaboración cuando la obra no se puede dividir sin alterar su naturaleza. Aportes separables: cada autor conserva su parte (en una canción, música y letra son dos obras).", "lista": null, "ejemplo": "En un repo: el módulo de pagos escrito solo por Ana, identificable, es aporte separable; el núcleo reescrito entre todos, imposible de separar, es obra en colaboración. Por eso los proyectos open source piden firmar un CLA (Contributor License Agreement) o un DCO.", "articulos": ["Art. 16 Ley 11.723", "Art. 17 Ley 11.723"], "fuente": "PPT", "ubicacion": "PPT slide 15; material §3 p. 8", "alerta": null, "evidencia": [], "agregado": false, "b": 8, "nucleo": false}, {"id": "u8-duracion", "seccion": "Alcance de los derechos: titulares, plazos y excepciones", "termino": "Duración de la protección", "pregunta": "¿Cuánto dura el derecho de autor?", "definicion": "70 años después de la muerte del autor. Regla general: toda la vida del autor y 70 años más, desde el 1 de enero siguiente a su muerte. Ojo: el plazo no depende del registro.", "lista": {"titulo": "Tipo de obra: plazo", "items": ["Obras en colaboración: 70 años desde la muerte del último coautor (art. 5).", "Interpretaciones y fonogramas: 70 años desde su publicación (art. 5 bis).", "Obras cinematográficas: 50 años desde la muerte del último colaborador (art. 34).", "Obras fotográficas: 20 años desde la primera publicación (art. 34)."]}, "ejemplo": null, "articulos": ["Art. 5 Ley 11.723", "Art. 5 bis Ley 11.723", "Art. 6 Ley 11.723", "Art. 34 Ley 11.723"], "fuente": "PPT", "ubicacion": "PPT slide 16; material §4 p. 8", "alerta": "PPT: fonogramas «70 años desde su publicación»; material: «desde el 1 de enero del año siguiente a su publicación». Precisión del material, no contradicción.", "evidencia": ["quiz8"], "agregado": false, "b": 8, "nucleo": true}, {"id": "u8-dominio-publico", "seccion": "Alcance de los derechos: titulares, plazos y excepciones", "termino": "Dominio público pagante", "pregunta": "¿Qué pasa cuando vence el plazo de protección?", "definicion": "Vencido el plazo, la obra pasa al dominio público, que en Argentina es «pagante» (Fondo Nacional de las Artes, Dto.-Ley 1224/58).", "lista": null, "ejemplo": null, "articulos": ["Dto.-Ley 1224/58"], "fuente": "PPT+material", "ubicacion": "PPT slide 16; material §4 p. 9 (gravamen al FNA; exceptúa usos culturales o didácticos gratuitos y textos de enseñanza primaria y secundaria)", "alerta": null, "evidencia": [], "agregado": false, "b": 8, "nucleo": false}, {"id": "u8-excepciones", "seccion": "Alcance de los derechos: titulares, plazos y excepciones", "termino": "Lo que se puede usar sin permiso (excepciones)", "pregunta": "¿Qué usos de una obra ajena admite la ley sin autorización?", "definicion": "A diferencia de EE.UU., no hay un fair use amplio: fuera de estas excepciones, usar una obra ajena requiere autorización (arts. 9, 10 y 36 Ley 11.723).", "lista": {"titulo": "Excepciones", "items": ["Derecho de cita: con fines didácticos o científicos, hasta 1.000 palabras u 8 compases, solo lo indispensable.", "Copia de salvaguardia: quien tiene licencia puede hacer una única copia de resguardo, identificada, solo para reemplazar el original.", "Accesibilidad: formatos accesibles (braille, audio) para personas con discapacidad visual o perceptiva (Ley 26.285)."]}, "ejemplo": null, "articulos": ["Art. 9 Ley 11.723", "Art. 10 Ley 11.723", "Art. 36 Ley 11.723", "Ley 26.285"], "fuente": "PPT", "ubicacion": "PPT slide 17; material §5 p. 9", "alerta": null, "evidencia": [], "agregado": false, "b": 8, "nucleo": true}, {"id": "u8-derecho-imagen", "seccion": "Alcance de los derechos: titulares, plazos y excepciones", "termino": "Derecho a la imagen (retrato fotográfico)", "pregunta": "¿Qué es el derecho a la imagen?", "definicion": "El art. 31 de la Ley 11.723 prohíbe poner en el comercio el retrato fotográfico de una persona sin su consentimiento expreso, y después de su muerte, sin el de su familia; ese consentimiento deja de ser necesario veinte años después de la muerte (art. 35). Hoy esta regla se complementa con el derecho a la imagen del art. 53 del Código Civil y Comercial.", "lista": {"titulo": "Claves", "items": ["Consentimiento expreso de la persona retratada.", "Fallecida: consentimiento de su familia.", "Pasados 20 años de la muerte, ya no hace falta (art. 35).", "La imagen es un derecho personalísimo: si se lesiona, el titular (o sus herederos) puede reclamar compensación dineraria (PPT/material B1, 1er parcial)."]}, "ejemplo": "Material: regla que interesa si desarrollan apps o sitios que usan fotos de personas.", "articulos": ["Art. 31 Ley 11.723", "Art. 35 Ley 11.723", "Art. 53 CCyC"], "fuente": "material", "ubicacion": "material §4 p. 8-9; no está en el PPT B8. Derechos personalísimos: PPT/material B1 (parciales_viejos.md)", "alerta": "No está en el PPT B8: sale del material. El texto del art. 53 CCyC no está transcripto en las fuentes.", "evidencia": ["parcial2023"], "agregado": false, "b": 8, "nucleo": false}, {"id": "u8-beneficios-registro", "seccion": "Registro y organismos", "termino": "Registro de la obra: necesidad y beneficios", "pregunta": "¿Hace falta registrar la obra? ¿Cuáles son los beneficios de registrarla?", "definicion": "El derecho nace con la creación (regla del Convenio de Berna, art. 5.2, del que Argentina es parte). Pero la ley argentina pide depósito: en las obras publicadas, la falta de inscripción suspende el derecho hasta que se inscribe (arts. 57 y 63). Registrar siempre conviene.", "lista": {"titulo": "Por qué registrar siempre conviene", "items": ["Fecha cierta: prueba oficial de que el código existía así, en esa fecha.", "Presunción de autoría: se presume autor quien figura en el certificado.", "Carga de la prueba: quien diga lo contrario tiene que probarlo.", "Elemento de comparación: sirve de base ante plagio o piratería."]}, "ejemplo": null, "articulos": ["Art. 5.2 Convenio de Berna", "Art. 57 Ley 11.723", "Art. 63 Ley 11.723"], "fuente": "PPT+material", "ubicacion": "PPT slide 19; material §6 p. 10 (el autor recupera el derecho en el acto mismo de inscribir)", "alerta": null, "evidencia": ["parcial2023", "tp7"], "agregado": false, "b": 8, "nucleo": true}, {"id": "u8-inedita-publicada", "seccion": "Registro y organismos", "termino": "Software inédito vs. publicado", "pregunta": "¿Qué diferencia hay entre registrar un software inédito y uno publicado?", "definicion": "Son dos trámites distintos ante la DNDA: depósito en custodia (obra inédita) e inscripción (obra publicada).", "lista": {"titulo": "Inédita (depósito en custodia) vs. publicada (inscripción)", "items": ["Qué es: inédita: software que no lanzaste o solo negociás con interesados; publicada: software ya puesto a disposición del público (tiene que estar publicado antes de iniciar el trámite).", "Qué se entrega: inédita: sobre cerrado y firmado con un soporte (pendrive, DVD), o archivo digital encriptado y firmado, con las partes suficientes para identificarla sin exponer secretos; publicada: una copia completa, en forma física o digital.", "Vigencia/resultado: inédita: 36 meses, renovable por períodos iguales; si no renovás dentro de 30 días hábiles, la DNDA puede destruirla; publicada: el certificado de inscripción llega por TAD."]}, "ejemplo": null, "articulos": ["Decreto 972/2024", "Decreto 165/94"], "fuente": "PPT", "ubicacion": "PPT slides 20 y 22; material §6 p. 10-11", "alerta": "PPT: «sobre cerrado y firmado»; material (Dto. 165/94): «sobre lacrado y firmado». Misma idea.", "evidencia": ["tp7"], "agregado": false, "b": 8, "nucleo": true}, {"id": "u8-tramite-tad", "seccion": "Registro y organismos", "termino": "Paso a paso del registro en TAD", "pregunta": "¿Cómo se registra un software ante la DNDA?", "definicion": "Sin errores, la DNDA emite el certificado o la constancia por TAD. Con errores, llega una tarea de subsanación.", "lista": {"titulo": "Pasos", "items": ["1. Ingresá a TAD: con clave fiscal (ARCA) o con Mi Argentina.", "2. Elegí el trámite: «Depósito en custodia de obra inédita - Software» o «Inscripción de obra publicada - Software».", "3. Cargá los datos: autores y titulares: CUIL/CUIT, domicilio y % de titularidad.", "4. Pagá el arancel: Fondo Cooperador Ley 23.412 (DNDA-CESSI); publicada: más una tasa al FNA.", "5. Entregá la obra: en sobre (Moreno 1230, CABA, por correo o receptorías del interior) o en forma digital."]}, "ejemplo": null, "articulos": ["Ley 23.412"], "fuente": "PPT", "ubicacion": "PPT slide 21", "alerta": null, "evidencia": ["tp7"], "agregado": false, "b": 8, "nucleo": false}, {"id": "u8-obra-software", "seccion": "Registro y organismos", "termino": "Obra de software (Dto. 165/94) y qué se presenta", "pregunta": "¿Qué incluye la obra de software según el Decreto 165/94?", "definicion": "La obra de software incluye los diseños del flujo lógico de los datos, el programa fuente y objeto, y la documentación técnica (Dto. 165/94).", "lista": {"titulo": "¿Qué presento?", "items": ["Escritorio o app: código fuente (completo o los módulos representativos), manual o documentación técnica, capturas si querés proteger la interfaz.", "Web o app web: código relevante (HTML, CSS, JS, backend), estructura del proyecto, capturas y documentación de arquitectura.", "¿Entrego todo?: inédita: las partes suficientes para identificarla, sin exponer secretos (algoritmos críticos, datos); publicada: TAD pide una copia completa."]}, "ejemplo": "Material: obra de base de datos = conjunto organizado de datos interrelacionados, compilado para almacenarlo, procesarlo y recuperarlo con técnicas informáticas.", "articulos": ["Decreto 165/94"], "fuente": "PPT+material", "ubicacion": "PPT slide 22; material §6 p. 10", "alerta": null, "evidencia": [], "agregado": false, "b": 8, "nucleo": false}, {"id": "u8-organismos", "seccion": "Registro y organismos", "termino": "Organismos que intervienen y controlan", "pregunta": "¿Qué organismos intervienen en la producción intelectual en cada nivel?", "definicion": "Contralor en todos los niveles: internacional, nacional, provincial y municipal.", "lista": {"titulo": "Nivel: organismo · función", "items": ["Internacional: OMPI (Ginebra) · administra el Convenio de Berna y el Convenio de París.", "Nacional: DNDA e INPI · DNDA (Min. de Justicia): obras, software, cesiones; INPI: patentes, diseños y marcas.", "Provincial: colegios y consejos profesionales · matrícula, ética y visado de proyectos y planos de sus matriculados.", "Municipal: municipios · aprueban planos, permisos de obra y habilitaciones; queda constancia de autoría."]}, "ejemplo": null, "articulos": [], "fuente": "PPT", "ubicacion": "PPT slide 23; material §6 p. 11", "alerta": null, "evidencia": [], "agregado": false, "b": 8, "nucleo": false}, {"id": "u8-capas-software", "seccion": "Software: capas de protección y licencias", "termino": "Capas de protección del software", "pregunta": "¿Cuáles son las formas de proteger un software?", "definicion": "Una app tiene varias capas de protección. La patente no alcanza al programa en sí: no es invención (art. 6 inc. c Ley 24.481).", "lista": {"titulo": "Qué se protege: con qué · norma", "items": ["Código y documentación: derecho de autor · Ley 11.723.", "Nombre y logo: marca ante el INPI (clases 9 y 42) · Ley 22.362.", "Algoritmos, modelos y parámetros no publicados: secreto comercial · Ley 24.766.", "Relación con devs, clientes y usuarios: contratos: cesión, NDA, licencias · CCyC.", "Accesos indebidos y daño a sistemas: ley penal · Ley 26.388."]}, "ejemplo": null, "articulos": ["Ley 11.723", "Ley 22.362", "Ley 24.766", "Ley 26.388", "Art. 6 inc. c Ley 24.481"], "fuente": "PPT+material", "ubicacion": "PPT slide 25; material §7 p. 12-13", "alerta": null, "evidencia": ["parcial2018", "tp7"], "agregado": false, "b": 8, "nucleo": true}, {"id": "u8-ley-software", "seccion": "Software: capas de protección y licencias", "termino": "Lo que dice la Ley 11.723 sobre el software", "pregunta": "¿Qué artículos de la Ley 11.723 regulan el software?", "definicion": "La ley protege el software como obra intelectual por el derecho de autor; las normas centrales son los arts. 1, 4 inc. d, 9, 55 bis y 57 + Dto. 165/94.", "lista": {"titulo": "Artículo: contenido", "items": ["Art. 1: programas fuente y objeto y compilaciones de datos son obras protegidas.", "Art. 4 inc. d: el software hecho por dependientes es del empleador, salvo pacto.", "Art. 9: el licenciatario puede hacer una única copia de salvaguardia.", "Art. 55 bis: la explotación incluye los contratos de licencia de uso o reproducción.", "Art. 57 + Dto. 165/94: depósito del software y de las bases de datos."]}, "ejemplo": null, "articulos": ["Art. 1 Ley 11.723", "Art. 4 inc. d Ley 11.723", "Art. 9 Ley 11.723", "Art. 55 bis Ley 11.723", "Art. 57 Ley 11.723", "Decreto 165/94"], "fuente": "PPT", "ubicacion": "PPT slide 26; material §7 p. 12", "alerta": null, "evidencia": [], "agregado": false, "b": 8, "nucleo": false}, {"id": "u8-fuente-objeto", "seccion": "Software: capas de protección y licencias", "termino": "Código fuente vs. código objeto", "pregunta": "¿Qué diferencia hay entre código fuente y código objeto para la ley?", "definicion": "Fuente: lo escribe y lo lee el programador. Objeto: resultado de compilar, para la máquina. Para la ley, la misma obra.", "lista": null, "ejemplo": null, "articulos": ["Art. 1 Ley 11.723"], "fuente": "PPT+material", "ubicacion": "PPT slide 26; material §7 p. 12", "alerta": null, "evidencia": [], "agregado": false, "b": 8, "nucleo": false}, {"id": "u8-promocion", "seccion": "Software: capas de protección y licencias", "termino": "Promoción de la industria del software", "pregunta": "¿Qué legislación promueve la industria del software?", "definicion": "2004: Ley 25.922 de promoción de la industria del software, prorrogada por la Ley 26.692. Hoy la reemplaza el régimen de Economía del Conocimiento (Ley 27.506, modificada por la Ley 27.570), vigente hasta el 31/12/2029. Da beneficios fiscales a empresas de software y servicios informáticos. La Ley 25.922 dejó una definición legal de software.", "lista": null, "ejemplo": "Material: definición de la Ley 25.922: expresión organizada de un conjunto de órdenes o instrucciones, en cualquier lenguaje, destinada a que una computadora ejecute una función específica.", "articulos": ["Ley 25.922", "Ley 26.692", "Ley 27.506", "Ley 27.570"], "fuente": "PPT+material", "ubicacion": "PPT slide 27; material §7 p. 13", "alerta": null, "evidencia": [], "agregado": false, "b": 8, "nucleo": false}, {"id": "u8-licencia", "seccion": "Software: capas de protección y licencias", "termino": "Licencia de uso («licenciar no es vender»)", "pregunta": "¿Qué es una licencia de uso de software?", "definicion": "Una licencia es un permiso para usar el software en ciertas condiciones; los derechos siguen siendo del titular. Jurídicamente es un contrato reconocido por el art. 55 bis Ley 11.723, casi siempre por adhesión (se acepta con un clic; arts. 984 a 989 CCyC, cláusulas abusivas); si el usuario es consumidor, se suma la Ley 24.240. El licenciatario nunca adquiere la propiedad del programa.", "lista": {"titulo": "«Me compré Windows 11»", "items": ["¿Compró el software? No.", "¿Compró los derechos intelectuales? Tampoco.", "Compró una licencia: permiso para usarlo en ciertas condiciones. Los derechos siguen siendo de Microsoft."]}, "ejemplo": "Desde el 14/10/2025 Windows 10 ya no recibe soporte gratuito: lo que pasa con las actualizaciones también lo define el titular.", "articulos": ["Art. 55 bis Ley 11.723", "Arts. 984 a 989 CCyC", "Ley 24.240"], "fuente": "PPT+material", "ubicacion": "PPT slide 28; material §8 p. 13-14", "alerta": null, "evidencia": ["parcial2023"], "agregado": false, "b": 8, "nucleo": true}, {"id": "u8-tipos-licencia", "seccion": "Software: capas de protección y licencias", "termino": "Tipos (familias) de licencias de software", "pregunta": "¿Cuáles son los tipos de licencias de software?", "definicion": "Las grandes familias de licencias, según qué permiten y qué exigen.", "lista": {"titulo": "Tipo: qué permite y qué exige · ejemplos", "items": ["Propietaria (EULA): usar en las condiciones fijadas; prohíbe copiar, modificar y ver el código · Windows, Office, Photoshop.", "Freeware: usar gratis, sin código ni permiso para modificar · muchas utilidades gratuitas.", "Shareware / freemium: gratis por un tiempo o con funciones limitadas · versiones de prueba, apps con plan pago.", "Libre con copyleft: usar, estudiar, modificar y redistribuir; derivadas bajo la misma licencia · GPL (Linux), AGPL.", "Abierta permisiva: usar y modificar incluso en productos cerrados, conservando el aviso · MIT, BSD, Apache 2.0.", "Dominio público: usar sin restricciones · CC0, Unlicense.", "Suscripción / SaaS: acceder al servicio mientras se paga, sin recibir copia · plataformas en la nube, CRM online."]}, "ejemplo": null, "articulos": [], "fuente": "PPT", "ubicacion": "PPT slide 29; material §8 p. 14", "alerta": "PPT: la propietaria «prohíbe copiar, modificar y ver el código»; material: «normalmente prohíbe». Va el PPT.", "evidencia": ["parcial2018"], "agregado": false, "b": 8, "nucleo": true}, {"id": "u8-libre-abierto-gratis", "seccion": "Software: capas de protección y licencias", "termino": "Software libre, código abierto y gratis", "pregunta": "¿Es lo mismo software libre, código abierto y gratis?", "definicion": "No. Libre no significa gratis: un software libre se puede vender, y un freeware puede ser totalmente cerrado.", "lista": {"titulo": "Libre · abierto · gratis", "items": ["Software libre: 0. usarlo con cualquier fin; 1. estudiarlo y modificarlo; 2. distribuir copias; 3. distribuir versiones modificadas.", "Código abierto: definición de la Open Source Initiative (1998); pone el foco en el modelo de desarrollo; en la práctica, casi todas las licencias libres son también abiertas.", "Gratis: freeware: no cuesta, pero no da acceso al código ni permiso para modificar. Gratis no es libre."]}, "ejemplo": null, "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slide 30; material §8 p. 14-15 (las 4 libertades son de la Free Software Foundation)", "alerta": null, "evidencia": [], "agregado": false, "b": 8, "nucleo": true}, {"id": "u8-copyleft-permisiva", "seccion": "Software: capas de protección y licencias", "termino": "Copyleft vs. licencia permisiva", "pregunta": "¿Qué diferencia hay entre una licencia con copyleft y una permisiva?", "definicion": "Copyleft (GPL, AGPL): usa el derecho de autor «al revés»: quien distribuye una obra derivada debe hacerlo bajo la misma licencia; la AGPL alcanza también al software ofrecido como servicio por la red. Permisivas (MIT, BSD, Apache): se pueden usar dentro de productos cerrados conservando el aviso de copyright y el texto de la licencia; por eso dominan en entornos comerciales.", "lista": {"titulo": "Copyleft vs. permisiva", "items": ["Obra derivada: copyleft: debe distribuirse bajo la misma licencia; permisiva: puede ir en un producto cerrado.", "Exigencia: copyleft: misma licencia (y con código); permisiva: conservar el aviso de copyright y el texto de la licencia.", "Ejemplos: copyleft: GPL, AGPL; permisiva: MIT, BSD, Apache."]}, "ejemplo": "Caso Redis: 2024 deja la licencia BSD y pasa a licencias «source available»; 2024 la comunidad crea el fork Valkey (Linux Foundation); 2025 Redis 8 vuelve al código abierto sumando la AGPLv3. Revisá la licencia en cada versión.", "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slide 31; material §8 p. 15", "alerta": null, "evidencia": ["tp7"], "agregado": false, "b": 8, "nucleo": true}, {"id": "u8-puedo-usar", "seccion": "Software: capas de protección y licencias", "termino": "Ejercicio: ¿puedo usar esto?", "pregunta": "¿Puedo usar un componente con licencia MIT, GPL, AGPL o CC BY-NC en mi producto?", "definicion": "Cada componente trae obligaciones que viajan con él.", "lista": {"titulo": "Situación: respuesta", "items": ["Librería MIT en una app comercial cerrada: sí, conservando el aviso de copyright y la licencia.", "Librería GPL dentro de un programa que vendés y distribuís: riesgo: la obra derivada debe distribuirse bajo GPL, con código.", "Componente AGPL modificado en tu plataforma SaaS: tenés que ofrecer el código a quienes usan el servicio por la red.", "Íconos con licencia CC BY-NC en una app paga: no: esa licencia prohíbe el uso comercial."]}, "ejemplo": null, "articulos": [], "fuente": "PPT", "ubicacion": "PPT slide 32", "alerta": null, "evidencia": ["tp7"], "agregado": false, "b": 8, "nucleo": false}, {"id": "u8-consecuencias", "seccion": "Consecuencias y responsabilidad del profesional", "termino": "Consecuencias de violar los derechos intelectuales", "pregunta": "¿Qué consecuencias tiene violar los derechos de propiedad intelectual?", "definicion": "Tres planos: civil, penal y laboral (arts. 71, 72 y 79 Ley 11.723 · art. 172 CP).", "lista": {"titulo": "Plano: consecuencia", "items": ["Civil: reparación de daños y perjuicios (arts. 1716 y ss. CCyC); el juez puede ordenar embargo de copias ilícitas y otras medidas preventivas (art. 79).", "Penal: pena de la estafa: prisión de 1 mes a 6 años (art. 71 Ley 11.723 y art. 172 CP); art. 72: editar, vender o reproducir sin autorización, falsificar, suprimir el nombre del autor.", "Laboral: copiar o llevarse código ajeno puede violar los deberes de fidelidad (arts. 85 y 88 LCT) y justificar un despido con causa."]}, "ejemplo": null, "articulos": ["Art. 71 Ley 11.723", "Art. 72 Ley 11.723", "Art. 79 Ley 11.723", "Art. 172 CP", "Arts. 1716 y ss. CCyC", "Arts. 85 y 88 LCT"], "fuente": "PPT+material", "ubicacion": "PPT slide 34; material §9 p. 15-16", "alerta": null, "evidencia": ["tp7"], "agregado": false, "b": 8, "nucleo": true}, {"id": "u8-casos-microsoft", "seccion": "Consecuencias y responsabilidad del profesional", "termino": "Casos Microsoft (2025)", "pregunta": "¿Qué enseñan los casos Microsoft c/ Matriplast y Microsoft c/ P. A. S.A.?", "definicion": "Instalar sin licencia ya es infracción, aunque no se use. El daño se mide por lo que hubiera costado la licencia; no hubo daño punitivo.", "lista": {"titulo": "Casos", "items": ["Microsoft c/ Matriplast (Cám. Nac. Civil, Sala M, 2025): condena USD 29.059 más intereses; ordena desinstalar el software sin licencia en 10 días; licencias copiadas de otro licenciatario.", "Microsoft c/ P. A. S.A. (Juzg. Nac. Civil N° 28, 2025): 13 programas instalados sin licencia; condena USD 5.942 más intereses y desinstalación; comprar las licencias después no la salvó."]}, "ejemplo": null, "articulos": [], "fuente": "PPT", "ubicacion": "PPT slide 35", "alerta": null, "evidencia": [], "agregado": false, "b": 8, "nucleo": false}, {"id": "u8-responsabilidad-profesional", "seccion": "Consecuencias y responsabilidad del profesional", "termino": "Responsabilidad del profesional", "pregunta": "¿Qué responsabilidad tiene el profesional informático? ¿Puede alegar que «no sabía»?", "definicion": "«No sabía» no alcanza: cuanto mayor el deber de obrar con prudencia y conocimiento, mayor la diligencia exigida (art. 1725 CCyC). El art. 1768 regula la responsabilidad de los profesionales liberales.", "lista": {"titulo": "Situaciones de responsabilidad", "items": ["Instalar o tolerar software sin licencia en la empresa.", "Llevarse código de un empleo a otro.", "Incorporar componentes sin revisar su licencia.", "Entregar a un cliente un desarrollo con material ajeno.", "Borrar la autoría de un colega o presentar su trabajo como propio."]}, "ejemplo": null, "articulos": ["Art. 1725 CCyC", "Art. 1768 CCyC"], "fuente": "PPT+material", "ubicacion": "PPT slide 36; material §9 p. 16-17", "alerta": null, "evidencia": ["tp7"], "agregado": false, "b": 8, "nucleo": false}, {"id": "u8-codigo-ia", "seccion": "Consecuencias y responsabilidad del profesional", "termino": "Código generado por inteligencia artificial", "pregunta": "¿Es protegible el código generado por IA? ¿Qué debe hacer el profesional?", "definicion": "Thaler v. Perlmutter: sin autor humano no hay copyright (Apelaciones, EE.UU., mar. 2025); la Corte Suprema no quiso revisarlo (mar. 2026). Argentina: no hay norma específica; la doctrina mayoritaria exige creación humana.", "lista": {"titulo": "Checklist profesional", "items": ["Revisá y entendé el código antes de incorporarlo.", "Controlá que no reproduzca código ajeno con licencias incompatibles.", "Respetá la política de tu empresa sobre qué herramientas usar.", "No pegues código ni datos confidenciales (Bolilla 17).", "Dejá registro de tu aporte humano."]}, "ejemplo": null, "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slide 37; material §9 p. 17", "alerta": null, "evidencia": [], "agregado": false, "b": 8, "nucleo": false}, {"id": "u10-marca", "seccion": "Concepto y marco legal", "termino": "Marca", "pregunta": "¿Qué es una marca?", "definicion": "Son marcas los signos con capacidad distintiva que permiten identificar productos o servicios y diferenciarlos de otros de la misma especie. La marca no protege el producto en sí, sino el signo distintivo que lo identifica en el mercado.", "lista": null, "ejemplo": "\"Mercado Libre\" identifica una plataforma determinada; \"YPF\", determinados combustibles y servicios; \"Pepsi\", una bebida determinada.", "articulos": ["Ley 22.362"], "fuente": "PPT+material", "ubicacion": "PPT slide 2; material §1 p. 1", "alerta": null, "evidencia": ["parcial2018"], "agregado": false, "b": 10, "nucleo": true}, {"id": "u10-marco-legal", "seccion": "Concepto y marco legal", "termino": "Marco legal de las marcas", "pregunta": "¿Cuál es el marco legal de las marcas en Argentina?", "definicion": "El régimen se arma en capas: Constitución Nacional, tratados internacionales, Ley 22.362 de Marcas y Designaciones (1980), decreto reglamentario y resoluciones del INPI. Autoridad de aplicación: INPI, Instituto Nacional de la Propiedad Industrial (organismo autárquico, Ley 24.481).", "lista": {"titulo": "Niveles (en el orden del PPT)", "items": ["Constitución Nacional: art. 17 (derecho de propiedad) y art. 75 inc. 22 (los tratados están por encima de las leyes)", "Tratados internacionales: Convenio de París (Ley 17.011) y ADPIC/TRIPS de la OMC (Ley 24.425)", "Ley 22.362 de Marcas y Designaciones (1980), reformada por la Ley 27.444 (2018): oposiciones, caducidad y nulidad pasan al INPI", "Decreto reglamentario 242/2019: detalla el trámite y crea la declaración jurada de uso de medio término", "Resoluciones del INPI: Clasificación de Niza 13.ª ed. (desde 1/1/2026) y aranceles en UMAPI (Res. 75/2026)"]}, "ejemplo": null, "articulos": ["Art. 17 CN", "Art. 75 inc. 22 CN", "Ley 17.011", "Ley 24.425", "Ley 22.362", "Ley 27.444", "Decreto 242/2019", "Ley 24.481", "Res. INPI 75/2026"], "fuente": "PPT", "ubicacion": "PPT slide 3; material §2", "alerta": null, "evidencia": [], "agregado": false, "b": 10, "nucleo": false}, {"id": "u10-nacimiento-derecho", "seccion": "Concepto y marco legal", "termino": "Nacimiento del derecho marcario (principio atributivo)", "pregunta": "¿Cuándo nace el derecho sobre una marca? ¿Qué principio adopta la Argentina?", "definicion": "Argentina adopta el principio atributivo: el derecho exclusivo sobre una marca nace con su registro. El art. 4 de la Ley 22.362 establece que la propiedad de una marca y la exclusividad de uso se obtienen con su registro. En Argentina no soy dueño de una marca porque la uso; soy dueño porque la registré.", "lista": {"titulo": "El uso sigue siendo importante porque", "items": ["Conservación: permite conservar la marca", "Caducidad: evita acciones de caducidad por falta de uso", "Conflictos: puede ser relevante en ciertos conflictos"]}, "ejemplo": null, "articulos": ["Art. 4 Ley 22.362"], "fuente": "PPT+material", "ubicacion": "PPT slide 4; material §3", "alerta": null, "evidencia": ["tp7"], "agregado": false, "b": 10, "nucleo": true}, {"id": "u10-atributivo-declarativo", "seccion": "Concepto y marco legal", "termino": "Sistema atributivo vs. declarativo", "pregunta": "¿En qué se diferencia el sistema atributivo del declarativo?", "definicion": "En los sistemas declarativos (como el de Estados Unidos) el derecho nace del uso: quien usa primero una marca en el comercio es su dueño y el registro solo lo declara. En los atributivos el derecho nace del registro. La Argentina adopta el atributivo.", "lista": {"titulo": "Atributivo vs. declarativo", "items": ["Fuente del derecho: atributivo, el registro; declarativo, el uso", "Función del registro: atributivo, constituye el derecho; declarativo, solo declara un derecho ya nacido del uso", "Ejemplo: atributivo, Argentina (art. 4 Ley 22.362); declarativo, Estados Unidos"]}, "ejemplo": null, "articulos": ["Art. 4 Ley 22.362"], "fuente": "material", "ubicacion": "material §3", "alerta": "El PPT solo nombra el principio atributivo; la comparación con el declarativo sale del material.", "evidencia": [], "agregado": false, "b": 10, "nucleo": false}, {"id": "u10-funciones", "seccion": "Concepto y marco legal", "termino": "Funciones de la marca", "pregunta": "¿Cuáles son las funciones de una marca?", "definicion": "La marca cumple cuatro funciones: distintiva, de identificación de origen, de garantía de calidad y publicitaria.", "lista": {"titulo": "Funciones (orden del PPT)", "items": ["Función distintiva: es la función esencial de toda marca. Permite diferenciar productos o servicios de una empresa respecto de los ofrecidos por sus competidores; sin marcas, todos los productos serían anónimos", "Función de identificación de origen: permite asociar un producto o servicio con una determinada empresa o fuente empresarial; el consumidor puede no saber quién lo fabrica, pero reconoce que proviene de una organización determinada. Genera confianza", "Función de garantía de calidad: actúa como referencia para el consumidor respecto de la calidad esperable; no garantiza una calidad determinada por ley, sino que permite asociar la marca con una experiencia previa", "Función publicitaria: es una poderosa herramienta de comunicación comercial; con el tiempo la marca adquiere un valor económico propio que puede superar el de los bienes materiales de la empresa"]}, "ejemplo": "Ejercicio del PPT: si desaparecieran todas las marcas y los productos se vendieran en envases blancos, ¿cómo elegiríamos qué comprar?", "articulos": [], "fuente": "PPT", "ubicacion": "PPT slides 5-9; material §1", "alerta": null, "evidencia": ["quiz10", "tp7"], "agregado": false, "b": 10, "nucleo": true}, {"id": "u10-beneficios", "seccion": "Concepto y marco legal", "termino": "Beneficios de registrar una marca", "pregunta": "¿Cuáles son los beneficios de una marca (registrada)?", "definicion": "Registrar una marca otorga derechos y permite excluir a terceros; además incorpora un activo intangible al patrimonio de la empresa.", "lista": {"titulo": "Beneficios (orden del PPT)", "items": ["Derecho exclusivo de uso: registrar una marca no solo otorga derechos, también permite excluir a terceros", "Protección legal frente a imitaciones: sin registro, la defensa suele ser más compleja", "Incorporación de un activo intangible: la marca tiene valor económico propio", "Genera confianza y profesionalización: transmite mayor seguridad", "Facilita la expansión comercial: permite replicar el negocio (otorgar licencias y franquicias)"]}, "ejemplo": null, "articulos": [], "fuente": "PPT", "ubicacion": "PPT slide 17; material §1", "alerta": null, "evidencia": [], "agregado": false, "b": 10, "nucleo": true}, {"id": "u10-que-puede-ser", "seccion": "Qué puede ser marca y tipos", "termino": "Qué puede ser una marca (art. 1)", "pregunta": "¿Qué signos pueden registrarse como marca?", "definicion": "Art. 1, Ley 22.362: la lista es enunciativa. Vale cualquier signo con capacidad distintiva.", "lista": {"titulo": "Signos (orden del PPT)", "items": ["Palabras: con o sin significado (\"Ualá\", \"Mercado Libre\")", "Dibujos, emblemas, imágenes: el ícono de una app, un isologo", "Letras y números: combinados o con un dibujo especial", "Combinaciones de colores: aplicadas en un lugar determinado del producto o envase", "Envases y envoltorios: la forma de una botella o de un packaging", "Frases publicitarias: siempre que tengan originalidad", "Relieves: con capacidad distintiva", "Todo otro signo: que permita distinguir productos o servicios"]}, "ejemplo": null, "articulos": ["Art. 1 Ley 22.362"], "fuente": "PPT+material", "ubicacion": "PPT slide 10; material §4", "alerta": null, "evidencia": [], "agregado": false, "b": 10, "nucleo": true}, {"id": "u10-tipos", "seccion": "Qué puede ser marca y tipos", "termino": "Tipos de marca", "pregunta": "Enumere y describa los tipos de marca.", "definicion": "Según su composición, la marca puede ser denominativa, figurativa, mixta o tridimensional.", "lista": {"titulo": "Tipos (orden del PPT)", "items": ["Denominativa: solo palabras, letras o números, sin diseño. Ej.: MERCADO LIBRE, escrito en cualquier tipografía", "Figurativa: solo un dibujo o imagen, sin palabras. Ej.: la manzana de Apple", "Mixta: palabras + diseño, tipografía o colores. Ej.: el logo de YPF tal como aparece en las estaciones", "Tridimensional: la forma del envase o del producto. Ej.: una botella con forma distintiva"]}, "ejemplo": "Tip práctico del PPT: la denominativa protege el nombre en sí, sin importar cómo se dibuje. La mixta protege el conjunto: si después cambia el logo, puede hacer falta un nuevo registro.", "articulos": [], "fuente": "PPT", "ubicacion": "PPT slide 11; material §4", "alerta": null, "evidencia": ["parcial2018", "quiz10"], "agregado": false, "b": 10, "nucleo": true}, {"id": "u10-no-tradicionales", "seccion": "Qué puede ser marca y tipos", "termino": "Marcas no tradicionales (que no se ven)", "pregunta": "¿Se puede registrar un olor o un sonido como marca?", "definicion": "En Argentina la ley no menciona olores ni sonidos, pero el art. 1 es una lista abierta. El problema de fondo es cómo \"escribir\" un olor en un registro.", "lista": {"titulo": "Casos del PPT", "items": ["Olor de las pelotas de tenis (Unión Europea, 2000): una empresa neerlandesa (Senta) logró registrar el olor a césped recién cortado; la oficina europea lo rechazó primero y lo aceptó en apelación", "Rugido de Harley-Davidson (Estados Unidos, 1994 a 2000): competidores se opusieron porque otros motores suenan igual; después de 6 años Harley desistió", "Rugido del león de MGM (Estados Unidos): sí está registrado como marca"]}, "ejemplo": null, "articulos": ["Art. 1 Ley 22.362"], "fuente": "PPT", "ubicacion": "PPT slide 12; material §4", "alerta": null, "evidencia": [], "agregado": false, "b": 10, "nucleo": false}, {"id": "u10-no-registrables", "seccion": "Límites al registro", "termino": "Qué no se puede registrar (arts. 2 y 3)", "pregunta": "¿Qué no se puede registrar como marca? Distinga art. 2 y art. 3.", "definicion": "La ley pone dos límites: lo que NO ES MARCA (art. 2), porque le falta capacidad distintiva, y lo PROHIBIDO (art. 3), que afecta derechos de terceros o el orden público.", "lista": {"titulo": "No son marcas (art. 2) / Prohibidas (art. 3)", "items": ["Art. 2 — Genéricos: la designación necesaria o habitual del producto (\"Gaseosa\" para gaseosas)", "Art. 2 — Descriptivos: lo que describe su naturaleza, función o cualidades (\"Súper Rápido\" para internet)", "Art. 2 — Uso general: palabras, signos y frases que ya pasaron al uso general antes de la solicitud", "Art. 2 — Forma del producto: la forma que se da al producto mismo", "Art. 2 — Colores: el color natural o intrínseco del producto, o un solo color aplicado sobre él", "Art. 3 — Confundibles: idénticas o similares a marcas ya registradas o solicitadas para lo mismo", "Art. 3 — Engañosas: sobre naturaleza, propiedades, calidad u origen del producto", "Art. 3 — Orden público: contrarias a la moral y las buenas costumbres; símbolos patrios y emblemas oficiales", "Art. 3 — Personas: nombre, seudónimo o retrato de alguien sin su consentimiento (o el de sus herederos)", "Art. 3 — Otros: denominaciones de origen; designaciones de actividades ajenas; frases publicitarias sin originalidad"]}, "ejemplo": "\"Manzana\" es genérico para vender manzanas, pero no para vender computadoras (material).", "articulos": ["Art. 2 Ley 22.362", "Art. 3 Ley 22.362"], "fuente": "PPT+material", "ubicacion": "PPT slide 13; material §5", "alerta": null, "evidencia": ["tp7"], "agregado": false, "b": 10, "nucleo": true}, {"id": "u10-caracter-distintivo", "seccion": "Límites al registro", "termino": "Carácter distintivo (escala de signos)", "pregunta": "¿Qué es el carácter distintivo y cómo se gradúa?", "definicion": "El carácter distintivo es el requisito central de toda marca. Un signo es distintivo cuando el público puede reconocer, a través de él, que un producto o servicio proviene de una empresa determinada y no de otra. No es una cualidad del signo aislado, sino de la relación entre el signo y lo que distingue.", "lista": {"titulo": "Escala (de más fuerte a más débil)", "items": ["De fantasía: palabra inventada, sin significado previo (Kodak, Rolex). Máxima distintividad", "Arbitrario: palabra con significado pero sin relación con el producto (\"Apple\" para computadoras). Alta", "Evocativo: sugiere una característica sin describirla (\"Rapipago\"). Media: registrable, protección más acotada", "Descriptivo: describe la naturaleza o cualidades (\"Súper Rápido\" para internet). No registrable (art. 2)", "Genérico: nombre común del producto (\"Gaseosa\" para gaseosas). No registrable (art. 2)"]}, "ejemplo": "Vulgarización: \"birome\" nació como marca y hoy se usa para cualquier bolígrafo (material).", "articulos": ["Art. 2 Ley 22.362"], "fuente": "material", "ubicacion": "material §1 (El carácter distintivo)", "alerta": "El PPT solo dice \"signos con capacidad distintiva\" y lista genéricos/descriptivos; la escala y la vulgarización son solo del material.", "evidencia": [], "agregado": false, "b": 10, "nucleo": false}, {"id": "u10-do-ig", "seccion": "Límites al registro", "termino": "Denominación de origen e indicación geográfica", "pregunta": "¿Qué es una IG y una DO? ¿En qué se diferencian de una marca?", "definicion": "Indicación geográfica (IG): identifica un producto cuya calidad, reputación u otra característica se debe a su origen geográfico. Denominación de origen (DO): es más exigente; las cualidades se deben al medio geográfico, con sus factores naturales y humanos. No se pueden registrar como marca (art. 3, Ley 22.362).", "lista": {"titulo": "Marca vs. IG/DO", "items": ["¿De quién es?: marca, de una persona o empresa; IG/DO, de todos los productores de la zona que cumplen las reglas", "¿Se puede vender?: marca, sí, se cede o se licencia; IG/DO, no, está atada al lugar", "¿Qué identifica?: marca, quién lo fabrica; IG/DO, de dónde viene"]}, "ejemplo": "Chivito criollo del norte neuquino (primera DO agroalimentaria, 2010), Salame de Tandil, Cordero patagónico, Yerba mate argentina. Roquefort → \"queso azul\"; Champagne → \"espumantes\".", "articulos": ["Ley 25.163", "Ley 25.380", "Art. 3 Ley 22.362"], "fuente": "PPT", "ubicacion": "PPT slides 14-15; material §5", "alerta": null, "evidencia": [], "agregado": false, "b": 10, "nucleo": true}, {"id": "u10-niza-especialidad", "seccion": "Registro y Niza", "termino": "Clasificación de Niza y principio de especialidad", "pregunta": "¿Qué es el Arreglo de Niza y qué establece el principio de especialidad?", "definicion": "El Arreglo de Niza (1957) es un tratado internacional administrado por la Organización Mundial de la Propiedad Intelectual: 45 clases, divididas en dos grandes grupos (clases 1 a 34 → productos; clases 35 a 45 → servicios). En Argentina rige la 13.ª edición desde el 1/1/2026. Principio de especialidad: una marca puede coexistir con otra idéntica si operan en clases distintas.", "lista": null, "ejemplo": "\"Delta\" para aerolíneas y para grifos.", "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slides 18 y 22; material §6", "alerta": null, "evidencia": ["tp7"], "agregado": false, "b": 10, "nucleo": true}, {"id": "u10-productos-servicios", "seccion": "Registro y Niza", "termino": "Marcas de productos y marcas de servicios", "pregunta": "¿Qué diferencia hay entre marcas de productos y de servicios?", "definicion": "La Ley 22.362 protege por igual las marcas que distinguen productos (bienes que se fabrican y venden) y las que distinguen servicios (prestaciones). La Clasificación de Niza respeta esa división: clases 1 a 34 productos, 35 a 45 servicios. La marca vale solo para lo que se registró, por eso en tecnología es habitual registrar en clases de los dos grupos.", "lista": null, "ejemplo": "Una marca de software descargable (clase 9) no protege automáticamente el servicio de software en la nube (clase 42).", "articulos": ["Ley 22.362"], "fuente": "PPT+material", "ubicacion": "PPT slide 22 (clases 1-34 / 35-45); material §1", "alerta": "El PPT solo da la división de clases; la explicación es del material.", "evidencia": [], "agregado": false, "b": 10, "nucleo": false}, {"id": "u10-clases-tecnologia", "seccion": "Registro y Niza", "termino": "Clases que importan en tecnología", "pregunta": "¿En qué clases de Niza conviene registrar una app o un SaaS?", "definicion": "Clase 9: software y apps descargables, hardware, dispositivos. Clase 42: SaaS, desarrollo de software, hosting, servicios en la nube. Clase 35: publicidad, gestión comercial, tiendas y marketplaces online. Clase 38: telecomunicaciones, mensajería, transmisión de datos. Clase 41: educación, entretenimiento, juegos en línea.", "lista": {"titulo": "Errores y novedades", "items": ["Error típico: registrar una app solo en clase 9 y dejar afuera el servicio que presta (42) o lo que vende (35)", "Error frecuente: registrar la marca únicamente en la actividad actual y no contemplar futuros desarrollos (\"¿Dónde imaginás tu negocio dentro de cinco años?\")", "Novedad 13.ª edición (2026): los productos \"inteligentes\" se clasifican por su función principal; un juguete inteligente va a la 28, no a la 9"]}, "ejemplo": null, "articulos": [], "fuente": "PPT", "ubicacion": "PPT slides 19 y 22; material §6", "alerta": null, "evidencia": ["tp7"], "agregado": false, "b": 10, "nucleo": false}, {"id": "u10-registro-pasos", "seccion": "Registro y Niza", "termino": "Pasos del registro de una marca", "pregunta": "¿Cómo se registra una marca? Enumere los pasos.", "definicion": "El registro se tramita ante el INPI en siete pasos: búsqueda, clase, solicitud, examen formal, publicación, oposiciones (30 días) y resolución.", "lista": {"titulo": "Pasos (orden del PPT)", "items": ["1. Verificar que la marca sea registrable: capacidad distintiva (problemas con genéricos, descriptivos, uso común, engañosos) y si existe una marca anterior similar; la búsqueda previa no es requisito legal obligatorio, pero en la práctica es importante", "2. Determinar la clase correspondiente: Clasificación Internacional de Niza (1-34 productos, 35-45 servicios)", "3. Presentar la solicitud ante el INPI, en su portal de trámites: nombre del solicitante, domicilio, descripción de la marca, productos y/o servicios que distinguirá", "4. Examen formal: el INPI verifica los requisitos formales; los defectos deben subsanarse (p. ej., falta pagar una tasa)", "5. Publicación en el Boletín de Marcas: permite que terceros conozcan la solicitud y puedan defender sus derechos", "6. Período de oposiciones: plazo de treinta días desde la publicación; suelen oponerse titulares de marcas anteriores, licenciatarios o empresas con un derecho previo. Una oposición no significa rechazo automático: abre una etapa de discusión", "7. Oposiciones, examen de fondo y resolución: si hubo oposición, el solicitante tiene 3 meses para negociar (acuerdo de coexistencia, limitar productos o retirar la solicitud); sin acuerdo resuelve el INPI (cambio de la Ley 27.444, antes había que ir a juicio), recurrible ante la Cámara Nacional de Apelaciones en lo Civil y Comercial Federal. Examen de fondo de oficio (arts. 2 y 3). Resultado: concesión (título) o denegatoria, también recurrible"]}, "ejemplo": null, "articulos": ["Ley 27.444", "Art. 2 Ley 22.362", "Art. 3 Ley 22.362"], "fuente": "PPT", "ubicacion": "PPT slides 20-25; material §7", "alerta": null, "evidencia": ["tp7"], "agregado": false, "b": 10, "nucleo": true}, {"id": "u10-requisitos-prioridad", "seccion": "Registro y Niza", "termino": "Requisitos de la solicitud y prioridad", "pregunta": "¿Quién puede pedir una marca y qué significa \"prioridad\"?", "definicion": "Puede pedir una marca cualquier persona humana o jurídica; el art. 4 exige un interés legítimo, para ser titular y para oponerse. Se presenta una solicitud por clase. Prioridad: (a) dentro del país, ante marcas confundibles tiene preferencia quien presentó primero; (b) prioridad unionista (Convenio de París): quien presentó en un país miembro tiene 6 meses para presentar en otro con la fecha de la primera solicitud, reclamándola expresamente.", "lista": null, "ejemplo": null, "articulos": ["Art. 4 Ley 22.362"], "fuente": "material", "ubicacion": "material §7; PPT slide 33 (prioridad de 6 meses)", "alerta": "El PPT solo menciona el derecho de prioridad de 6 meses del Convenio de París; interés legítimo y prioridad interna son solo del material.", "evidencia": [], "agregado": false, "b": 10, "nucleo": false}, {"id": "u10-confusion", "seccion": "Registro y Niza", "termino": "La confusión (visual, auditiva, ideológica)", "pregunta": "¿Qué tipos de confusión entre marcas existen?", "definicion": "La Ley 22.362 no define la confusión; los criterios los armaron la doctrina y la jurisprudencia. Se busca evitar que el consumidor compre un producto por otro o crea que dos productos vienen de la misma empresa o de empresas vinculadas. Basta uno de los tres tipos para que haya confusión.", "lista": {"titulo": "Tipos y reglas del cotejo", "items": ["Visual o gráfica: se parecen al verlas (letras, longitud, estructura, diseño, colores)", "Auditiva o fonética: suenan igual o muy parecido aunque se escriban distinto (\"k\" vs. \"c\")", "Ideológica o conceptual: evocan la misma idea aunque se vean y suenen distinto (\"El Rey del Mar\" vs. \"King of the Sea\")", "Reglas: impresión de conjunto; cotejo sucesivo, no simultáneo (pesan más las semejanzas); consumidor medio; más rigor cuanto más cercanos los productos; mayor rigor en productos sensibles (medicamentos); los elementos de uso común no se monopolizan"]}, "ejemplo": null, "articulos": [], "fuente": "material", "ubicacion": "material §8", "alerta": "Sin desarrollo en el PPT (solo aparece \"Confundibles\" en art. 3 y el caso Messi vs. Massi). Lo toma el TP7 (PADELYA vs. PADDLEYA).", "evidencia": ["tp7"], "agregado": false, "b": 10, "nucleo": false}, {"id": "u10-vigencia", "seccion": "Conservación", "termino": "Vigencia y mantenimiento", "pregunta": "¿Cuánto dura una marca y qué debe hacer el titular para conservarla?", "definicion": "La marca dura 10 años desde la concesión, renovables indefinidamente por períodos iguales.", "lista": {"titulo": "Además, el titular debe", "items": ["Usar la marca: si no se usa en los 5 años anteriores a que alguien lo pida, puede declararse su caducidad, incluso parcial (solo para los productos no usados)", "Presentar la DJ de uso de medio término a mitad de la vigencia (Decreto 242/2019)", "Renovar a tiempo: desde 6 meses antes del vencimiento, o hasta 6 meses después con recargo. Solo se renueva si hubo uso en los últimos 5 años", "Vigilar el Boletín de Marcas y mantener actualizados sus datos"]}, "ejemplo": "\"Registrar una marca no es obtener un certificado; es incorporar un activo al patrimonio de la empresa.\"", "articulos": ["Decreto 242/2019"], "fuente": "PPT", "ubicacion": "PPT slide 26; material §9", "alerta": null, "evidencia": ["tp7"], "agregado": false, "b": 10, "nucleo": true}, {"id": "u10-dj-medio-termino", "seccion": "Conservación", "termino": "Declaración jurada de uso de medio término", "pregunta": "¿Qué es la declaración jurada de uso de medio término?", "definicion": "Es un trámite ante el INPI en el que el titular de una marca declara que la usó durante los primeros cinco años desde que se la concedieron. Sirve para depurar el registro: que no queden marcas inscriptas que nadie usa y que bloquean a otros que sí quieren usarlas.", "lista": null, "ejemplo": null, "articulos": ["Decreto 242/2019"], "fuente": "PPT+material", "ubicacion": "PPT slides 26 y 34; material §9", "alerta": "Material agrega: se presenta cumplido el quinto año y antes de que termine el sexto; si no se presenta, la marca no se cae, pero se presume que no se usa y no se renueva hasta regularizar (con recargo).", "evidencia": ["tp7"], "agregado": false, "b": 10, "nucleo": false}, {"id": "u10-umapi", "seccion": "Conservación", "termino": "Costo del registro (UMAPI)", "pregunta": "¿Cuánto cuesta registrar una marca? ¿Qué es la UMAPI?", "definicion": "El arancel oficial de una solicitud nueva es de 100 UMAPI por clase (hasta 20 productos o servicios). La UMAPI es la Unidad de Medida Arancelaria de la Propiedad Industrial, creada por la Res. INPI 75/2026; arrancó en $360 (abril 2026) y se actualiza todos los meses según el IPC del INDEC. No incluye honorarios de agentes o abogados, oposiciones, renovaciones y otros trámites.", "lista": null, "ejemplo": "Funciona igual que las UVA de los créditos hipotecarios.", "articulos": ["Res. INPI 75/2026"], "fuente": "PPT", "ubicacion": "PPT slide 27; material §9", "alerta": null, "evidencia": [], "agregado": false, "b": 10, "nucleo": false}, {"id": "u10-copia-vias", "seccion": "Defensa y mundo digital", "termino": "Defensa de la marca: vías ante la copia", "pregunta": "¿Qué vías tiene el titular si le copian la marca?", "definicion": "El titular de una marca registrada tiene tres vías: civil, administrativa (INPI) y penal (art. 31), y puede usar más de una a la vez.", "lista": {"titulo": "Vías (orden del PPT)", "items": ["Vía civil: acción de cese de uso; indemnización de daños y perjuicios; medidas cautelares (secuestro de mercadería, cese inmediato)", "Vía administrativa (INPI): oposición a una solicitud ajena; pedido de caducidad por falta de uso; pedido de nulidad de una marca mal concedida", "Vía penal (art. 31): falsificar o imitar fraudulentamente una marca registrada, usarla o vender productos con marca falsificada. Pena: prisión de 3 meses a 2 años, más multa"]}, "ejemplo": "Caso \"zapatillas por Facebook\" (Cám. Fed. La Plata, Sala A, 12/07/2022): se confirmaron procesamientos y un embargo de $400.000; una copia burda igual es delito, la ley también protege al consumidor.", "articulos": ["Art. 31 Ley 22.362"], "fuente": "PPT", "ubicacion": "PPT slide 28; material §10", "alerta": null, "evidencia": ["tp7"], "agregado": false, "b": 10, "nucleo": true}, {"id": "u10-falsificacion-imitacion", "seccion": "Defensa y mundo digital", "termino": "Exclusividad, falsificación e imitación fraudulenta", "pregunta": "¿Qué diferencia hay entre falsificación e imitación fraudulenta?", "definicion": "El registro da un derecho de exclusividad con una cara positiva (usar, licenciar, ceder o gravar) y una negativa (excluir a terceros). Falsificación: reproducción idéntica o casi idéntica de la marca ajena (copia servil); no hace falta analizar confusión. Imitación fraudulenta: crea un signo parecido con intención de aprovechar el prestigio ajeno y confundir; se aplican las reglas de la confusión y se necesita dolo.", "lista": null, "ejemplo": null, "articulos": ["Art. 31 Ley 22.362"], "fuente": "material", "ubicacion": "material §10; PPT slide 28 (solo nombra ambas conductas)", "alerta": "El PPT nombra \"falsificar o imitar fraudulentamente\" sin definirlas; las definiciones son del material.", "evidencia": [], "agregado": false, "b": 10, "nucleo": false}, {"id": "u10-extincion", "seccion": "Conservación", "termino": "Extinción del derecho", "pregunta": "¿Cuáles son las causas de extinción de la marca?", "definicion": "El material indica que el art. 23 de la Ley 22.362 enumera las causas de extinción: renuncia, vencimiento del plazo, nulidad y caducidad. En todos los casos el signo vuelve a estar disponible.", "lista": {"titulo": "Causas", "items": ["Renunc
