to, no a la prohibición de sensibles. Inscribirse en el Registro hace lícita una base, pero no habilita a recolectar sensibles. La obligación legal también es una excepción al consentimiento, no a esta prohibición.", "ref": "u13-prohibicion-sensibles"}, {"id": "m13-11", "b": 13, "tipo": "simple", "origen": "nueva", "pregunta": "Según el PPT, ¿qué conducta castiga el art. 157 bis del Código Penal?", "opciones": ["Acceder a sabiendas e ilegítimamente, o violando sistemas de seguridad, a un banco de datos personales.", "No responder un pedido de rectificación dentro de los cinco días hábiles.", "Proporcionar a un tercero información falsa contenida en un archivo de datos personales que la persona administra.", "Insertar datos falsos en un archivo de datos personales."], "correctas": [0], "explicacion": "El PPT ubica en el art. 157 bis CP el acceso a sabiendas e ilegítimo, o violando sistemas de seguridad, a un banco de datos personales (1 mes a 2 años), y también la revelación de información que debía mantenerse en secreto. Insertar datos falsos es el art. 117 bis CP. Proporcionar a un tercero información falsa de un archivo es otra figura penal del PPT, con escala de 6 meses a 3 años, no el acceso ilegítimo. No responder en plazo no es delito: habilita el hábeas data y puede dar lugar a sanciones administrativas.", "ref": "u13-sanciones"}, {"id": "m13-12", "b": 13, "tipo": "simple", "origen": "nueva", "pregunta": "Un municipio rechaza el pedido de subsidio de una vecina únicamente por el puntaje que le asignó un sistema automatizado. ¿Qué derecho del titular está en juego según el PPT?", "opciones": ["Valoraciones personales (art. 20).", "Derecho de acceso (art. 14).", "Derecho de información ante la AAIP (art. 13).", "Gratuidad (art. 19)."], "correctas": [0], "explicacion": "El art. 20 (valoraciones personales) establece que un acto judicial o administrativo no puede basarse solo en un perfil hecho por un sistema automatizado; el PPT lo marca como clave frente a la IA, y el material agrega que esos actos son insanablemente nulos. El derecho de información es consultar a la AAIP qué bases existen. La gratuidad se refiere a que corregir o borrar datos no le cuesta nada al titular. El acceso es pedir los datos propios a una base, en 10 días corridos; nada de eso ataca una decisión automatizada.", "ref": "u13-valoraciones-personales"}, {"id": "m13-13", "b": 13, "tipo": "multiple", "origen": "nueva", "pregunta": "¿Cuáles de los siguientes son datos sensibles según el PPT? Seleccioná todas las correctas.", "opciones": ["Fecha de nacimiento del titular.", "Afiliación sindical.", "Información sobre la salud.", "Ocupación.", "Convicciones religiosas."], "correctas": [1, 2, 4], "explicacion": "Son sensibles los datos que revelan origen racial y étnico, opiniones políticas, convicciones religiosas, filosóficas o morales, afiliación sindical e información sobre la salud o la vida sexual: por eso valen la afiliación sindical, la salud y las convicciones religiosas. La fecha de nacimiento y la ocupación son datos personales comunes: de hecho, el PPT los incluye entre los listados (nombre, DNI, CUIT/CUIL, ocupación, fecha de nacimiento y domicilio) que no requieren consentimiento.", "ref": "u13-dato-sensible"}, {"id": "m13-14", "b": 13, "tipo": "multiple", "origen": "nueva", "pregunta": "Según el PPT, ¿qué debe informarse previamente al titular cuando se recaban sus datos? Seleccioná todas las correctas.", "opciones": ["La identidad y el domicilio del responsable.", "La finalidad para la que serán tratados.", "Sus derechos de acceso, rectificación y supresión.", "El tiempo de conservación de los datos.", "Los medios utilizados para garantizar la seguridad de los datos."], "correctas": [0, 1, 2], "explicacion": "El PPT enumera lo que se informa al titular: finalidad, existencia del archivo, identidad y domicilio del responsable, carácter obligatorio o facultativo de las respuestas, consecuencias de dar o negar los datos, y derechos de acceso, rectificación y supresión. El tiempo de conservación y los medios de seguridad no forman parte de esa lista: integran el contenido mínimo que debe comprender la inscripción de la base en el Registro, que es otra obligación del responsable frente a la autoridad.", "ref": "u13-informacion-titular"}, {"id": "m13-15", "b": 13, "tipo": "multiple", "origen": "nueva", "pregunta": "¿En cuáles de estos casos el PPT dice que NO es necesario el consentimiento del titular? Seleccioná todas las correctas.", "opciones": ["Operaciones de entidades financieras (art. 39, Ley 21.526).", "Datos de pacientes que un centro de salud comparte con una marca para enviar publicidad.", "Datos obtenidos de fuentes de acceso público irrestricto.", "Datos que derivan de una relación contractual y son necesarios para cumplirla.", "Datos recabados con una casilla de «Acepto» ya tildada y sin otra información."], "correctas": [0, 2, 3], "explicacion": "Las excepciones del PPT son: fuentes de acceso público irrestricto, funciones del Estado u obligación legal, listados básicos, relación contractual, científica o profesional necesaria para cumplirla, y operaciones de entidades financieras. Compartir pacientes con una marca para publicidad no está en esa lista: es una finalidad distinta y además datos de salud. La casilla premarcada sin información no es una excepción sino un consentimiento que no es expreso ni informado, por lo que el tratamiento sería ilícito.", "ref": "u13-consentimiento"}, {"id": "m13-16", "b": 13, "tipo": "multiple", "origen": "nueva", "pregunta": "¿Cuáles son sanciones ADMINISTRATIVAS según el PPT? Seleccioná todas las correctas.", "opciones": ["Inhabilitación del funcionario público.", "Cancelación.", "Prisión de 1 mes a 2 años.", "Apercibimiento.", "Clausura."], "correctas": [1, 3, 4], "explicacion": "El PPT enumera como sanciones administrativas el apercibimiento, la suspensión, la multa, la clausura y la cancelación (art. 31), aplicadas por la AAIP. La inhabilitación figura del lado penal: se agrega cuando el responsable de un delito es funcionario público. La prisión de 1 mes a 2 años es la escala penal de figuras como insertar datos falsos (art. 117 bis CP) o acceder ilegítimamente a un banco de datos (art. 157 bis CP), que aplica la Justicia, no la AAIP.", "ref": "u13-sanciones"}, {"id": "m13-17", "b": 13, "tipo": "vf", "origen": "nueva", "pregunta": "Según el art. 43 CN, se puede interponer hábeas data respecto de registros o bancos de datos públicos y también de los privados destinados a proveer informes.", "opciones": ["Verdadero", "Falso"], "correctas": [0], "explicacion": "Verdadero. El PPT transcribe el art. 43 CN: toda persona puede interponer hábeas data para conocer los datos a ella referidos y su finalidad, que consten en registros o bancos de datos públicos, o los privados destinados a proveer informes, y exigir supresión, rectificación, confidencialidad o actualización en caso de falsedad o discriminación. Sería falso si dijera que solo alcanza a bancos públicos: los privados destinados a informes también están incluidos.", "ref": "u13-habeas-data"}, {"id": "m13-18", "b": 13, "tipo": "vf", "origen": "nueva", "pregunta": "La supresión de datos procede siempre que el titular la pida, aunque exista una obligación legal de conservarlos.", "opciones": ["Verdadero", "Falso"], "correctas": [1], "explicacion": "Falso. El PPT (art. 16) dice que la supresión no procede cuando pudiese causar perjuicios a derechos o intereses de terceros, o cuando existiera una obligación legal de conservar los datos. El material da el ejemplo de un banco que no puede borrar los registros de una operación solo porque el cliente lo pide si una ley lo obliga a conservarlos. El derecho de supresión existe, pero dice «cuando corresponda»: tiene límites.", "ref": "u13-rectificacion-supresion"}, {"id": "m13-19", "b": 13, "tipo": "vf", "origen": "nueva", "pregunta": "Según el PPT, toda base de datos privada debe inscribirse en el Registro, esté o no destinada a proporcionar informes.", "opciones": ["Verdadero", "Falso"], "correctas": [1], "explicacion": "Falso. El PPT dice que debe inscribirse todo archivo, registro, base o banco de datos público, y privado destinado a proporcionar informes. El criterio para las privadas es justamente ese destino: generar información y descripciones sobre personas para uso interno o para terceros. Una base pública se inscribe siempre; una privada, cuando está destinada a dar informes. La inscripción debe comprender como mínimo el responsable, la finalidad, la naturaleza de los datos y las medidas de seguridad, entre otros puntos.", "ref": "u13-registro"}, {"id": "m13-20", "b": 13, "tipo": "vf", "origen": "nueva", "pregunta": "La disociación permite usar datos, por ejemplo en Big Data o IA, sin comprometer la privacidad, porque la información obtenida no puede asociarse a persona determinada o determinable.", "opciones": ["Verdadero", "Falso"], "correctas": [0], "explicacion": "Verdadero. La disociación es todo tratamiento de datos personales de manera que la información obtenida no pueda asociarse a persona determinada o determinable, y el PPT, en «Innovación responsable», menciona el uso de datos disociados sin comprometer privacidad. El material agrega que disociar es básicamente anonimizar y que los datos disociados pueden cederse sin consentimiento porque ya no hay intimidad que proteger.", "ref": "u13-disociacion"}, {"id": "m14-01", "b": 14, "tipo": "simple", "origen": "nueva", "pregunta": "Una contraparte desconoce en juicio un contrato firmado con firma electrónica. Según la Ley 25.506, ¿quién tiene que probar?", "opciones": ["Quien desconoce la firma, porque se presume que pertenece al titular del certificado (art. 7).", "Quien invoca la firma tiene que acreditar su validez (art. 5).", "Nadie, porque la firma electrónica cumple la exigencia de firma manuscrita (art. 3).", "El certificador que emitió el certificado, que responde por los daños (arts. 38-39)."], "correctas": [1], "explicacion": "La pregunta clave del PPT es ¿quién tiene que probar?: con firma electrónica, si se la desconoce, la prueba la carga quien la invoca (art. 5). No es la presunción del art. 7, porque esa presunción de autoría es propia de la firma digital. No es la equivalencia del art. 3, que también es solo de la digital. Y la responsabilidad del certificador (arts. 38-39) es por daños, no define quién prueba la firma.", "ref": "u14-digital-vs-electronica"}, {"id": "m14-02", "b": 14, "tipo": "simple", "origen": "nueva", "pregunta": "¿Qué distingue jurídicamente a la firma digital de la firma electrónica?", "opciones": ["La digital usa criptografía simétrica y la electrónica usa criptografía asimétrica.", "La electrónica exige un token USB conectado a la computadora y la digital puede hacerse en forma remota.", "La digital tiene presunciones de autoría e integridad (arts. 7 y 8); la electrónica, ninguna.", "La digital cifra el contenido para que nadie lo lea; la electrónica no lo oculta."], "correctas": [2], "explicacion": "El cuadro del PPT es claro: la firma digital, con certificado de un certificador licenciado, goza de presunciones de autoría e integridad (arts. 7 y 8); la electrónica no tiene ninguna. No es la diferencia simétrica/asimétrica: la firma digital usa asimétrica y eso no define a la electrónica. No es el token: tanto token como remota son formas de firma digital. Y firmar no oculta el contenido, prueba quién firmó.", "ref": "u14-digital-vs-electronica"}, {"id": "m14-03", "b": 14, "tipo": "simple", "origen": "nueva", "pregunta": "Una startup tucumana hace que sus clientes acepten el contrato de servicio con un clic en “acepto”. ¿Qué clase de firma es?", "opciones": ["Firma digital, porque el clic queda registrado en el servidor de la empresa.", "Firma electrónica: es un medio de identificación al que le falta algún requisito legal para ser firma digital.", "Firma digital remota, porque se firma desde una plataforma web y sin token.", "Documento digitalizado, porque reproduce en pantalla un contrato pensado en papel."], "correctas": [1], "explicacion": "El PPT pone el clic en “acepto” como ejemplo típico de firma electrónica: le falta algún requisito legal (no hay certificado de un certificador licenciado). No es firma digital por quedar registrado: el registro no reemplaza la clave privada certificada. No es firma digital remota, que exige clave privada en un HSM del certificador y segundo factor. Y digitalizado es la foto o escaneo de un papel, no un clic.", "ref": "u14-digital-vs-electronica"}, {"id": "m14-04", "b": 14, "tipo": "simple", "origen": "nueva", "pregunta": "La Firma CiDi de Córdoba se confirma con un PIN. Según el PPT, ¿por qué es firma digital y no electrónica?", "opciones": ["Porque el PIN es información de exclusivo conocimiento del firmante, y eso alcanza para ser firma digital.", "Porque detrás usa certificados de la infraestructura oficial; el PIN solo abre la clave privada guardada en forma remota.", "Porque la ofrece un gobierno provincial, y toda firma ofrecida por el Estado es firma digital.", "Porque se entra con cuenta CiDi nivel 2, que cumple el mismo rol que la Clave Fiscal nivel 3 de ARCA."], "correctas": [1], "explicacion": "El PPT lo explica: Firma CiDi es digital porque usa certificados emitidos dentro de la infraestructura oficial de firma digital y el PIN solo abre la clave privada remota; por eso tiene las presunciones de la Ley 25.506. No alcanza con un PIN suelto: el cuadro del PPT lista el PIN como firma electrónica. Que la ofrezca el Estado no basta (la Clave Fiscal en el S.O.D.A. es electrónica). Y la cuenta de acceso no es lo que la vuelve digital.", "ref": "u14-digital-vs-electronica"}, {"id": "m14-05", "b": 14, "tipo": "simple", "origen": "nueva", "pregunta": "En el S.O.D.A. de la IGJ se ingresa con Clave Fiscal de ARCA nivel 3, y las constancias de inscripción salen firmadas por el funcionario. ¿Cómo lo califica el PPT?", "opciones": ["Las dos son firma digital, porque ambas las provee un organismo del Estado.", "La Clave Fiscal es firma digital con token y la constancia es un documento digitalizado.", "Las dos son firma electrónica, porque ninguna de las dos se estampa de puño y letra como la manuscrita.", "La Clave Fiscal funciona como firma electrónica; la constancia lleva firma digital del funcionario."], "correctas": [3], "explicacion": "El PPT usa la IGJ como “un organismo, dos tipos de firma”: usuario y clave = firma electrónica; certificado de un certificador licenciado = firma digital, que es lo que lleva la constancia del funcionario. No alcanza con que lo provea el Estado para que todo sea digital. La Clave Fiscal no es token. Y la constancia nace digital, no es un escaneo. Tampoco son ambas electrónicas: lo manuscrito no es el criterio.", "ref": "u14-digital-vs-electronica"}, {"id": "m14-06", "b": 14, "tipo": "multiple", "origen": "nueva", "pregunta": "Según el cuadro del PPT, ¿cuáles son ejemplos de firma electrónica (y no digital)? Seleccioná todas las correctas.", "opciones": ["Un clic en “acepto”.", "Un PIN.", "Una firma con certificado no licenciado.", "Una firma con token de un certificador licenciado.", "La firma remota oficial."], "correctas": [0, 1, 2], "explicacion": "El cuadro del PPT da como ejemplos de firma electrónica el clic en “acepto”, el PIN y el certificado no licenciado: a todos les falta algún requisito legal. No lo es la firma con token de un certificador licenciado, que el mismo cuadro pone como firma digital. Tampoco la firma remota oficial, también ejemplo de firma digital. Ojo: el PIN que solo abre una clave privada certificada (Firma CiDi) es otra cosa, ahí es digital.", "ref": "u14-digital-vs-electronica"}, {"id": "m14-07", "b": 14, "tipo": "vf", "origen": "nueva", "pregunta": "Si una firma electrónica es desconocida, quien la niega es el que debe probar que es falsa.", "opciones": ["Verdadero", "Falso"], "correctas": [1], "explicacion": "Falso. Esa regla (quien niega, prueba) es la de la firma digital, que tiene presunciones de autoría e integridad (arts. 7 y 8). Con la firma electrónica pasa lo contrario: si se la desconoce, quien la invoca debe probar (art. 5). Por eso el PPT resume toda la distinción en una pregunta: ¿quién tiene que probar? Es el punto más preguntado de la bolilla.", "ref": "u14-digital-vs-electronica"}, {"id": "m14-08", "b": 14, "tipo": "simple", "origen": "nueva", "pregunta": "Según el art. 2 de la Ley 25.506, la firma digital es:", "opciones": ["La imagen digitalizada de la firma manuscrita incorporada a un documento electrónico.", "Un conjunto de datos electrónicos que el firmante usa para identificarse, aunque le falte algún requisito legal para ser considerado firma digital.", "Un documento firmado por el certificador que vincula una clave pública con la identidad de su titular.", "Un procedimiento matemático que requiere información que solo conoce el firmante y que pueden verificar terceros."], "correctas": [3], "explicacion": "El art. 2 define la firma digital como un procedimiento matemático que requiere información que solo conoce el firmante (su clave privada) y que pueden verificar terceros. No es la imagen escaneada: eso es digitalizado y, como mucho, firma electrónica. No es el conjunto de datos al que le falta un requisito: esa es la firma electrónica. Y el documento del certificador que vincula clave y titular es el certificado.", "ref": "u14-firma-digital"}, {"id": "m14-09", "b": 14, "tipo": "simple", "origen": "nueva", "pregunta": "¿Por qué la firma digital usa criptografía asimétrica y no simétrica?", "opciones": ["Porque con una clave compartida no se puede probar quién fue; firmar exige algo que tenga una sola persona.", "Porque la simétrica es lenta y no sirve para documentos grandes.", "Porque la asimétrica oculta el contenido, y la finalidad de la firma es la confidencialidad.", "Porque en la asimétrica la clave privada se deduce de la pública, y así cualquiera puede verificar."], "correctas": [0], "explicacion": "El PPT lo dice: si Ana y David tienen la misma clave, cualquiera de los dos pudo escribir el mensaje; para firmar hace falta algo que tenga una sola persona, la clave privada. No es por lentitud: el PPT caracteriza a la simétrica como rápida. No es por confidencialidad: firmar no oculta el contenido. Y en la asimétrica es imposible en la práctica deducir una clave de la otra.", "ref": "u14-simetrica-asimetrica"}, {"id": "m14-10", "b": 14, "tipo": "vf", "origen": "nueva", "pregunta": "Si David cierra un mensaje con su propia clave privada, solo David puede abrirlo.", "opciones": ["Verdadero", "Falso"], "correctas": [1], "explicacion": "Falso. Lo que se cierra con la privada de David lo abre cualquiera con la pública de David, que está a la vista de todos. La gracia está en eso: si la pública lo abre, se cerró con la privada, y esa solo la tiene David, así que queda probado que fue él (firma). Lo que solo David puede abrir es lo que se cerró con su clave pública (confidencialidad).", "ref": "u14-simetrica-asimetrica"}, {"id": "m14-11", "b": 14, "tipo": "simple", "origen": "nueva", "pregunta": "En la firma digital, ¿qué se cifra con la clave privada del firmante?", "opciones": ["El documento entero, para que solo lo lea quien tenga la clave pública.", "La huella (hash) del documento.", "El certificado del firmante, para que el receptor conozca su clave pública.", "La clave pública del destinatario, para asegurar la confidencialidad del envío."], "correctas": [1], "explicacion": "Se firma la huella, no el archivo entero: el hash resume el documento en una cadena fija y eso se cifra con la clave privada. No se cifra el documento entero, y además firmar no oculta el contenido. El certificado lo firma el certificador, no el titular, y se manda junto con el contrato. Cifrar con la pública del destinatario es el uso de confidencialidad, no el de firma.", "ref": "u14-hash"}, {"id": "m14-12", "b": 14, "tipo": "multiple", "origen": "nueva", "pregunta": "¿Cuáles son las tres propiedades técnicas que garantiza la firma digital según el PPT? Seleccioná todas las correctas.", "opciones": ["Autoría", "Integridad", "No repudio", "Confidencialidad", "Vigencia"], "correctas": [0, 1, 2], "explicacion": "El PPT enumera tres propiedades técnicas: autoría (solo el titular tiene la clave privada), integridad (la huella coincide) y no repudio (el firmante no puede negar después que fue él); la ley las convierte en presunciones. No es confidencialidad: firmar no oculta el contenido; eso se logra cifrando con la pública del destinatario. Y la vigencia es un atributo del certificado y un requisito de validez del art. 9, no una propiedad técnica.", "ref": "u14-propiedades"}, {"id": "m14-13", "b": 14, "tipo": "multiple", "origen": "nueva", "pregunta": "Según el art. 9, ¿cuáles son requisitos de validez de la firma digital? Seleccioná todas las correctas.", "opciones": ["Creada con un certificado vigente.", "Verificada con los datos del certificado.", "Certificado emitido por un certificador licenciado.", "Que el titular haya validado su identidad en persona.", "Que se haya firmado con token USB."], "correctas": [0, 1, 2], "explicacion": "El art. 9 exige tres cosas: certificado vigente al crearla, verificación con sus datos y emisión por un certificador licenciado; son los tres “sí” que muestra el lector de PDF. No exige presencialidad: desde el Dec. 743/2024 la identidad se valida a distancia con biometría contra el RENAPER. Tampoco exige token: la firma remota, con la clave en un HSM del certificador, es firma digital válida.", "ref": "u14-presunciones-validez"}, {"id": "m14-14", "b": 14, "tipo": "vf", "origen": "nueva", "pregunta": "La presunción de autoría del art. 7 admite prueba en contrario.", "opciones": ["Verdadero", "Falso"], "correctas": [0], "explicacion": "Verdadero. El art. 7 dice que se presume, salvo prueba en contrario, que la firma pertenece al titular del certificado que la verifica. Es una presunción, no una certeza absoluta: el titular puede probar que no firmó, pero la carga es suya. Lo mismo pasa con la integridad (art. 8). Por eso con firma digital quien la niega debe probar, a diferencia de la electrónica.", "ref": "u14-presunciones-validez"}, {"id": "m14-15", "b": 14, "tipo": "simple", "origen": "nueva", "pregunta": "Un cliente de un estudio jurídico quiere firmar su testamento con firma digital remota. ¿Es válido?", "opciones": ["Sí: cuando la ley exige firma manuscrita, la firma digital cumple esa exigencia (art. 3).", "Sí, siempre que el certificado esté vigente y lo haya emitido un certificador licenciado (art. 9).", "No: las disposiciones por causa de muerte están excluidas de la firma digital (art. 4).", "Solo con token, porque la firma remota no goza de la presunción de autoría."], "correctas": [2], "explicacion": "El art. 4 excluye de la firma digital las disposiciones por causa de muerte, los actos de familia, los personalísimos y las formalidades incompatibles; el repaso del PPT lo pregunta así: ¿testamento con firma digital? No. La equivalencia del art. 3 existe, pero cede ante las exclusiones. Cumplir el art. 9 no salva un acto excluido. Y la firma remota sí es firma digital, con las mismas presunciones que la de token.", "ref": "u14-equivalencia-exclusiones"}, {"id": "m14-16", "b": 14, "tipo": "simple", "origen": "nueva", "pregunta": "Un estudio contable escanea un contrato firmado a mano y lo guarda como PDF. ¿Qué es ese archivo?", "opciones": ["Un documento digital firmado, porque al guardarse como PDF nace electrónico.", "Un original digital (art. 11), porque sus copias idénticas también valen.", "Un documento digitalizado: reproduce un original en papel y no trae ninguna garantía propia.", "Un documento con firma digital, porque la firma manuscrita escaneada equivale a la digital (art. 3)."], "correctas": [2], "explicacion": "Digital no es lo mismo que digitalizado: el escaneo es una foto de un papel, se puede editar, recortar o pegar y no trae garantía propia. No es un documento digital firmado, que nace y vive electrónico con firma digital. El art. 11 habla del documento firmado digitalmente, no de un escaneo. Y la firma escaneada no es firma digital: como mucho es firma electrónica, sin presunciones.", "ref": "u14-digital-digitalizado"}, {"id": "m14-17", "b": 14, "tipo": "simple", "origen": "nueva", "pregunta": "¿Qué es el certificado digital según el PPT?", "opciones": ["Un dispositivo físico que guarda la clave privada del titular, como un token USB o una tarjeta con chip.", "Un documento firmado por el certificador que dice que esa clave pública es de esa persona.", "El trámite por el que una autoridad de registro valida la identidad del solicitante.", "La licencia que la autoridad de aplicación otorga al certificador para operar."], "correctas": [1], "explicacion": "El certificado (arts. 13-14) es un documento firmado por el certificador que dice: “esta clave pública es de esta persona”; responde a ¿cómo sé que esa clave es de David? No es el token, que es donde vive la clave privada. No es la validación de identidad, que hace la autoridad de registro antes de emitirlo. Y no es la licencia, que la autoridad de aplicación otorga al certificador.", "ref": "u14-certificado"}, {"id": "m14-18", "b": 14, "tipo": "vf", "origen": "nueva", "pregunta": "En la cadena de confianza, la Corte de Tucumán aparece en el PPT como certificador licenciado.", "opciones": ["Verdadero", "Falso"], "correctas": [1], "explicacion": "Falso. El PPT pone a la Corte de Tucumán como ejemplo de autoridad de registro, que valida la identidad. Los certificadores licenciados, que emiten y revocan certificados, son por ejemplo AC ONTI y AC Modernización-PFDR. Arriba está la autoridad de aplicación (Jefatura de Gabinete, vía la Secretaría de Innovación, Ciencia y Tecnología), que licencia y controla.", "ref": "u14-cadena-confianza"}, {"id": "m14-19", "b": 14, "tipo": "simple", "origen": "nueva", "pregunta": "Un desarrollador de una software factory tucumana le presta su token a un compañero para que firme por él durante sus vacaciones. ¿Qué deber incumple?", "opciones": ["El del titular (art. 25): mantener el control exclusivo de su clave privada y no prestar el token.", "El del certificador (art. 19): identificar cada certificado sin ambigüedad.", "El del certificador (art. 19): publicar el estado de los certificados emitidos.", "El de la autoridad de registro: validar la identidad antes de emitir."], "correctas": [0], "explicacion": "Prestar el token viola el deber del titular del art. 25: mantener el control exclusivo de su clave privada y no compartirla ni prestar el token. Identificar sin ambigüedad y publicar el estado de los certificados son deberes del certificador (art. 19), que acá no hizo nada mal. Y validar la identidad es función de la autoridad de registro, ajena a lo que hizo el desarrollador.", "ref": "u14-deberes"}, {"id": "m14-20", "b": 14, "tipo": "multiple", "origen": "nueva", "pregunta": "Sobre la firma con token y la firma remota, ¿cuáles afirmaciones son correctas según el PPT? Seleccioná todas las correctas.", "opciones": ["Con token, la clave privada está en un USB o tarjeta que tiene el titular.", "En la remota, la clave privada está en un HSM del certificador.", "La remota es firma electrónica, porque se entra con usuario y contraseña.", "El riesgo de la remota es que roben las credenciales de acceso.", "Con token se firma desde cualquier lado y sin hardware."], "correctas": [0, 1, 3], "explicacion": "El cuadro del PPT: con token la clave está en un USB o tarjeta del titular; en la remota, en un HSM del certificador, y su riesgo es el robo de credenciales. No es correcto que la remota sea electrónica: es firma digital válida (cambia dónde vive la clave), y el usuario con segundo factor solo da acceso a la clave certificada. Firmar desde cualquier lado sin hardware es la ventaja de la remota, no del token.", "ref": "u14-token-remota"}, {"id": "m15-q1", "b": 15, "tipo": "simple", "origen": "quiz", "pregunta": "¿Qué es trabajo para la LCT?", "opciones": ["La prestación efectiva de las tareas en favor de otro, que la ley protege aunque no haya nada escrito entre las partes.", "El acuerdo por el cual una persona humana presta servicios bajo la dependencia de otra a cambio de una remuneración.", "Toda actividad lícita que se preste en favor de quien tiene la facultad de dirigirla, mediante una remuneración.", "Toda prestación personal de servicios, hecha por una persona humana o jurídica, a cambio de un precio cierto en dinero."], "correctas": [2], "explicacion": "Es la definición textual del art. 4 LCT: actividad lícita, en favor de quien tiene la facultad de dirigirla, mediante una remuneración (notas: licitud, dirección, personal, remuneración). No es la idea de «precio cierto» con persona jurídica, porque eso describe una locación y el trabajo es personal. No es el acuerdo bajo dependencia, porque esa es la definición de contrato (art. 21). No es la prestación efectiva sin nada escrito, porque esa es la relación de trabajo (art. 22).", "ref": "u15-trabajo"}, {"id": "m15-q2", "b": 15, "tipo": "simple", "origen": "quiz", "pregunta": "¿Qué es la Ley de Contrato de Trabajo y cómo quedó tras las reformas?", "opciones": ["La Ley 27.742 (Ley Bases, 2024), que regula el trabajo en relación de dependencia y eliminó la obligación de registrar al trabajador desde el primer día.", "La Ley 20.744, que regula el empleo público y el privado; la Ley 27.742 la derogó en julio de 2024 al fijar el período de prueba de 6 meses para todos.", "La Ley 20.744 (1974/1976), que regula el trabajo en relación de dependencia en el sector privado; sigue vigente, reformada por las Leyes 27.742 y 27.802.", "La Ley 27.802 de Modernización Laboral (2026), que derogó la Ley 20.744 y la reemplazó por un régimen nuevo para el trabajo dependiente del sector privado."], "correctas": [2], "explicacion": "La LCT es la Ley 20.744 (1974/1976) y regula el trabajo en relación de dependencia en el sector privado; según el PPT no fue derogada: es la misma ley, con muchos artículos con texto nuevo por la Ley 27.742 (2024) y la Ley 27.802 (2026). No es la Ley 27.802 como ley nueva, porque esta reformó más de 50 artículos sin derogar la LCT. No regula el empleo público ni fue derogada en 2024. No es la Ley 27.742, que derogó las multas por falta de registro pero no la obligación de registrar.", "ref": "u15-lct-reformas"}, {"id": "m15-q3", "b": 15, "tipo": "multiple", "origen": "quiz", "pregunta": "¿Cuáles de los siguientes son principios que protegen al trabajador según el PPT? Seleccioná todas las correctas.", "opciones": ["Ocupación efectiva (art. 78): el empleador debe dar tareas al trabajador.", "Ius variandi (art. 66): cambios razonables, sin dañar al trabajador.", "Gratuidad (art. 20): los trámites y juicios no le cuestan al trabajador.", "Primacía de la realidad (art. 14): importan los hechos, no el nombre del contrato.", "Irrenunciabilidad (art. 12): no se puede renunciar a derechos de la ley o del convenio."], "correctas": [2, 3, 4], "explicacion": "El PPT enumera seis principios: irrenunciabilidad (art. 12), norma más favorable (art. 9), continuidad (art. 10), primacía de la realidad (art. 14), no discriminación (arts. 17 y 81) y gratuidad (art. 20); tres de ellos están entre las opciones. No es principio el ius variandi, porque es una facultad del empleador (art. 66) que la ley le reconoce y limita. Tampoco la ocupación efectiva, porque es un deber del empleador (art. 78), no un principio interpretativo del derecho del trabajo.", "ref": "u15-principios"}, {"id": "m15-q4", "b": 15, "tipo": "multiple", "origen": "quiz", "pregunta": "¿Cuáles de los siguientes son deberes del empleador? Seleccioná todas las correctas.", "opciones": ["No concurrencia (art. 88): no competir con la empresa.", "Diligencia (art. 79): aportes y documentación al día.", "Disciplina (art. 67): aplicar al trabajador sanciones proporcionales a sus faltas.", "Ocupación efectiva (art. 78): dar tareas.", "Certificados (art. 80): al terminar; hoy pueden ser digitales."], "correctas": [1, 3, 4], "explicacion": "Los deberes del empleador del PPT son: pagar el sueldo (art. 74), seguridad (art. 75), ocupación efectiva (art. 78), diligencia (art. 79), certificados (art. 80) e igualdad y registro (arts. 81 y 52). No es deber del empleador la no concurrencia, porque el art. 88 obliga al trabajador a no competir con su empleador. La disciplina tampoco es un deber: es una facultad del empleador (art. 67), que la ley le reconoce para sancionar con proporcionalidad, no algo que deba prestar.", "ref": "u15-deberes-empleador"}, {"id": "m15-q5", "b": 15, "tipo": "simple", "origen": "quiz", "pregunta": "¿Cuáles son los deberes del trabajador?", "opciones": ["Diligencia, fidelidad, obediencia, no concurrencia y responder por daños solo con dolo o culpa grave.", "Irrenunciabilidad, norma más favorable, continuidad, primacía de la realidad y gratuidad.", "Pagar el sueldo, seguridad, ocupación efectiva, diligencia, certificados, igualdad y registro.", "Organización, dirección, ius variandi, disciplina y control discreto y razonable del trabajo."], "correctas": [0], "explicacion": "Los deberes del trabajador del PPT son diligencia (art. 84), fidelidad (art. 85: reserva sobre código, datos y credenciales), obediencia (art. 86: órdenes legítimas), no concurrencia (art. 88) y daños (art. 87: responde solo por dolo o culpa grave). No es la lista de pagar el sueldo, seguridad y ocupación efectiva, porque esos son deberes del empleador (arts. 74 a 81). No es organización, dirección e ius variandi, porque son facultades del empleador. No son irrenunciabilidad y continuidad, porque son principios protectorios.", "ref": "u15-deberes-trabajador"}, {"id": "m15-q6", "b": 15, "tipo": "simple", "origen": "quiz", "pregunta": "¿Cuáles son los derechos (facultades) del empleador?", "opciones": ["Diligencia, fidelidad, obediencia, no concurrencia y responder por daños.", "Organización, dirección, ius variandi, disciplina y control.", "Pagar el sueldo, dar seguridad, ocupación efectiva y entregar certificados.", "Capacidad, consentimiento, objeto lícito y no prohibido, y forma libre."], "correctas": [1], "explicacion": "Las facultades del empleador del PPT son organización (art. 64), dirección (art. 65, respetando la dignidad), ius variandi (art. 66, cambios razonables), disciplina (art. 67, sanciones proporcionales) y control (art. 70, discreto y razonable). No son pagar el sueldo, seguridad y certificados, porque esos son deberes del empleador. No son capacidad, consentimiento, objeto y forma, porque son los requisitos del contrato. No son diligencia, fidelidad y obediencia, porque son deberes del trabajador.", "ref": "u15-facultades"}, {"id": "m15-01", "b": 15, "tipo": "simple", "origen": "nueva", "pregunta": "Una software factory tucumana contrata a Tomás como monotributista: trabaja de 9 a 18, con la notebook de la empresa, y un jefe le asigna tareas y le controla las horas. ¿Qué principio permite sostener que es empleado aunque facture?", "opciones": ["Primacía de la realidad (art. 14).", "Continuidad del contrato (art. 10).", "Irrenunciabilidad de derechos (art. 12).", "Norma más favorable (art. 9)."], "correctas": [0], "explicacion": "Por primacía de la realidad (art. 14) importan los hechos, no el nombre del contrato: horario fijo, herramientas de la empresa y un jefe que da órdenes muestran dependencia aunque Tomás facture. No es la norma más favorable, que resuelve dudas entre normas o interpretaciones. No es la continuidad, que ante la duda presume que el contrato sigue, no que exista. No es la irrenunciabilidad, que impide renunciar a derechos de la ley o del convenio, pero no califica el vínculo.", "ref": "u15-principios"}, {"id": "m15-02", "b": 15, "tipo": "simple", "origen": "nueva", "pregunta": "Según el PPT, ¿cuál es la nota decisiva de la dependencia laboral?", "opciones": ["La jurídica: el empleador da órdenes y el trabajador debe cumplirlas.", "La económica: el trabajador vive de su sueldo y no asume el riesgo.", "La personal: la actividad la presta el propio trabajador, sin delegar.", "La técnica: el empleador decide cómo, cuándo y dónde se trabaja."], "correctas": [0], "explicacion": "La dependencia se da en triple sentido y el PPT marca la jurídica (dar órdenes que deben cumplirse) como la nota decisiva. La técnica existe, pero describe la decisión de cómo, cuándo y dónde se trabaja, y no es la que el PPT señala como decisiva. La económica también existe (vivir del sueldo, riesgo del empleador), pero tampoco es la decisiva. Lo «personal» no es un sentido de la dependencia: es una de las notas del concepto de trabajo del art. 4.", "ref": "u15-dependencia"}, {"id": "m15-03", "b": 15, "tipo": "simple", "origen": "nueva", "pregunta": "Según el PPT, desde 2026, ¿cuándo deja de regir la presunción del art. 23 LCT?", "opciones": ["Cuando hay facturación y pago bancarizado.", "Cuando la jornada es a tiempo parcial (art. 92 ter).", "Cuando el trabajador está en período de prueba.", "Cuando no hay contrato escrito entre las partes."], "correctas": [0], "explicacion": "El art. 23 presume el contrato de trabajo por el hecho de prestar servicios; desde 2026 no rige si hay facturación y pago bancarizado. La falta de contrato escrito no la excluye: la relación (art. 22) se protege aunque no haya nada escrito y la forma es libre (art. 48). El período de prueba no la excluye: el trabajador a prueba tiene contrato, registro y derechos. El tiempo parcial es una modalidad del contrato de trabajo, no una excepción a la presunción.", "ref": "u15-contrato-relacion"}, {"id": "m15-04", "b": 15, "tipo": "simple", "origen": "nueva", "pregunta": "Una startup de 40 empleados quiere fijar un período de prueba de 8 meses para sus desarrolladores. ¿Es posible?", "opciones": ["Sí, por acuerdo individual con cada trabajador, porque la forma es libre (art. 48).", "Sí, si lo prevé el convenio: en empresas de 6 a 100 trabajadores puede llegar a 8 meses.", "No: desde la Ley 27.742 el período de prueba es de 6 meses, sin ninguna excepción.", "No: los 8 meses por convenio solo rigen en empresas de hasta 5 trabajadores."], "correctas": [1], "explicacion": "Según el art. 92 bis, la regla general desde la Ley 27.742 es de 6 meses, pero por convenio puede ser de 8 meses en empresas de 6 a 100 trabajadores y de 1 año en empresas de hasta 5. No es cierto que no haya excepciones: el PPT prevé ampliaciones por convenio. No alcanza un acuerdo individual, porque la ampliación es por convenio y la libertad de formas del art. 48 no tiene que ver con la duración de la prueba. Para empresas de hasta 5 trabajadores el plazo es 1 año, no 8 meses.", "ref": "u15-periodo-prueba"}, {"id": "m15-05", "b": 15, "tipo": "simple", "origen": "nueva", "pregunta": "En el concepto de trabajo del art. 4 LCT, ¿qué significa la nota «dirección»?", "opciones": ["Que otro organiza y dirige la actividad.", "Que la presta el propio trabajador.", "Que la actividad es legal.", "Que hay un pago a cambio de la tarea."], "correctas": [0], "explicacion": "El PPT descompone el art. 4 en cuatro notas: licitud (la actividad es legal), dirección (otro organiza y dirige), personal (lo presta el propio trabajador) y remuneración (hay un pago a cambio). La nota «dirección» es la de otro que organiza y dirige. Que la preste el propio trabajador es la nota «personal». Que la actividad sea legal es la «licitud». Que haya un pago a cambio es la «remuneración»: todas son notas del art. 4, pero no la que se pregunta.", "ref": "u15-trabajo"}, {"id": "m15-06", "b": 15, "tipo": "simple", "origen": "nueva", "pregunta": "Al terminar una relación laboral no queda claro si el contrato se extinguió o sigue vigente. ¿Qué principio resuelve la duda?", "opciones": ["Continuidad (art. 10): ante la duda, el contrato sigue.", "Norma más favorable (art. 9): se aplica la ley más benigna.", "Primacía de la realidad (art. 14): importan los hechos.", "Gratuidad (art. 20): los trámites no le cuestan al trabajador."], "correctas": [0], "explicacion": "El principio de continuidad (art. 10) dice que, ante la duda, el contrato sigue: es el que responde si el vínculo terminó o no. No es la norma más favorable, que decide entre normas o interpretaciones, no sobre la subsistencia del contrato. No es la primacía de la realidad, que hace prevalecer los hechos sobre el nombre del contrato. No es la gratuidad, que solo asegura que los trámites y juicios no le cuesten al trabajador.", "ref": "u15-principios"}, {"id": "m15-07", "b": 15, "tipo": "simple", "origen": "nueva", "pregunta": "Un empleador deja a una analista de datos durante semanas sin asignarle ninguna tarea, como castigo por un reclamo. ¿Qué deber incumple?", "opciones": ["Diligencia (art. 79).", "Ocupación efectiva (art. 78).", "Seguridad (art. 75).", "Igualdad de trato (art. 81)."], "correctas": [1], "explicacion": "El deber de ocupación efectiva (art. 78) obliga al empleador a dar tareas; tener a alguien sin tareas como castigo lo viola. No es el deber de seguridad (art. 75), que consiste en proteger la vida y la salud del trabajador. No es la diligencia (art. 79), que se refiere a tener los aportes y la documentación al día. No es la igualdad de trato (art. 81), que prohíbe distinciones arbitrarias entre trabajadores, y aunque podría discutirse en el caso, no es el deber que describe la conducta.", "ref": "u15-deberes-empleador"}, {"id": "m15-08", "b": 15, "tipo": "simple", "origen": "nueva", "pregunta": "A Martín hace tres meses que no le pagan el sueldo; intima a su empleador por telegrama y no obtiene respuesta. Según el PPT, ¿qué puede hacer?", "opciones": ["Renunciar (art. 240) dando 15 días de preaviso y cobrar la indemnización por antigüedad.", "Invocar despido con justa causa (art. 242), que le da derecho a la indemnización completa.", "Considerarse despedido (despido indirecto, art. 246) y reclamar la indemnización completa por antigüedad.", "Alegar fuerza mayor o falta de trabajo (art. 247) para cobrar el 50% de la indemnización."], "correctas": [2], "explicacion": "Ante un incumplimiento grave del empleador, el trabajador lo intima y, si no responde, se considera despedido con derecho a indemnización completa (despido indirecto, art. 246). La renuncia no da indemnización por antigüedad: solo la liquidación final. El despido con justa causa (art. 242) es el que hace el empleador por incumplimiento grave del trabajador y no da indemnización. La fuerza mayor (art. 247) es una causa ajena que no describe el impago del sueldo.", "ref": "u15-justa-causa-indirecto"}, {"id": "m15-09", "b": 15, "tipo": "simple", "origen": "nueva", "pregunta": "Un desarrollador es despedido sin causa con 3 años y 2 meses de antigüedad. ¿Cuántos sueldos le corresponden por el art. 245?", "opciones": ["2 meses: es el preaviso del empleador con más de 5 años.", "3 sueldos: los 2 meses no superan la fracción de 3 meses.", "1 sueldo: es el mínimo que garantiza el art. 245.", "4 sueldos: toda fracción de año se computa como año entero."], "correctas": [1], "explicacion": "La fórmula del art. 245 es un sueldo por año o fracción mayor de 3 meses: con 3 años y 2 meses la fracción no supera 3 meses, así que son 3 sueldos. No toda fracción cuenta como año: solo la mayor de 3 meses (en Lucía, 8 meses sí). El mínimo de un sueldo es un piso, no el resultado cuando hay más años. Los 2 meses son el preaviso del empleador con más de 5 años de antigüedad, otro rubro distinto de la indemnización por antigüedad.", "ref": "u15-indemnizacion"}, {"id": "m15-10", "b": 15, "tipo": "simple", "origen": "nueva", "pregunta": "Una empresa monitorea la pantalla, el correo corporativo y el GPS de sus empleados. Según el PPT, ¿cómo debe ser ese control (art. 70)?", "opciones": ["Previsto en el contrato escrito (art. 48).", "Proporcional a la falta cometida (art. 67).", "Con autorización judicial previa.", "Discreto y razonable."], "correctas": [3], "explicacion": "El PPT dice que la facultad de control (art. 70) debe ser discreta y razonable, y pone como ejemplos el correo, la pantalla y el GPS. No exige autorización judicial previa. La proporcionalidad con la falta es el límite de la facultad disciplinaria (art. 67: sanciones proporcionales), no del control. El art. 48 consagra la libertad de formas del contrato (verbal o escrito), no un requisito para controlar al trabajador.", "ref": "u15-facultades"}, {"id": "m15-11", "b": 15, "tipo": "simple", "origen": "nueva", "pregunta": "Un desarrollador comparte con un amigo las credenciales de acceso al servidor de producción de su empleador. ¿Qué deber del trabajador incumple?", "opciones": ["Diligencia (art. 84).", "Obediencia (art. 86).", "Fidelidad (art. 85).", "No concurrencia (art. 88)."], "correctas": [2], "explicacion": "La fidelidad (art. 85) exige reserva sobre código, datos y credenciales: compartir credenciales la viola de lleno. No es la no concurrencia (art. 88), que prohíbe competir con el empleador y aquí no hay competencia. No es la obediencia (art. 86), que obliga a cumplir órdenes legítimas y no hay una orden incumplida. La diligencia (art. 84) es trabajar con cuidado y responsabilidad: podría rozarse, pero el deber específico sobre credenciales es la fidelidad.", "ref": "u15-deberes-trabajador"}, {"id": "m15-12", "b": 15, "tipo": "simple", "origen": "nueva", "pregunta": "Por una reorganización del equipo, la empresa cambia el horario de un analista de 9-17 a 10-18, sin perjuicio para él. ¿Qué facultad ejerce?", "opciones": ["Dirección (art. 65).", "Organización (art. 64).", "Ius variandi (art. 66).", "Disciplina (art. 67)."], "correctas": [2], "explicacion": "El ius variandi (art. 66) permite cambios razonables en la forma de prestar el trabajo, sin dañar al trabajador: cambiar el horario sin perjuicio encaja. La dirección (art. 65) es dar órdenes sobre el trabajo diario respetando la dignidad, no modificar condiciones. La organización (art. 64) es organizar la empresa en general, no alterar el contrato de un trabajador. La disciplina (art. 67) es aplicar sanciones proporcionales, y aquí no hay sanción alguna.", "ref": "u15-facultades"}, {"id": "m15-13", "b": 15, "tipo": "multiple", "origen": "nueva", "pregunta": "¿Cuáles de las siguientes son facultades del empleador según el PPT? Seleccioná todas las correctas.", "opciones": ["Continuidad (art. 10): ante la duda, se entiende que el contrato de trabajo sigue.", "Dirección (art. 65): dar órdenes, respetando la dignidad.", "Disciplina (art. 67): sanciones proporcionales.", "Ocupación efectiva (art. 78): dar tareas.", "No concurrencia (art. 88): no competir con el empleador."], "correctas": [1, 2], "explicacion": "Dirección (art. 65) y disciplina (art. 67) son facultades del empleador, junto con organización (art. 64), ius variandi (art. 66) y control (art. 70). No es facultad la ocupación efectiva, porque es un deber del empleador (art. 78) hacia el trabajador. No lo es la no concurrencia, que es un deber del trabajador (art. 88). Tampoco la continuidad, que es un principio protectorio (art. 10) que favorece la conservación del contrato.", "ref": "u15-facultades"}, {"id": "m15-14", "b": 15, "tipo": "multiple", "origen": "nueva", "pregunta": "Durante el período de prueba (art. 92 bis), ¿qué es correcto según el PPT? Seleccioná todas las correctas.", "opciones": ["El empleador puede pagar menos que el salario mínimo, vital y móvil mientras dure la prueba.", "El trabajador no tiene obra social ni ART hasta que vence la prueba.", "Cualquiera de las partes puede terminar el contrato sin indemnización.", "El trabajador debe estar registrado desde el primer día.", "Desde 2026 no se exige preaviso para terminarlo."], "correctas": [2, 3, 4], "explicacion": "El PPT resume el período de prueba: sin indemnización y, desde 2026, sin preaviso; con registro desde el primer día; y con derechos (sueldo, aportes, obra social y ART). Es falso que el trabajador carezca de obra social o ART durante la prueba: el PPT dice expresamente que los tiene. También es falso que pueda pagarse menos que el salario mínimo, vital y móvil, porque la remuneración nunca puede ser inferior a ese mínimo y la irrenunciabilidad lo impide.", "ref": "u15-periodo-prueba"}, {"id": "m15-15", "b": 15, "tipo": "multiple", "origen": "nueva", "pregunta": "¿En cuáles de estas causas de extinción NO hay indemnización por antigüedad según el PPT? Seleccioná todas las correctas.", "opciones": ["Despido indirecto (art. 246).", "Despido con justa causa (art. 242).", "Renuncia (art. 240).", "Muerte del trabajador (art. 248).", "Jubilación (art. 252)."], "correctas": [1, 2, 4], "explicacion": "Según el cuadro del PPT no hay indemnización por antigüedad en la renuncia (solo la liquidación final), en el despido con justa causa ni en la jubilación; en el mutuo acuerdo, solo lo que se pacte. Sí la hay en el despido indirecto (art. 246), que da la indemnización completa como el despido sin causa. También la hay en la muerte del trabajador (art. 248): el 50% para sus derechohabientes. La fuerza mayor da el 50%.", "ref": "u15-extincion"}, {"id": "m15-16", "b": 15, "tipo": "multiple", "origen": "nueva", "pregunta": "Lucía, desarrolladora con 4 años y 8 meses de antigüedad y sueldo de $1.000.000, es despedida sin causa ni preaviso el día 10. ¿Qué rubros figuran en su liquidación según el PPT? Seleccioná todas las correctas.", "opciones": ["Antigüedad (art. 245): 5 sueldos, $5.000.000.", "Integración del mes (art. 233): 20 días restantes.", "Preaviso (art. 232): 1 mes, $1.000.000.", "Indemnización agravada que suma un año de sueldos al despido sin causa.", "Preaviso de 2 meses, porque supera los 4 años."], "correctas": [0, 1, 2], "explicacion": "El PPT liquida a Lucía así: antigüedad 5 sueldos porque los 8 meses superan 3 ($5.000.000), preaviso de 1 mes por tener menos de 5 años ($1.000.000) e integración del mes por los 20 días restantes, más días trabajados, SAC y vacaciones proporcionales. No corresponde preaviso de 2 meses, que es para más de 5 años de antigüedad. No hay indemnización agravada: el caso no presenta matrimonio, maternidad ni discriminación.", "ref": "u15-indemnizacion"}, {"id": "m15-17", "b": 15, "tipo": "vf", "origen": "nueva", "pregunta": "La Ley 27.802 de Modernización Laboral derogó la Ley de Contrato de Trabajo y la reemplazó por un régimen nuevo.", "opciones": ["Verdadero", "Falso"], "correctas": [1], "explicacion": "Falso. El PPT es explícito: la LCT no fue derogada; es la misma ley (20.744), con muchos artículos con texto nuevo. La Ley 27.802, publicada y vigente desde el 6/3/2026, reformó más de 50 artículos de la LCT; antes, la Ley 27.742 (julio 2024) fijó el período de prueba de 6 meses y terminó con las multas por falta de registro. Por eso siempre hay que usar el texto actualizado.", "ref": "u15-lct-reformas"}, {"id": "m15-18", "b": 15, "tipo": "vf", "origen": "nueva", "pregunta": "Según el PPT, la forma del contrato de trabajo es libre: puede ser verbal o escrito (art. 48), salvo excepciones.", "opciones": ["Verdadero", "Falso"], "correctas": [0], "explicacion": "Verdadero. Entre los requisitos del contrato (capacidad, consentimiento, objeto y forma), el PPT dice que la forma es libre: verbal o escrito (art. 48), salvo excepciones. Una excepción es el plazo fijo, que según el cuadro de modalidades va por escrito y justificado. Esto se relaciona con el art. 22: la relación de trabajo se protege aunque no haya nada escrito.", "ref": "u15-requisitos"}, {"id": "m15-19", "b": 15, "tipo": "vf", "origen": "nueva", "pregunta": "Según el art. 87 LCT, el trabajador responde por los daños que cause a la empresa solo si actuó con dolo o culpa grave.", "opciones": ["Verdadero", "Falso"], "correctas": [0], "explicacion": "Verdadero. Entre los deberes del trabajador, el PPT ubica «Daños (art. 87): responde solo por dolo o culpa grave». Es decir, no responde por cualquier error o culpa leve en su trabajo, lo que es coherente con el carácter protectorio del derecho del trabajo. Los demás deberes son diligencia (art. 84), fidelidad (art. 85), obediencia (art. 86) y no concurrencia (art. 88).", "ref": "u15-deberes-trabajador"}, {"id": "m15-20", "b": 15, "tipo": "vf", "origen": "nueva", "pregunta": "La reforma de 2026 cambió la fórmula de la indemnización por antigüedad: ya no corresponde un sueldo por año trabajado.", "opciones": ["Verdadero", "Falso"], "correctas": [1], "explicacion": "Falso. El PPT dice que la reforma de 2026 cambió la base, no la fórmula: sigue siendo un sueldo por año o fracción mayor de 3 meses (art. 245). Lo que cambió es la base: mejor sueldo mensual del último año, sin aguinaldo ni lo no mensual. Siguen el tope (3 veces el promedio del convenio), el piso del 67% del sueldo real (Vizzoti, 2004) y el mínimo de un sueldo.", "ref": "u15-indemnizacion"}, {"id": "m17-q1", "b": 17, "tipo": "simple", "origen": "quiz", "pregunta": "¿Qué es la confidencialidad?", "opciones": ["La protección integral de los datos personales asentados en archivos, registros o bancos de datos, para garantizar el honor y la intimidad.", "Lo que se hace o se dice en confianza y con reserva entre dos o más personas, garantizando que se mantendrá la discreción sobre la información compartida.", "El derecho exclusivo y temporal del autor o inventor sobre su obra, invento o descubrimiento.", "El deber del trabajador de cumplir las órdenes legítimas del empleador."], "correctas": [1], "explicacion": "Es la definición del PPT tomada de la RAE, que el quiz copió: lo que se hace o se dice en confianza y con reserva, garantizando la discreción; el PPT agrega que es información que da ventaja competitiva y cuya divulgación podría causar perjuicio. No es el objeto de la Ley 25.326 de datos personales, que protege a la persona titular de los datos. No es el derecho intelectual de la Bolilla 8. Y no es el deber de obediencia del trabajador, que nada tiene que ver con la reserva de información.", "ref": "u17-confidencialidad"}, {"id": "m17-q2", "b": 17, "tipo": "multiple", "origen": "quiz", "pregunta": "¿Qué requisitos tiene que tener la información para ser confidencial? Seleccioná todas las correctas.", "opciones": ["Que sea secreta: no conocida ni fácilmente accesible para quienes habitualmente manejan ese tipo de información.", "Que haya sido registrada ante el organismo competente.", "Que tenga valor comercial por ser secreta.", "Que cumpla los requisitos de novedad, altura inventiva y aplicación industrial.", "Que haya sido objeto de medidas razonables de protección para mantener su confidencialidad."], "correctas": [0, 2, 4], "explicacion": "Los tres requisitos del PPT (y de la respuesta del quiz) son que sea secreta, que tenga valor comercial por ser secreta y que haya sido objeto de medidas razonables de protección; deben cumplirse simultáneamente. El registro no es requisito: la protección de la información no depende de registrar algo, como muestra el ejemplo de Pepsi. Y novedad, altura inventiva y aplicación industrial son los requisitos de las patentes, la alternativa que exige revelar la información.", "ref": "u17-info-confidencial"}, {"id": "m17-q3", "b": 17, "tipo": "multiple", "origen": "quiz", "pregunta": "¿Qué tipos de información se consideran confidenciales? Seleccioná todas las correctas.", "opciones": ["Financiera.", "Técnica y científica.", "Sensible (origen racial, opiniones políticas, salud).", "Comercial.", "Negativa."], "correctas": [0, 1, 3, 4], "explicacion": "El PPT enumera cuatro tipos: financiera, técnica y científica, comercial y negativa (lo que no funciona). La categoría «sensible» no es un tipo de secreto comercial: es la clasificación de datos personales de la Ley 25.326 (Bolilla 13), que protege a la persona titular de los datos y no la ventaja competitiva de la empresa.", "ref": "u17-tipos"}, {"id": "m17-01", "b": 17, "tipo": "simple", "origen": "nueva", "pregunta": "Una startup tucumana tiene una lista de 40 fincas clientes con el precio especial pactado con cada una. ¿Qué tipo de información confidencial es?", "opciones": ["Financiera.", "Comercial.", "Técnica y científica.", "Negativa."], "correctas": [1], "explicacion": "Es comercial: incluye lo que da ventaja en la gestión del negocio, las ventas o las relaciones con clientes y proveedores; el PPT menciona las listas de clientes y los acuerdos de precios especiales. No es financiera, que son datos económicos o contables (márgenes, costos, proyecciones) sobre la situación de la empresa. No es técnica, que son conocimientos aplicados al diseño o mejora de productos y procesos. Y no es negativa, que es el conocimiento de lo que no funcionó.", "ref": "u17-tipos"}, {"id": "m17-02", "b": 17, "tipo": "simple", "origen": "nueva", "pregunta": "Una empresa guarda una planilla con sus costos, márgenes de ganancia y proyección de ventas para el año próximo. ¿Qué tipo de información confidencial es?", "opciones": ["Comercial.", "Negativa.", "Financiera.", "Técnica y científica."], "correctas": [2], "explicacion": "Es financiera: datos económicos o contables que muestran la situación, desempeño o estrategias de una empresa, como márgenes de ganancia, estructuras de costos y proyecciones de ventas. No es comercial, que apunta a clientes, proveedores, marketing y planes de lanzamiento. No es negativa, porque no registra pruebas que fracasaron. Y no es técnica y científica, que abarca fórmulas, algoritmos, planos o procedimientos de producción.", "ref": "u17-tipos"}, {"id": "m17-03", "b": 17, "tipo": "simple", "origen": "nueva", "pregunta": "Una agencia de marketing guarda el registro de las campañas que lanzó y no vendieron nada. ¿Qué tipo de información confidencial es ese registro?", "opciones": ["Comercial, porque se refiere a ventas y marketing.", "Financiera, porque refleja el desempeño económico de la agencia.", "Técnica y científica, porque surge de ensayos.", "Negativa, porque es conocimiento sobre lo que no funciona."], "correctas": [3], "explicacion": "Es información negativa: el conocimiento sobre lo que no funciona, y el PPT pone como ejemplo justamente los métodos de venta o campañas que no funcionaron. No alcanza con que hable de ventas para ser comercial: la comercial es lo que sí da ventaja en la gestión, como listas de clientes o estrategias. No es financiera porque no son datos contables. Y no es técnica, que son conocimientos aplicados al diseño o mejora de productos y procesos.", "ref": "u17-tipos"}, {"id": "m17-04", "b": 17, "tipo": "simple", "origen": "nueva", "pregunta": "Según el PPT, ¿por qué es secreta la información negativa?", "opciones": ["Porque otorga una ventaja tecnológica que puede perderse si se hace pública.", "Porque saber «qué no sirve» ahorra tiempo y dinero: un competidor que accede a ella puede evitar los mismos errores sin invertir en esas pruebas.", "Porque permitiría a un competidor anticipar decisiones, ajustar precios o negociar mejor con proveedores.", "Porque su divulgación permitiría a la competencia anticipar o imitar movimientos comerciales."], "correctas": [1], "explicacion": "El PPT explica que la información negativa es secreta porque saber qué no sirve ahorra tiempo y dinero, y quien accede a ella evita los mismos errores sin pagar por las pruebas (ejemplo de Edison). La ventaja tecnológica que se pierde si se hace pública es la razón de la información técnica y científica. Anticipar decisiones, ajustar precios o negociar con proveedores es la razón de la financiera. Y anticipar o imitar movimientos comerciales es la razón de la comercial.", "ref": "u17-negativa"}, {"id": "m17-05", "b": 17, "tipo": "simple", "origen": "nueva", "pregunta": "Una startup guarda su modelo predictivo, que nadie del rubro conoce y que le da ventaja, en una carpeta de Drive sin restricción de acceso, y nunca hizo firmar acuerdos de confidencialidad. ¿Qué requisito de la información confidencial está en riesgo?", "opciones": ["Que sea secreta.", "Que tenga valor comercial por ser secreta.", "Que haya sido objeto de medidas razonables de protección.", "Que haya sido registrada como obra de software."], "correctas": [2], "explicacion": "Falla el requisito de medidas razonables: la ley exige que el titular demuestre que se preocupó por resguardar la información (NDA, acceso restringido, contraseñas); si no hay protección, no hay secreto. El caso afirma que nadie del rubro la conoce, así que hoy sigue siendo secreta. También tiene valor comercial por ser secreta, porque le da ventaja frente a la competencia. Y el registro como obra es otra alternativa de protección (derecho de autor), no un requisito de la confidencialidad.", "ref": "u17-info-confidencial"}, {"id": "m17-06", "b": 17, "tipo": "simple", "origen": "nueva", "pregunta": "¿Qué protege la Ley 24.766, según el PPT?", "opciones": ["Los datos personales asentados en archivos, registros o bancos de datos públicos o privados destinados a dar informes.", "La información confidencial y los secretos comerciales o industriales en el ámbito de la competencia desleal.", "Las obras científicas, literarias y artísticas, incluidos los programas de computación.", "Los signos que distinguen productos o servicios en el mercado."], "correctas": [1], "explicacion": "El PPT dice que la Ley 24.766 de Secretos Comerciales y de Confidencialidad, sancionada en 1996, protege la información confidencial y los secretos comerciales o industriales en el ámbito de la competencia desleal. Los datos personales en archivos destinados a dar informes son el objeto de la Ley 25.326. Las obras y los programas de computación los protege el derecho de autor (Ley 11.723). Y los signos distintivos son las marcas de la Bolilla 10.", "ref": "u17-ley-24766"}, {"id": "m17-07", "b": 17, "tipo": "simple", "origen": "nueva", "pregunta": "Un equipo desarrolla un dispositivo físico cuyo funcionamiento cualquiera puede descubrir desarmándolo. Según los factores de la decisión estratégica, ¿qué protección conviene?", "opciones": ["Una patente, porque si el producto permite descubrir fácilmente su funcionamiento sería imposible mantener el secreto.", "El secreto comercial, porque no requiere registro ni revelación pública y depende solo de las medidas internas de seguridad.", "Acuerdos de confidencialidad con los compradores del dispositivo.", "Una marca, porque protege el producto frente a la copia."], "correctas": [0], "explicacion": "Por el factor de ingeniería inversa: si el producto permite descubrir fácilmente su funcionamiento al ser analizado o desarmado, no conviene basar la protección en la confidencialidad, y el PPT dice que una patente ofrece mejor resguardo. El secreto comercial fallaría justamente porque el secreto no puede mantenerse. Hacer firmar NDA a cada comprador no impide el análisis del producto. Y la marca protege signos distintivos, no el funcionamiento técnico.", "ref": "u17-decision-estrategica"}, {"id": "m17-08", "b": 17, "tipo": "simple", "origen": "nueva", "pregunta": "Una empresa tiene un conocimiento cuyo valor comercial va a durar solo unos meses. Según el factor «duración del valor competitivo», ¿qué recomienda el PPT?", "opciones": ["Tramitar una patente, porque es la única protección formal.", "Registrarlo como obra para obtener protección por toda la vida del autor.", "Divulgarlo para que pierda valor para la competencia.", "Que pueden bastar acuerdos de confidencialidad, porque la protección formal conviene para ventajas de largo plazo."], "correctas": [3], "explicacion": "El PPT dice que si el valor comercial del conocimiento es de corto plazo pueden bastar acuerdos de confidencialidad, y que la protección formal conviene cuando el resultado representa una ventaja a largo plazo. La patente es precisamente la protección formal pensada para el largo plazo, con costos y plazos a veces largos. El registro como obra protege la expresión, no el conocimiento en sí. Y divulgarlo destruiría el valor, que radica en la exclusividad.", "ref": "u17-decision-estrategica"}, {"id": "m17-09", "b": 17, "tipo": "simple", "origen": "nueva", "pregunta": "Una empresa planea licenciar su tecnología a terceros. Según el factor «estrategia de mercado», ¿qué protección le conviene?", "opciones": ["El secreto comercial, porque si se busca mantener el control exclusivo puede ser más conveniente.", "Una patente, porque brinda seguridad jurídica a los contratos.", "Solo acuerdos de confidencialidad con los licenciatarios.", "Un diseño industrial."], "correctas": [1], "explicacion": "Si la empresa planea licenciar o comercializar la tecnología, el PPT dice que una patente brinda seguridad jurídica a los contratos. El secreto comercial conviene en el caso contrario, cuando se busca mantener el control exclusivo y no licenciar. Depender solo de NDA con licenciatarios deja la tecnología sin protección formal frente al resto. Y el diseño industrial protege aspectos estéticos, no la tecnología que se quiere licenciar.", "ref": "u17-decision-estrategica"}, {"id": "m17-10", "b": 17, "tipo": "simple", "origen": "nueva", "pregunta": "Según el PPT, ¿cuándo es particularmente útil la confidencialidad como alternativa estratégica?", "opciones": ["Cuando el producto permite descubrir fácilmente su funcionamiento por ingeniería inversa.", "Cuando la empresa planea licenciar la tecnología a terceros.", "Cuando no se cumplen los requisitos de patentabilidad, o la revelación pública que exige la patente sería perjudicial para el negocio.", "Cuando se trata de signos distintivos o aspectos estéticos."], "correctas": [2], "explicacion": "El PPT dice que la confidencialidad es particularmente útil cuando no se cumplen los requisitos de patentabilidad o cuando la revelación pública que exige la patente sería perjudicial. Si el producto permite ingeniería inversa fácil, el secreto no se puede mantener y conviene la patente. Si se va a licenciar la tecnología, también conviene la patente por la seguridad jurídica. Y los signos distintivos y aspectos estéticos se protegen con marcas o diseños industriales.", "ref": "u17-alternativas"}, {"id": "m17-11", "b": 17, "tipo": "simple", "origen": "nueva", "pregunta": "Martina, analista de una empresa de software, comenta la arquitectura del sistema con una empresa competidora mientras sigue trabajando. ¿Qué deber laboral está violando, según el PPT de confidencialidad?", "opciones": ["El deber de no concurrencia (art. 88 LCT), que le impide hacer negocios por cuenta propia o ajena que afecten al empleador.", "El deber de obediencia (art. 86 LCT).", "El deber de fidelidad (art. 85 LCT), que incluye no revelar información confidencial o estratégica de la empresa.", "El deber de seguridad del empleador (art. 75 LCT)."], "correctas": [2], "explicacion": "El PPT basa la obligación laboral de confidencialidad en el art. 85 LCT: el trabajador debe observar todos los deberes de fidelidad, lo que incluye no revelar información confidencial o estratégica. La no concurrencia (art. 88) prohíbe competir o hacer negocios que afecten al empleador, pero revelar información es fidelidad. La obediencia (art. 86) es cumplir órdenes legítimas. Y el deber de seguridad (art. 75) es del empleador, que debe proteger la vida y la salud del trabajador.", "ref": "u17-laboral"}, {"id": "m17-12", "b": 17, "tipo": "simple", "origen": "nueva", "pregunta": "Durante unas tratativas, una empresa le mostró a otra la arquitectura de su sistema; el contrato nunca se firmó y la otra la usó. Según el CCyC, tal como lo presenta el PPT, ¿qué deber tenía quien recibió la información?", "opciones": ["Ninguno, porque sin contrato celebrado no hay obligación.", "Solo el que surja de un acuerdo de confidencialidad firmado.", "Conducirse de buena fe durante las tratativas y guardar confidencialidad sobre la información recibida, aun cuando el contrato no llegue a celebrarse.", "Solo el de no usar la información si estaba patentada."], "correctas": [2], "explicacion": "El CCyC reconoce el deber de guardar reserva dentro del principio de buena fe: las partes deben conducirse de buena fe durante las tratativas y guardar confidencialidad sobre lo que reciban aun cuando el contrato no llegue a celebrarse. Por eso no es cierto que sin contrato no haya obligación. Tampoco hace falta un NDA firmado, porque el deber surge del propio Código. Y la patente no es condición: la información protegida es justamente la que no se hizo pública.", "ref": "u17-art991"}, {"id": "m17-13", "b": 17, "tipo": "multiple", "origen": "nueva", "pregunta": "¿Qué elementos forman parte de la estructura básica de un NDA según el PPT? Seleccioná todas las correctas.", "opciones": ["Identificación de las partes (Parte Reveladora y Parte Receptora).", "Cesión de la titularidad de la información a la parte receptora.", "Excepciones: información que ya era pública, conocida o que se obtiene por otros medios lícitos.", "Inscripción obligatoria del acuerdo en un registro público.", "Plazo de vigencia de la obligación de confidencialidad."], "correctas": [0, 2, 4], "explicacion": "La estructura del PPT es: identificación de las partes, definición de información confidencial, obligaciones de la receptora, excepciones, plazo de vigencia, sanciones por incumplimiento y jurisdicción. El NDA no cede la titularidad: la parte receptora solo puede usar la información para el propósito autorizado. Y no exige inscripción en ningún registro; la protección del secreto no depende de registrar algo.", "ref": "u17-nda"}, {"id": "m17-14", "b": 17, "tipo": "multiple", "origen": "nueva", "pregunta": "En un NDA, ¿cuáles son obligaciones de la parte receptora? Seleccioná todas las correctas.", "opciones": ["Usar la información solo para el propósito autorizado.", "Definir qué tipo de información se considera protegida.", "No divulgarla a terceros.", "Fijar la jurisdicción donde se resolverán los conflictos.", "Adoptar medidas razonables de seguridad."], "correctas": [0, 2, 4], "explicacion": "El PPT enumera tres obligaciones de la receptora: usar la información solo para el propósito autorizado, no divulgarla a terceros y adoptar medidas razonables de seguridad. Definir qué información se considera protegida es un elemento del propio acuerdo (definición de información confidencial), no una obligación de la receptora. Y la jurisdicción o ley aplicable también es un elemento de la estructura del NDA, que pactan ambas partes.", "ref": "u17-nda"}, {"id": "m17-15", "b": 17, "tipo": "multiple", "origen": "nueva", "pregunta": "¿Qué ejemplos de medidas razonables de protección da el PPT? Seleccioná todas las correctas.", "opciones": ["Firmar acuerdos de confidencialidad con empleados, proveedores o socios.", "Patentar la información para que quede publicada.", "Restringir el acceso a la información solo a quienes la necesitan.", "Usar contraseñas, servidores seguros o políticas internas de seguridad.", "Compartirla con todo el personal para que todos sepan que es confidencial."], "correctas": [0, 2, 3], "explicacion": "El PPT da tres ejemplos de medidas razonables: NDA con empleados, proveedores o socios, restringir el acceso a quienes la necesitan y usar contraseñas, servidores seguros o políticas de seguridad. Patentar no es una medida para mantener el secreto: la patente exige divulgación pública. Y compartirla con todo el personal va en contra del requisito, porque el PPT pregunta justamente si quienes acceden la necesitan realmente para su trabajo.", "ref": "u17-medidas-razonables"}, {"id": "m17-16", "b": 17, "tipo": "multiple", "origen": "nueva", "pregunta": "¿Cuáles son factores de la decisión estratégica de protección según el PPT? Seleccioná todas las correctas.", "opciones": ["Tipo y características del resultado.", "Que la información sea secreta.", "Posibilidad de ingeniería inversa.", "Costos y tiempos.", "Que haya sido objeto de medidas razonables de protección."], "correctas": [0, 2, 3], "explicacion": "Los factores del PPT son el tipo y características del resultado, la posibilidad de ingeniería inversa, la duración del valor competitivo, los costos y tiempos y la estrategia de mercado. Que la información sea secreta no es un factor para decidir, sino uno de los tres requisitos que debe reunir la información confidencial. Lo mismo ocurre con las medidas razonables de protección: son requisito de la información confidencial, no factor de la decisión.", "ref": "u17-decision-estrategica"}, {"id": "m17-17", "b": 17, "tipo": "vf", "origen": "nueva", "pregunta": "Para que la ley proteja una información como confidencial, basta con que cumpla uno de los tres requisitos (secreta, con valor comercial por ser secreta, o protegida razonablemente).", "opciones": ["Verdadero", "Falso"], "correctas": [1], "explicacion": "Falso. El PPT dice que la ley protege la información no divulgada si cumple los tres requisitos simultáneamente: que sea secreta, que tenga valor comercial por ser secreta y que esté protegida razonablemente. Si falta uno, no hay protección; por ejemplo, sin medidas razonables «no hay secreto» aunque la información sea valiosa.", "ref": "u17-info-confidencial"}, {"id": "m17-18", "b": 17, "tipo": "vf", "origen": "nueva", "pregunta": "Los resultados de pruebas o ensayos que fracasaron pueden constituir información confidencial.", "opciones": ["Verdadero", "Falso"], "correctas": [0], "explicacion": "Verdadero. Es la información negativa, uno de los cuatro tipos del PPT: el conocimiento sobre lo que no funciona, es decir, resultados de pruebas, ensayos o experiencias que fracasan. Tiene valor porque un competidor que accede a ella evita los mismos errores sin invertir en esas pruebas (ejemplo de Edison y los materiales del filamento).", "ref": "u17-tipos"}, {"id": "m17-19", "b": 17, "tipo": "vf", "origen": "nueva", "pregunta": "Según el PPT, el deber del trabajador de no revelar información confidencial o estratégica de la empresa puede extenderse incluso después de terminada la relación laboral, cuando se trata de datos sensibles.", "opciones": ["Verdadero", "Falso"], "correctas": [0], "explicacion": "Verdadero. El PPT dice que el deber de fidelidad del art. 85 LCT incluye no revelar información confidencial o estratégica, incluso después de terminada la relación laboral, cuando se trata de datos sensibles. Su ejemplo es el diseñador gráfico de una marca de bebidas que no puede divulgar diseños o campañas aún después de renunciar.", "ref": "u17-laboral"}, {"id": "m17-20", "b": 17, "tipo": "vf", "origen": "nueva", "pregunta": "Si el producto final permite descubrir fácilmente su funcionamiento al ser analizado o desarmado, conviene basar su protección en la confidencialidad.", "opciones": ["Verdadero", "Falso"], "correctas": [1], "explicacion": "Falso. El PPT dice lo contrario: si el producto permite descubrir fácilmente su funcionamiento por ingeniería inversa, no conviene basar la protección en la confidencialidad, porque sería imposible mantener el secreto; en esos casos una patente ofrece mejor resguardo.", "ref": "u17-decision-estrategica"}], "casos": [{"id": "tp7-1", "titulo": "TP7 · Consigna 1: «Código propio, código ajeno»", "bolillas": [8], "origen": "TP7", "pie": "SoftNorte S.R.L. es una empresa tucumana que desarrolla una aplicación de gestión de turnos para consultorios. En el proyecto trabajan dos personas:\n• Lucía, programadora empleada en relación de dependencia, que durante su horario de trabajo y con los equipos de la empresa programa el módulo de facturación.\n• Martín, desarrollador freelance, contratado para programar la app móvil. Su contrato fija el precio y el plazo de entrega, pero no dice nada sobre a quién pertenecen los derechos sobre el código.\nPara llegar a tiempo con la entrega, el líder técnico del proyecto aprueba incorporar dos librerías descargadas de GitHub sin revisar sus condiciones: una con licencia GPL y otra con licencia MIT, a la que además le borran el aviso de copyright. SoftNorte planea vender la aplicación a otras empresas como producto cerrado, sin publicar su código fuente. Nunca registró el software ante ningún organismo.\nSeis meses después ocurren dos cosas. Lucía renuncia, ingresa a trabajar en DataSur, una empresa de la competencia, y se lleva una copia del módulo de facturación para reutilizarlo allí, porque “lo escribió ella”. Por otro lado, DataSur lanza una app de turnos con funciones prácticamente iguales a las de SoftNorte, pero programada desde cero por su propio equipo. SoftNorte pretende demandar a DataSur por ambas cosas.", "pista": "Reconocé: idea vs. expresión (DataSur), art. 4 inc. d (Lucía) vs. freelance sin cesión (Martín), morales vs. patrimoniales, tres planos de consecuencias, GPL vs. MIT, registro inédito y «no sabía no alcanza».", "preguntas": [{"q": "a. Objeto de la protección. ¿Qué protege la Ley 11.723 cuando se trata de software? ¿Puede SoftNorte reclamar a DataSur por haber lanzado una app con la misma funcionalidad, pero programada desde cero?", "respuesta": "La Ley 11.723 protege los programas de computación fuente y objeto y las compilaciones de datos como obras (art. 1, texto según Ley 25.036), y la obra de software incluye los diseños del flujo lógico, el programa fuente y objeto y la documentación técnica (Dto. 165/94). Pero se protege la expresión, no la idea (art. 1, último párrafo). Por la app programada desde cero, SoftNorte no puede reclamar: programar desde cero algo que hace lo mismo no es copiar; la funcionalidad de una app de turnos es una idea libre. Distinto es el módulo de facturación que se llevó Lucía (punto d): ahí sí hay copia del código concreto.", "conceptos": ["Obras protegidas por la Ley 11.723", "Idea vs. expresión", "Obra de software (Dto. 165/94) y qué se presenta"], "dudosa": false}, {"q": "b. Titularidad. ¿Quién es titular de los derechos patrimoniales sobre el módulo de facturación de Lucía? ¿Y sobre la app móvil programada por Martín? ¿Por qué la respuesta no es la misma y qué cláusula debió incluir SoftNorte en el contrato con Martín?", "respuesta": "El módulo de Lucía es de SoftNorte: el art. 4 inc. d Ley 11.723 atribuye el software producido por dependientes contratados para programar, en sus funciones, a su empleador, salvo pacto en contrario; Lucía era empleada en relación de dependencia y programó en horario y con equipos de la empresa. La app de Martín es de Martín: el inc. d habla de dependientes, no de independientes; si el contrato del freelance no dice nada, el código es suyo y el cliente solo tiene el uso acordado. SoftNorte debió incluir una cláusula de cesión de derechos (arts. 51 y 53, cesión inscripta): «Cliente: pedir cesión».", "conceptos": ["Titulares del derecho de propiedad intelectual", "¿De quién es el código? (casos de titularidad)"], "dudosa": false}, {"q": "c. Derechos morales y patrimoniales. Si Martín cede sus derechos a SoftNorte, ¿qué transfiere y qué conserva? ¿Podría SoftNorte presentar la app ocultando que Martín es su autor? ¿Qué requisito exige la ley para que la cesión sea válida?", "respuesta": "Martín transfiere los derechos patrimoniales, los que permiten explotar la obra (disponer, publicar, reproducir, adaptar: art. 2), que pueden cederse total o parcialmente (art. 51). Conserva los derechos morales, que no se venden: aunque enajene la obra mantiene el derecho a exigir la fidelidad del texto y la mención de su nombre como autor (art. 52). Por eso SoftNorte no puede ocultar su autoría: además, el art. 72 castiga reproducir suprimiendo el nombre del autor, y el PPT pone «borrar la autoría de un colega» entre las faltas profesionales. La cesión debe inscribirse en el registro (DNDA), «sin cuyo requisito no tendrá validez» (art. 53).", "conceptos": ["Derechos morales y patrimoniales", "Consecuencias de violar los derechos intelectuales", "Responsabilidad del profesional"], "dudosa": false}, {"q": "d. Consecuencias de la infracción. ¿Qué consecuencias jurídicas puede tener para Lucía haber reutilizado el módulo en DataSur? Analicen el plano civil, el penal y el laboral.", "respuesta": "Aunque «lo escribió ella», el módulo sigue siendo del ex emp
