ia: el titular abandona voluntariamente su derecho", "Vencimiento del plazo: pasan los 10 años sin pedir la renovación (ni en los 6 meses de gracia)", "Nulidad: la marca nunca debió registrarse (vicio de origen; art. 24); la pide un tercero con interés legítimo ante el INPI", "Caducidad: la marca dejó de usarse (5 años); la pide un tercero con interés legítimo ante el INPI"]}, "ejemplo": null, "articulos": ["Art. 23 Ley 22.362", "Art. 24 Ley 22.362"], "fuente": "material", "ubicacion": "material §11; PPT slides 26 y 28 (caducidad y nulidad, sin desarrollo)", "alerta": "Solo material: el PPT no trata renuncia ni la enumeración del art. 23.", "evidencia": [], "agregado": false, "b": 10, "nucleo": false}, {"id": "u10-dominio", "seccion": "Defensa y mundo digital", "termino": "Marcas y nombres de dominio (ciberocupación)", "pregunta": "¿Qué relación hay entre marca y nombre de dominio? ¿Qué es la ciberocupación?", "definicion": "Un dominio es la dirección de un sitio web (p. ej., unt.edu.ar) y es único. Los .ar se registran en NIC Argentina: se asignan al primero que los pide y nadie revisa si existe una marca igual. Ciberocupación: alguien registra un dominio con la marca de otro para revendérselo o para quedarse con sus clientes.", "lista": null, "ejemplo": "Caso psa.com.ar (CNCivComFed, Sala II, 30/12/1999): como cautelar, cese de uso, cancelación provisoria del dominio y asignación provisoria al dueño de la marca, que era anterior. Aunque el registro de dominios no exige ser dueño de la marca, la justicia puede proteger al titular.", "articulos": [], "fuente": "PPT", "ubicacion": "PPT slide 29; material §14", "alerta": null, "evidencia": ["tp7"], "agregado": false, "b": 10, "nucleo": false}, {"id": "u10-marketplaces-redes", "seccion": "Defensa y mundo digital", "termino": "Marcas en marketplaces y redes", "pregunta": "¿Quién responde por las copias en un marketplace? ¿Se registra un @usuario?", "definicion": "Nike c/ MercadoLibre (CNCivComFed, 2011): una prohibición total de publicaciones era desmedida porque frenaba también a quienes vendían originales; sí obligó a MercadoLibre a dar los datos de los vendedores cuando Nike los pidiera. Un @usuario o el nombre de una app no se registran en el INPI: se toman en cada plataforma, como un dominio; para que prospere una denuncia por infracción marcaria hay que demostrar que la marca está registrada.", "lista": null, "ejemplo": null, "articulos": [], "fuente": "PPT", "ubicacion": "PPT slide 30; material §14", "alerta": null, "evidencia": [], "agregado": false, "b": 10, "nucleo": false}, {"id": "u10-marca-notoria", "seccion": "Marca notoria y territorialidad", "termino": "Marca notoria", "pregunta": "¿Qué es una marca notoria y por qué importa?", "definicion": "Es la marca que conoce el público en general o el sector al que se dirige. Rompe en parte dos principios: territorialidad (el Convenio de París, art. 6 bis, obliga a protegerla aunque no esté registrada en el país) y especialidad (el ADPIC, art. 16, extiende la protección a productos o servicios distintos cuando el uso sugiere una conexión con el titular y lo perjudica). La jurisprudencia argentina rechaza solicitudes que intentan aprovechar el prestigio ajeno, aunque estén en otra clase.", "lista": null, "ejemplo": "Caso \"M\" vs. \"m\" (Martínez Hermanos c/ Mars Inc., CNCivComFed, Sala I, 18/10/2022): se rechazó la oposición de Mars; una letra es de uso común en la clase y nadie puede monopolizarla; la notoriedad exigía un cotejo más riguroso, que hacía más evidentes las diferencias.", "articulos": ["Art. 6 bis Convenio de París", "Art. 16 ADPIC"], "fuente": "PPT+material", "ubicacion": "PPT slide 16; material §12", "alerta": "Material agrega: la notoriedad no se presume, quien la invoca debe probarla; la ley argentina no define la marca notoria.", "evidencia": [], "agregado": false, "b": 10, "nucleo": true}, {"id": "u10-territorialidad", "seccion": "Marca notoria y territorialidad", "termino": "Territorialidad y Protocolo de Madrid", "pregunta": "¿Qué es el principio de territorialidad? ¿Qué es el Protocolo de Madrid?", "definicion": "Una marca registrada en el INPI protege solo en Argentina; para otros países hay que registrar país por país, con agentes locales y aranceles en cada uno. Ayuda el Convenio de París: derecho de prioridad de 6 meses desde la primera solicitud para presentar en otros países miembros. Protocolo de Madrid: una sola solicitud internacional ante la OMPI designando varios países; Argentina todavía no adhirió (Chile, Brasil, México y Colombia sí).", "lista": null, "ejemplo": "El acuerdo comercial con EE.UU. (firmado el 5/2/2026) compromete a llevar el Protocolo al Congreso antes de fines de 2027, junto con el Tratado de Singapur.", "articulos": ["Ley 17.011"], "fuente": "PPT+material", "ubicacion": "PPT slide 33; material §13", "alerta": null, "evidencia": [], "agregado": false, "b": 10, "nucleo": false}, {"id": "u10-casos-famosos", "seccion": "Marca notoria y territorialidad", "termino": "Nombres de personas famosas como marca", "pregunta": "¿Puede registrarse el nombre de una persona como marca?", "definicion": "El nombre, seudónimo o retrato de una persona necesita su consentimiento, o el de sus herederos (art. 3). La marca es un bien: se cede, se hereda y se puede administrar mal. Cada país tiene su propio registro (territorialidad).", "lista": {"titulo": "Casos del PPT", "items": ["Maradona: cedió en vida sus 21 marcas registradas en Argentina a Sattvica S.A.; tras su muerte (25/11/2020) los herederos las reclaman; en 2023 la Cámara Civil y Comercial Federal (Sala I) declaró competente a la justicia argentina también para las marcas del exterior. Causa penal en trámite (presunción de inocencia)", "Messi vs. Massi (TJUE, 17/09/2020): Messi pidió \"MESSI\" para ropa y calzado deportivo; se opuso \"MASSI\"; el TJUE confirmó que la fama de Messi neutraliza el parecido fonético y visual", "Mercado Libre vs. \"MR MERCADORAPID\" (Chile, Corte Suprema): rechazada por casi idéntica a \"MERCADO LIBRE\", genera confusión sobre el origen y es competencia desleal"]}, "ejemplo": null, "articulos": ["Art. 3 Ley 22.362"], "fuente": "PPT", "ubicacion": "PPT slides 31-32", "alerta": null, "evidencia": [], "agregado": false, "b": 10, "nucleo": false}, {"id": "u11-contrato", "seccion": "Repaso: el contrato", "termino": "Contrato", "pregunta": "¿Qué es un contrato según el CCyC?", "definicion": "Acto jurídico mediante el cual dos o más partes manifiestan su consentimiento para crear, regular, modificar, transferir o extinguir relaciones jurídicas patrimoniales.", "lista": null, "ejemplo": null, "articulos": ["Art. 957 CCyC"], "fuente": "PPT+material", "ubicacion": "PPT slide 2; material §1", "alerta": null, "evidencia": [], "agregado": false, "b": 11, "nucleo": false}, {"id": "u11-elementos", "seccion": "Repaso: el contrato", "termino": "Elementos del contrato", "pregunta": "Enumere los elementos del contrato.", "definicion": "Elementos que deben estar presentes para que el acuerdo sea válido.", "lista": {"titulo": "Elementos (PPT)", "items": ["Capacidad: aptitud de las partes para obligarse.", "Consentimiento: voluntad libre y sin vicios de contratar.", "Objeto: aquello sobre lo que recae el acuerdo.", "Forma: modo en que esa voluntad se exterioriza."]}, "ejemplo": null, "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slide 3; material §1 y §6", "alerta": "PPT: 4 elementos (capacidad, consentimiento, objeto, forma), sin causa; material: §1 coincide con el PPT, pero §6 habla de «elementos constitutivos» causa, objeto cierto y consentimiento libre de vicios (3, con causa). El núcleo del 1er parcial listaba también la causa. En el parcial de B11, ir con la lista de 4 del PPT.", "evidencia": [], "agregado": false, "b": 11, "nucleo": false}, {"id": "u11-buena-fe", "seccion": "Repaso: el contrato", "termino": "Principio de buena fe", "pregunta": "¿Qué establece el principio de buena fe en los contratos?", "definicion": "Los contratos deben celebrarse, interpretarse y ejecutarse de buena fe. Obligan no sólo a lo que está formalmente expresado, sino a todas las consecuencias que puedan considerarse comprendidas en ellos, con los alcances en que razonablemente se habría obligado un contratante cuidadoso y previsor.", "lista": null, "ejemplo": null, "articulos": ["Art. 961 CCyC"], "fuente": "PPT+material", "ubicacion": "PPT slide 4; material §1", "alerta": null, "evidencia": [], "agregado": false, "b": 11, "nucleo": false}, {"id": "u11-contrato-informatico", "seccion": "Concepto y objeto", "termino": "Contrato informático", "pregunta": "¿Qué es un contrato informático?", "definicion": "Un contrato informático es un acuerdo legal entre dos o más partes para establecer derechos y obligaciones sobre bienes o servicios informáticos como hardware y software. Su objetivo es regular la creación y transmisión de esos derechos, y puede involucrar aspectos como la compraventa de equipos, licencias de uso, mantenimiento y servicios de desarrollo de software.", "lista": null, "ejemplo": "Un contrato de desarrollo de software firmado en papel, con lapicera, sigue siendo un contrato informático (material).", "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slide 5; material §2", "alerta": null, "evidencia": ["quiz11", "tp6"], "agregado": false, "b": 11, "nucleo": true}, {"id": "u11-informatico-vs-electronico", "seccion": "Concepto y objeto", "termino": "Contrato informático vs. contrato electrónico", "pregunta": "¿Qué diferencia hay entre un contrato informático y un contrato electrónico?", "definicion": "El contrato electrónico se define por el medio: se celebra a través de medios electrónicos, con independencia de su objeto («contrato a distancia»). El contrato informático se define por el objeto: un bien o un servicio informático, o ambos, sin importar cómo se haya firmado. Son clasificaciones independientes; un mismo acuerdo puede ser las dos cosas.", "lista": {"titulo": "Informático vs. electrónico", "items": ["Criterio: informático, el objeto (la materia); electrónico, el medio (el canal).", "Forma de firma: informático, indiferente (puede ser en papel); electrónico, por vía electrónica.", "Ejemplo: informático, desarrollo de software firmado en papel; electrónico, compra de zapatillas en una tienda online."]}, "ejemplo": "Contratar un servicio en la nube aceptando los términos online es ambas cosas a la vez.", "articulos": [], "fuente": "material", "ubicacion": "material §2 (no está en el PPT)", "alerta": null, "evidencia": ["tp6"], "agregado": false, "b": 11, "nucleo": false}, {"id": "u11-objeto", "seccion": "Concepto y objeto", "termino": "Objeto de los contratos informáticos", "pregunta": "¿Cuál es el objeto de los contratos informáticos?", "definicion": "El objeto de los contratos informáticos generalmente puede ser múltiple: bienes informáticos y servicios informáticos de apoyo.", "lista": {"titulo": "Objeto", "items": ["A) Bienes informáticos — 1. Hardware: conjunto de dispositivos y elementos mecánicos, magnéticos, eléctricos y electrónicos del sistema.", "A) Bienes informáticos — 2. Software: conjunto de bienes inmateriales que constituyen el soporte lógico del sistema, incluyendo los programas de base y los aplicativos.", "B) Servicios informáticos de apoyo: el diseño, el análisis y el mantenimiento de dicho sistema."]}, "ejemplo": null, "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slide 7; material §2", "alerta": null, "evidencia": [], "agregado": false, "b": 11, "nucleo": true}, {"id": "u11-clasif-objeto", "seccion": "Clasificaciones", "termino": "Clasificación según el objeto", "pregunta": "¿Cómo se clasifican los contratos informáticos según su objeto?", "definicion": "Según la materia u objeto, los contratos informáticos son de equipamiento, de software o de servicios informáticos.", "lista": {"titulo": "Según el objeto", "items": ["De equipamiento: tienen por objeto la adquisición, locación o leasing de hardware (equipos, servidores, impresoras, etc.). Ej.: una empresa compra computadoras a un proveedor tecnológico, o alquila servidores a una empresa de data centers.", "De software: el objeto es la cesión, licencia o desarrollo de programas informáticos. Pueden ser de software estándar (enlatado) o software a medida, y también puede incluir mantenimiento o actualizaciones. Ej.: licencia de Microsoft 365; programador que desarrolla un sistema a medida de gestión de ventas.", "De servicios informáticos: tienen como objeto la prestación de servicios vinculados al uso o soporte de tecnología. Ej.: hosting o almacenamiento en la nube (AWS, Google Cloud); soporte técnico o mantenimiento de sistemas; gestión de redes o ciberseguridad."]}, "ejemplo": null, "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slides 9-12; material §7 A", "alerta": null, "evidencia": ["tp6"], "agregado": false, "b": 11, "nucleo": true}, {"id": "u11-clasif-naturaleza", "seccion": "Clasificaciones", "termino": "Clasificación según el negocio jurídico", "pregunta": "¿Cómo se clasifican los contratos informáticos según su naturaleza (negocio jurídico)?", "definicion": "Según el negocio jurídico, los contratos informáticos son de compraventa, de leasing, de locación, de prestaciones intelectuales y de prestación de servicios.", "lista": {"titulo": "Según el negocio jurídico", "items": ["De compraventa: se transmiten derechos de propiedad sobre un bien informático. Ej.: venta de un servidor físico o de un software on premise con cesión definitiva.", "De leasing: se da el uso de un equipo o sistema con opción de compra al final. Ej.: equipos de cómputo mediante leasing financiero por tres años, con opción de compra.", "De locación: se concede el uso de un bien informático sin transferir la propiedad. Ej.: alquiler mensual de impresoras o equipos informáticos.", "De prestaciones intelectuales: tienen por objeto el trabajo intelectual de programadores, diseñadores o analistas. Ej.: contrato con un desarrollador freelance para crear una app.", "De prestación de servicios: buscan una actividad o resultado técnico, no la entrega de un bien. Ej.: mantenimiento de sistemas, administración de redes, auditorías informáticas."]}, "ejemplo": null, "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slides 14-19; material §7 B", "alerta": null, "evidencia": ["tp6"], "agregado": false, "b": 11, "nucleo": true}, {"id": "u11-servicios-vs-intelectuales", "seccion": "Clasificaciones", "termino": "Prestación de servicios vs. prestaciones intelectuales", "pregunta": "Compare los contratos de prestación de servicios y de prestaciones intelectuales.", "definicion": "Cuadro comparativo del PPT entre ambas categorías del negocio jurídico.", "lista": {"titulo": "Prestación de servicios vs. prestaciones intelectuales", "items": ["Naturaleza del trabajo: servicios, técnica o material; intelectuales, intelectual o creativa.", "Grado de especialización: servicios, puede ser bajo o medio; intelectuales, alto nivel técnico o profesional.", "Resultado esperado: servicios, funcional (mantenimiento/soporte); intelectuales, innovador o analítico (desarrollo, diseño, consultoría).", "Ejemplo típico: servicios, servicio de hosting; intelectuales, desarrollo de software."]}, "ejemplo": null, "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slide 20; material §7 B", "alerta": null, "evidencia": ["tp6"], "agregado": false, "b": 11, "nucleo": true}, {"id": "u11-deber-informacion", "seccion": "Partes, deberes y obligaciones", "termino": "Distancia proveedor-usuario y deber de información", "pregunta": "¿Qué deberes tiene el proveedor frente a la brecha de conocimiento con el usuario?", "definicion": "En los contratos informáticos existe una fuerte desigualdad técnica: el proveedor domina la tecnología y el usuario suele desconocer sus características o funcionamiento. Para equilibrar la relación, la doctrina y la jurisprudencia imponen al proveedor deberes especiales, que surgen del principio de buena fe en la etapa precontractual: cada parte debe actuar con lealtad y transparencia.", "lista": {"titulo": "Consecuencias y deberes", "items": ["Consecuencia: el proveedor tiene una posición más fuerte en la negociación.", "Consecuencia: si abusa de esa ventaja, pueden producirse contratos injustos o desequilibrados.", "Deber de información: debe comunicar con veracidad las características, funciones y limitaciones del producto o servicio.", "Deber de consejo: debe orientar al cliente para que pueda elegir la opción más adecuada a sus necesidades."]}, "ejemplo": null, "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slides 22-23; material §3", "alerta": null, "evidencia": ["tp6"], "agregado": false, "b": 11, "nucleo": true}, {"id": "u11-objetivos-partes", "seccion": "Partes, deberes y obligaciones", "termino": "Objetivos perseguidos por las partes", "pregunta": "¿Qué objetivos persiguen las partes en un contrato informático y qué consecuencias tiene?", "definicion": "El usuario busca resultados concretos y funcionales; el proveedor tiende a garantizar solo la funcionalidad técnica general del sistema, sin comprometerse con el resultado específico que el usuario espera. Esta diferencia refleja la distinción anglosajona entre contracting for results (contrato por resultados) y contracting for resources (contrato por recursos).", "lista": {"titulo": "Consecuencias", "items": ["Tipo de obligación: en informática, las obligaciones del proveedor suelen ser obligaciones de resultado, porque si el sistema no cumple los objetivos funcionales, pierde valor económico; por eso es fundamental definir claramente el objeto de la prestación.", "Precisión en el objeto: el contrato debe tener un objeto cierto y determinado, coincidente entre oferta y aceptación; la ambigüedad genera conflictos y posibles incumplimientos.", "Colaboración: no solo el proveedor debe precisar el objeto; el usuario también debe colaborar activamente, detallando sus necesidades y especificaciones.", "Complejidad técnica: a mayor complejidad del sistema, mayor necesidad de un pliego técnico especializado, elaborado por personal capacitado.", "Descripción inadecuada: una definición insuficiente o imprecisa de la prestación puede generar conflictos por incumplimiento contractual."]}, "ejemplo": null, "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slides 25-27; material §4 etapa 2", "alerta": null, "evidencia": ["tp6"], "agregado": false, "b": 11, "nucleo": true}, {"id": "u11-medios-resultado", "seccion": "Partes, deberes y obligaciones", "termino": "Obligación de medios vs. de resultado", "pregunta": "¿Qué diferencia hay entre una obligación de medios y una de resultado en un contrato informático?", "definicion": "En la etapa de formalización se definen las obligaciones de resultado o de medios del proveedor (PPT). Si el contrato dice que el proveedor «pondrá sus mejores esfuerzos» (medios), basta con que haya trabajado con diligencia aunque el sistema no sirva; si dice que «el sistema emitirá los reportes contables exigidos» (resultado), el proveedor incumple si no lo logra, por más que se haya esforzado (material).", "lista": null, "ejemplo": "«Pondrá sus mejores esfuerzos» = medios; «el sistema emitirá los reportes contables exigidos por la ARCA» = resultado (material).", "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slides 25 y 33; material §4 etapa 2", "alerta": null, "evidencia": ["tp6"], "agregado": false, "b": 11, "nucleo": false}, {"id": "u11-adhesion", "seccion": "Contratos de adhesión", "termino": "Contratos de adhesión", "pregunta": "¿Qué son los contratos de adhesión y por qué la desigualdad se agrava en los informáticos?", "definicion": "Son aquellos redactados unilateralmente por una de las partes (el predisponente), sin posibilidad real de negociación por la otra (el adherente). En ellos, el consentimiento se limita a aceptar o rechazar en bloque, sin posibilidad de modificar cláusulas. En la práctica, existe desigualdad económica y técnica, especialmente en contextos de monopolio o posición dominante. En los contratos informáticos esta desigualdad se agrava, porque el usuario carece del conocimiento técnico para evaluar el producto o servicio.", "lista": null, "ejemplo": "Contratos tipo, formularios, contratos «standard» o uniformes.", "articulos": ["Art. 984 CCyC"], "fuente": "PPT+material", "ubicacion": "PPT slide 29; material §3 (cita el art. 984)", "alerta": null, "evidencia": ["tp6"], "agregado": false, "b": 11, "nucleo": true}, {"id": "u11-etapas", "seccion": "Etapas del contrato", "termino": "Etapas del contrato informático", "pregunta": "Enumere y describa las etapas del contrato informático.", "definicion": "Aunque no existe una regulación única en Argentina, la doctrina y la práctica coinciden en que los contratos informáticos atraviesan varias etapas sucesivas, tanto precontractuales como contractuales y postcontractuales.", "lista": {"titulo": "Etapas (orden del PPT)", "items": ["1) Etapa precontractual: fase de análisis, negociación y planificación. Se define la necesidad del usuario y se analiza la solución técnica; reuniones exploratorias, pliegos de condiciones, propuestas técnicas y económicas; evaluación comparativa de proveedores; el proveedor tiene deberes de información y consejo; puede incluir acuerdos de confidencialidad.", "2) Etapa de formalización del contrato (el PPT la titula «Etapa precontractual»): las partes acuerdan objeto, precio, plazos y condiciones; se redacta y firma el contrato principal; se definen las obligaciones de resultado o de medios; cláusulas de propiedad intelectual, confidencialidad, garantías, responsabilidad y resolución de conflictos.", "3) Etapa de entrega, instalación y puesta en marcha: fase de ejecución inicial; entrega, instalación, configuración, capacitación del personal e inicio de la puesta en marcha.", "4) Etapa de verificación. Test de aceptación: fase de control del cumplimiento funcional; el usuario prueba el sistema, se documenta en un acta de aceptación o rechazo y el proveedor corrige las fallas antes de la aceptación definitiva.", "5) Etapa de aceptación: fase de aprobación formal del resultado; el usuario acepta formalmente, se inicia el plazo de garantía o mantenimiento post entrega y el contrato entra en cumplimiento pleno.", "6) Etapa de garantía, mantenimiento o soporte: fase postcontractual; el proveedor garantiza el correcto funcionamiento durante el período acordado (actualización, soporte técnico, mantenimiento correctivo o evolutivo) y se aplican las cláusulas de responsabilidad y resolución de conflictos."]}, "ejemplo": "Etapa 4: durante un mes, el cliente prueba el software para verificar que emite correctamente sus reportes contables. Etapa 5: se firma el acta de conformidad y comienza el período de garantía de 12 meses.", "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slides 31-37; material §4", "alerta": "PPT: titula «Etapa precontractual» tanto la 1 como la 2, aunque la 2 la describe como «Fase de formalización del contrato»; material: la 2 es la «etapa contractual o de formalización» y aclara que lo que importa es la secuencia (primero se negocia, después se formaliza). Error de título del PPT: en el parcial, nombrarla como formalización.", "evidencia": ["tp6"], "agregado": false, "b": 11, "nucleo": true}, {"id": "u11-test-aceptacion", "seccion": "Etapas del contrato", "termino": "Test de aceptación", "pregunta": "¿Qué es el test de aceptación?", "definicion": "Fase de control del cumplimiento funcional: el usuario prueba el sistema para verificar que cumple los objetivos funcionales pactados. Se documentan los resultados en un acta de aceptación o rechazo. Si hay errores o fallas, el proveedor debe corregirlos antes de la aceptación definitiva.", "lista": null, "ejemplo": "Durante un mes, el cliente prueba el software para verificar que emite correctamente sus reportes contables.", "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slide 35; material §4 etapa 4 (recomienda no aceptar ni pagar hasta superar las pruebas)", "alerta": null, "evidencia": ["tp6"], "agregado": false, "b": 11, "nucleo": false}, {"id": "u11-escalabilidad", "seccion": "Especificaciones técnicas", "termino": "Escalabilidad", "pregunta": "¿Qué es la escalabilidad y por qué importa en un contrato informático?", "definicion": "La escalabilidad es la capacidad de un sistema (software, infraestructura o servicio) para mantener o mejorar su rendimiento cuando aumenta la carga de trabajo (más usuarios, más transacciones, más datos) y para crecer sin necesidad de rediseñar todo el sistema. En contratos informáticos es crítico establecer niveles de servicio y pruebas que demuestren que el proveedor puede soportar el crecimiento previsto del cliente; si no se especifica, el sistema puede volverse inútil cuando crece la demanda.", "lista": {"titulo": "Formas", "items": ["Escalabilidad vertical (scale up): aumentar la capacidad de un nodo (más CPU, memoria, disco).", "Escalabilidad horizontal (scale out): añadir más nodos/instancias que trabajen en paralelo (ej.: réplicas, servidores web adicionales)."]}, "ejemplo": "Un e-commerce que vende 100 pedidos/día hoy y planea 10.000 pedidos/día en 6 meses: el sistema debe poder escalar (auto-scaling de servidores web, cola de procesamiento, base de datos escalable).", "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slides 39-40; material §5", "alerta": null, "evidencia": ["tp6"], "agregado": false, "b": 11, "nucleo": true}, {"id": "u11-compatibilidad", "seccion": "Especificaciones técnicas", "termino": "Compatibilidad", "pregunta": "¿Qué es la compatibilidad y qué dimensiones incluye?", "definicion": "La compatibilidad es la capacidad de un producto (software/hardware) para funcionar con otros sistemas, plataformas, formatos o versiones sin errores. Si un sistema no es compatible con elementos críticos del entorno del cliente (sistemas legados, navegadores corporativos, otros servicios), no cumple su finalidad; en contratos hay que detallar versiones y protocolos que deben soportarse.", "lista": {"titulo": "Dimensiones", "items": ["Compatibilidad de plataforma/OS (Windows, Linux, iOS, Android).", "Compatibilidad de navegadores (Chrome, Firefox, Edge, Safari).", "Compatibilidad de versiones (backward/forward compatibility).", "Compatibilidad de interfaces/datos (APIs, formatos JSON/XML, protocolos: HTTP/HTTPS, LDAP, etc.).", "Interoperabilidad: capacidad de intercambiar datos y trabajar conjuntamente con sistemas terceros."]}, "ejemplo": "Una app móvil que debe funcionar en Android 10+ y iOS 13+.", "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slides 41-42; material §5", "alerta": null, "evidencia": ["tp6"], "agregado": false, "b": 11, "nucleo": true}, {"id": "u11-modularidad", "seccion": "Especificaciones técnicas", "termino": "Modularidad", "pregunta": "¿Qué es la modularidad y qué beneficios tiene?", "definicion": "La modularidad es la propiedad arquitectónica por la cual un sistema se divide en componentes independientes (módulos) que encapsulan funcionalidades concretas y se comunican mediante interfaces definidas. Cada módulo puede desarrollarse, probarse, desplegarse y reemplazarse sin afectar todo el sistema.", "lista": {"titulo": "Beneficios", "items": ["Mantenimiento más sencillo.", "Reutilización de módulos (plugins, librerías).", "Facilita actualizaciones y evoluciones (solo cambias un módulo).", "Mejora la legibilidad y testabilidad del código.", "Reduce riesgos en cambios."]}, "ejemplo": null, "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slides 43-44; material §5", "alerta": null, "evidencia": [], "agregado": false, "b": 11, "nucleo": true}, {"id": "u11-atipicos", "seccion": "Solo material", "termino": "Naturaleza jurídica: contratos atípicos", "pregunta": "¿Cuál es la naturaleza jurídica de los contratos informáticos?", "definicion": "Los contratos informáticos son, en general, atípicos: no encajan del todo en los moldes que la ley regula con nombre y reglas propias. Mientras no haya ley específica, se rigen por lo que las partes acuerden, por las normas de las figuras afines o análogas, por las reglas generales de contratación y por los usos y principios generales del Derecho. Son además usualmente contratos de adhesión.", "lista": null, "ejemplo": null, "articulos": [], "fuente": "material", "ubicacion": "material §3 (no está en el PPT)", "alerta": null, "evidencia": [], "agregado": false, "b": 11, "nucleo": false}, {"id": "u11-clausulas-abusivas", "seccion": "Solo material", "termino": "Cláusulas abusivas en contratos de adhesión", "pregunta": "¿Qué pasa con las cláusulas abusivas en un contrato de adhesión?", "definicion": "En los contratos por adhesión se tienen por no escritas las cláusulas que desnaturalizan las obligaciones del predisponente, las que importan renuncia o restricción a los derechos del adherente y las que por su contenido o redacción no son razonablemente previsibles (art. 988 CCyC). Las cláusulas ambiguas se interpretan en contra de quien las redactó (art. 987 CCyC). La Ley 24.240 (art. 37) tiene por no convenidas cláusulas similares e interpreta el contrato en el sentido más favorable al consumidor.", "lista": null, "ejemplo": "Caso «Sistex SA c/ Oliva SA»: en caso de duda, los contratos informáticos se interpretan en contra del proveedor.", "articulos": ["Art. 987 CCyC", "Art. 988 CCyC", "Art. 37 Ley 24.240"], "fuente": "material", "ubicacion": "material §3 y §4 (no está en el PPT)", "alerta": null, "evidencia": [], "agregado": false, "b": 11, "nucleo": false}, {"id": "u11-codigo-fuente", "seccion": "Solo material", "termino": "Titularidad del software y código fuente", "pregunta": "¿Quién se queda con el código fuente según el tipo de software?", "definicion": "En el software enlatado el usuario solo recibe el código objeto y la titularidad queda en el programador o empresa que lo creó; en el software a medida lo habitual es que el adquirente reciba código objeto y fuente y sea el titular. Sin el código fuente el cliente depende del programador original; las soluciones habituales son el contrato de mantenimiento y el escrow (depósito del código fuente en un tercero de confianza que lo entrega si el proveedor desaparece o incumple).", "lista": null, "ejemplo": null, "articulos": [], "fuente": "material", "ubicacion": "material §7 A (el PPT solo nombra enlatado y a medida)", "alerta": null, "evidencia": [], "agregado": false, "b": 11, "nucleo": false}, {"id": "u11-leasing-modalidades", "seccion": "Solo material", "termino": "Leasing: modalidades", "pregunta": "¿Cuáles son las modalidades del leasing?", "definicion": "El leasing es un contrato de locación con opción de compra (Ley 25.248): permite usar el equipamiento pagando un canon periódico, con la posibilidad de quedárselo al final pagando un valor residual.", "lista": {"titulo": "Modalidades", "items": ["Operativo: dos partes (fabricante y tomador); suele incluir mantenimiento.", "Financiero: tres partes (fabricante, entidad financiera que compra y da en leasing, tomador).", "Leaseback o retroarriendo: la empresa vende un bien a una financiera y simultáneamente lo toma en leasing; funciona como préstamo con garantía."]}, "ejemplo": null, "articulos": ["Ley 25.248"], "fuente": "material", "ubicacion": "material §7 (el PPT solo define el leasing)", "alerta": null, "evidencia": [], "agregado": false, "b": 11, "nucleo": false}, {"id": "u11-unidad-medida", "seccion": "Solo material", "termino": "Contratos a unidad de medida", "pregunta": "¿Qué son los contratos a unidad de medida?", "definicion": "Más que un tipo de contrato, son una forma de fijar el precio: en lugar de un precio global, se calcula por unidad (hora de desarrollo, hora de máquina, módulo entregado, usuario o transacción). Ventaja: flexibilidad; riesgo: incertidumbre sobre el costo final, por lo que conviene pactar topes o estimaciones.", "lista": null, "ejemplo": null, "articulos": [], "fuente": "material", "ubicacion": "material §7 (no está en el PPT)", "alerta": null, "evidencia": [], "agregado": false, "b": 11, "nucleo": false}, {"id": "u12-delito", "seccion": "Conceptos básicos", "termino": "Delito", "pregunta": "¿Qué es un delito? ¿Cuáles son sus elementos?", "definicion": "Conducta (una acción o también una omisión) típica (descripta por la ley), antijurídica (contraria a Derecho) y culpable (con dolo o, al menos, con culpa), a la que corresponde una pena. Un cuarto elemento que suele olvidarse es la relación de causalidad: tiene que existir un vínculo real entre lo que hizo (o dejó de hacer) la persona y el resultado dañoso.", "lista": {"titulo": "Elementos", "items": ["Conducta: una acción o también una omisión", "Típica: descripta por la ley", "Antijurídica: contraria a Derecho", "Culpable: con dolo o, al menos, con culpa", "Relación de causalidad: vínculo real entre lo que hizo (o dejó de hacer) la persona y el resultado dañoso; no alcanza con estar cerca del problema, hay que haberlo provocado"]}, "ejemplo": null, "articulos": [], "fuente": "PPT", "ubicacion": "PPT slide 6; material §1", "alerta": null, "evidencia": [], "agregado": false, "b": 12, "nucleo": true}, {"id": "u12-dolo-culpa", "seccion": "Conceptos básicos", "termino": "Dolo y culpa", "pregunta": "¿Qué diferencia hay entre dolo y culpa?", "definicion": "Dolo: a sabiendas y con intención; la persona sabe lo que hace y quiere el resultado. Culpa: negligencia, imprudencia o impericia; no hay intención de dañar, pero el daño se produce por no haber actuado con el cuidado debido. Casi todos los delitos informáticos del Código Penal son dolosos: por eso aparecen las expresiones «a sabiendas», «indebidamente» o «ilegítimamente».", "lista": {"titulo": "Dolo vs culpa", "items": ["Qué es: dolo = a sabiendas y con intención; culpa = negligencia, imprudencia o impericia", "Intención: dolo = sabe lo que hace y quiere el resultado; culpa = no hay intención de dañar, el daño se produce por no actuar con el cuidado debido", "En la bolilla: casi todos los delitos informáticos del CP son dolosos («a sabiendas», «indebidamente», «ilegítimamente»)"]}, "ejemplo": null, "articulos": [], "fuente": "PPT", "ubicacion": "PPT slide 7; material §1", "alerta": null, "evidencia": [], "agregado": false, "b": 12, "nucleo": true}, {"id": "u12-art19", "seccion": "Conceptos básicos", "termino": "Todo lo que no está prohibido está permitido", "pregunta": "¿Qué establece el art. 19 CN respecto de los delitos?", "definicion": "Todo lo que no está expresamente prohibido por la ley, está permitido (art. 19 de la Constitución Nacional). Si el legislador no describió una conducta como delito, no puede castigarse como tal.", "lista": null, "ejemplo": null, "articulos": ["Art. 19 CN"], "fuente": "PPT+material", "ubicacion": "PPT slide 8; material §1", "alerta": null, "evidencia": [], "agregado": false, "b": 12, "nucleo": false}, {"id": "u12-tipos-delito", "seccion": "Conceptos básicos", "termino": "Tipos de delito: civil, cuasidelito y penal", "pregunta": "¿Qué tipos de delito existen? Diferencie delito civil, cuasidelito civil y delito penal.", "definicion": "No todo «delito» termina en la cárcel. Delito civil: acto ilícito ejecutado con intención de dañar a otro. Cuasidelito civil: sin intención de dañar, pero con daño por negligencia o imprudencia. Delito penal: conducta tipificada, es decir, expresamente mencionada en la ley penal. Un mismo hecho puede ser las dos cosas (faceta penal y faceta civil).", "lista": {"titulo": "Tipos y consecuencia", "items": ["Delito civil: acto ilícito ejecutado con intención de dañar a otro. Consecuencia: reparar el daño (indemnización)", "Cuasidelito civil: sin intención de dañar, pero con daño por negligencia o imprudencia. Consecuencia: reparar el daño (indemnización)", "Delito penal: conducta tipificada, es decir, expresamente mencionada en la ley penal. Consecuencia: una pena"]}, "ejemplo": "Quien ingresa sin autorización a un sistema y borra información puede enfrentar una pena (faceta penal) y además tener que indemnizar a la empresa por el perjuicio económico (faceta civil).", "articulos": [], "fuente": "PPT", "ubicacion": "PPT slide 9; material §1", "alerta": null, "evidencia": ["quiz11"], "agregado": false, "b": 12, "nucleo": true}, {"id": "u12-delito-informatico", "seccion": "Conceptos básicos", "termino": "Delito informático", "pregunta": "¿Qué es un delito informático?", "definicion": "Toda operación ilícita y culpable (con intención dolosa o por negligencia) que se realiza por medio de la informática, o bien que tiene como objetivo destruir o dañar computadoras, medios electrónicos y redes de internet.", "lista": {"titulo": "La definición abre dos puertas", "items": ["La computadora es el arma: se usa la informática para cometer el hecho", "La computadora es la víctima: el ataque apunta a destruir o dañar sistemas, medios y redes"]}, "ejemplo": null, "articulos": [], "fuente": "PPT", "ubicacion": "PPT slide 10; material §2", "alerta": null, "evidencia": ["quiz11"], "agregado": false, "b": 12, "nucleo": true}, {"id": "u12-criterios", "seccion": "Conceptos básicos", "termino": "Criterios de clasificación: instrumento o medio / fin u objeto", "pregunta": "¿Cuáles son los dos criterios para clasificar los delitos informáticos? Dé ejemplos.", "definicion": "Instrumento o medio: la tecnología COMETE el delito; es un delito «de toda la vida» con otra herramienta. Fin u objeto: la tecnología PADECE el delito; el ataque recae sobre el sistema o el dato.", "lista": {"titulo": "Instrumento o medio vs fin u objeto", "items": ["Instrumento o medio — falsificación de documentos por vía computarizada (arts. 292 y ss. + art. 77)", "Instrumento o medio — alteración de la situación contable de una empresa", "Instrumento o medio — intervención de comunicaciones de datos (art. 153)", "Instrumento o medio — fraude informático (art. 173 inc. 16)", "Fin u objeto — acceso ilegítimo a un sistema (art. 153 bis)", "Fin u objeto — daño informático: borrar o alterar datos (art. 183, 2º párr.)", "Fin u objeto — bloqueo parcial o total del sistema (arts. 183 y 197)", "Fin u objeto — atentado físico contra el equipo (art. 183, 1º párr.)"]}, "ejemplo": null, "articulos": ["Art. 153 CP", "Art. 153 bis CP", "Art. 173 inc. 16 CP", "Art. 183 CP", "Art. 197 CP", "Arts. 292 y ss. CP", "Art. 77 CP"], "fuente": "PPT+material", "ubicacion": "PPT slide 11; material §2", "alerta": "PPT: en «instrumento o medio» no figura la introducción de código malicioso, y el art. 183 2º párr. aparece solo en «fin u objeto»; material: suma en «instrumento o medio» la «introducción de código extraño (virus, bombas lógicas) (art. 183, 2º párr.)» y «espionaje y fraude», y en «fin u objeto» la «destrucción de programas». Para el examen, la lista del PPT.", "evidencia": [], "agregado": false, "b": 12, "nucleo": true}, {"id": "u12-rasgos", "seccion": "Conceptos básicos", "termino": "Rasgos propios de los delitos informáticos", "pregunta": "¿Cuáles son los rasgos propios de los delitos informáticos?", "definicion": "Caracterización de Julio Téllez Valdés, referente del derecho informático en América Latina: conocimiento técnico, «cuello blanco», ocupacionales, de oportunidad, pérdidas económicas, cifra negra, difícil comprobación y tienden a proliferar.", "lista": {"titulo": "Rasgos (Téllez Valdés)", "items": ["Conocimiento técnico: superior al promedio", "«Cuello blanco»: autores con formación y recursos", "Ocupacionales: muchas veces desde adentro", "De oportunidad: aprovechan o fabrican la ocasión", "Pérdidas económicas: el rastro casi siempre presente", "Cifra negra: muchos casos, pocas denuncias", "Difícil comprobación: prueba técnica e internacional", "Tienden a proliferar: la ley debe actualizarse"]}, "ejemplo": null, "articulos": [], "fuente": "PPT", "ubicacion": "PPT slide 12; material §3", "alerta": null, "evidencia": ["quiz11"], "agregado": false, "b": 12, "nucleo": true}, {"id": "u12-cuello-blanco", "seccion": "Conceptos básicos", "termino": "Delito de «cuello blanco»", "pregunta": "¿Qué significa que los delitos informáticos sean de «cuello blanco»? ¿Qué matiz tiene hoy?", "definicion": "Edwin Sutherland acuñó la expresión en 1939 y la desarrolló en White Collar Crime (1949). Desafió la idea de que el delito era «cosa de pobres»: también delinquen personas respetables, en el ejercicio de su profesión. Aplicado aquí: la conducta no se explica por necesidad ni por falta de educación. Matiz actual: existen kits de ataque listos para usar y servicios de ransomware que se alquilan; alguien con escasos conocimientos puede causar daños enormes. El perfil experto sigue siendo frecuente, pero ya no es el único.", "lista": null, "ejemplo": null, "articulos": [], "fuente": "PPT", "ubicacion": "PPT slide 13; material §3", "alerta": null, "evidencia": [], "agregado": false, "b": 12, "nucleo": false}, {"id": "u12-cifra-negra", "seccion": "Conceptos básicos", "termino": "Cifra negra", "pregunta": "¿Qué es la cifra negra y por qué se produce?", "definicion": "Son muchos los casos y pocas las denuncias: los delitos que nunca llegan a las autoridades. Causas: miedo al descrédito (a la organización le aterra que se sepa que la vulneraron: golpea su reputación y la confianza de sus clientes) y vacíos de regulación (durante años la ley no alcanzaba todas las conductas). Tapar un incidente no lo hace desaparecer.", "lista": {"titulo": "¿Por qué?", "items": ["Miedo al descrédito: golpea la reputación y la confianza de los clientes", "Vacíos de regulación: durante años la ley no alcanzaba todas las conductas"]}, "ejemplo": null, "articulos": [], "fuente": "PPT", "ubicacion": "PPT slide 14; material §3", "alerta": null, "evidencia": [], "agregado": false, "b": 12, "nucleo": false}, {"id": "u12-inmediatez", "seccion": "Conceptos básicos", "termino": "Difícil comprobación y principio de inmediatez", "pregunta": "¿Por qué los delitos informáticos son difíciles de probar? ¿Qué es el principio de inmediatez?", "definicion": "La prueba es técnica y el delito, internacional (una estafa puede perjudicar a un vecino de Tucumán y haber sido montada desde la India; exige coordinación entre países que no siempre existe). La evidencia es frágil: datos técnicos (un correo electrónico, una página web, un registro de conexión) que se modifican o desaparecen con enorme facilidad. Principio de inmediatez: hay que actuar rápido para preservar la prueba antes de que se pierda.", "lista": null, "ejemplo": null, "articulos": [], "fuente": "PPT", "ubicacion": "PPT slide 15; material §3", "alerta": null, "evidencia": [], "agregado": false, "b": 12, "nucleo": false}, {"id": "u12-sujetos", "seccion": "Conceptos básicos", "termino": "Sujetos del delito", "pregunta": "¿Quiénes son los sujetos del delito informático?", "definicion": "Sujeto pasivo: la víctima, el ente sobre el cual recae la conducta: una persona, una institución, un gobierno o una empresa; cualquiera que use sistemas informáticos (en el ejercicio profesional, muchas veces será la organización que los contrató). Sujeto activo: quien comete el delito; suele describírselo como una persona inteligente, decidida, motivada y dispuesta a aceptar un reto tecnológico. La tradición los llamó «delincuentes de guante blanco», retomando la idea de cuello blanco.", "lista": {"titulo": "Sujeto pasivo vs sujeto activo", "items": ["Quién es: pasivo = la víctima; activo = quien comete el delito", "Descripción: pasivo = persona, institución, gobierno o empresa, cualquiera que use sistemas informáticos; activo = persona inteligente, decidida, motivada y dispuesta a aceptar un reto tecnológico («delincuentes de guante blanco»)"]}, "ejemplo": null, "articulos": [], "fuente": "PPT", "ubicacion": "PPT slide 16; material §4", "alerta": null, "evidencia": [], "agregado": false, "b": 12, "nucleo": true}, {"id": "u12-hacker", "seccion": "Conceptos básicos", "termino": "Hacker", "pregunta": "¿Qué es un hacker? ¿Qué tipos hay?", "definicion": "Persona con altos conocimientos informáticos que accede a sistemas para explorar vulnerabilidades o aprender, no necesariamente con mala intención. Hacker no es sinónimo de delincuente.", "lista": {"titulo": "Tipos (color del sombrero)", "items": ["White hat (sombrero blanco): el hacker ético. Prueba los sistemas con permiso del dueño, para encontrar fallas y ayudar a corregirlas. Trabajo legítimo", "Gray hat (sombrero gris): entra sin permiso, pero sin causar daño. Su situación es ambigua: acceder sin autorización ya puede ser delito aunque no quiera perjudicar (art. 153 bis)", "Black hat (sombrero negro): actúa con fines ilícitos: robar datos o dinero, espiar o sabotear. Su conducta encaja en varios tipos penales"]}, "ejemplo": null, "articulos": ["Art. 153 bis CP"], "fuente": "PPT", "ubicacion": "PPT slide 17; material §4", "alerta": null, "evidencia": ["quiz11", "tp6"], "agregado": false, "b": 12, "nucleo": true}, {"id": "u12-cracker", "seccion": "Conceptos básicos", "termino": "Cracker y otras figuras", "pregunta": "¿Qué es un cracker? ¿Qué otras figuras se distinguen?", "definicion": "El cracker es el delincuente informático propiamente dicho. «Rompe» o vulnera los sistemas de seguridad para robar, dañar o alterar datos, buscando un beneficio propio o el perjuicio ajeno.", "lista": {"titulo": "Otras figuras", "items": ["Phreaker: usa sus conocimientos de telefonía para utilizar las telecomunicaciones gratis", "Virucher: ingresa a un sistema ajeno para introducir virus (art. 183, 2º párr.)", "Pirata informático: reproduce, vende o usa software sin licencia (Ley 11.723, arts. 71 y 72)", "Copyhacker: «cracker de hardware»: falsifica y piratea tarjetas inteligentes"]}, "ejemplo": null, "articulos": ["Art. 183 CP", "Arts. 71 y 72 Ley 11.723"], "fuente": "PPT", "ubicacion": "PPT slide 18; material §4", "alerta": null, "evidencia": ["quiz11"], "agregado": false, "b": 12, "nucleo": true}, {"id": "u12-conductas-etiquetas", "seccion": "Conceptos básicos", "termino": "El derecho penal castiga conductas, no etiquetas", "pregunta": "¿Por qué es jurídicamente relevante distinguir hacker de cracker?", "definicion": "El derecho penal castiga conductas, no etiquetas. Lo que importa no es cómo se autodenomine alguien, sino si su conducta encaja o no en un tipo penal.", "lista": null, "ejemplo": null, "articulos": [], "fuente": "PPT", "ubicacion": "PPT slide 19; material §4", "alerta": null, "evidencia": ["tp6"], "agregado": false, "b": 12, "nucleo": false}, {"id": "u12-legalidad-ley26388", "seccion": "La Ley 26.388", "termino": "Principio de legalidad y Ley 26.388", "pregunta": "¿Por qué hizo falta la Ley 26.388? ¿Cuáles son sus antecedentes y caracteres fundamentales?", "definicion": "Principio de legalidad (art. 18 CN): una acción no es delito si no está expresamente tipificada por una ley anterior al hecho, por más aberrante o dañina que sea. Prohibición de la analogía (derivada de la legalidad): no se puede castigar una conducta no tipificada por el solo hecho de que se parezca a otra que sí lo está. Antes de 2008, mientras no estuvieran en el Código Penal, estas conductas no podían castigarse y la jurisprudencia era contradictoria (alguien podía borrar información ajena y quedar impune). Solución: en 2008 la Ley 26.388 no creó un código aparte; modificó el Código Penal para incorporarle diversos delitos informáticos, ampliando conceptos que ya usaba.", "lista": {"titulo": "Línea de tiempo", "items": ["2004 · Ley 25.930: fraude con tarjetas y sus datos (art. 173 inc. 15)", "2008 · Ley 26.388: ley de delitos informáticos", "2013 · Ley 26.904: grooming (art. 131)", "2018 · Ley 27.436: reforma del art. 128: tenencia", "2026 · Proyecto: nuevo Código Penal anunciado; mientras no se apruebe, rige la numeración actual"]}, "ejemplo": null, "articulos": ["Art. 18 CN", "Ley 26.388", "Ley 25.930", "Ley 26.904", "Ley 27.436"], "fuente": "PPT", "ubicacion": "PPT slides 21-22; material §5", "alerta": null, "evidencia": [], "agregado": false, "b": 12, "nucleo": true}, {"id": "u12-vacios", "seccion": "La Ley 26.388", "termino": "Lo que la ley todavía no resolvió (y lo que sí)", "pregunta": "¿Existe en el Código Penal un delito autónomo de robo de identidad? ¿Y el grooming?", "definicion": "Robo de identidad: SIN FIGURA AUTÓNOMA. Sigue sin tener, hasta hoy, una figura penal autónoma y general, aunque hay proyectos legislativos; en la práctica se lo persigue como estafa (arts. 172 y 173) cuando el engaño sobre la identidad sirve para defraudar. Grooming: TIPIFICADO EN 2013. La Ley 26.904 sumó el art. 131: castiga a quien, por medios electrónicos o cualquier tecnología de transmisión de datos, contacte a una persona menor de edad con el propósito de cometer un delito contra su integridad sexual.", "lista": null, "ejemplo": null, "articulos": ["Arts. 172 y 173 CP", "Art. 131 CP", "Ley 26.904"], "fuente": "PPT", "ubicacion": "PPT slide 23; material §5", "alerta": null, "evidencia": ["tp6"], "agregado": false, "b": 12, "nucleo": false}, {"id": "u12-mapa", "seccion": "Los delitos en el Código Penal", "termino": "Mapa de los delitos incorporados al Código Penal", "pregunta": "¿Qué grupos de delitos incorporó la Ley 26.388 al Código Penal?", "definicion": "Recorrido por las figuras que incorporó la Ley 26.388, en seis grupos.", "lista": {"titulo": "Grupos", "items": ["I · Delitos contra menores: arts. 128 y 131", "II · Delitos contra la privacidad: arts. 153 a 157 bis", "III · Fraude o estafa informática: arts. 172 y 173", "IV · Daño o sabotaje informático: arts. 183 y 184", "V · Delitos contra las comunicaciones: art. 197", "VI · Contra la administración de justicia: arts. 254 y 255"]}, "ejemplo": null, "articulos": ["Arts. 128 y 131 CP", "Arts. 153 a 157 bis CP", "Arts. 172 y 173 CP", "Arts. 183 y 184 CP", "Art. 197 CP", "Arts. 254 y 255 CP"], "fuente": "PPT", "ubicacion": "PPT slide 25; material §6", "alerta": null, "evidencia": [], "agregado": false, "b": 12, "nucleo": false}, {"id": "u12-menores", "seccion": "Los delitos en el Código Penal", "termino": "Delitos contra menores (arts. 128 y 131)", "pregunta": "¿Qué castigan los arts. 128 y 131 del Código Penal?", "definicion": "Art. 128 (Leyes 26.388 y 27.436): castiga a quien produzca, financie, ofrezca, comercie, publique, facilite, divulgue o distribuya, por cualquier medio, representaciones sexuales de menores de 18 años. Desde 2018 también es delito la simple tenencia a sabiendas, con pena mayor si es con fines inequívocos de distribución o comercialización. Castiga además facilitar el acceso a espectáculos pornográficos o suministrar ese material a menores de 14 años. Art. 131: grooming. Internet potencia estas formas de abuso: facilita difundir el material y permite que los agresores contacten a menores a través de redes sociales.", "lista": null, "ejemplo": null, "articulos": ["Art. 128 CP", "Art. 131 CP", "Ley 26.388", "Ley 27.436"], "fuente": "PPT", "ubicacion": "PPT slide 26; material §6.I", "alerta": null, "evidencia": [], "agregado": false, "b": 12, "nucleo": false}, {"id": "u12-art153", "seccion": "Los delitos en el Código Penal", "termino": "Violación de comunicación electrónica (art. 153)", "pregunta": "¿Qué conductas castiga el art. 153? ¿Qué significa «indebidamente»?", "definicion": "Castiga: abrir o acceder a una comunicación electrónica, carta o pliego que no le esté dirigido; apoderarse de una comunicación ajena, aunque no esté cerrada; suprimir o desviar la comunicación de su destino; interceptar o captar comunicaciones de sistemas privados o de acceso restringido. Palabra clave: «indebidamente»: sin derecho; la comunicación no estaba dirigida a quien la abre y esa persona no estaba autorizada. Es un delito doloso. Acceder a la casilla de otro «sin querer» o con autorización del dueño no es este delito; hacerlo a escondidas y sin permiso, sí. Agravantes: comunicar o publicar el contenido; si es funcionario público que abusa de sus funciones, se suma la inhabilitación especial.", "lista": {"titulo": "Conductas", "items": ["Abrir o acceder a una comunicación electrónica, carta o pliego que no le esté dirigido", "Apoderarse de una comunicación ajena, aunque no esté cerrada", "Suprimir o desviar la comunicación de su destino", "Interceptar o captar comunicaciones de sistemas privados o de acceso restringido"]}, "ejemplo": null, "articulos": ["Art. 153 CP"], "fuente": "PPT", "ubicacion": "PPT slide 27; material §6.II.1", "alerta": null, "evidencia": ["tp6"], "agregado": false, "b": 12, "nucleo": false}, {"id": "u12-arts154-157", "seccion": "Los delitos en el Código Penal", "termino": "Abuso de funciones y secretos (arts. 154 a 157)", "pregunta": "¿Qué castigan los arts. 154 a 157?", "definicion": "Art. 154: empleado de correos que abusa de su empleo para apoderarse de correspondencia, conocer su contenido, entregarla a otro, suprimirla, ocultarla o cambiar su texto. Art. 155: publicar indebidamente una comunicación no destinada a publicidad, causando o pudiendo causar perjuicio; eximente: el propósito inequívoco de proteger un interés público (punto controversial). Art. 156: revelar sin justa causa un secreto conocido por razón del oficio, empleo o profesión (un administrador de sistemas conoce, por su oficio, muchísimos secretos ajenos: el art. 156 también les habla a ellos). Art. 157: funcionario público que revela datos que por ley deben ser secretos: pena mayor.", "lista": null, "ejemplo": null, "articulos": ["Art. 154 CP", "Art. 155 CP", "Art. 156 CP", "Art. 157 CP"], "fuente": "PPT", "ubicacion": "PPT slide 28; material §6.II.3", "alerta": null, "evidencia": [], "agregado": false, "b": 12, "nucleo": false}, {"id": "u12-art157bis", "seccion": "Los delitos en el Código Penal", "termino": "Violación a bancos de datos (art. 157 bis)", "pregunta": "¿Qué conductas castiga el art. 157 bis?", "definicion": "Acceder, a sabiendas e ilegítimamente, o violando sistemas de confidencialidad, a un banco de datos personales; revelar a otro información de un banco de datos cuyo secreto estaba obligado a preservar; insertar ilegítimamente, o hacer insertar, datos en un archivo de datos personales. Si el autor es funcionario público, se agrega la inhabilitación. Conecta con la Bolilla 13: protección de datos personales.", "lista": {"titulo": "Conductas", "items": ["Acceder: a sabiendas e ilegítimamente, o violando sistemas de confidencialidad, a un banco de datos personales", "Revelar: a otro información de un banco de datos cuyo secreto estaba obligado a preservar", "Insertar: ilegítimamente, o hacer insertar, datos en un archivo de datos personales"]}, "ejemplo": null, "articulos": ["Art. 157 bis CP"], "fuente": "PPT", "ubicacion": "PPT slide 29; material §6.II.4", "alerta": null, "evidencia": ["tp6"], "agregado": false, "b": 12, "nucleo": false}, {"id": "u12-acceso-153bis", "seccion": "Los delitos en el Código Penal", "termino": "Acceso no autorizado a un sistema (art. 153 bis)", "pregunta": "¿Qué es el acceso no autorizado a un sistema informático? ¿Cuál es la conducta típica?", "definicion": "Castiga a quien a sabiendas accede por cualquier medio, sin la debida autorización o excediendo la que posea, a un sistema o dato informático de acceso restringido. Agravante (2º párr.): cuando el acceso es en perjuicio de un sistema de un organismo público estatal o de un proveedor de servicios públicos o financieros.", "lista": {"titulo": "Elementos de la conducta típica", "items": ["«A sabiendas»: delito doloso; hay que saber que se entra sin permiso. Un acceso accidental no encaja", "«Por cualquier medio»: la técnica da igual: contraseña robada, vulnerabilidad o ingeniería social", "«Sin autorización o excediendo la que posea»: la bisagra de todo: entrar sin permiso o salirse del permiso que se tiene", "«Acceso restringido»: tiene que haber una barrera, aunque sea tan sencilla como una contraseña"]}, "ejemplo": null, "articulos": ["Art. 153 bis CP"], "fuente": "PPT", "ubicacion": "PPT slide 30; material §7", "alerta": null, "evidencia": ["tp6"], "agregado": false, "b": 12, "nucleo": true}, {"id": "u12-sin-vs-excediendo", "seccion": "Los delitos en el Código Penal", "termino": "Sin la debida autorización vs excediendo la autorización", "pregunta": "¿Qué diferencia hay entre acceder «sin la debida autorización» y «excediendo la que posee»?", "definicion": "Sin la debida autorización: un desarrollador termina un proyecto y conserva sus credenciales; meses después entra «para ver cómo anda el sistema»: su permiso terminó con el contrato. Excediendo la autorización: un empleado de soporte tiene acceso a la base de datos para mantenimiento, pero la consulta para espiar los datos de un conocido; si era un banco de datos personales, puede sumarse el art. 157 bis. En ambos casos la conducta puede ser delictiva según el art. 153 bis, aunque ninguno haya «roto» nada en sentido técnico.", "lista": {"titulo": "Sin autorización vs excediendo", "items": ["Situación: sin autorización = ex desarrollador que conserva credenciales y entra meses después; excediendo = soporte con acceso para mantenimiento que espía datos de un conocido", "Por qué: sin autorización = su permiso terminó con el contrato; excediendo = se sale del alcance del permiso que sí tiene", "Concurso: excediendo sobre un banco de datos personales puede sumar el art. 157 bis"]}, "ejemplo": null, "articulos": ["Art. 153 bis CP", "Art. 157 bis CP"], "fuente": "PPT+material", "ubicacion": "PPT slide 31; material §7", "alerta": null, "evidencia": ["tp6"], "agregado": false, "b": 12, "nucleo": false}, {"id": "u12-art197", "seccion": "Los delitos en el Código Penal", "termino": "Interrupción de comunicaciones (art. 197)", "pregunta": "¿Qué castiga el art. 197? ¿Cómo se relaciona con un ataque DoS?", "definicion": "Castiga a quien interrumpe o entorpece la comunicación telegráfica, telefónica o de otra naturaleza, o resiste violentamente su restablecimiento. Ataque de denegación de servicio (DoS): saturar un servidor para que deje de responder al tráfico legítimo es, jurídicamente, entorpecer o interrumpir una comunicación. Lo que para el atacante es «tirar abajo una página», para el derecho es una conducta tipificada.", "lista": null, "ejemplo": null, "articulos": ["Art. 197 CP"], "fuente": "PPT", "ubicacion": "PPT slide 32; material §7", "alerta": null, "evidencia": ["tp6"], "agregado": false, "b": 12, "nucleo": false}, {"id": "u12-estafa", "seccion": "Los delitos en el Código Penal", "termino": "Estafa informática (arts. 172 y 173)", "pregunta": "¿Qué es la estafa informática? ¿Cuáles son sus conductas típicas?", "definicion": "Art. 172 (la base): defraudar a otro mediante un ardid o engaño: usar un nombre supuesto, simular una calidad, exhibir falsos títulos, abusar de la confianza, aparentar bienes o crédito que no se tienen. Art. 173: casos especiales de defraudación.", "lista": {"titulo": "Art. 173: casos especiales (inciso · conducta · origen)", "items": ["Inc. 3: hacer suscribir con engaño un documento (puede ser electrónico) · antiguo + art. 77", "Inc. 4: abusar de una firma en blanco (incluye firma electrónica) · antiguo + art. 77", "Inc. 8: sustituir, ocultar o mutilar un expediente o documento · antiguo + art. 77", "Inc. 15: usar una tarjeta falsificada, robada o perdida, o sus datos sin autorización, aun por operación automática · Ley 25.930 (2004)", "Inc. 16: cualquier técnica de manipulación informática que altere el funcionamiento de un sistema o la transmisión de datos · Ley 26.388 (2008)"]}, "ejemplo": null, "articulos": ["Art. 172 CP", "Art. 173 incs. 3, 4, 8, 15 y 16 CP", "Ley 25.930", "Ley 26.388"], "fuente": "PPT", "ubicacion": "PPT slide 33; material §8", "alerta": null, "evidencia": [], "agregado": false, "b": 12, "nucleo": false}, {"id": "u12-inc16", "seccion": "Los delitos en el Código Penal", "termino": "Fraude por manipulación informática (art. 173 inc. 16)", "pregunta": "¿Qué establece el art. 173 inc. 16? ¿Por qué es amplio?", "definicion": "Defraudar mediante cualquier técnica de manipulación informática que altere el normal funcionamiento de un sistema o la transmisión de datos. Es amplio a propósito: no se ata a una técnica que mañana quedaría obsoleta; es el «paraguas» de las modalidades (phishing, pharming, troyanos, robo de identidad).", "lista": null, "ejemplo": null, "articulos": ["Art. 173 inc. 16 CP"], "fuente": "PPT", "ubicacion": "PPT slide 34; material §8", "alerta": null, "evidencia": ["tp6"], "agregado": false, "b": 12, "nucleo": false}, {"id": "u12-dano-183", "seccion": "Los delitos en el Código Penal", "termino": "Daño o sabotaje informático (arts. 183 y 184)", "pregunta": "¿Qué castiga el art. 183, 2º párrafo? ¿Cuáles son sus agravantes?", "definicion": "El art. 183, 2º párrafo, castiga dos momentos distintos: 1) el daño en sí: alterar, destruir o inutilizar datos, documentos, programas o sistemas informáticos; 2) hacerlo circular: vender, distribuir, hacer circular o introducir en un sistema cualquier programa destinado a causar daños. Quien fabrica y reparte malware ya puede responder penalmente, aunque no lo haya ejecutado en la máquina de la víctima. No comprende las medidas de protección legítimas (como el DRM) ni la acción normal de un antivirus: proteger lo propio no es sabotear.", "lista": {"titulo": "Agravantes (art. 184)", "items": ["Inc. 5: datos, programas o sistemas públicos", "Inc. 6: sistemas de servicios esenciales (salud, comunicaciones, energía, transporte)"]}, "ejemplo": null, "articulos": ["Art. 183 CP", "Art. 184 incs. 5 y 6 CP"], "fuente": "PPT", "ubicacion": "PPT slide 35; material §9", "alerta": null, "evidencia": ["tp6"], "agregado": false, "b": 12, "nucleo": false}, {"id": "u12-ingenieria-social", "seccion": "Modalidades y código malicioso", "termino": "Ingeniería social", "pregunta": "¿Qué es la ingeniería social? ¿Dónde se encuadran las modalidades que se apoyan en ella?", "definicion": "Práctica ilegítima de obtener información confidencial manipulando a los propios usuarios. En lugar de atacar la máquina, se ataca a la persona que la usa. El usuario suele ser el eslabón débil: por más firewalls que tenga una empresa, si alguien convence a un empleado de decir su contraseña, toda la defensa técnica se vuelve inútil.", "lista": {"titulo": "¿Dónde se encuadran? (ninguna modalidad tiene un artículo con su nombre)", "items": ["Art. 172: estafa genérica", "Art. 173 inc. 15: uso no autorizado de datos de tarjetas", "Art. 173 inc. 16: manipulación informática", "+ art. 153 bis: acceso ilegítimo, muchas veces"]}, "ejemplo": null, "articulos": ["Art. 172 CP", "Art. 173 incs. 15 y 16 CP", "Art. 153 bis CP"], "fuente": "PPT", "ubicacion": "PPT slide 37; material §8", "alerta": "PPT: «práctica ilegítima»; apunte manuscrito del Quiz 11: «práctica legítima» (error del apunte). Va la del PPT: ilegítima.", "evidencia": ["quiz11"], "agregado": false, "b": 12, "nucleo": true}, {"id": "u12-phishing-pharming", "seccion": "Modalidades y código malicioso", "termino": "Phishing y pharming", "pregunta": "¿Qué es el phishing? ¿Qué es el pharming? ¿Por qué el pharming es más peligroso?", "definicion": "Phishing (pescar incautos): normalmente por correo, con cualquier excusa («validá tus datos», «tu cuenta fue bloqueada»); el contenido casi no importa: lo que el atacante necesita es el clic; la víctima llega a una página que cree que es la de su banco, diseñada para robarle las claves. Pharming (adulterar la agenda, art. 173 inc. 16): con el DNS o el archivo hosts adulterado, el usuario escribe la dirección correcta del banco y llega a la página falsa del atacante, sin hacer clic en nada. Por eso es más peligroso que el phishing: es mucho más difícil de detectar.", "lista": {"titulo": "Phishing vs pharming", "items": ["Mecanismo: phishing = correo con excusa que lleva a hacer clic; pharming = adulteración del DNS o del archivo hosts", "Acción de la víctima: phishing = necesita el clic; pharming = sin hacer clic en nada, escribiendo la dirección correcta", "Detección: phishing = señales: urgencia, amenaza, remitente con dominio raro, botón que pide credenciales; pharming = mucho más difícil de detectar (más peligroso)", "Alcance del pharming: si ataca un servidor DNS caen muchos usuarios a la vez; si modifica el archivo hosts, cae un equipo", "Encuadre: pharming = art. 173 inc. 16"]}, "ejemplo": "Analogía del PPT: cada computadora tiene una dirección IP, como una dirección postal; el dominio es un apodo cómodo, como el nombre en una agenda telefónica. El pharming adultera esa agenda.", "articulos": ["Art. 173 inc. 16 CP"], "fuente": "PPT", "ubicacion": "PPT slides 38-39; material §8", "alerta": null, "evidencia": ["tp6"], "agregado": false, "b": 12, "nucleo": true}, {"id": "u12-troyano", "seccion": "Modalidades y código malicioso", "termino": "Troyano", "pregunta": "¿Qué es un troyano? ¿Cómo se encuadra?", "definicion": "Parece legítimo e inofensivo; al ejecutarlo, le abre a un atacante el acceso remoto al equipo. Puerta trasera: la mayoría crea un backdoor que permite a un tercero no autorizado administrar la máquina. Captura todo: puede registrar lo que la víctima teclea, incluidas sus claves bancarias, sin que lo note. No se reproduce solo: a diferencia de virus y gusanos, no se copia por su cuenta. Encuadre: instalarlo en un equipo ajeno ya puede ser acceso ilegítimo (art. 153 bis); distribuirlo puede encuadrar en el art. 183, 2º párrafo.", "lista": null, "ejemplo": null, "articulos": ["Art. 153 bis CP", "Art. 183 CP"], "fuente": "PPT", "ubicacion": "PPT slide 40; material §8", "alerta": null, "evidencia": ["tp6"], "agregado": false, "b": 12, "nucleo": false}, {"id": "u12-robo-identidad", "seccion": "Modalidades y código malicioso", "termino": "Robo de identidad", "pregunta": "¿Qué es el robo de identidad? ¿Cómo se persigue?", "definicion": "Con datos personales y credenciales obtenidos por phishing, pharming, troyanos o spyware, el delincuente se hace pasar por la víctima para operar en su nombre, vaciar cuentas, pedir créditos o contratar servicios. Todavía sin figura penal autónoma: se lo persigue a través de la estafa (arts. 172 y 173) y de los demás delitos que se cometen al usar la identidad usurpada. Un frente donde la ley aún tiene materia pendiente.", "lista": null, "ejemplo": null, "articulos": ["Arts. 172 y 173 CP"], "fuente": "PPT", "ubicacion": "PPT slide 41; material §8", "alerta": null, "evidencia": ["tp6"], "agregado": false, "b": 12, "nucleo": false}, {"id": "u12-virus-gusano", "seccion": "Modalidades y código malicioso", "termino": "Virus y gusano", "pregunta": "¿Qué diferencia hay entre un virus y un gusano? ¿Por qué importa legalmente?", "definicion": "Virus: depende de un archivo para copiarse. Gusano: se replica por sí mismo a través de la red. Por qué importa: un peritaje que los confunde puede cambiar cómo se entiende el ataque. En ambos casos, quien los distribuye o introduce responde por el art. 183, 2º párr.", "lista": {"titulo": "Virus vs gusano", "items": ["Reproducción: virus = actúa de forma transparente al usuario y se reproduce a sí mismo; gusano = se replica por sí mismo a través de la red", "Anfitrión: virus = necesita un archivo anfitrión; gusano = programa independiente, no necesita archivo anfitrión", "Ingreso/propagación: virus = entra por otros equipos, medios extraíbles o la red; gusano = se propaga por la red local, internet, el correo o fallas del sistema operativo", "Tipos/objetivo: virus = de archivo (.exe, .com), de script, de boot y de macro; de acción directa o residentes en memoria; gusano = llegar a la mayor cantidad de equipos, en minutos", "Daño: gusano = daña aunque sea consumiendo ancho de banda; a veces se usa en ataques DoS"]}, "ejemplo": null, "articulos": ["Art. 183 CP"], "fuente": "PPT", "ubicacion": "PPT slide 42; material §9", "alerta": null, "evidencia": [], "agregado": false, "b": 12, "nucleo": true}, {"id": "u12-spyware-otras", "seccion": "Modalidades y código malicioso", "termino": "Spyware y otras amenazas", "pregunta": "¿Qué es el spyware? ¿Qué otras amenazas frecuentes existen?", "definicion": "Spyware: recolecta información sensible del usuario sin su conocimiento: desde qué sitios visita hasta datos financieros para el robo de identidad. El eslabón silencioso de muchas estafas. Instalarlo sin permiso: art. 153 bis. Si capta comunicaciones: art. 153.", "lista": {"titulo": "Otras amenazas", "items": ["Adware: publicidad invasiva; suele venir con programas gratuitos y a menudo es legal (figura en la licencia)", "Rogue: simula ser un antivirus, muestra alertas falsas y cobra por una «solución» que instala malware", "Riskware: no es malware puro pero aumenta los riesgos, como los viejos «dialers»", "Aplicaciones peligrosas: programas legítimos que mal usados exponen al usuario: keyloggers, acceso remoto", "Hoax: desinformación en cadena que se propaga porque las personas la reenvían", "Scam: engaño para obtener dinero o datos. Jurídicamente, estafa del art. 172"]}, "ejemplo": null, "articulos": ["Art. 153 bis CP", "Art. 153 CP", "Art. 172 CP"], "fuente": "PPT", "ubicacion": "PPT slide 43; material §9", "alerta": null, "evidencia": ["tp6"], "agregado": false, "b": 12, "nucleo": false}, {"id": "u12-ataques-remotos", "seccion": "Modalidades y código malicioso", "termino": "Ataques remotos", "pregunta": "¿Qué ataques remotos se mencionan y cómo se encuadran?", "definicion": "Misma herramienta, distinta calificación: la diferencian el permiso y la intención. El encuadre que se indica es orientativo: depende de cómo se concrete cada hecho.", "lista": {"titulo": "Ataque · qué hace · encuadre orientativo", "items": ["DoS (denegación de servicio): satura un equipo o red con solicitudes hasta que deja de responder al tráfico legítimo · art. 197", "Envenenamiento de DNS: engaña al servidor DNS para que tome información falsa como verdadera; emparentado con el pharming · art. 173 inc. 16", "Análisis de puertos: rastrea qué puertos están abiertos; puede ser una tarea legítima o el primer paso de un atacante · depende (con autorización es trabajo de seguridad; a escondidas para preparar un ataque es la antesala de un delito)", "Secuestro o interferencia de TCP, SMB relay, ICMP: leer, insertar o modificar mensajes, o degradar la red · arts. 153 / 197"]}, "ejemplo": null, "articulos": ["Art. 197 CP", "Art. 173 inc. 16 CP", "Art. 153 CP"], "fuente": "PPT", "ubicacion": "PPT slide 44; material §9", "alerta": null, "evidencia": ["tp6"], "agregado": false, "b": 12, "nucleo": false}, {"id": "u12-destruccion-prueba", "seccion": "La prueba informática", "termino": "Destrucción de prueba informática (arts. 254 y 255)", "pregunta": "¿Qué es la destrucción de prueba informática? ¿Qué castigan los arts. 254 y 255?", "definicion": "Art. 255: castiga a quien sustrae, altera, oculta, destruye o inutiliza objetos destinados a servir de prueba ante la autoridad, o registros y documentos bajo custodia oficial; prevé multa para el depositario que la deja perder por imprudencia o negligencia. Art. 254: violar los sellos puestos por la autoridad para asegurar la conservación o identidad de una cosa. La prueba informática (un log de conexión, un correo, el contenido de un disco, los metadatos de un archivo) es valiosísima y facilísima de borrar. Doble problema: borrar o alterar deliberadamente esa prueba puede ser, en sí mismo, un delito contra la administración de justicia, además del delito original que se intentaba ocultar.", "lista": null, "ejemplo": null, "articulos": ["Art. 254 CP", "Art. 255 CP"], "fuente": "PPT", "ubicacion": "PPT slide 46; material §10", "alerta": null, "evidencia": ["tp6"], "agregado": false, "b": 12, "nucleo": false}, {"id": "u12-cadena-custodia", "seccion": "La prueba informática", "termino": "Cadena de custodia: preservar, no limpiar", "pregunta": "¿Qué debe hacer el área de sistemas ante un incidente? ¿Qué es la cadena de custodia?", "definicion": "Ante un incidente: preservar, no limpiar. Cadena de custodia: es la diferencia entre una prueba que sirve ante un juez y una que se cae por haber sido alterada. Modificar la prueba, aun con buena intención, puede arruinar una investigación y comprometer legalmente a quien la manipuló.", "lista": {"titulo": "Pasos", "items": ["1 · Aislar el equipo: cortar el contacto con la red sin borrar ni reinstalar nada", "2 · Resguardar los registros: copiar logs y evidencia antes de que se roten o se pierdan", "3 · Documentar todo: qué se hizo, quién lo hizo y cuándo", "4 · Tocar lo mínimo: no manipular la evidencia más de lo imprescindible"]}, "ejemplo": null, "articulos": [], "fuente": "PPT", "ubicacion": "PPT slide 47; material §10", "alerta": null, "evidencia": ["tp6"], "agregado": false, "b": 12, "nucleo": true}, {"id": "u12-sintesis-cp", "seccion": "La prueba informática", "termino": "Síntesis: delito, qué protege y palabra clave", "pregunta": "Complete: delito y artículo / qué protege / palabra clave.", "definicion": "Cuadro síntesis del PPT de las figuras del Código Penal.", "lista": {"titulo": "Delito (art.) · qué protege · palabra clave", "items": ["Acceso no autorizado (art. 153 bis) · la integridad del sistema o dato restringido · «sin autorización o excediendo la que se posee»", "Violación de comunicación electrónica (art. 153) · la intimidad de las comunicaciones · «indebidamente»", "Interrupción de comunicaciones (art. 197) · que las comunicaciones fluyan · entorpecer o interrumpir (ej. DoS)", "Estafa informática (arts. 172 y 173 incs. 15 y 16) · el patrimonio · «manipulación informática», ardid o engaño", "Daño o sabotaje informático (arts. 183 y 184) · datos, programas y sistemas · alterar, destruir, inutilizar o distribuir malware", "Violación a bancos de datos (art. 157 bis) · los datos personales · acceso o revelación ilegítima", "Destrucción de prueba informática (art. 255) · la administración de justicia · preservar la evidencia (inmediatez)"]}, "ejemplo": null, "articulos": ["Art. 153 bis CP", "Art. 153 CP", "Art. 197 CP", "Arts. 172 y 173 incs. 15 y 16 CP", "Arts. 183 y 184 CP", "Art. 157 bis CP", "Art. 255 CP"], "fuente": "PPT", "ubicacion": "PPT slide 48; material síntesis", "alerta": null, "evidencia": ["tp6"], "agregado": false, "b": 12, "nucleo": true}, {"id": "u12-tres-ideas", "seccion": "La prueba informática", "termino": "Tres ideas para llevarse", "pregunta": "¿Cuáles son las tres ideas centrales de la bolilla?", "definicion": "1) Legalidad: solo es delito lo que la ley describió previamente como tal; por eso hizo falta la Ley 26.388. 2) Permiso e intención: en casi todas estas figuras, la línea entre lo lícito y lo ilícito la marcan el permiso y la intención, no la destreza técnica. 3) Prevención y prueba: casi siempre van a estar del lado de la prevención y de la preservación de la prueba; conocer esta ley es parte de su responsabilidad profesional.", "lista": null, "ejemplo": null, "articulos": ["Ley 26.388"], "fuente": "PPT", "ubicacion": "PPT slide 49; material cierre", "alerta": null, "evidencia": [], "agregado": false, "b": 12, "nucleo": false}, {"id": "u13-marco-normativo", "seccion": "Marco legal", "termino": "Marco normativo vigente", "pregunta": "¿Qué normas rigen hoy la protección de datos personales en Argentina?", "definicion": "Marco legal: Constitución Nacional, Ley Nacional 25.326 y Convenio 108 y 108+.", "lista": {"titulo": "Qué normas rigen hoy (PPT, actualizado a noviembre de 2026)", "items": ["Constitución Nacional: art. 43, acción de hábeas data; arts. 18 y 19, privacidad e intimidad.", "Ley 25.326 y Decreto 1558/2001: ley general de protección de datos personales, sancionada en el año 2000. Sigue vigente.", "Convenio 108 y Convenio 108+: tratado del Consejo de Europa. Argentina es parte desde 2019 (Ley 27.483) y aprobó la versión modernizada por Ley 27.699 (2022).", "Ley 26.951: Registro «No Llame». Permite bloquear llamadas y mensajes publicitarios. También lo controla la AAIP.", "Resoluciones de la AAIP: Res. 47/2018, medidas de seguridad recomendadas; Res. 126/2024, tipos de infracciones y graduación de sanciones.", "Reconocimiento de la Unión Europea: Argentina es «país con nivel adecuado» desde 2003. La Comisión Europea lo ratificó el 15/01/2024."]}, "ejemplo": null, "articulos": ["Art. 43 CN", "Arts. 18 y 19 CN", "Ley 25.326", "Decreto 1558/2001", "Ley 27.483", "Ley 27.699", "Ley 26.951", "Res. AAIP 47/2018", "Res. AAIP 126/2024"], "fuente": "PPT+material", "ubicacion": "PPT slides 2-3; material pp. 2-4", "alerta": null, "evidencia": [], "agregado": false, "b": 13, "nucleo": false}, {"id": "u13-reforma", "seccion": "Marco legal", "termino": "Reforma de la Ley 25.326", "pregunta": "¿La Ley 25.326 fue reformada? ¿Qué temas se repiten en los proyectos?", "definicion": "La Ley 25.326 tiene 26 años y sigue vigente: ningún proyecto de reforma se aprobó todavía. El Convenio 108+ obliga a la Argentina a actualizar su legislación.", "lista": {"titulo": "Temas que se repiten en los proyectos", "items": ["Protección especial de niñas, niños y adolescentes.", "Datos biométricos (rostro, huella, iris).", "Decisiones automatizadas e IA: transparencia y derecho a la explicación.", "«Derecho al olvido» o desindexación.", "Autoridad de control con más independencia.", "Acercar la ley al RGPD europeo."]}, "ejemplo": "Proyecto del Poder Ejecutivo de 2023, presentado otra vez en julio de 2026 (expte. 3397-D-2026).", "articulos": [], "fuente": "PPT+material", "ubicacion": "PPT slide 4; material pp. 3-4", "alerta": null, "evidencia": [], "agregado": false, "b": 13, "nucleo": false}, {"id": "u13-objeto-ley", "seccion": "Marco legal", "termino": "Objeto de la Ley 25.326", "pregunta": "¿Cuál es el objeto de la Ley 25.326?", "definicion": "La protección integral de los datos personales asentados en archivos, registros, bancos de datos, u otros medios técnicos de tratamiento de datos, sean éstos públicos, o privados destinados a dar informes, para garantizar el derecho al honor y a la intimidad de las personas, así como también el acceso a la información que sobre ellas se registre, de conformidad al artículo 43 de la Constitución Nacional.", "lista": null, "ejemplo": null, "articulos": ["Art. 1 Ley 25.326", "Art. 43 CN"], "fuente": "PPT", "ubicacion": "PPT slide 5; material p. 3 (art. 1)", "alerta": null, "evidencia": ["quiz13"], "agregado": false, "b": 13, "nucleo": true}, {"id": "u13-habeas-data", "seccion": "Marco legal", "termino": "Hábeas data (art. 43 CN)", "pregunta": "¿Qué dice la Constitución sobre el hábeas data?", "definicion": "Toda persona puede interponer un HABEAS DATA, para tomar conocimiento de los datos a ella referidos y de su finalidad, que consten en registros o bancos de datos públicos, o los privados destinados a proveer informes, y en caso de falsedad o discriminación, para exigir la supresión, rectificación, confidencialidad o actualización de aquéllos.", "lista": {"titulo": "Claves (material)", "items": ["Origen: reforma constitucional de 1994, art. 43 CN.", "Límite: no podrá afectarse el secreto de las fuentes de información periodística (art. 43, tercer párrafo, CN).", "Como acción: juicio rápido que la persona inicia cuando el responsable no respeta sus derechos (arts. 33 y siguientes).", "Se usa cuando el titular ejerció acceso o rectificación ante el responsable y no le respondieron o le respondieron mal."]}, "ejemplo": "Una persona pide a una base qué datos tiene de ella; no le contestan; recurre a la Justicia por hábeas data.", "articulos": ["Art. 43 CN", "Arts. 33 y siguientes Ley 25.326"], "fuente": "PPT+material", "ubicacion": "PPT slides 6 y 27; material pp. 2 y 12-13", "alerta": null, "evidencia": ["tp7"], "agregado": false, "b": 13, "nucleo": true}, {"id": "u13-dnpdp-aaip", "seccion": "Marco legal", "termino": "Autoridad de control: DNPDP / AAIP", "pregunta": "¿Quién es la autoridad de control de la Ley 25.326?", "definicion": "La DNPDP (Dirección Nacional de Protección de Datos Personales) se creó en el año 2000. Hoy es parte de la Agencia de Acceso a la Información Pública (AAIP)
