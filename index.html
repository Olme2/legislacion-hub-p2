ptos": ["Contrato", "Elementos del contrato", "Contrato informático", "Clasificación según el objeto", "Clasificación según el negocio jurídico"], "dudosa": false}, {"q": "¿Quién tiene razón en la discusión sobre lo que se pidió? Fundamente.", "respuesta": "Los dos tienen parte de culpa. El PPT exige que el contrato tenga un objeto cierto y determinado, coincidente entre oferta y aceptación; «sistema de stock adecuado» es ambiguo, y la ambigüedad genera conflictos e incumplimientos. El estudio tenía los deberes de información y de consejo derivados de la buena fe precontractual: debía orientar al cliente y preguntar lo necesario, y a mayor complejidad corresponde un pliego técnico especializado. Pero el usuario también debe colaborar activamente, detallando sus necesidades y especificaciones, y el gerente no informó los depósitos ni el sistema de facturación. El material agrega que, si el contrato quedó ambiguo, la duda se interpreta contra quien lo redactó (el proveedor).", "conceptos": ["Objetivos perseguidos por las partes", "Distancia proveedor-usuario y deber de información", "Cláusulas abusivas en contratos de adhesión"], "dudosa": true}, {"q": "¿Qué característica técnica faltó especificar para que el sistema sirviera? ¿Cómo debió quedar escrita?", "respuesta": "La compatibilidad, en su dimensión de interfaces/datos e interoperabilidad: la capacidad de intercambiar datos y trabajar conjuntamente con sistemas de terceros. El PPT advierte que si un sistema no es compatible con elementos críticos del entorno del cliente (sistemas legados, otros servicios) no cumple su finalidad, y que en el contrato hay que detallar versiones y protocolos a soportar. Redacción sugerida (agregada): «El sistema exportará diariamente los movimientos de stock al sistema de facturación del cliente mediante la API y el formato JSON que este utiliza».", "conceptos": ["Compatibilidad"], "dudosa": false}], "nota": "Caso inventado. «Dudosa» en la pregunta 2: el reparto de culpas no lo resuelve ninguna fuente; la interpretación contra el redactor es solo del material (art. 987 CCyC, caso Sistex).", "agregado": true, "fuentes": "PPT B11; material B11"}, {"id": "inv11-2", "titulo": "Las notebooks del estudio contable", "bolillas": [11], "origen": "Inventado", "pie": "Un estudio contable de Yerba Buena firma tres contratos con el mismo proveedor: toma 10 notebooks por 36 meses pagando una cuota mensual, con la posibilidad de comprarlas al final; adquiere una licencia de un software contable estándar (enlatado), y contrata soporte técnico mensual.\nTodo está en un formulario impreso que el estudio firmó sin poder cambiar nada. Una de sus cláusulas dice: «El proveedor no responde por ningún daño derivado del uso del software».\nEl técnico instala todo un lunes y el contador, apurado, firma ese mismo día el acta de conformidad. A la semana, el software no emite los reportes que el estudio necesita para sus clientes. El proveedor contesta que el producto «ya fue aceptado».", "pista": "Leasing vs. locación; licencia de software enlatado; prestación de servicios; test de aceptación salteado; adhesión y cláusulas abusivas (material).", "preguntas": [{"q": "¿Qué clase de contrato es cada uno, según su objeto y según el negocio jurídico?", "respuesta": "Las notebooks: de equipamiento y de leasing, porque se da el uso de los equipos con opción de compra al final (no es locación, que concede el uso sin opción de compra, ni compraventa, porque la propiedad no se transmite de entrada). La licencia: de software estándar o enlatado, cuyo objeto es la licencia de un programa (como el ejemplo de Microsoft 365 del PPT). El soporte: de servicios informáticos y de prestación de servicios, porque busca una actividad técnica y no la entrega de un bien.", "conceptos": ["Clasificación según el objeto", "Clasificación según el negocio jurídico"], "dudosa": false}, {"q": "¿Qué etapa del contrato se salteó el estudio y qué debería haber hecho?", "respuesta": "Se salteó la etapa de verificación o test de aceptación: el usuario debía probar el sistema para verificar que cumple los objetivos funcionales pactados (por ejemplo, que emite correctamente los reportes, que es el mismo ejemplo del PPT), documentar el resultado en un acta de aceptación o rechazo y exigir que el proveedor corrija las fallas antes de la aceptación definitiva. Al firmar el acta de conformidad el mismo día pasó directo a la etapa de aceptación, con la que se inicia la garantía. El material recomienda pactar que el usuario no acepte ni pague hasta que el sistema supere las pruebas. Igual conserva la etapa de garantía, en la que el proveedor debe asegurar el correcto funcionamiento durante el período acordado.", "conceptos": ["Test de aceptación", "Etapas del contrato informático"], "dudosa": false}, {"q": "¿Es válida la cláusula «el proveedor no responde por ningún daño»? Fundamente.", "respuesta": "En principio no. El formulario es un contrato de adhesión: redactado por el predisponente y aceptado en bloque por el adherente, con la desigualdad técnica agravada propia de los contratos informáticos. Según el material, en los contratos por adhesión se tienen por no escritas las cláusulas que desnaturalizan las obligaciones del predisponente o restringen los derechos del adherente (art. 988 CCyC), y la Ley 24.240 tiene por no convenidas las que limitan la responsabilidad por daños (art. 37). Una exención total de responsabilidad vacía la obligación del proveedor.", "conceptos": ["Contratos de adhesión", "Cláusulas abusivas en contratos de adhesión"], "dudosa": true}], "nota": "Caso inventado. Pregunta 3 «dudosa»: la nulidad de cláusulas abusivas está solo en el material, no en el PPT; y que el estudio sea consumidor en los términos de la Ley 24.240 no lo cierran las fuentes.", "agregado": true, "fuentes": "PPT B11; material B11 (arts. 988 CCyC y 37 Ley 24.240)"}, {"id": "ppt12-1", "titulo": "La casilla del ex empleado", "bolillas": [12], "origen": "PPT B12", "pie": "Un administrador «recupera» el acceso a la casilla de correo de un ex empleado porque se lo pidió su jefe. Ninguno se siente un delincuente. Sin embargo, según cómo actúe, cualquiera de los tres podría estar cometiendo un delito tipificado en el Código Penal.", "pista": "Comunicación electrónica ajena + palabra clave «indebidamente»: ¿hay autorización legítima y con alcance claro?", "preguntas": [{"q": "¿Comete delito el administrador? Fundamente.", "respuesta": "Depende (resolución del PPT). Que lo pida el jefe no alcanza: hace falta una autorización legítima y un alcance claro. El art. 153 castiga a quien indebidamente abre o accede a una comunicación electrónica que no le esté dirigida; «indebidamente» significa sin derecho: la comunicación no estaba dirigida a quien la abre y esa persona no estaba autorizada. Si el administrador abre o lee los correos del ex empleado sin derecho, encaja en el art. 153; con autorización legítima y dentro de su alcance, no.", "conceptos": ["Violación de comunicación electrónica (art. 153)", "Tres ideas para llevarse"], "dudosa": false}, {"q": "¿Qué tipo de delito sería en cuanto al elemento subjetivo?", "respuesta": "Doloso. El PPT dice que la violación de comunicación electrónica es un delito doloso: acceder a la casilla de otro «sin querer» o con autorización del dueño no es este delito; hacerlo a escondidas y sin permiso, sí. Por eso, si el administrador sabe que no tiene derecho a leer esas comunicaciones y lo hace igual, actúa con dolo (a sabiendas y con intención).", "conceptos": ["Violación de comunicación electrónica (art. 153)", "Dolo y culpa"], "dudosa": false}], "nota": "Resolución tomada del slide «Volvamos a los tres casos» (PPT B12, slide 50). La segunda pregunta es agregada, respondida con el slide 27.", "agregado": false, "fuentes": "PPT B12 slides 2, 27, 50; material B12 intro y §6.II.1"}, {"id": "ppt12-2", "titulo": "La contraseña vieja", "bolillas": [12], "origen": "PPT B12", "pie": "Una desarrolladora entra, por curiosidad, a la base de datos de un cliente con una contraseña vieja que nunca se dio de baja. Ninguno se siente un delincuente. Sin embargo, según cómo actúe, cualquiera de los tres podría estar cometiendo un delito tipificado en el Código Penal.", "pista": "Acceso a sistema restringido sin la debida autorización; base de datos ⇒ ¿banco de datos personales?", "preguntas": [{"q": "¿Comete delito la desarrolladora? ¿En qué artículo encuadra? Fundamente.", "respuesta": "Sí, delito (resolución del PPT). Es acceso sin la debida autorización a un sistema restringido: art. 153 bis, que castiga a quien a sabiendas accede por cualquier medio, sin la debida autorización o excediendo la que posea, a un sistema o dato informático de acceso restringido. La técnica da igual («por cualquier medio») y la contraseña es la barrera que hace restringido el acceso. Si la base es un banco de datos personales, además corresponde el art. 157 bis (acceder a sabiendas e ilegítimamente a un banco de datos personales).", "conceptos": ["Acceso no autorizado a un sistema (art. 153 bis)", "Violación a bancos de datos (art. 157 bis)"], "dudosa": false}, {"q": "Ella alega que entró «solo por curiosidad» y que la contraseña funcionaba. ¿La exime eso?", "respuesta": "No. El dolo del art. 153 bis es «a sabiendas»: hay que saber que se entra sin permiso, no querer dañar; solo un acceso accidental no encaja. Que la contraseña siga activa no es una autorización: como en el caso del PPT del desarrollador que conserva sus credenciales, el permiso terminó y la conducta puede ser delictiva aunque no haya «roto» nada en sentido técnico. La línea entre lo lícito y lo ilícito la marcan el permiso y la intención, no la destreza técnica.", "conceptos": ["Acceso no autorizado a un sistema (art. 153 bis)", "Sin la debida autorización vs excediendo la autorización", "Tres ideas para llevarse"], "dudosa": false}], "nota": "Resolución tomada del slide 50 del PPT B12. La segunda pregunta es agregada, respondida con los slides 30, 31 y 49.", "agregado": false, "fuentes": "PPT B12 slides 2, 30, 31, 49, 50; material B12 §7"}, {"id": "ppt12-3", "titulo": "El script de claves", "bolillas": [12], "origen": "PPT B12", "pie": "Alguien arma un script que prueba miles de claves hasta dar con la correcta, «solo para ver si funciona». Ninguno se siente un delincuente. Sin embargo, según cómo actúe, cualquiera de los tres podría estar cometiendo un delito tipificado en el Código Penal.", "pista": "Permiso: con o sin autorización del dueño; white hat vs acceso ilegítimo.", "preguntas": [{"q": "¿Es delito? ¿De qué depende? Fundamente.", "respuesta": "Depende del permiso (resolución del PPT). Contra un sistema ajeno y sin permiso, si logra entrar, encuadra en el art. 153 bis: «probar» no es una autorización. Con permiso escrito del dueño es trabajo de white hat, el hacker ético que prueba los sistemas con permiso para encontrar fallas y ayudar a corregirlas. El derecho penal castiga conductas, no etiquetas: decir que era una prueba no cambia la calificación.", "conceptos": ["Acceso no autorizado a un sistema (art. 153 bis)", "Hacker", "El derecho penal castiga conductas, no etiquetas"], "dudosa": false}, {"q": "Si el script se lanza sin permiso pero no logra entrar, ¿qué figura se aplica?", "respuesta": "Dudosa: las fuentes no lo cierran. El PPT condiciona el art. 153 bis a que «logre entrar» y no desarrolla qué ocurre si el acceso no se concreta. Solo puede decirse que la misma herramienta usada a escondidas para preparar un ataque es, según el PPT, «la antesala de un delito».", "conceptos": ["Acceso no autorizado a un sistema (art. 153 bis)", "Ataques remotos"], "dudosa": true}], "nota": "Resolución tomada del slide 50 del PPT B12. La segunda pregunta es agregada y queda marcada dudosa: no hay fuente para el supuesto sin acceso.", "agregado": false, "fuentes": "PPT B12 slides 2, 17, 19, 44, 50"}, {"id": "inv12-1", "titulo": "El padrón de la municipalidad", "bolillas": [12], "origen": "Inventado", "pie": "Martín, estudiante de Ingeniería en Informática, quiere armar su portfolio de seguridad. Sin pedirle permiso a nadie, corre un análisis de puertos sobre el sistema de trámites de la Municipalidad de Yerba Buena y encuentra un servicio desactualizado. Aprovechando esa falla, entra al sistema y descarga el padrón de contribuyentes (nombre, DNI y domicilio) «para tener la prueba de que la falla existe». No borra ni modifica nada. Después le escribe a la municipalidad para avisarle. Sostiene que es un hacker ético y que «no hizo daño a nadie».", "pista": "Análisis de puertos (permiso e intención) · 153 bis + agravante por organismo público estatal · 157 bis · white hat vs gray hat · conductas, no etiquetas.", "preguntas": [{"q": "El análisis de puertos que hizo Martín, ¿es por sí mismo un delito? Fundamente.", "respuesta": "Depende. El PPT dice que el análisis de puertos rastrea qué puertos están abiertos y puede ser una tarea legítima o el primer paso de un atacante: con autorización es trabajo de seguridad; a escondidas para preparar un ataque es la antesala de un delito. La misma herramienta tiene distinta calificación según el permiso y la intención. Martín lo hizo sin permiso y como paso previo para entrar, así que no puede ampararse en que fue una tarea de seguridad.", "conceptos": ["Ataques remotos", "Tres ideas para llevarse"], "dudosa": false}, {"q": "El ingreso y la descarga del padrón, ¿son delito? ¿En qué artículos y con qué agravante? Fundamente.", "respuesta": "Sí. Martín accedió a sabiendas, por cualquier medio (una vulnerabilidad) y sin la debida autorización a un sistema de acceso restringido: art. 153 bis. Corresponde el agravante del 2º párrafo, porque el acceso es en perjuicio de un sistema de un organismo público estatal. Como el padrón es un banco de datos personales, además puede encuadrar en el art. 157 bis (acceder a sabiendas e ilegítimamente a un banco de datos personales). Que no haya borrado nada no lo exime: el 153 bis no exige daño.", "conceptos": ["Acceso no autorizado a un sistema (art. 153 bis)", "Violación a bancos de datos (art. 157 bis)"], "dudosa": false}, {"q": "¿Es Martín un hacker ético (white hat)? ¿Qué debió hacer para serlo?", "respuesta": "No. El white hat prueba los sistemas con permiso del dueño; quien entra sin permiso pero sin causar daño es un gray hat, cuya situación es ambigua porque acceder sin autorización ya puede ser delito aunque no quiera perjudicar (art. 153 bis). Avisar después no reemplaza la autorización previa, y el derecho penal castiga conductas, no etiquetas. Para ser white hat debió obtener antes el permiso de la municipalidad.", "conceptos": ["Hacker", "El derecho penal castiga conductas, no etiquetas"], "dudosa": false}], "nota": null, "agregado": true, "fuentes": "PPT B12 slides 17, 19, 29, 30, 44, 49; material B12 §4, §7, §9"}, {"id": "inv12-2", "titulo": "La llamada del «banco» a la distribuidora", "bolillas": [12, 3], "origen": "Inventado", "pie": "Distribuidora del Norte SRL, de San Miguel de Tucumán, opera su cuenta bancaria por home banking. Una tarde, la encargada de pagos recibe una llamada de alguien que dice ser «del área de seguridad del banco»: le explica que detectaron movimientos raros y le pide, «para bloquearlos», el usuario, la clave y el código que le llega por SMS. Ella los dicta. Esa noche el atacante entra al home banking, transfiere fondos a cuentas de terceros y usa los datos de la tarjeta corporativa para compras online. El gerente quiere «arreglarlo con el banco sin denunciar nada, para que los clientes no se enteren».", "pista": "Ingeniería social · 153 bis · estafa 172 / 173 incs. 15 y 16 · sujeto pasivo (persona jurídica) · cifra negra.", "preguntas": [{"q": "¿Qué técnica usó el atacante? ¿Es un ataque a la máquina o a la persona?", "respuesta": "Ingeniería social: práctica ilegítima de obtener información confidencial manipulando a los propios usuarios. En lugar de atacar la máquina, se ataca a la persona que la usa: el usuario suele ser el eslabón débil, y si alguien convence a un empleado de decir su contraseña, toda la defensa técnica se vuelve inútil. Eso es lo que ocurrió con la encargada de pagos.", "conceptos": ["Ingeniería social"], "dudosa": false}, {"q": "¿En qué figuras penales pueden encuadrarse las maniobras? Fundamente.", "respuesta": "Ninguna modalidad tiene un artículo con su nombre; según cómo se concrete la maniobra, el PPT las encuadra en la estafa genérica del art. 172 (defraudar mediante ardid o engaño, como simular una calidad), el art. 173 inc. 16 (manipulación informática) y, muchas veces, el acceso ilegítimo del art. 153 bis: el atacante entró sin la debida autorización al home banking. El uso de los datos de la tarjeta corporativa sin autorización encuadra en el art. 173 inc. 15, aun por operación automática. Si además se aplica el agravante del art. 153 bis por tratarse del sistema de un proveedor de servicios financieros es dudoso: el PPT no lo resuelve para el home banking del cliente.", "conceptos": ["Ingeniería social", "Estafa informática (arts. 172 y 173)", "Acceso no autorizado a un sistema (art. 153 bis)"], "dudosa": true}, {"q": "¿Quién es la víctima? ¿Qué opina de la decisión del gerente de no denunciar?", "respuesta": "La víctima es la sociedad: el sujeto pasivo es el ente sobre el cual recae la conducta, y puede ser una empresa (persona jurídica). La decisión del gerente alimenta la cifra negra (muchos casos, pocas denuncias) por miedo al descrédito; el PPT advierte que tapar un incidente no lo hace desaparecer. Además, como la evidencia es frágil, por el principio de inmediatez convendría preservar ya los registros y documentar lo ocurrido.", "conceptos": ["Sujetos del delito", "Cifra negra", "Difícil comprobación y principio de inmediatez"], "dudosa": false}], "nota": null, "agregado": true, "fuentes": "PPT B12 slides 14, 15, 16, 30, 33, 34, 37; material B12 §3, §4, §8; núcleo parcial 1 (persona jurídica, B3)"}, {"id": "ppt13-actividad", "titulo": "Actividad: ¿qué principio se violó?", "bolillas": [13], "origen": "PPT B13", "pie": "ACTIVIDAD: ¿QUÉ PRINCIPIO SE VIOLÓ? Para cada situación, identificá el principio o artículo de la Ley 25.326 en juego. 1. Una app de delivery pide grupo sanguíneo y religión al registrarse. 2. Un gimnasio usa la huella para el acceso y después vende la base a una aseguradora. 3. Un empleado de RRHH descarga 500 legajos con su usuario habilitado. 4. Una empresa tarda un mes en contestar un pedido de supresión. 5. Una startup guarda datos de clientes en un país sin ley de protección de datos. 6. Un municipio niega un subsidio solo por un puntaje automático.", "pista": "Cada situación calza con un slide del PPT: calidad, recolección/finalidad, seguridad (logs), art. 16, art. 12 (caso TikTok) y art. 20.", "preguntas": [{"q": "1. Una app de delivery pide grupo sanguíneo y religión al registrarse.", "respuesta": "Se viola el principio de calidad de los datos: deben ser adecuados, pertinentes y no excesivos en relación con la finalidad (art. 4, inc. 1, según el material, que usa este mismo ejemplo como principio de pertinencia). Para entregar comida no tiene sentido pedir grupo sanguíneo ni religión. Además, el grupo sanguíneo es información sobre la salud y la religión revela convicciones religiosas: son datos sensibles, y ninguna persona puede ser obligada a proporcionarlos (prohibición de recolección; art. 7, inc. 1, según el material).", "conceptos": ["Principio de la calidad de los datos (pertinencia)", "Datos sensibles", "Prohibición de recolección (datos sensibles)"], "dudosa": false}, {"q": "2. Un gimnasio usa la huella para el acceso y después vende la base a una aseguradora.", "respuesta": "Se viola la recolección con finalidad específica: los datos no pueden usarse con una finalidad distinta o incompatible con la que motivó su obtención (art. 4, inc. 3, según el material); la huella se tomó para controlar el acceso, no para venderla. Vender la base es además una cesión a un tercero, que según el material exige consentimiento previo del titular e información sobre la finalidad y el cesionario (art. 11, inc. 1). Ojo con la huella: es un dato biométrico; la ley actual no lo nombra entre los sensibles, pero el PPT (Worldcoin, reforma) y el material piden tratarlo con el máximo cuidado porque no se puede cambiar.", "conceptos": ["Recolección de un dato", "Cesión de datos", "Consentimiento"], "dudosa": false}, {"q": "3. Un empleado de RRHH descarga 500 legajos con su usuario habilitado.", "respuesta": "Está en juego el deber de seguridad (art. 9): el responsable debe adoptar medidas técnicas y organizativas para evitar la consulta o tratamiento no autorizado y detectar desviaciones. Falló el control de accesos con mínimo privilegio (cada uno accede solo a lo que necesita) y es justo el ejemplo del PPT para la auditoría de logs (un usuario de RRHH que accede a 500 legajos en un día). Es el mismo patrón del caso RENAPER: uso indebido de permisos internos, no un hackeo externo. Si además hubo delito del empleado (art. 157 bis CP) depende de que el acceso sea ilegítimo o de que revele información que debía mantener en secreto; el enunciado no lo cierra.", "conceptos": ["Seguridad de los datos", "Control de accesos y MFA", "Auditoría de logs y monitoreo", "Caso RENAPER (2021)"], "dudosa": false}, {"q": "4. Una empresa tarda un mes en contestar un pedido de supresión.", "respuesta": "Se viola el derecho de rectificación, actualización y supresión (art. 16): el responsable debe proceder a la supresión en el plazo máximo de cinco días hábiles de recibido el reclamo. El incumplimiento dentro del término habilita al interesado a promover la acción de hábeas data, o a denunciar ante la AAIP (arts. 33 y siguientes). Solo podría negarse a suprimir si causara perjuicio a derechos de terceros o hubiera una obligación legal de conservar los datos, pero aun así tenía que contestar en plazo.", "conceptos": ["Rectificación, actualización y supresión (art. 16)", "Derechos del titular", "Hábeas data (art. 43 CN)"], "dudosa": false}, {"q": "5. Una startup guarda datos de clientes en un país sin ley de protección de datos.", "respuesta": "Se viola la prohibición de transferencia internacional: el art. 12 prohíbe transferir datos a países sin protección adecuada (PPT, caso TikTok). El PPT aclara que usar la nube es transferir: importa dónde están los servidores y quién accede. El material enumera excepciones (colaboración judicial, datos médicos, transferencias bancarias o bursátiles, tratados, art. 12 inc. 2), pero guardar datos de clientes en la nube no encaja en ninguna.", "conceptos": ["Transferencia internacional (art. 12)"], "dudosa": false}, {"q": "6. Un municipio niega un subsidio solo por un puntaje automático.", "respuesta": "Se viola la regla de valoraciones personales (art. 20): un acto judicial o administrativo no puede basarse solo en un perfil hecho por un sistema automatizado; el PPT lo marca como clave frente a la IA. La negativa del subsidio es un acto administrativo basado únicamente en el puntaje, así que es ilegal; según el material, esos actos son insanablemente nulos.", "conceptos": ["Valoraciones personales (art. 20)", "Derechos del titular"], "dudosa": false}], "nota": "Respuestas modelo agregadas: el PPT deja las respuestas en «¿?». Los artículos citados salen del PPT (arts. 9, 12, 16, 20) o del material (arts. 4, 7, 11).", "agregado": false, "fuentes": "PPT B13 (slide 53); material B13"}, {"id": "inv13-1", "titulo": "CrediYa: la fintech que pedía de más", "bolillas": [13], "origen": "Inventado", "pie": "CrediYa S.A.S., una fintech de San Miguel de Tucumán, ofrece microcréditos por app. El formulario de registro pide nombre, DNI, domicilio, ingresos mensuales, opiniones políticas y afiliación sindical, todos obligatorios; abajo hay una casilla ya tildada que dice «Acepto». La base de clientes está alojada en un servidor alquilado en un país sin legislación de protección de datos y nunca se inscribió en el Registro, aunque CrediYa vende a otras financieras informes sobre la solvencia de sus clientes. Martín, cliente, pidió por mail saber qué datos suyos tiene la empresa. Pasaron tres semanas sin respuesta.", "pista": "Base privada destinada a dar informes; datos sensibles; consentimiento libre, expreso e informado; transferencia internacional; derecho de acceso y hábeas data.", "preguntas": [{"q": "¿Es legal el formulario de registro de CrediYa? Fundamente.", "respuesta": "No. Opiniones políticas y afiliación sindical son datos sensibles y ninguna persona puede ser obligada a proporcionarlos; CrediYa no está en ninguna de las excepciones del PPT (interés general autorizado por ley, finalidad estadística o científica, asociaciones religiosas u organizaciones políticas y sindicales sobre sus miembros). Además viola el principio de calidad: esos datos no son pertinentes y son excesivos para otorgar un crédito. Y la casilla premarcada no cumple el consentimiento libre, expreso e informado que exige el PPT, ni se informaron la finalidad, el responsable y los derechos del titular.", "conceptos": ["Datos sensibles", "Prohibición de recolección (datos sensibles)", "Principio de la calidad de los datos (pertinencia)", "Consentimiento", "Información para el titular"], "dudosa": false}, {"q": "¿Debía CrediYa inscribir su base? ¿Puede tenerla en ese servidor?", "respuesta": "Sí debía inscribirla: vende informes sobre la solvencia de sus clientes, así que es una base privada destinada a proporcionar informes, y el PPT exige que todo archivo público y privado destinado a dar informes se inscriba en el Registro (según el material, sin inscripción la base no es lícita, art. 3). Tampoco puede tenerla en ese servidor: el art. 12 prohíbe transferir datos a países sin protección adecuada, y usar la nube es transferir.", "conceptos": ["Destinados a proveer informes", "Inscripción en el Registro de bases de datos", "Licitud de la base de datos", "Transferencia internacional (art. 12)"], "dudosa": false}, {"q": "¿Qué derecho ejerció Martín, en qué plazo debían responderle y qué puede hacer ahora?", "respuesta": "Ejerció el derecho de acceso (art. 14): pedir los datos propios que tiene una base. El plazo para responder es de 10 días corridos, y es gratuito cada 6 meses; a las tres semanas CrediYa ya incumplió. Como no le responden, Martín puede denunciar ante la AAIP o iniciar la acción de hábeas data ante la Justicia (arts. 33 y siguientes; art. 43 CN). Además CrediYa queda expuesta a sanciones administrativas de la AAIP (apercibimiento, suspensión, multa, clausura o cancelación).", "conceptos": ["Derechos del titular", "Hábeas data (art. 43 CN)", "Sanciones"], "dudosa": false}], "nota": null, "agregado": true, "fuentes": "PPT B13; material B13"}, {"id": "inv13-2", "titulo": "Colegio del Cerro: credenciales que nadie dio de baja", "bolillas": [13], "origen": "Inventado", "pie": "El Colegio del Cerro, una asociación civil de Yerba Buena, contrató a la software factory DevNorte para desarrollar su plataforma de notas, que guarda nombre, DNI, domicilio, notas y certificados médicos de los alumnos. Todos los preceptores entran con el mismo usuario y contraseña, la base no está cifrada y no se registran los accesos. Terminado el contrato, nadie dio de baja la cuenta de administrador de un programador de DevNorte, que meses después entró a la plataforma desde su casa y le vendió el listado de alumnos a una academia de apoyo escolar. El colegio dice que, como no fue un hackeo, no tiene ninguna responsabilidad. Ahora quiere usar las notas históricas para un estudio estadístico de rendimiento.", "pista": "Deber de seguridad (art. 9) y RENAPER; certificados médicos = salud; responsabilidad administrativa del colegio y penal del programador; disociación.", "preguntas": [{"q": "¿Tiene razón el colegio cuando dice que no tiene responsabilidad porque no fue un hackeo? Fundamente.", "respuesta": "No. Como responsable de la base (persona de existencia ideal titular del archivo), debía adoptar medidas técnicas y organizativas para garantizar la seguridad y confidencialidad de los datos y evitar su consulta o tratamiento no autorizado (art. 9). Falló en todas las del PPT: no había control de accesos individual ni mínimo privilegio, no había cifrado en reposo, no había logs ni monitoreo, y una credencial quedó activa al terminar el contrato. Es el mismo patrón del caso RENAPER: la amenaza vino de un acceso con permisos, no de un hackeo externo, y eso no exime al responsable. Además los certificados médicos son información sobre la salud, datos sensibles que piden la máxima protección.", "conceptos": ["Seguridad de los datos", "Control de accesos y MFA", "Cifrado en tránsito y en reposo", "Auditoría de logs y monitoreo", "Caso RENAPER (2021)", "Titular, usuario y responsable de archivos", "Datos sensibles"], "dudosa": false}, {"q": "¿Qué sanciones pueden corresponder al colegio y al programador?", "respuesta": "Al colegio, sanciones administrativas que aplica la AAIP (art. 31): apercibimiento, suspensión, multa, clausura o cancelación del archivo; la multa se aplica por cada infracción y se gradúa según la Res. AAIP 126/2024. Al programador, sanción penal: el PPT castiga con 1 mes a 2 años al que a sabiendas e ilegítimamente, o violando sistemas de seguridad, acceda a un banco de datos personales (art. 157 bis CP); entró después de terminado el contrato, sin autorización vigente. Según el material, además puede haber responsabilidad civil por los daños a los alumnos.", "conceptos": ["Sanciones", "Sanciones administrativas hoy (art. 31 y Res. AAIP 126/2024)"], "dudosa": false}, {"q": "¿Puede el colegio usar las notas para el estudio estadístico?", "respuesta": "Sí, si las disocia antes. La disociación es todo tratamiento de datos personales de manera que la información obtenida no pueda asociarse a persona determinada o determinable, y el PPT la presenta como la forma de usar datos sin comprometer la privacidad. Si el estudio incluye los certificados médicos, el PPT admite la finalidad estadística o científica como excepción para datos sensibles, y el material exige que los titulares no puedan ser identificados. Con datos identificables, en cambio, sería una finalidad distinta de la que motivó su recolección.", "conceptos": ["Disociación de datos", "Prohibición de recolección (datos sensibles)", "Recolección de un dato"], "dudosa": false}], "nota": null, "agregado": true, "fuentes": "PPT B13; material B13"}, {"id": "b14-moisa", "titulo": "Caso Moisá: la firma escaneada", "bolillas": [14], "origen": "PPT B14", "pie": "En un juicio civil (Cámara Civil y Comercial Común, Sala II, expte. “Romano c/ AG Naum S.A.”), el cliente firma el escrito en papel; la abogada lo escanea y lo sube con su firma digital (2025). El 3/9/25 el camarista Benjamín Moisá lo rechaza: exige que ambos firmen digitalmente. En septiembre de 2025 la abogada desiste, pero la Corte Suprema de Tucumán trata el tema de oficio. El 20/4/26, por Acordada 288/2026, le aplica un “llamado de atención” al camarista. En junio de 2026 Moisá demanda a la Provincia para anular la sanción y propone peritajes de universidades sobre si un escaneo garantiza autoría e integridad. (Fuentes del PPT: Acordada CSJT 288/2026; La Gaceta, 22/06/2026.)", "pista": "Digital vs. digitalizado; firma digital vs. electrónica; arts. 288 y 319 CCCN; qué cubre la firma digital de la abogada y qué no.", "preguntas": [{"q": "¿Qué clase de firma es la imagen escaneada de la firma del cliente? Fundamente.", "respuesta": "Es, como mucho, firma electrónica, no firma digital. Un documento digitalizado es una foto de un papel: no trae ninguna garantía propia y se puede editar, recortar o pegar en otro archivo. La firma digital exige un procedimiento matemático con información que solo conoce el firmante (clave privada) y certificado de un certificador licenciado (arts. 2 y 9), y el cliente no usó nada de eso. Por eso la imagen no goza de las presunciones de autoría e integridad (arts. 7 y 8) y solo tiene el valor relativo del art. 319 CCCN, que el juez valora según la confiabilidad de los soportes.", "conceptos": ["Digital no es lo mismo que digitalizado (arts. 6, 11 y 12)", "Firma electrónica (concepto)", "Firma digital vs. firma electrónica", "Arts. 288 y 319 CCCN"], "dudosa": false}, {"q": "Desde la mirada de informático: ¿qué quedó firmado digitalmente y qué no?", "respuesta": "Quedó firmado digitalmente el PDF que subió la abogada: su firma digital cubre todo el archivo, imagen incluida, así que se presume que lo presentó ella (autoría, art. 7) y que nadie lo alteró después (integridad, art. 8), porque cualquier cambio alteraría la huella (hash). No quedó garantizada la firma del cliente: la imagen no prueba por sí sola que él firmó; esa prueba es el papel original que guarda la abogada.", "conceptos": ["Función hash (huella)", "Propiedades técnicas de la firma digital", "Presunciones de autoría (art. 7) e integridad (art. 8); validez (art. 9)"], "dudosa": false}, {"q": "Exponga los fundamentos de la postura del camarista (A) y de la Corte (B).", "respuesta": "Postura A (“digitalizado no es digital”): el art. 288 CCCN exige firma digital en los instrumentos electrónicos; un código procesal provincial no puede contradecir una ley nacional (art. 31 CN) y legislar sobre la firma es materia de la Nación (art. 75 inc. 12); la imagen de una firma es como mucho firma electrónica, sin presunción de autenticidad ni integridad y con el valor relativo del art. 319. Se apoya en “Aiziczon c/ López” (sent. 109, 25/02/2025). Postura B (“es firma electrónica y alcanza”): el art. 170 del código procesal de Tucumán prevé que el cliente firme en papel, el abogado suba la imagen con su firma digital y guarde el original; la firma escaneada es firma electrónica y la digital es una especie de ese género, así que no hay contradicción; rechazar el escrito es la opción más gravosa y afecta el acceso a la justicia. Se apoya en “Sal” (dic. 2024), “Domínguez” (abr. 2025) y “Santucho” (sep. 2025), que fijó su criterio como obligatorio para los tribunales inferiores.", "conceptos": ["Caso Moisá (firma escaneada)", "Arts. 288 y 319 CCCN", "Firma digital vs. firma electrónica"], "dudosa": false}, {"q": "¿Quién tiene razón? Fundamente.", "respuesta": "El PPT no lo resuelve: lo deja a votación (“¿alcanza con eso o hace falta que el cliente firme digitalmente?”). Respuesta argumentable: técnicamente Moisá tiene razón en que la imagen no es firma digital y no prueba autoría del cliente; jurídicamente, la Corte sostiene que el art. 170 procesal ya prevé el mecanismo (firma digital de la abogada sobre el PDF + original en papel guardado) y que su criterio es obligatorio para los inferiores (“Santucho”). Cualquiera de las dos posturas se defiende si se distingue qué cubre la firma digital de la abogada (el archivo) y qué no (la firma del cliente).", "conceptos": ["Caso Moisá (firma escaneada)", "Digital no es lo mismo que digitalizado (arts. 6, 11 y 12)"], "dudosa": true}], "nota": null, "agregado": false, "fuentes": "PPT B14 (slides Noticia, Caso Moisá: hechos, postura A, postura B, mirada de informático; arts. 288/319 CCCN); material B14 §4 y §6"}, {"id": "b14-inv1", "titulo": "Plataforma de alquileres con firma “propia”", "bolillas": [14], "origen": "Inventado", "pie": "FirmaYa SRL, una software factory de Yerba Buena, desarrolla una plataforma para que inmobiliarias firmen contratos de alquiler a distancia. Para abaratar costos, la plataforma genera certificados emitidos por la propia empresa, que no tiene licencia de ningún ente, y la firma se completa con un clic en “acepto” y un código por SMS. Un inquilino, demandado por falta de pago, desconoce haber firmado el contrato. Además, un cliente de la inmobiliaria pide usar la plataforma para firmar su testamento.", "pista": "Certificado no licenciado = firma electrónica; carga de la prueba (art. 5); exclusiones (art. 4); requisitos de validez (art. 9).", "preguntas": [{"q": "¿Qué clase de firma ofrece la plataforma? ¿Quién debe probar la firma del inquilino? Fundamente.", "respuesta": "Es firma electrónica, no digital. El certificado lo emite una empresa sin licencia, y el PPT pone el certificado no licenciado y el clic en “acepto” como ejemplos de firma electrónica: le falta algún requisito legal (art. 9 exige certificado emitido por un certificador licenciado). Como no tiene presunciones, si el inquilino la desconoce, quien la invoca (la inmobiliaria) debe probar que firmó (art. 5). El juez valorará esa prueba según la confiabilidad de los soportes y procedimientos usados (art. 319 CCCN).", "conceptos": ["Firma digital vs. firma electrónica", "Firma electrónica (concepto)", "Presunciones de autoría (art. 7) e integridad (art. 8); validez (art. 9)", "Arts. 288 y 319 CCCN"], "dudosa": false}, {"q": "¿Puede la plataforma usarse para firmar el testamento? Fundamente.", "respuesta": "No. El art. 4 excluye de la firma digital las disposiciones por causa de muerte, como el testamento, junto con los actos de familia, los personalísimos y las formalidades incompatibles. Si ni siquiera una firma digital válida sirve para ese acto, menos una firma electrónica.", "conceptos": ["Equivalencia con la manuscrita (art. 3) y exclusiones (art. 4)"], "dudosa": false}, {"q": "¿Qué debería cambiar FirmaYa para que las firmas tengan las presunciones de la ley?", "respuesta": "Debería usar certificados emitidos por un certificador licenciado (por ejemplo, integrarse con una firma remota de un certificador licenciado), de modo que se cumplan los tres requisitos del art. 9: certificado vigente, verificación con sus datos y emisión por certificador licenciado. Así la firma sería digital, con presunción de autoría (art. 7) e integridad (art. 8), y quien la niegue debería probar. El código por SMS por sí solo no alcanza: lo que importa es que haya una clave privada certificada dentro de la infraestructura oficial, como en Firma CiDi, donde el PIN solo abre esa clave.", "conceptos": ["Presunciones de autoría (art. 7) e integridad (art. 8); validez (art. 9)", "Firma con token vs. firma remota", "Firma CiDi: por qué un PIN puede ser firma digital", "Cadena de confianza"], "dudosa": false}], "nota": null, "agregado": true, "fuentes": "PPT B14; material B14 §4"}, {"id": "b14-inv2", "titulo": "El token robado y el presupuesto adulterado", "bolillas": [14], "origen": "Inventado", "pie": "Martina, ingeniera en una consultora tucumana, firma sus presupuestos con firma digital en token emitida por un certificador licenciado. Guardaba el PIN anotado en un papel dentro de la funda del token. Le roban la mochila y recién una semana después pide la revocación. En ese lapso aparece un presupuesto firmado con su certificado que ella dice no haber hecho. Por otro lado, un cliente presenta un presupuesto auténtico de Martina en el que cambió “$1.000” por “$9.000” después de la firma; el lector de PDF avisa que el documento se modificó.", "pista": "Presunción de autoría (art. 7) y su prueba en contrario; deberes del titular (art. 25); integridad y hash (art. 8).", "preguntas": [{"q": "¿Se presume que Martina firmó el presupuesto que niega? ¿Quién debe probar? Fundamente.", "respuesta": "Sí. Es firma digital (certificado de un certificador licenciado), así que se presume, salvo prueba en contrario, que pertenece al titular del certificado que la verifica (art. 7). Como el certificado no estaba revocado, la verificación da positiva y es Martina, quien niega, la que debe probar que no firmó (por ejemplo, acreditando el robo). La presunción admite prueba en contrario, pero la carga es suya.", "conceptos": ["Presunciones de autoría (art. 7) e integridad (art. 8); validez (art. 9)", "Firma digital vs. firma electrónica"], "dudosa": false}, {"q": "¿Qué deberes incumplió Martina? Fundamente.", "respuesta": "Incumplió deberes del titular del art. 25: mantener el control exclusivo de su clave privada (guardar el PIN junto al token lo compromete) y pedir la revocación si la clave se compromete, que hizo una semana tarde. El riesgo típico de la firma con token, según el PPT, es perderlo o prestarlo; el titular debe custodiar su clave y pedir la revocación.", "conceptos": ["Deberes del certificador (art. 19) y del titular (art. 25)", "Firma con token vs. firma remota"], "dudosa": false}, {"q": "¿Qué vale el presupuesto adulterado por el cliente? ¿Responde el certificador por el presupuesto falso?", "respuesta": "El adulterado no goza de la presunción de integridad: el art. 8 presume que el documento no se modificó solo si la verificación da verdadero, y acá la huella recalculada no coincide (cambiar un número cambia el hash por completo), así que el cambio queda delatado. Sobre el certificador: responde por errores, omisiones o no revocar a tiempo (arts. 38-39), pero revoca “cuando corresponde” y Martina no pidió la revocación sino una semana después; las fuentes no cierran si responde por ese lapso, así que en principio no parece haber falta suya.", "conceptos": ["Función hash (huella)", "Presunciones de autoría (art. 7) e integridad (art. 8); validez (art. 9)", "Responsabilidad y sanciones del certificador"], "dudosa": true}], "nota": null, "agregado": true, "fuentes": "PPT B14; material B14 §5 y §9"}, {"id": "ppt15-lucia", "titulo": "La liquidación de Lucía", "bolillas": [15], "origen": "PPT B15", "pie": "Ejemplo: la liquidación de Lucía. Desarrolladora, 4 años y 8 meses de antigüedad, sueldo de $1.000.000. Despedida sin causa ni preaviso el día 10. [Cuadro del PPT: Antigüedad (art. 245) · 5 sueldos (8 meses > 3) · $5.000.000 | Preaviso (art. 232) · 1 mes (menos de 5 años) · $1.000.000 | Integración del mes (art. 233) · 20 días restantes · A calcular en clase | Días trabajados, SAC y vacaciones · Proporcionales · A calcular en clase]", "pista": "Despido sin causa: indemnización completa por antigüedad + sustitutiva de preaviso + integración + proporcionales. Fracción mayor de 3 meses = un año más. Menos de 5 años = 1 mes de preaviso.", "preguntas": [{"q": "¿Qué indemnización por antigüedad le corresponde a Lucía y por qué?", "respuesta": "Le corresponden 5 sueldos ($5.000.000). Es un despido sin causa, que según el cuadro de extinción da indemnización por antigüedad completa (art. 245). La fórmula es un sueldo por año o fracción mayor de 3 meses: Lucía tiene 4 años y 8 meses, y como los 8 meses superan los 3, se computan 5 años. La base es el mejor sueldo mensual del último año, sin aguinaldo ni lo no mensual ($1.000.000), sujeta al tope de 3 veces el promedio del convenio con piso del 67% (el material aclara que el ejemplo supone que el sueldo está por debajo del tope).", "conceptos": ["Indemnización por antigüedad (art. 245)", "Extinción del contrato"], "dudosa": false}, {"q": "¿Por qué se le paga $1.000.000 de preaviso?", "respuesta": "Porque no fue preavisada. El empleador debe dar 1 mes de preaviso si el trabajador tiene hasta 5 años de antigüedad (2 meses con más de 5); si no lo da, paga la indemnización sustitutiva (art. 232). Lucía tiene menos de 5 años, así que corresponde 1 mes de sueldo: $1.000.000.", "conceptos": ["Preaviso e integración del mes"], "dudosa": false}, {"q": "¿Qué otros rubros integran su liquidación final?", "respuesta": "La integración del mes de despido (art. 233), porque la despidieron el día 10 y quedan 20 días hasta fin de mes, y los días trabajados, el SAC proporcional y las vacaciones proporcionales. El PPT deja el monto de estos rubros «a calcular en clase», así que acá no se calculan. El material los identifica como días trabajados (art. 103), aguinaldo proporcional (art. 123) y vacaciones no gozadas (art. 156).", "conceptos": ["Preaviso e integración del mes", "Sueldo anual complementario (aguinaldo)"], "dudosa": false}], "nota": "Enunciado y cifras textuales del PPT slide 30 (y material p. 13). Las respuestas modelo son agregadas; no se calculan los rubros que el PPT deja «a calcular en clase».", "agregado": false, "fuentes": "PPT B15 slides 25, 28-30; material B15 p. 12-13"}, {"id": "inv15-1", "titulo": "El programador monotributista de NubeSur", "bolillas": [15], "origen": "Inventado", "pie": "Joaquín es desarrollador backend en NubeSur SRL, una software factory de Yerba Buena. Firmó un «contrato de locación de servicios» y factura todos los meses como monotributista; NubeSur le paga por transferencia bancaria. En los hechos, trabaja de lunes a viernes de 9 a 18, con la notebook y las cuentas de la empresa, y su líder técnico le asigna tareas y le controla las horas. NubeSur es su único cliente desde hace 1 año y 2 meses. Nunca estuvo dado de alta como empleado. La semana pasada le avisaron que «prescinden de sus servicios» desde ese mismo día, sin pagarle nada.", "pista": "Dependencia jurídica, técnica y económica; primacía de la realidad; presunción del art. 23 y su excepción de 2026 (facturación + pago bancarizado); registro; despido sin causa.", "preguntas": [{"q": "¿Joaquín es un trabajador independiente o un empleado en relación de dependencia? Fundamente.", "respuesta": "Es empleado. Por primacía de la realidad (art. 14) importan los hechos, no el nombre del contrato ni la factura. Hay dependencia jurídica (su líder le da órdenes y debe cumplirlas: la nota decisiva), técnica (NubeSur decide cómo, cuándo y dónde trabaja: horario fijo, notebook de la empresa) y económica (vive de lo que le paga NubeSur, su único cliente, y el riesgo del negocio es de la empresa). Es justo el caso que plantea el PPT: un programador con horario fijo, jefe y una sola empresa, que factura.", "conceptos": ["Dependencia (triple sentido)", "Principios que protegen al trabajador", "Trabajo (art. 4 LCT)"], "dudosa": false}, {"q": "¿Puede Joaquín apoyarse en la presunción del art. 23 LCT?", "respuesta": "No le alcanza con la presunción. El art. 23 hace presumir el contrato de trabajo por el hecho de prestar servicios, pero desde 2026 no rige si hay facturación y pago bancarizado, que es lo que pasa acá. Entonces Joaquín tiene que probar la dependencia real (horario, órdenes, herramientas, exclusividad). Lo que decide es la dependencia real: el material aclara que la reforma lo hace más difícil de probar, pero que la realidad de los hechos sigue siendo lo que va a analizar el juez. Tampoco aplica la figura del independiente con colaboradores (Ley 27.742), que es para autónomos que trabajan con hasta tres colaboradores independientes.", "conceptos": ["Contrato, relación y presunción", "Independiente con colaboradores y trabajo en plataformas"], "dudosa": false}, {"q": "Si se reconoce la relación laboral, ¿qué le corresponde por la desvinculación y qué pasa con la falta de registro?", "respuesta": "Es un despido sin causa, así que corresponde indemnización por antigüedad completa (art. 245): con 1 año y 2 meses, la fracción no supera 3 meses, por lo que es 1 sueldo (que además es el mínimo). Como no hubo preaviso y tiene menos de 5 años, se suma la sustitutiva de 1 mes (art. 232), la integración del mes si el despido no fue el último día (art. 233) y los proporcionales. Ya no estaba en período de prueba (6 meses). NubeSur incumplió el deber de registro (alta digital en ARCA desde el primer día, arts. 81 y 52), pero las multas de las Leyes 24.013 y 25.323 fueron derogadas por la Ley 27.742: la obligación de registrar sigue, pero esas multas no se cobran.", "conceptos": ["Indemnización por antigüedad (art. 245)", "Preaviso e integración del mes", "Trabajo registrado y no registrado", "Período de prueba (art. 92 bis)"], "dudosa": false}], "nota": null, "agregado": true, "fuentes": "PPT B15 slides 6, 8-9, 11-12, 14, 25, 28-29; material B15 p. 3-6"}, {"id": "inv15-2", "titulo": "El despido de Carla, analista QA", "bolillas": [15], "origen": "Inventado", "pie": "Carla trabaja hace 7 años como analista QA en una fintech tucumana, registrada y por tiempo indeterminado. Se casó hace dos meses y lo notificó a la empresa. Un lunes, el gerente le dice en una videollamada que está despedida «con causa, por bajo rendimiento», sin mandarle nada por escrito y con efecto inmediato. Carla consulta a un abogado. Cuando ella reclama, la empresa contesta que en realidad la causa fue que filtró datos de clientes, algo que nunca le habían mencionado.", "pista": "Despido con justa causa: forma escrita y causa inmodificable; si no es válido, es despido sin causa; preaviso por más de 5 años; despido por matrimonio (art. 182).", "preguntas": [{"q": "¿Es válido el despido con justa causa? Fundamente.", "respuesta": "No. El despido con justa causa (arts. 242-244) exige un incumplimiento grave del trabajador, comunicado por escrito, y la causa no se puede cambiar después. Acá la comunicación fue verbal, el «bajo rendimiento» no se presenta como un incumplimiento grave concreto, y la empresa después intenta cambiar la causa por la filtración de datos, lo que no puede hacer. Por eso no se configura la justa causa y el despido se trata como un despido sin causa.", "conceptos": ["Despido con justa causa y despido indirecto", "Extinción del contrato"], "dudosa": false}, {"q": "¿Qué rubros le corresponden por el despido?", "respuesta": "Al ser un despido sin causa, corresponde indemnización por antigüedad completa (art. 245): un sueldo por año, 7 sueldos, sobre el mejor sueldo mensual del último año, con tope de 3 veces el promedio del convenio y piso del 67% (Vizzoti). Como tiene más de 5 años y no hubo preaviso, se suma la sustitutiva de 2 meses (art. 232), más la integración del mes (art. 233) si el despido no fue el último día, y los días trabajados, SAC y vacaciones proporcionales.", "conceptos": ["Indemnización por antigüedad (art. 245)", "Preaviso e integración del mes"], "dudosa": false}, {"q": "¿Influye que Carla se haya casado hace dos meses?", "respuesta": "Sí. El despido por matrimonio (art. 182) es una indemnización agravada: si el despido ocurre 3 meses antes o 6 después del casamiento, se suma un año de sueldos. Carla fue despedida dos meses después de casarse, dentro de ese plazo, y el material aclara que en ese plazo la ley presume que el despido se debe al matrimonio. Por lo tanto, a los rubros anteriores se suma un año de remuneraciones.", "conceptos": ["Indemnizaciones agravadas"], "dudosa": false}], "nota": null, "agregado": true, "fuentes": "PPT B15 slides 25-26, 28-29, 31; material B15 p. 11-14"}, {"id": "inv17-1", "titulo": "Tres desarrollos de una misma empresa", "bolillas": [17], "origen": "Inventado", "pie": "Una S.A.S. tucumana de logística obtuvo en un año tres resultados de su equipo de I+D:\n(a) un algoritmo de optimización de rutas que corre solo en sus servidores; los clientes únicamente reciben el recorrido sugerido;\n(b) un dispositivo físico para medir la temperatura de la carga, cuyo funcionamiento se entiende con solo desarmarlo;\n(c) un informe de las tres arquitecturas de servidores que probaron y colapsaron bajo carga.\nLa empresa quiere licenciar el dispositivo a otras firmas del rubro. Mientras tanto, un desarrollador pegó parte del código del algoritmo en un chatbot público de inteligencia artificial para que lo ayudara a corregir un error.", "pista": "Factores de la decisión estratégica (tipo de resultado, ingeniería inversa, estrategia de mercado); tipos de información (técnica, negativa); filtración involuntaria (material).", "preguntas": [{"q": "¿Qué tipo de protección jurídica conviene para el algoritmo (a) y para el dispositivo (b)? Fundamente con los factores de la decisión estratégica.", "respuesta": "Para el algoritmo, el secreto comercial con acuerdos de confidencialidad: no toda innovación puede patentarse (un algoritmo o método puede no cumplir los requisitos de patentabilidad) y, como corre solo en los servidores, no se puede descubrir por ingeniería inversa; además la revelación pública que exige la patente sería perjudicial. El código, como expresión, puede registrarse como obra (software). Para el dispositivo conviene una patente (o modelo de utilidad, si cumple novedad, altura inventiva y aplicación industrial): su funcionamiento se descubre al desarmarlo, así que sería imposible mantener el secreto, y como la empresa quiere licenciarlo, la patente brinda seguridad jurídica a los contratos.", "conceptos": ["Decisión estratégica de protección", "Alternativas de protección jurídica"], "dudosa": false}, {"q": "¿Qué clase de información confidencial son el algoritmo y el informe de arquitecturas que colapsaron? ¿Tiene valor el informe?", "respuesta": "El algoritmo es información técnica y científica: conocimientos aplicados al diseño, desarrollo o mejora de productos y procesos (el PPT incluye los algoritmos de software). El informe de arquitecturas que colapsaron es información negativa: el conocimiento sobre lo que no funciona, resultados de pruebas que fracasaron (el PPT menciona las configuraciones tecnológicas que no dieron resultado). Sí tiene valor: saber qué no sirve ahorra tiempo y dinero, y un competidor que accediera a él evitaría los mismos errores sin invertir en esas pruebas.", "conceptos": ["Tipos de información confidencial", "Información negativa"], "dudosa": false}, {"q": "¿Qué problema genera lo que hizo el desarrollador con el chatbot? ¿Qué debería hacer la empresa?", "respuesta": "Según el material, pegar código de la empresa en un servicio externo sin autorización equivale a entregarlo a un tercero: puede violar el acuerdo de confidencialidad que haya firmado y, además, debilita el carácter secreto de la información, que es uno de los tres requisitos (caso Samsung, 2023). No hubo mala intención, pero sí una divulgación. La empresa debería incluir en su política de protección reglas claras sobre qué herramientas de IA pueden usarse y con qué información, y reforzar las medidas razonables (NDA, capacitación, acceso restringido al código), porque sin protección no hay secreto.", "conceptos": ["Requisito 1: que la información sea secreta", "Requisito 3: protección razonable", "Política de protección de la información"], "dudosa": true}], "nota": "Caso inventado. Pregunta 3 «dudosa»: la filtración por IA y la política de protección están solo en el material (no en el PPT). Que el software en sí no se patenta en Argentina también es solo del material; no se usó como argumento central.", "agregado": true, "fuentes": "PPT B17; material B17 (§5, §12, §13)"}, {"id": "inv17-2", "titulo": "El NDA que lo cubría todo", "bolillas": [17], "origen": "Inventado", "pie": "Una consultora de ciberseguridad de San Miguel de Tucumán contrata a Nicolás como freelance por tres meses. Le hace firmar un NDA de una sola cláusula: «Toda la información de la empresa, de cualquier tipo, es confidencial para siempre». No identifica quién revela ni quién recibe la información ni prevé excepciones.\nLos informes de auditoría de los clientes quedan impresos en una bandeja compartida a la que entra cualquier visitante. Al terminar el contrato, Nicolás publica en su blog la lista de clientes de la consultora junto con una técnica de configuración de firewalls que aprendió allí y que ya estaba publicada en un manual de libre acceso.", "pista": "Estructura del NDA (7 elementos); requisito de medidas razonables; información ya pública como excepción; consecuencias civiles.", "preguntas": [{"q": "¿Está bien armado el NDA? ¿Qué elementos le faltan?", "respuesta": "No. Según la estructura básica del PPT, un convenio de confidencialidad debe contener: identificación de las partes (Parte Reveladora y Parte Receptora), definición de qué información se considera protegida (técnica, comercial, financiera), obligaciones de la parte receptora, excepciones, plazo de vigencia, sanciones o consecuencias por incumplimiento y jurisdicción o ley aplicable. Este NDA no identifica a las partes, no define tipos de información, no fija excepciones ni consecuencias ni jurisdicción. Además, el material advierte que una definición tan amplia («toda la información, de cualquier tipo») es difícil de hacer valer, porque no permite saber qué estaba realmente protegido.", "conceptos": ["Acuerdo de confidencialidad (NDA)"], "dudosa": false}, {"q": "¿Violó Nicolás la confidencialidad al publicar la técnica de configuración de firewalls? ¿Y la lista de clientes?", "respuesta": "La técnica, no: ya estaba publicada en un manual de libre acceso, así que no es secreta (no cumple el primer requisito) y además encaja en la excepción típica del NDA para la información que ya era pública. La lista de clientes es información comercial y, en principio, sí podía ser confidencial: no es pública y tiene valor comercial por ser secreta. Su publicación puede generar responsabilidad civil por daños y perjuicios a quien utilizó o divulgó información confidencial en forma contraria a los usos comerciales honestos (Ley 24.766). Pero la consultora tendrá que probar que tomó medidas razonables para protegerla.", "conceptos": ["Información confidencial (requisitos)", "Tipos de información confidencial", "Responsabilidad civil por violación de la confidencialidad"], "dudosa": true}, {"q": "¿Qué debilidad tiene la posición de la consultora y qué debería corregir?", "respuesta": "La falta de medidas razonables de protección: deja informes en una bandeja compartida a la que accede cualquier visitante, y el PPT advierte que si la empresa deja los documentos sensibles a la vista o no controla quién accede, después no puede reclamar que alguien violó su confidencialidad (si no hay protección, no hay secreto). Debería restringir el acceso a la información solo a quienes la necesitan, usar contraseñas y políticas internas de seguridad, y rehacer el NDA con la estructura completa del PPT y una definición precisa. Como Nicolás es freelance y no trabajador, el deber de fidelidad de la LCT no sería la vía; la protección pasa por el NDA y la Ley 24.766.", "conceptos": ["Requisito 3: protección razonable", "Acuerdo de confidencialidad (NDA)", "Confidencialidad en el ámbito laboral"], "dudosa": true}], "nota": "Caso inventado. Pregunta 2 «dudosa»: que la lista de clientes siga siendo secreta pese a las medidas deficientes no lo cierran las fuentes. Pregunta 3 «dudosa»: si Nicolás fuera en realidad un trabajador en relación de dependencia (primacía de la realidad, B15) le aplicaría el art. 85 LCT; las fuentes de B17 no tratan al freelance.", "agregado": true, "fuentes": "PPT B17; material B17 (§10, NDA amplio)"}]}</script>
<script>
(function () {
"use strict";
const D = JSON.parse(document.getElementById("hub-data").textContent);
const BOL = D.bolillas;                     // [{n, titulo, secciones, programa, notas}]
const E = D.entradas;                        // all glossary entries (with .b)
const EBY = Object.fromEntries(E.map(e => [e.id, e]));
const MC = D.mc;                              // [{id,b,tipo,pregunta,opciones,correctas,explicacion,origen,ref}]
const CASOS = D.casos;
const BN = BOL.map(b => b.n);
const BT = Object.fromEntries(BOL.map(b => [b.n, b.titulo]));
const EVLABEL = { quiz8: "Quiz B8", quiz10: "Quiz Marcas", quiz11: "Quiz 11", quiz13: "Quiz Datos", quiz15: "Quiz Laboral", quiz17: "Quiz Confid.", parcial2018: "Parcial 2018", parcial2023: "Parcial 2023", tp6: "TP6", tp7: "TP7" };

/* ---------- utils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
function ls(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || "null"); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
function item(t) { // "Término: explicación" -> bold label
  const s = String(t); const i = s.indexOf(":");
  if (i > 0 && i < 48) return "<b>" + esc(s.slice(0, i)) + "</b>" + esc(s.slice(i));
  return esc(s);
}

/* ---------- progress (db per viewer, fallback local) ---------- */
let P = Object.assign({ sab: {}, mc: {}, bloques: {} }, ls("hubleg2.p") || {});
let dbRef = null, saveT = null, chain = Promise.resolve(), syncMode = "local";
function save() {
  ls("hubleg2.p", P);
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    if (!dbRef) return;
    const body = JSON.parse(JSON.stringify(P)); body.t = Date.now();
    chain = chain.then(() => dbRef.set(body)).catch(e => { if (e && (e.code === "invalid_argument" || e.code === "revoked" || e.code === "not_granted")) { dbRef = null; syncMode = "local"; renderCount(); } });
  }, 1200);
}
function mergeRemote(r) {
  if (!r) return;
  for (const k of ["sab", "mc", "bloques"]) P[k] = Object.assign({}, P[k] || {}, r[k] || {});
}
(async function initDb() {
  try {
    const c = window.claude; if (!c || !c.use) return;
    const [db, user] = await Promise.all([c.use("db"), c.use("user")]);
    if (!db || !user) return;
    const uid = await user.id(); if (!uid) return;
    const ref = db.doc("data/users/" + uid + "/progreso");
    const snap = await ref.get();
    if (snap.exists) { const local = JSON.parse(JSON.stringify(P)); P = { sab: {}, mc: {}, bloques: {} }; mergeRemote(snap.data()); mergeRemote(local); }
    dbRef = ref; syncMode = "db"; save(); renderAll();
    document.addEventListener("visibilitychange", async () => {
      if (document.visibilityState !== "visible" || !dbRef) return;
      try { const s = await dbRef.get(); if (s.exists) { const r = s.data(); const local = JSON.parse(JSON.stringify(P)); P = { sab: {}, mc: {}, bloques: {} }; mergeRemote(local); mergeRemote(r); renderAll(); } } catch (e) {}
    });
  } catch (e) { /* sin db: queda local */ }
})();

/* ---------- filters ---------- */
let F = Object.assign({ b: "all", star: false, ppt: false, core: true }, ls("hubleg2.f") || {});
function inB(b) { return F.b === "all" || String(F.b) === String(b); }
const HASCORE = {}; E.forEach(e => { if (e.nucleo) HASCORE[e.b] = true; });
function eOk(e) { return inB(e.b) && (!F.core || e.nucleo || !HASCORE[e.b]) && (!F.star || (e.evidencia && e.evidencia.length)) && (!F.ppt || /PPT/.test(e.fuente || "")); }
function renderFilters() {
  const el = $("#filters");
  let h = '<button class="chip" data-fb="all" aria-pressed="' + (F.b === "all") + '">Todas</button>';
  for (const n of BN) h += '<button class="chip b" data-b="' + n + '" data-fb="' + n + '" aria-pressed="' + (String(F.b) === String(n)) + '" title="' + esc(BT[n]) + '">B' + n + "</button>";
  h += '<span class="sep" aria-hidden="true"></span>';
  h += '<label class="toggle"><input type="checkbox" id="f-core"' + (F.core ? " checked" : "") + "> Solo definiciones clave</label>";
  h += '<label class="toggle"><input type="checkbox" id="f-star"' + (F.star ? " checked" : "") + "> Solo lo que ya tomaron</label>";
  h += '<label class="toggle"><input type="checkbox" id="f-ppt"' + (F.ppt ? " checked" : "") + "> Solo PPT</label>";
  el.innerHTML = h;
}
$("#filters").addEventListener("click", ev => {
  const b = ev.target.closest("[data-fb]"); if (!b) return;
  F.b = b.dataset.fb === "all" ? "all" : Number(b.dataset.fb); ls("hubleg2.f", F); renderFilters(); onFilter();
});
$("#filters").addEventListener("change", ev => {
  if (ev.target.id === "f-core") F.core = ev.target.checked;
  if (ev.target.id === "f-star") F.star = ev.target.checked;
  if (ev.target.id === "f-ppt") F.ppt = ev.target.checked;
  ls("hubleg2.f", F); onFilter();
});
function setB(n) { F.b = n; ls("hubleg2.f", F); renderFilters(); }

/* ---------- tabs ---------- */
let TAB = "hoy";
const TABS = ["hoy", "punteros", "glosario", "mc", "casos", "simulacro", "bolillas"];
function go(t, opts) {
  if (!TABS.includes(t)) t = "hoy";
  TAB = t;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.go === t)));
  document.querySelectorAll("section[data-tab]").forEach(s => s.hidden = s.dataset.tab !== t);
  try { history.replaceState(null, "", "#" + t); } catch (e) {}
  if (t !== "punteros") releaseWake();
  render(t, opts || {});
  window.scrollTo(0, 0);
}
$("#tabs").addEventListener("click", ev => { const b = ev.target.closest("[data-go]"); if (b) go(b.dataset.go); });
function onFilter() { if (TAB === "punteros") { deck = null; } if (TAB === "mc") { mcRun = null; } render(TAB, {}); }
function renderAll() { renderCount(); render(TAB, {}); }
function render(t, o) {
  ({ hoy: rHoy, punteros: rPunteros, glosario: rGlosario, mc: rMC, casos: rCasos, simulacro: rSim, bolillas: rBolillas })[t](o);
}

/* ---------- countdown ---------- */
const EXAM = new Date("2026-12-02T19:00:00-03:00");
function renderCount() {
  const now = new Date(); const ms = EXAM - now;
  let txt;
  if (ms <= 0) txt = "<b>Hoy fue el parcial</b>";
  else {
    const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5);
    txt = "<b>" + (d > 0 ? d + " d " + h + " h" : h + " h") + "</b>para el parcial";
  }
  $("#countdown").innerHTML = txt + '<br><span class="small">' + (syncMode === "db" ? "Progreso sincronizado" : "Progreso en este dispositivo") + "</span>";
}

/* ---------- entry rendering ---------- */
function evBadges(e) {
  return (e.evidencia || []).map(v => '<span class="badge star">★ ' + esc(EVLABEL[v] || v) + "</span>").join(" ");
}
function entryHTML(e, opts) {
  opts = opts || {};
  const st = P.sab[e.id];
  let h = '<article class="entry" id="e-' + esc(e.id) + '" data-b="' + e.b + '">';
  h += '<div class="head">' + (opts.noB ? "" : '<span class="bt">B' + e.b + "</span>") + '<span class="term"><mark class="hl">' + esc(e.termino) + "</mark></span> " + evBadges(e) + "</div>";
  if (e.definicion) h += '<p class="def">' + esc(e.definicion) + "</p>";
  if (e.lista && e.lista.items && e.lista.items.length) {

function rCasos() {
  const origins = ["all"].concat(Array.from(new Set(CASOS.map(c => c.origen))));
  const cs = CASOS.filter(c => (F.b === "all" || c.bolillas.includes(Number(F.b))) && (casOrigen === "all" || c.origen === casOrigen));
  let h = '<h2>Casos</h2><p class="lead">Leé el pie, escribí tu respuesta y recién ahí abrí la pista o el modelo. La pregunta del parcial siempre es la misma: ¿qué concepto aplica acá y por qué?</p>';
  h += '<div class="seg">' + origins.map(o => '<button class="chip" data-or="' + esc(o) + '" aria-pressed="' + (casOrigen === o) + '">' + (o === "all" ? "Todos" : esc(o)) + "</button>").join("") + "</div>";
  h += '<p class="small muted">' + cs.length + " casos</p>";
  for (const c of cs) {
    h += '<details class="caso" id="c-' + esc(c.id) + '"><summary><div>' + c.bolillas.map(n => '<span class="bt" data-b="' + n + '">B' + n + "</span>").join(" ") + ' <span class="badge">' + esc(c.origen) + "</span>" + (c.agregado ? ' <span class="badge">inventado</span>' : "") + "</div><h3>" + esc(c.titulo) + '</h3></summary><div class="cbody">';
    h += '<p class="pie">' + esc(c.pie) + "</p>";
    if (c.pista) h += '<details><summary class="small"><b>Pista</b></summary><p class="small">' + esc(c.pista) + "</p></details>";
    c.preguntas.forEach((q, i) => {
      const key = "hubleg2.c." + c.id + "." + i;
      h += '<div class="cq"><p><b>' + (i + 1) + ".</b> " + esc(q.q) + '</p><textarea data-draft="' + esc(key) + '" aria-label="Tu respuesta" placeholder="Tu respuesta">' + esc(ls(key) || "") + "</textarea>";
      h += '<details><summary class="small"><b>Ver respuesta modelo</b></summary><div class="reveal"><p>' + esc(q.respuesta) + "</p>" + (q.dudosa ? '<p class="alerta small"><b>⚠ Dudosa:</b> el material no lo desarrolla del todo; está razonado con lo visto.</p>' : "") + conceptChips(q.conceptos, c.bolillas) + "</div></details></div>";
    });
    if (c.nota) h += '<p class="alerta small"><b>Ojo:</b> ' + esc(c.nota) + "</p>";
    h += '<p class="small muted">Fuente: ' + esc(c.fuentes || "") + "</p></div></details>";
  }
  if (!cs.length) h += '<div class="empty">No hay casos con este filtro.</div>';
  $("#t-casos").innerHTML = h;
}
$("#t-casos").addEventListener("click", ev => {
  const o = ev.target.closest("[data-or]"); if (o) { casOrigen = o.dataset.or; rCasos(); return; }
  const t = ev.target.closest("[data-term]"); if (t) openTerm(t.dataset.term);
});
let draftT = {};
$("#t-casos").addEventListener("input", ev => {
  const k = ev.target.dataset.draft; if (!k) return;
  clearTimeout(draftT[k]); draftT[k] = setTimeout(() => ls(k, ev.target.value), 500);
});

/* ---------- SIMULACRO ---------- */
let sim = null;
function coreFirst(a) { const c = a.filter(e => e.nucleo); return F.core && c.length ? c : a; }
function listEntries(b, min) { return coreFirst(E.filter(e => e.b === b && e.lista && e.lista.items && e.lista.items.length >= min && (!F.ppt || /PPT/.test(e.fuente || "")))); }
function defEntries(b) { const all = coreFirst(E.filter(e => e.b === b && e.definicion && (!F.ppt || /PPT/.test(e.fuente || "")))); const st = all.filter(e => e.evidencia && e.evidencia.length); return st.length && Math.random() < .7 ? st : all; }
function buildSim() {
  const pool = F.b === "all" ? BN.slice() : [Number(F.b)];
  const bs = F.b === "all" ? shuffle(pool).slice(0, 5).sort((a, b) => BN.indexOf(a) - BN.indexOf(b)) : pool;
  sim = bs.map(b => {
    const used = new Set();
    const A = pick(defEntries(b)); if (A) used.add(A.id);
    const Bc = shuffle(listEntries(b, 2)).find(e => !used.has(e.id)); if (Bc) used.add(Bc.id);
    const Cc = shuffle(listEntries(b, 3)).find(e => !used.has(e.id));
    const cs = CASOS.filter(c => c.bolillas.includes(b));
    const Dc = cs.length ? pick(cs) : null;
    return { b, A, B: Bc, C: Cc, D: Dc, open: false };
  });
  simStart = Date.now();
}
let simStart = 0;
function rSim() {
  let h = '<h2>Simulacro</h2><p class="lead">Mismo formato que los parciales anteriores: cada punto es una bolilla. Resolvé en papel, con reloj, y después abrí la resolución de cada punto.' + (F.b === "all" ? " Arma 5 puntos con bolillas al azar." : " Filtrado: un punto de la B" + F.b + ".") + "</p>";
  h += '<div class="btns"><button class="btn pri" id="sim-new">' + (sim ? "Armar otro" : "Armar simulacro") + "</button></div>";
  if (!sim) { $("#t-simulacro").innerHTML = h; return; }
  sim.forEach((p, i) => {
    h += '<div class="punto" data-b="' + p.b + '"><h3>Punto ' + (i + 1) + ' <span class="bt">B' + p.b + "</span></h3><ol>";
    if (p.A) h += '<li><p><span class="lbl">A)</span>Defina ' + esc(p.A.termino.toUpperCase()) + ".</p>" + (p.open ? sAns(p.A) : "") + "</li>";
    if (p.B) h += '<li><p><span class="lbl">B)</span>' + esc(p.B.pregunta || ("Enuncie y explique: " + p.B.termino)) + "</p>" + (p.open ? sAns(p.B) : "") + "</li>";
    if (p.C) h += '<li><p><span class="lbl">C)</span>Enuncie ' + esc((p.C.lista.titulo || p.C.termino).toLowerCase()) + " (" + esc(p.C.termino) + "). Elija uno y descríbalo.</p>" + (p.open ? sAns(p.C) : "") + "</li>";
    if (p.D) {
      h += '<li><p><span class="lbl">D)</span>Analice el siguiente caso y responda.</p><p class="pie">' + esc(p.D.pie) + "</p><ul>" + p.D.preguntas.map(q => "<li>" + esc(q.q) + "</li>").join("") + "</ul>";
      if (p.open) h += p.D.preguntas.map((q, k) => '<div class="reveal"><p><b>' + (k + 1) + ".</b> " + esc(q.respuesta) + "</p>" + conceptChips(q.conceptos, p.D.bolillas) + "</div>").join("");
      h += "</li>";
    }
    h += '</ol><div class="btns"><button class="btn" data-sim="' + i + '">' + (p.open ? "Ocultar resolución" : "Ver resolución del punto") + "</button></div></div>";
  });
  $("#t-simulacro").innerHTML = h;
}
function sAns(e) {
  let h = '<div class="reveal">';
  if (e.definicion) h += "<p>" + esc(e.definicion) + "</p>";
  if (e.lista && e.lista.items && e.lista.items.length) h += "<ul>" + e.lista.items.map(i => "<li>" + item(i) + "</li>").join("") + "</ul>";
  h += '<p><button class="chip" data-term="' + esc(e.id) + '">Ver en el glosario</button></p></div>';
  return h;
}
$("#t-simulacro").addEventListener("click", ev => {
  if (ev.target.id === "sim-new") { buildSim(); rSim(); return; }
  const s = ev.target.closest("[data-sim]"); if (s) { const p = sim[Number(s.dataset.sim)]; p.open = !p.open; rSim(); return; }
  const t = ev.target.closest("[data-term]"); if (t) openTerm(t.dataset.term);
});

/* ---------- BOLILLAS ---------- */
let bOpen = null;
function rBolillas(o) {
  if (o && o.open) bOpen = o.open;
  if (o && o.close) bOpen = null;
  let h = "";
  if (!bOpen) {
    h += '<h2>Bolillas</h2><p class="lead">Cada bolilla en el orden del PPT, con lo que ya tomaron, los choques entre PPT y material, y qué ítems del programa no tienen fuente.</p><div class="bgrid">';
    for (const b of BOL) {
      const s = stats(b.n);
      h += '<button class="btile" data-open="' + b.n + '" data-b="' + b.n + '"><span class="n"><mark class="hl">' + b.n + "</mark></span><b>" + esc(b.titulo) + '</b><span class="small muted">' + s.total + " términos · " + MC.filter(q => q.b === b.n).length + " preguntas · " + CASOS.filter(c => c.bolillas.includes(b.n)).length + ' casos</span><span class="bar"><i style="width:' + (s.total ? Math.round(100 * s.sab / s.total) : 0) + '%"></i></span></button>';
    }
    h += "</div>";
    h += '<div class="foot"><p><b>Nota de fidelidad.</b> Fuente principal: PPT de clase de cada bolilla del 2do parcial (lo que no está en el PPT no entra). Refuerzo: material de lectura de la cátedra, marcado «material». Evidencia de lo que toman: quices de la cursada (B8, B10, Quiz 11 de B11-B12, B13, B15, B17), parciales 2018 y 2023 (propiedad intelectual y marcas), TP6 y TP7. B14 y B19 no tienen quiz; B19 tiene cobertura liviana.</p><p><b>Agregado (no sale del material):</b> las preguntas «Nuevas» de opción múltiple y sus explicaciones, las versiones en opción múltiple de las consignas de los quices, los casos marcados «inventado», las respuestas modelo y los ejemplos marcados «agregado». Ningún número de artículo, ley, plazo o monto fue agregado: un script verifica que todos aparezcan textuales en el PPT, el material o los TPs.</p><p><b>⚠ Ojo</b> marca contradicciones entre PPT y material (o con los apuntes de los quices): en el parcial va la versión del PPT. El material de B15 es anterior a las reformas 2024 y 2026: donde choca, manda el PPT.</p></div>';
    $("#t-bolillas").innerHTML = h; return;
  }
  const b = BOL.find(x => x.n === bOpen); const es = E.filter(e => e.b === b.n && (!F.ppt || /PPT/.test(e.fuente || "")));
  h += '<p><button class="chip" id="b-back">← Todas las bolillas</button></p>';
  h += '<div class="bhead" data-b="' + b.n + '"><span class="num"><mark class="hl">' + b.n + "</mark></span><h2 style=\"margin:0\">" + esc(b.titulo) + "</h2></div>";
  h += '<div class="btns"><button class="btn pri" data-act="mc">Opción múltiple</button><button class="btn" data-act="pun">Punteros</button><button class="btn" data-act="cas">Casos</button></div>';
  const star = es.filter(e => e.evidencia && e.evidencia.length);
  if (star.length) h += '<div class="howto" data-b="' + b.n + '"><h4>Lo que ya tomaron</h4><p>' + star.map(e => '<button class="chip" data-term="' + esc(e.id) + '">' + esc(e.termino) + "</button>").join(" ") + "</p></div>";
  const core = es.filter(e => e.nucleo), rest = es.filter(e => !e.nucleo);
  if (core.length) {
    h += '<h3 style="margin-top:14px">Definiciones clave</h3><p class="small muted">Lo que te pueden pedir de memoria: «¿Qué es…?», «enumere…».</p>';
    core.forEach(e => h += entryHTML(e, { noB: true }));
  }
  if (rest.length) {
    h += '<details style="margin-top:14px"><summary><b>Resto del glosario (' + rest.length + ')</b> <span class="small muted">· para casos y para ampliar</span></summary>';
    let lastS = null;
    for (const e of rest) {
      if (e.seccion !== lastS) { h += "<h3 style=\"margin-top:14px\">" + esc(e.seccion || "") + "</h3>"; lastS = e.seccion; }
      h += entryHTML(e, { noB: true });
    }
    h += "</details>";
  }
  if (b.programa && b.programa.length) {
    h += '<h3 style="margin-top:18px">Programa oficial vs. lo que hay</h3><div class="tbl"><table><thead><tr><th>Ítem del programa</th><th>Estado</th></tr></thead><tbody>';
    b.programa.forEach(p => {
      const lab = { cubierto: "En el PPT", solo_material: "Solo material", sin_fuente: "Sin fuente: no entra" }[p.estado] || p.estado;
      h += "<tr><td>" + esc(p.item) + "</td><td><span class=\"st " + esc(p.estado) + "\">" + esc(lab) + "</span></td></tr>";
    });
    h += "</tbody></table></div>";
  }
  if (b.notas) h += '<p class="small muted">' + esc(b.notas) + "</p>";
  $("#t-bolillas").innerHTML = h;
}
$("#t-bolillas").addEventListener("click", ev => {
  const o = ev.target.closest("[data-open]"); if (o) { bOpen = Number(o.dataset.open); rBolillas(); window.scrollTo(0, 0); return; }
  if (ev.target.id === "b-back") { bOpen = null; rBolillas(); return; }
  const t = ev.target.closest("[data-term]"); if (t) { openTerm(t.dataset.term); return; }
  const a = ev.target.closest("[data-act]");
  if (a) { setB(bOpen); if (a.dataset.act === "mc") { mcRun = null; mcCfg.bset = null; go("mc"); } else if (a.dataset.act === "pun") { deck = null; go("punteros"); } else go("casos"); }
});

/* ---------- boot ---------- */
renderFilters(); renderCount(); setInterval(renderCount, 60000);
const h0 = (location.hash || "").replace("#", "");
go(TABS.includes(h0) ? h0 : "hoy");
})();
</script>
