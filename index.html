leador (art. 4 inc. d; además puede ser secreto comercial, Ley 24.766). Civil: SoftNorte puede reclamar daños y perjuicios (arts. 1716 y ss. CCyC) y pedir al juez embargo de las copias ilícitas y otras medidas preventivas (art. 79 Ley 11.723). Penal: reproducir una obra sin autorización del titular encuadra en el art. 72, con la pena de la estafa del art. 71 Ley 11.723 y 172 CP (prisión de 1 mes a 6 años). Laboral: llevarse código ajeno viola los deberes de fidelidad y no concurrencia (arts. 85 y 88 LCT); como Lucía ya renunció, el despido con causa no aplica, pero el incumplimiento puede fundar reclamos de SoftNorte. DataSur, que se beneficia, también queda expuesta.", "conceptos": ["Consecuencias de violar los derechos intelectuales", "¿De quién es el código? (casos de titularidad)"], "dudosa": true}, {"q": "e. Licencias. ¿Qué problema genera la librería GPL si SoftNorte vende la app como producto cerrado? ¿Y haber borrado el aviso de copyright de la librería MIT? Expliquen la diferencia entre copyleft y licencia permisiva.", "respuesta": "La GPL tiene copyleft: quien distribuye una obra derivada debe hacerlo bajo la misma licencia; si SoftNorte vende la app (la distribuye) con la librería GPL adentro, la obra derivada debe distribuirse bajo GPL, con código, lo que choca con venderla cerrada. La MIT es permisiva: se puede usar dentro de un producto cerrado, pero conservando el aviso de copyright y el texto de la licencia; borrarlo viola la licencia (y afecta la mención del autor). Diferencia: el copyleft obliga a mantener la misma licencia libre en las derivadas; la permisiva solo exige conservar el aviso. Cada componente trae obligaciones que viajan con él.", "conceptos": ["Copyleft vs. licencia permisiva", "Ejercicio: ¿puedo usar esto?", "Tipos (familias) de licencias de software"], "dudosa": false}, {"q": "f. Registro. ¿Necesitaba SoftNorte registrar el software para que estuviera protegido? ¿Por qué igualmente conviene hacerlo, ante qué organismo y cómo se deposita un software inédito?", "respuesta": "No: el derecho nace con la creación (Convenio de Berna, art. 5.2); solo en obras publicadas la falta de inscripción suspende el derecho hasta que se inscribe (arts. 57 y 63). Conviene porque da fecha cierta, presunción de autoría, invierte la carga de la prueba y sirve de elemento de comparación ante plagio. Se registra ante la DNDA (Min. de Justicia) por TAD. El inédito va por «Depósito en custodia de obra inédita - Software»: sobre cerrado y firmado con un soporte, o archivo digital encriptado y firmado, con las partes suficientes para identificarlo sin exponer secretos; vigencia de 36 meses renovable (Dto. 972/2024).", "conceptos": ["Registro de la obra: necesidad y beneficios", "Software inédito vs. publicado", "Paso a paso del registro en TAD"], "dudosa": false}, {"q": "g. Responsabilidad profesional. ¿Qué responsabilidad le cabe al líder técnico que aprobó incorporar las librerías sin revisar sus licencias? ¿Puede alegar que «no sabía»?", "respuesta": "No puede: «no sabía» no alcanza. Cuanto mayor el deber de obrar con prudencia y conocimiento, mayor la diligencia exigida (art. 1725 CCyC), y el art. 1768 regula la responsabilidad de los profesionales liberales. «Incorporar componentes sin revisar su licencia» es una de las situaciones de responsabilidad del PPT: mezclar copyleft en un producto cerrado o borrar avisos de una librería permisiva viola esas licencias. Expone a SoftNorte a reclamos civiles y penales y puede comprometerlo personalmente.", "conceptos": ["Responsabilidad del profesional"], "dudosa": false}], "nota": null, "agregado": false, "fuentes": "PPT B8; material B8"}, {"id": "tp7-2", "titulo": "TP7 · Consigna 2: «PADELYA»", "bolillas": [10], "origen": "TP7", "pie": "Tres egresados UNT lanzan una app para reservar canchas de pádel en Tucumán. Al principio pensaron llamarla “Reservá Cancha”, pero finalmente eligieron el nombre “PADELYA”, acompañado de un logo con una pelota en movimiento. Hace un año que usan la marca en la app, en Instagram y en su publicidad, pero nunca la registraron.\nCuando deciden registrarla, encargan una búsqueda de antecedentes y descubren que:\n• Una empresa de Córdoba registró en el INPI, en 2025, la marca “PADDLEYA” en la clase 41 (servicios deportivos y de entretenimiento).\n• Un tercero registró el dominio padelya.com.ar en NIC Argentina y les ofrece vendérselo por USD 5.000.\n• Un complejo deportivo de Yerba Buena empezó a usar el nombre y el logo de PADELYA en su propio sistema de reservas en línea, sin autorización.\nLos egresados piensan presentar la solicitud solo en la clase 9, “porque es una app”.", "pista": "Reconocé: marca descriptiva (art. 2), funciones, principio atributivo (art. 4 Ley 22.362), confusión visual/auditiva/ideológica, especialidad y Niza, trámite con oposición, ciberocupación (psa.com.ar), vías civil/administrativa/penal, vigencia y DJ de medio término.", "preguntas": [{"q": "a. Capacidad distintiva. ¿Qué problema habría tenido registrar «Reservá Cancha»? ¿Qué funciones cumple una marca y por qué esa denominación no las cumple?", "respuesta": "«Reservá Cancha» no es marca registrable: describe la función del servicio, y el art. 2 Ley 22.362 excluye los descriptivos (lo que describe naturaleza, función o cualidades) por falta de capacidad distintiva. Las funciones de la marca son distintiva (la esencial: diferenciar de los competidores), de identificación de origen, de garantía de calidad y publicitaria. Una expresión que cualquier competidor necesita para describir lo mismo no permite diferenciar ni asociar el servicio a una empresa determinada, así que falla ya la función distintiva y con ella las demás.", "conceptos": ["Marca", "Funciones de la marca", "Signos no registrables"], "dudosa": false}, {"q": "b. Nacimiento del derecho. Sostienen que la marca «es de ellos» porque la usan hace un año. ¿Tienen razón? ¿Qué principio adopta la Argentina y qué norma lo establece? ¿Para qué sirve, igualmente, el uso?", "respuesta": "No. Argentina adopta el principio atributivo: el derecho exclusivo nace con el registro. El art. 4 Ley 22.362 dice que la propiedad de una marca y la exclusividad de uso se obtienen con su registro: «no soy dueño porque la uso; soy dueño porque la registré». El uso igual importa: permite conservar la marca, evita acciones de caducidad por falta de uso y puede ser relevante en ciertos conflictos.", "conceptos": ["Nacimiento del derecho marcario (principio atributivo)"], "dudosa": false}, {"q": "c. Confusión y especialidad. Comparen «PADELYA» y «PADDLEYA» desde lo visual, auditivo e ideológico. ¿Hay riesgo de confusión? ¿Influye que la marca cordobesa esté en otra clase? Expliquen el principio de especialidad.", "respuesta": "Según el material B10 (no el PPT), hay tres tipos de confusión y basta uno: visual (difieren en una letra del medio: «D» vs. «DD»), auditiva (se pronuncian prácticamente igual) e ideológica (ambas evocan el pádel y la inmediatez del «ya»); comparadas por su impresión de conjunto, el riesgo de confusión es alto. Principio de especialidad: una marca puede coexistir con otra idéntica si operan en clases distintas y no hay riesgo de confusión (ej. «Delta»). Pero la cordobesa está en la clase 41 (servicios deportivos y de entretenimiento), que es justamente la actividad de PADELYA: los servicios son conexos, así que la diferencia de clase no los salva si PADELYA pide la 41. Lo resuelve en definitiva el INPI.", "conceptos": ["Clasificación de Niza y principio de especialidad"], "dudosa": true}, {"q": "d. Clases. ¿Es suficiente pedir el registro solo en la clase 9? ¿Qué otras clases de Niza deberían considerar y por qué?", "respuesta": "No. Es el «error típico» del PPT: registrar una app solo en clase 9 (software y apps descargables) y dejar afuera el servicio que presta (42: SaaS, desarrollo, servicios en la nube) o lo que vende (35: gestión comercial, marketplaces online). Como reservan canchas, la 41 (entretenimiento; el TP la describe como servicios deportivos y de entretenimiento) también es central. Clases 1 a 34 son productos y 35 a 45 servicios; conviene pensar dónde estará el negocio dentro de cinco años.", "conceptos": ["Clasificación de Niza y principio de especialidad", "Registro de marca: pasos"], "dudosa": false}, {"q": "e. Trámite. Describan los pasos del registro ante el INPI. Si la empresa de Córdoba se opone, ¿en qué plazo, qué opciones tienen las partes y quién resuelve sin acuerdo?", "respuesta": "Pasos: 1) verificar que sea registrable (capacidad distintiva, búsqueda de antecedentes); 2) determinar la clase (Niza); 3) presentar la solicitud en el portal del INPI; 4) examen formal; 5) publicación en el Boletín de Marcas; 6) período de oposiciones de treinta días desde la publicación; 7) oposiciones, examen de fondo (arts. 2 y 3) y resolución. Si Córdoba se opone, se notifica al solicitante, que tiene 3 meses para negociar (acuerdo de coexistencia, limitar productos o retirar la solicitud). Sin acuerdo resuelve el INPI (cambio de la Ley 27.444), y su decisión se recurre ante la Cámara Nacional de Apelaciones en lo Civil y Comercial Federal.", "conceptos": ["Registro de marca: pasos"], "dudosa": false}, {"q": "f. Nombre de dominio. ¿Cómo se llama la conducta de quien registró padelya.com.ar? ¿Qué pueden hacer? ¿Mejora su posición si antes registran la marca? (caso psa.com.ar)", "respuesta": "Es ciberocupación: registrar un dominio con la marca de otro para revendérselo o quedarse con sus clientes. NIC Argentina asigna los .ar al primero que los pide y no revisa marcas, pero la justicia puede proteger al titular: en psa.com.ar (CNCivComFed, Sala II, 30/12/1999) se ordenó como cautelar el cese de uso, la cancelación provisoria del dominio y su asignación provisoria al dueño de la marca, porque la marca era anterior. El material agrega el trámite de disputa ante NIC Argentina. Registrar la marca mejora su posición (sin registro no hay exclusividad: principio atributivo), aunque en psa el peso estuvo en que la marca era anterior al dominio, y acá el dominio podría ser anterior al registro.", "conceptos": ["Marcas y nombres de dominio"], "dudosa": true}, {"q": "g. Defensa de la marca. Ya registrada, ¿qué vías tienen frente al complejo deportivo? Distingan civil, administrativa y penal (art. 31).", "respuesta": "Civil: acción de cese de uso, indemnización de daños y perjuicios y medidas cautelares (secuestro de mercadería, cese inmediato). Administrativa ante el INPI: oposición a una solicitud ajena, pedido de caducidad por falta de uso o de nulidad de una marca mal concedida; sirve si el complejo intenta registrar el signo. Penal (art. 31 Ley 22.362): falsificar o imitar fraudulentamente una marca registrada, usarla o vender productos con marca falsificada, con prisión de 3 meses a 2 años, más multa. El complejo usa nombre y logo sin autorización: encuadra en el uso de marca ajena.", "conceptos": ["Defensa de la marca (vías)"], "dudosa": false}, {"q": "h. Conservación del derecho. ¿Cuánto dura el registro y qué deben hacer para no perder la marca? ¿Qué es la caducidad por falta de uso y la declaración jurada de uso de medio término?", "respuesta": "Dura 10 años desde la concesión, renovables indefinidamente por períodos iguales. Deben usarla, presentar la DJ de medio término, renovar a tiempo (desde 6 meses antes del vencimiento o hasta 6 meses después con recargo; solo si hubo uso en los últimos 5 años) y vigilar el Boletín. Caducidad: si la marca no se usa en los 5 años anteriores a que alguien lo pida, puede declararse su caducidad, incluso parcial (solo para los productos no usados). DJ de uso de medio término (Decreto 242/2019): trámite ante el INPI en el que el titular declara que usó la marca durante los primeros cinco años desde la concesión; sirve para depurar el registro.", "conceptos": ["Vigencia y mantenimiento de la marca"], "dudosa": false}], "nota": "Los «conceptos» de este caso son de B10: el subagente de B10 debe tener entradas equivalentes en su glosario (nombres aproximados).", "agregado": false, "fuentes": "PPT B10; material B10 (confusión, disputa NIC)"}, {"id": "tp7-3", "titulo": "TP7 · Consigna 3: «Centro Odontológico Del Parque»", "bolillas": [13, 8], "origen": "TP7", "pie": "El Centro Odontológico Del Parque contrató a la consultora tecnológica CodeLab para desarrollar un sistema de turnos en línea y de historias clínicas digitales. CodeLab aloja la base de datos en un servidor contratado en un país que no cuenta con legislación de protección de datos personales. El sistema presenta las siguientes características:\n• El formulario de registro pide nombre, DNI, teléfono, correo electrónico, obra social, religión, ingresos mensuales y tratamientos odontológicos previos. Todos los campos son obligatorios.\n• Al final del formulario hay una casilla ya tildada que dice “Acepto los términos y condiciones”, sin ningún otro texto.\n• Todos los empleados del centro, incluidos los recepcionistas, ingresan con el mismo usuario y contraseña y pueden ver todas las historias clínicas. No existe registro de accesos (logs) y la base no está cifrada.\n• La base nunca fue inscripta en el Registro Nacional de Bases de Datos.\nHace un mes se detectó que un recepcionista descargó los datos de 3.000 pacientes y los vendió a una financiera, que empezó a llamarlos para ofrecerles préstamos. Además, el propio centro venía compartiendo la lista de pacientes con una marca de pastas dentales para que les enviara publicidad.\nUna paciente, Carla, envió un correo electrónico pidiendo saber qué datos suyos tiene el centro y, luego, que se borre toda su información. Pasaron quince días y nadie le respondió.\nPor último, CodeLab sostiene que, como diseñó la base de datos, “la base es suya” y puede reutilizar los datos de los pacientes para otros clientes.", "pista": "Reconocé: titular/responsable/encargado, datos sensibles y de salud, calidad (pertinencia), consentimiento libre, expreso e informado, información al titular, inscripción, cesión y transferencia internacional, seguridad (art. 9) y RENAPER, acceso/supresión y hábeas data, tres responsabilidades, y la base como obra (Ley 11.723) vs. los datos (Ley 25.326).", "preguntas": [{"q": "a. Sujetos y datos. Identifiquen al titular, al responsable y a quien trata los datos por cuenta del responsable. ¿Qué datos son personales comunes y cuáles sensibles? ¿Puede el centro tratar datos de salud?", "respuesta": "Titulares: los pacientes (Carla), cuyos datos son objeto del tratamiento. Responsable: el Centro Odontológico, titular del archivo o base. Quien trata por cuenta del responsable: CodeLab, encargado del tratamiento (art. 25; figura del material, el PPT solo define «usuario»). Comunes: nombre, DNI, teléfono, correo, obra social e ingresos (información referida a personas determinadas). Sensibles: religión (convicciones religiosas) y tratamientos odontológicos previos (información sobre la salud). Sí puede tratar los de salud: según el material (art. 8), los establecimientos sanitarios pueden recolectar y tratar los datos de salud de sus pacientes, respetando el secreto profesional.", "conceptos": ["Titular, usuario y responsable", "Dato personal", "Dato sensible"], "dudosa": false}, {"q": "b. Pertinencia y consentimiento. ¿Qué datos sobran y por qué? ¿La casilla premarcada cumple con el consentimiento? ¿Qué información debió darse al recolectar?", "respuesta": "Por el principio de calidad los datos deben ser ciertos, adecuados y pertinentes y no excesivos para la finalidad: para turnos e historia clínica odontológica sobran la religión y los ingresos mensuales. Además, ninguna persona puede ser obligada a proporcionar datos sensibles: hacer obligatoria la religión viola esa prohibición. La casilla premarcada no cumple: el consentimiento debe ser libre, expreso e informado y constar por escrito u otro medio; tildado de antemano no es expreso, y «acepto términos» sin texto no informa nada. Debió informarse en forma expresa y clara: finalidad, existencia de la base, identidad y domicilio del responsable, carácter obligatorio o facultativo de las respuestas, consecuencias de dar, negarse o dar datos inexactos, y derechos de acceso, rectificación y supresión.", "conceptos": ["Principio de calidad de los datos", "Consentimiento", "Información al titular", "Prohibición de recolección de datos sensibles"], "dudosa": false}, {"q": "c. Licitud y circulación. ¿Qué consecuencia tiene que la base no esté inscripta? ¿Era válido compartir la lista con la marca de pastas dentales? ¿Y alojar la base en un país sin legislación de protección de datos?", "respuesta": "Toda base pública o privada destinada a dar informes (incluso para uso interno) debe inscribirse en el Registro; según el material, la inscripción es la que hace lícita a la base (art. 3), y una base no registrada nace ilegal. Compartir la lista con la marca fue una cesión inválida: la cesión exige consentimiento previo del titular, informándole finalidad y cesionario (art. 11, material), y viola la finalidad específica de la recolección; además, los datos sensibles no pueden cederse salvo autorización legal. Alojar la base en un país sin protección adecuada viola el art. 12, que prohíbe esa transferencia; usar la nube es transferir: importa dónde están los servidores.", "conceptos": ["Destinados a proveer informes", "Recolección de datos", "Cesión y transferencia internacional"], "dudosa": false}, {"q": "d. Seguridad. ¿Qué deber legal incumplió el centro? Propongan al menos cuatro medidas técnicas y relaciónenlas con la norma. ¿Qué enseñanza deja el caso RENAPER?", "respuesta": "Incumplió el deber de seguridad (art. 9): el responsable o usuario debe adoptar medidas técnicas y organizativas para garantizar la seguridad y confidencialidad de los datos, evitar su adulteración, pérdida, consulta o tratamiento no autorizado y detectar desviaciones. Medidas del PPT: 1) control de accesos por usuario y rol, con mínimo privilegio (la recepción no ve historias clínicas); 2) MFA; 3) cifrado en reposo y en tránsito; 4) auditoría de logs y monitoreo (alerta ante una descarga de 3.000 registros); 5) backups cifrados y verificados. RENAPER: la amenaza vino de adentro, por uso indebido de credenciales legítimas que devolvían más datos de los necesarios; la solución fue responder solo «verdadero/falso» (minimización).", "conceptos": ["Seguridad de los datos"], "dudosa": false}, {"q": "e. Derechos del titular y hábeas data. ¿Qué derechos ejerció Carla y en qué plazos debían responderle? ¿Puede el centro negarse a borrar todo? Ante la falta de respuesta, ¿qué vía tiene y dónde está prevista?", "respuesta": "Ejerció el derecho de acceso (art. 14: plazo de 10 días corridos) y luego el de supresión (art. 16: 5 días hábiles); los quince días sin respuesta exceden ambos. La supresión no procede cuando pudiera causar perjuicios a derechos de terceros o existiera una obligación legal de conservar los datos: si una norma obliga a conservar la historia clínica, el centro podría negarse a borrar esa parte, pero no lo demás (las fuentes no dicen si esa obligación existe). Sin respuesta, Carla puede denunciar ante la AAIP o promover la acción de hábeas data (art. 43 CN; arts. 33 y ss. Ley 25.326; art. 16: el incumplimiento en plazo la habilita).", "conceptos": ["Derechos del titular", "Hábeas data"], "dudosa": true}, {"q": "f. Responsabilidades. ¿Qué tipos de responsabilidad pueden derivar de la filtración, para el centro y para el recepcionista? Mencionen las normas.", "respuesta": "Centro: civil, obligación de reparar el daño a los pacientes (art. 31 inc. 1 Ley 25.326; arts. 1716, 1737, 1738 y 1741 CCyC); administrativa ante la AAIP (art. 31: apercibimiento, suspensión, multa de $1.000 a $100.000 por infracción, clausura o cancelación del archivo; Res. AAIP 126/2024). Quien encarga o se beneficia del tratamiento responde aunque lo ejecute un tercero. Recepcionista: penal, por revelar información de un banco de datos que debía mantener en secreto y por acceder ilegítimamente (art. 157 bis CP, 1 mes a 2 años); también civil. El aspecto laboral (fidelidad, B15) excede las fuentes de B13.", "conceptos": ["Sanciones"], "dudosa": true}, {"q": "g. Propiedad intelectual de la base. ¿Tiene razón CodeLab cuando dice que «la base es suya»? Distingan qué protege la Ley 11.723 y qué protege la Ley 25.326.", "respuesta": "No en cuanto a los datos. La Ley 11.723 protege la base como obra (compilaciones de datos, art. 1): lo que se protege no son los datos individuales sino la selección y organización originales; como CodeLab es consultora externa y no dependiente, si no cedió derechos podría conservar la autoría del diseño de la base (art. 4 inc. d solo alcanza a dependientes). La Ley 25.326 protege a las personas que están adentro de la base: los datos son de sus titulares, el responsable es el centro y CodeLab solo los trata por cuenta de este, así que no puede reutilizarlos para otros clientes (finalidad específica, cesión sin consentimiento). Hacia adentro protege a los pacientes; hacia afuera, al creador de la base.", "conceptos": ["Obras protegidas por la Ley 11.723", "¿De quién es el código? (casos de titularidad)", "Titular, usuario y responsable"], "dudosa": false}], "nota": "Los «conceptos» B13 son nombres aproximados de entradas que arma el subagente de B13. Encargado (art. 25), art. 3, art. 8, art. 11 y art. 12 salen del material B13, no del PPT (el PPT B13 solo cita el art. 12 en el caso TikTok).", "agregado": false, "fuentes": "PPT B13; material B13; PPT/material B8 (punto g)"}, {"id": "p2023-echenique", "titulo": "Parcial 2023 · Caso Echenique (imagen en paquetes de cigarrillos)", "bolillas": [8], "origen": "Parcial 2023", "pie": "La familia de un mendocino que murió de cáncer de pulmón denunció al Ministerio de Salud y a tres tabacaleras por usar sin autorización su imagen agonizando en terapia intensiva, en los paquetes de cigarrillos. ¿Hubo consentimiento del enfermo? ¿Pueden los familiares impedir el uso de su imagen? ¿Pueden reclamar reparación moral y/o económica? Fundamente.", "pista": "Derecho a la imagen: art. 31 Ley 11.723 (retrato fotográfico en el comercio, consentimiento expreso; muerto, el de la familia; 20 años, art. 35) + art. 53 CCyC + derechos personalísimos (1er parcial).", "preguntas": [{"q": "¿Hubo consentimiento del enfermo?", "respuesta": "No. El art. 31 Ley 11.723 prohíbe poner en el comercio el retrato fotográfico de una persona sin su consentimiento expreso. El enunciado dice que la imagen se usó «sin autorización», y una persona agonizando en terapia intensiva no expresó ningún consentimiento para que su retrato terminara en paquetes de cigarrillos. Que la foto haya sido tomada en un ámbito sanitario no equivale a consentir su comercialización.", "conceptos": ["Derecho a la imagen (retrato fotográfico)"], "dudosa": false}, {"q": "¿Pueden los familiares impedir el uso de su imagen?", "respuesta": "Sí. El art. 31 exige, después de la muerte de la persona, el consentimiento de su familia, y ese consentimiento recién deja de ser necesario veinte años después de la muerte (art. 35). Como el uso se hizo sin autorización y dentro de ese plazo, la familia puede oponerse y pedir que cese; la regla se complementa con el derecho a la imagen del art. 53 CCyC. La imagen es un derecho personalísimo cuya lesión puede reclamar el titular o sus herederos.", "conceptos": ["Derecho a la imagen (retrato fotográfico)"], "dudosa": false}, {"q": "¿Pueden reclamar reparación moral y/o económica?", "respuesta": "Sí, al menos una compensación dineraria: si se lesionan derechos personalísimos como la imagen, el titular o sus herederos pueden reclamar compensación dineraria (PPT/material B1), y el plano civil de B8 remite a la reparación de daños y perjuicios (arts. 1716 y ss. CCyC). Las fuentes no desarrollan la distinción entre daño moral y daño económico, ni la responsabilidad específica del Estado (Ministerio de Salud) frente a la de las tabacaleras: esa parte queda dudosa.", "conceptos": ["Derecho a la imagen (retrato fotográfico)", "Consecuencias de violar los derechos intelectuales"], "dudosa": true}], "nota": "Las resoluciones de alumnos que circulan no son fuente; respuesta rehecha con material B8 (art. 31/35) y B1. El derecho a la imagen no está en el PPT B8.", "agregado": false, "fuentes": "material B8 (arts. 31 y 35 Ley 11.723; art. 53 CCyC); PPT/material B1 (derechos personalísimos)"}, {"id": "p2018-playa", "titulo": "Parcial 2018 · Caso fotos en la playa", "bolillas": [8], "origen": "Parcial 2018", "pie": "Un fotógrafo saca fotos a chicos que juegan al vóley en la playa y ellos posan; después las fotos aparecen en tapas de cuadernos Arterum. ¿Es lícito? ¿Pueden impedir el uso? ¿Pueden reclamar reparación moral y/o económica? (enunciado reconstruido por alumnos)", "pista": "Dos derechos distintos sobre la misma foto: derecho de autor del fotógrafo (la foto concreta, 20 años desde la publicación) y derecho a la imagen de los retratados (art. 31: consentimiento expreso para ponerla en el comercio).", "preguntas": [{"q": "¿Es lícito?", "respuesta": "No. El fotógrafo es autor de la foto concreta (la idea de sacar una foto en la playa no se protege, la foto sí; obras fotográficas: 20 años desde la primera publicación, art. 34), pero eso no le da derecho sobre la imagen de los retratados. El art. 31 Ley 11.723 prohíbe poner en el comercio el retrato fotográfico de una persona sin su consentimiento expreso, y usarlo en tapas de cuadernos es comercializarlo. Posar para la foto podría leerse como aceptación de la toma, pero no como consentimiento expreso para su uso comercial. Si los chicos son menores, quién debía consentir no está en las fuentes.", "conceptos": ["Derecho a la imagen (retrato fotográfico)", "Idea vs. expresión", "Duración de la protección"], "dudosa": true}, {"q": "¿Pueden impedir el uso?", "respuesta": "Sí. Sin consentimiento expreso el uso comercial está prohibido (art. 31), así que los retratados (o quienes los representen) pueden exigir que cese, tanto al fotógrafo como a Arterum, que es quien pone el retrato en el comercio. El art. 79 Ley 11.723 permite al juez dictar medidas preventivas, como el embargo de las copias ilícitas, para proteger los derechos en juego.", "conceptos": ["Derecho a la imagen (retrato fotográfico)", "Consecuencias de violar los derechos intelectuales"], "dudosa": true}, {"q": "¿Pueden reclamar reparación moral y/o económica?", "respuesta": "Sí, compensación dineraria: la imagen es un derecho personalísimo y su lesión habilita a reclamarla (PPT/material B1), con la reparación de daños y perjuicios de los arts. 1716 y ss. CCyC; el material B8 vincula además el art. 31 con el art. 53 CCyC. La distinción entre rubro moral y económico no está desarrollada en las fuentes.", "conceptos": ["Derecho a la imagen (retrato fotográfico)"], "dudosa": true}], "nota": "La resolución de alumnos de 2018 no es fuente (admite no haber visto el tema); rehecha con material B8 y B1.", "agregado": false, "fuentes": "material B8 (art. 31, art. 79); PPT B8 (idea vs. expresión, plazos); PPT/material B1"}, {"id": "p2018-farmacia", "titulo": "Parcial 2018 · Caso farmacia", "bolillas": [8, 11], "origen": "Parcial 2018", "pie": "Un informático hace un software para una farmacia; el contrato no incluía mantenimiento, pero él lo hacía igual; después se va a vivir a EE. UU. ¿Es válido lo que hizo? ¿Cómo se podría haber evitado? (enunciado reconstruido por alumnos)", "pista": "Freelance sin cesión: el código es suyo y la farmacia tiene el uso acordado (art. 4 inc. d no aplica). El mantenimiento no pactado no es obligación. Prevención: contrato con mantenimiento, cesión o licencia clara, registro.", "preguntas": [{"q": "¿Es válido lo que hizo?", "respuesta": "Sí, en principio. Como independiente, sin cláusula de cesión, conserva los derechos sobre el código y la farmacia solo tiene el uso acordado (el art. 4 inc. d habla de dependientes, no de independientes); la farmacia tiene una licencia, no la propiedad del programa. El mantenimiento no estaba en el contrato, así que no era una obligación de hacer asumida: lo hacía voluntariamente y dejar de hacerlo al mudarse no es incumplimiento. Si la conducta repetida generó una expectativa exigible por buena fe (art. 961 CCyC) es algo que las fuentes no cierran.", "conceptos": ["¿De quién es el código? (casos de titularidad)", "Licencia de uso («licenciar no es vender»)"], "dudosa": true}, {"q": "¿Cómo se podría haber evitado?", "respuesta": "Con un contrato completo (Bolilla 11): una cláusula de mantenimiento con alcance, plazo y precio; una cláusula de cesión de derechos inscripta (arts. 51 y 53) o una licencia que defina qué puede hacer la farmacia con el software (incluida la modificación por otro proveedor); y la entrega de la documentación técnica que integra la obra de software (Dto. 165/94). Del lado del informático, registrar la obra le da fecha cierta y presunción de autoría. La entrega del código fuente o su depósito para el cliente no está desarrollada en las fuentes B8.", "conceptos": ["¿De quién es el código? (casos de titularidad)", "Registro de la obra: necesidad y beneficios", "Obra de software (Dto. 165/94) y qué se presenta"], "dudosa": true}], "nota": "Se analiza también con contratos y obligaciones (1er parcial y B11); acá solo con B8 y conceptos del 1er parcial de parciales_viejos.md. La resolución de alumnos no es fuente.", "agregado": false, "fuentes": "PPT B8; material B8; conceptos 1er parcial (contrato, buena fe, obligaciones de hacer)"}, {"id": "inv-b8-1", "titulo": "Inventado · TurnoFácil S.A.S. y el código de la IA", "bolillas": [8], "origen": "Inventado", "pie": "TurnoFácil S.A.S., startup de Yerba Buena, ofrece por suscripción una plataforma web de turnos para peluquerías (no entrega copias del programa). Para acelerar, su único desarrollador, empleado en relación de dependencia, genera buena parte del backend con una herramienta de IA y lo pega sin revisarlo. Además modifica un componente de calendario con licencia AGPL y usa un set de íconos bajado de internet con licencia CC BY-NC. Un competidor descubre que un fragmento generado por la IA reproduce código de su repositorio público, publicado con licencia GPL. TurnoFácil sostiene que, como ofrece un servicio y no vende copias, ninguna licencia la obliga.", "pista": "SaaS no escapa a la AGPL; CC BY-NC prohíbe uso comercial; código de IA: sin autor humano no hay copyright y hay riesgo de reproducir código ajeno; responsabilidad profesional (art. 1725).", "preguntas": [{"q": "¿Tiene razón TurnoFácil en que, por ser SaaS, ninguna licencia la obliga? Fundamente.", "respuesta": "No. Para el componente AGPL modificado, el PPT es claro: la AGPL alcanza también al software ofrecido como servicio por la red, así que tiene que ofrecer el código a quienes usan el servicio. Y los íconos CC BY-NC no pueden usarse en una app paga porque esa licencia prohíbe el uso comercial, sin importar que sea SaaS. Respecto del fragmento GPL reproducido, el copyleft de la GPL se dispara con la distribución de la obra derivada; como TurnoFácil no distribuye copias, el alcance de esa obligación en un SaaS no lo cierran las fuentes, pero igual usó código ajeno sin revisar su licencia.", "conceptos": ["Ejercicio: ¿puedo usar esto?", "Copyleft vs. licencia permisiva", "Tipos (familias) de licencias de software"], "dudosa": true}, {"q": "¿De quién es el backend generado con IA? ¿Puede la empresa reclamar derechos sobre él?", "respuesta": "Sobre lo que escribió el empleado en sus funciones, la titular es la empresa (art. 4 inc. d, salvo pacto). Pero sobre lo generado por la IA sin aporte humano la protección es dudosa: en Thaler v. Perlmutter se resolvió que sin autor humano no hay copyright, y en Argentina no hay norma específica, aunque la doctrina mayoritaria exige creación humana. Por eso el checklist del PPT pide dejar registro del aporte humano. Además, lo que reproduce código ajeno no es de la empresa: es del competidor.", "conceptos": ["Código generado por inteligencia artificial", "Titulares del derecho de propiedad intelectual"], "dudosa": true}, {"q": "¿Qué responsabilidad tiene el desarrollador y qué debió hacer?", "respuesta": "Responde con la diligencia que exige su conocimiento: cuanto mayor el deber de obrar con prudencia y conocimiento, mayor la diligencia exigida (art. 1725 CCyC); «no sabía» no alcanza. Incorporar componentes sin revisar su licencia es una de las situaciones de responsabilidad del PPT. Debió seguir el checklist: revisar y entender el código generado, controlar que no reproduzca código ajeno con licencias incompatibles, respetar la política de la empresa sobre herramientas y no pegar código ni datos confidenciales.", "conceptos": ["Responsabilidad del profesional", "Código generado por inteligencia artificial"], "dudosa": false}], "nota": null, "agregado": true, "fuentes": "PPT B8"}, {"id": "inv-b8-2", "titulo": "Inventado · Planos reutilizados y software sin licencia en una constructora", "bolillas": [8], "origen": "Inventado", "pie": "Constructora Aconquija S.R.L. contrata a una ingeniera civil independiente para proyectar un edificio de oficinas en San Miguel de Tucumán; el contrato fija honorarios y plazo, sin cláusula sobre derechos. Los planos se visan en el Colegio y se aprueban en la Municipalidad. Un año después, la constructora usa los mismos planos para un segundo edificio en Yerba Buena sin consultarla. En paralelo, una inspección detecta que el encargado de sistemas instaló en los equipos 10 copias de un programa de diseño con licencias copiadas de otra empresa; la constructora compra las licencias al recibir el reclamo y alega que «casi no se usaban».", "pista": "Planos = obra (art. 1); el comitente paga el uso, no la titularidad; visado y municipio dejan constancia de autoría; licencias copiadas = infracción aunque no se use; comprar después no salva (casos Microsoft).", "preguntas": [{"q": "¿Puede la constructora reutilizar los planos para el segundo edificio? Fundamente.", "respuesta": "No. Los planos y las obras de arquitectura son obras protegidas (art. 1 Ley 11.723). La ingeniera es independiente, no dependiente, así que sin cesión conserva sus derechos: según el material, quien encarga un proyecto paga para usarlo en el fin para el que lo pidió, pero no se vuelve titular, y no puede reutilizar los planos para otra obra. La constructora debió pactar una cesión (arts. 51 y 53) o una autorización para el segundo uso.", "conceptos": ["Aplicación a las obras de ingeniería", "¿De quién es el código? (casos de titularidad)", "Obras protegidas por la Ley 11.723"], "dudosa": false}, {"q": "¿Cómo prueba la ingeniera su autoría y qué organismos intervienen?", "respuesta": "El visado de proyectos y planos por el colegio o consejo profesional (nivel provincial) y la aprobación de planos por el municipio (nivel municipal) dejan constancia de su autoría; además puede registrar la obra en la DNDA (nivel nacional), lo que da fecha cierta y presunción de autoría. Puede reclamar daños y perjuicios (arts. 1716 y ss. CCyC) y pedir medidas preventivas (art. 79).", "conceptos": ["Organismos que intervienen y controlan", "Registro de la obra: necesidad y beneficios", "Consecuencias de violar los derechos intelectuales"], "dudosa": false}, {"q": "¿Lo salva a la constructora haber comprado las licencias después o que «casi no se usaban»?", "respuesta": "No. En Microsoft c/ Matriplast (licencias copiadas de otro licenciatario) se condenó y se ordenó desinstalar, y en Microsoft c/ P. A. S.A. comprar las licencias después no la salvó; instalar sin licencia ya es infracción, aunque no se use. El daño se mide por lo que hubiera costado la licencia. Puede haber además consecuencia penal (arts. 71 y 72 Ley 11.723), y el encargado de sistemas responde profesionalmente por instalar software sin licencia (art. 1725 CCyC).", "conceptos": ["Casos Microsoft (2025)", "Consecuencias de violar los derechos intelectuales", "Responsabilidad del profesional"], "dudosa": false}], "nota": null, "agregado": true, "fuentes": "PPT B8; material B8 (obras de ingeniería)"}, {"id": "p2018-cr7", "titulo": "Caso \"CR7\"", "bolillas": [10], "origen": "Parcial 2018", "pie": "Christopher Renzi registró \"CR7\" en EE. UU. en 2009 para ropa, usando sus iniciales y su día de nacimiento. JBS Textile Group, que maneja la línea de ropa de Cristiano Ronaldo, pide revocar ese registro por aprovechamiento de la notoriedad del futbolista. Analizar según la legislación argentina qué posibilidades tiene cada uno. (Enunciado reconstruido por alumnos.)", "pista": "Territorialidad (el registro de EE. UU. no vale acá) + principio atributivo (art. 4) + marca notoria (París 6 bis y ADPIC 16) + nombre/seudónimo de persona sin consentimiento (art. 3) + vía administrativa ante el INPI (oposición/nulidad).", "preguntas": [{"q": "¿Qué posibilidades tiene Renzi según la legislación argentina? Fundamente.", "respuesta": "Pocas. Por territorialidad, una marca registrada protege solo en el país donde se registró: su registro de EE. UU. no le da ningún derecho en Argentina, donde tendría que registrar país por país. Y como Argentina adopta el principio atributivo (art. 4 Ley 22.362: la propiedad y la exclusividad de uso se obtienen con el registro), debería pedir \"CR7\" ante el INPI. Esa solicitud se publicaría en el Boletín de Marcas y JBS podría oponerse dentro de los treinta días; además el INPI hace un examen de fondo de oficio sobre los arts. 2 y 3. Como \"CR7\" es una marca notoria, la jurisprudencia argentina rechaza las solicitudes que intentan aprovechar el prestigio ajeno, aunque estén en otra clase. Su argumento (iniciales y día de nacimiento) solo serviría para discutir la confusión o la mala fe, pero no neutraliza la notoriedad.", "conceptos": ["Territorialidad y Protocolo de Madrid", "Nacimiento del derecho marcario (principio atributivo)", "Pasos del registro de una marca", "Marca notoria"], "dudosa": false}, {"q": "¿Qué posibilidades tiene JBS (Cristiano Ronaldo)? Fundamente.", "respuesta": "Buenas. Aunque \"CR7\" no estuviera registrada en Argentina, es una marca notoria (la conoce el público en general) y su protección rompe en parte dos principios: la territorialidad, porque el Convenio de París (art. 6 bis) obliga a protegerla aunque no esté registrada en el país, y la especialidad, porque el ADPIC (art. 16) extiende la protección a productos o servicios distintos cuando el uso sugiere una conexión con el titular y lo perjudica. Por la vía administrativa (INPI) puede oponerse a la solicitud de Renzi o, si ya se concedió, pedir su nulidad por estar mal concedida. Igual le conviene registrarla en el INPI, porque bajo el principio atributivo es el registro lo que da la exclusividad y la defensa sin registro es más compleja. El material agrega que la notoriedad no se presume: JBS tendría que probarla (años de uso, ventas, publicidad, registros en otros países).", "conceptos": ["Marca notoria", "Defensa de la marca: vías ante la copia", "Beneficios de registrar una marca", "Nacimiento del derecho marcario (principio atributivo)"], "dudosa": false}, {"q": "¿Puede invocarse además el art. 3 (nombre, seudónimo o retrato de una persona)?", "respuesta": "Probablemente sí, pero las fuentes no lo cierran. El art. 3 prohíbe registrar el nombre, seudónimo o retrato de alguien sin su consentimiento o el de sus herederos (PPT, caso Maradona). Si \"CR7\" se considera el seudónimo por el que se conoce a Cristiano Ronaldo, la solicitud de Renzi sin su consentimiento estaría prohibida. Ni el PPT ni el material dicen si unas iniciales con un número cuentan como seudónimo; por eso conviene usarlo como argumento complementario de la marca notoria, no como el principal. El caso Messi vs. Massi del PPT muestra el peso de la fama en el cotejo (en sentido inverso: favoreció al famoso que pedía su propio nombre).", "conceptos": ["Qué no se puede registrar (arts. 2 y 3)", "Nombres de personas famosas como marca", "Marca notoria"], "dudosa": true}], "nota": "La resolución de alumnos que circula admite \"no vimos marcas todavía\": no es fuente; respuesta rehecha con PPT B10. El enunciado es una reconstrucción de alumnos; el desenlace real del caso en EE. UU. no está en las fuentes y no se usa.", "agregado": false, "fuentes": "PPT B10 (slides 4, 13, 16, 25, 28, 31-33); material B10 §12-13"}, {"id": "p2018-clasificar", "titulo": "Clasificar signos: denominativa, figurativa o mixta", "bolillas": [10], "origen": "Parcial 2018", "pie": "(Consigna 2018: \"clasificar imágenes como marcas denominativas, figurativas o mixtas\". Las imágenes originales no están; se reemplazan por descripciones de signos ficticios.) Una incubadora de la UNT revisa los signos de cuatro emprendimientos: (1) \"TUKIPAY\", app de pagos, que piden registrar solo como palabra, en letras mayúsculas sin ningún diseño; (2) una consultora que usa únicamente el dibujo estilizado de un cóndor verde, sin texto; (3) una yerbatera que usa la palabra \"Yerbita\" en tipografía cursiva naranja dentro de un círculo con una hoja; (4) una fábrica de dulces que vende su producto en un frasco con forma de cerro tucumano.", "pista": "Mirar si hay solo palabra, solo dibujo, ambos, o forma del envase. Tip del PPT: la denominativa protege el nombre en cualquier tipografía; la mixta protege el conjunto.", "preguntas": [{"q": "Clasifique cada signo según el tipo de marca. Fundamente.", "respuesta": "(1) TUKIPAY es denominativa: solo palabras, letras o números, sin diseño, como MERCADO LIBRE escrito en cualquier tipografía. (2) El cóndor es figurativa: solo un dibujo o imagen, sin palabras, como la manzana de Apple. (3) \"Yerbita\" con tipografía, color y logo es mixta: palabras más diseño, tipografía o colores, como el logo de YPF en las estaciones. (4) El frasco con forma de cerro es tridimensional (la forma del envase o del producto); la consigna 2018 pedía tres tipos, pero el PPT enumera cuatro, así que conviene nombrarlo.", "conceptos": ["Tipos de marca"], "dudosa": false}, {"q": "La yerbatera piensa cambiar el logo el año que viene. ¿Qué le conviene registrar? Fundamente.", "respuesta": "Le conviene registrar también \"Yerbita\" como marca denominativa. Según el PPT, la denominativa protege el nombre en sí, sin importar cómo se dibuje, mientras que la mixta protege el conjunto: si cambia el logo, puede hacer falta un nuevo registro. Con la denominativa el nombre queda cubierto aunque cambie el diseño; el material agrega que por eso muchas empresas registran las dos.", "conceptos": ["Tipos de marca"], "dudosa": false}], "nota": "Signos ficticios agregados para reemplazar las imágenes del parcial 2018, que no están en el proyecto.", "agregado": true, "fuentes": "PPT B10 slide 11; material B10 §4"}, {"id": "inv10-movituc", "titulo": "MOVITUC: ¿quién tiene mejor derecho?", "bolillas": [10], "origen": "Inventado", "pie": "Un grupo de egresados de la FACET lanza \"MOVITUC\", una app de viajes compartidos en Tucumán (actividad del PPT). Antes de presentar la solicitud en el INPI encargan una búsqueda de antecedentes y descubren que una empresa de Córdoba usa \"Movituc\" hace dos años para un servicio de traslados, sin haberla registrado nunca. Los egresados presentan igual su solicitud. Además, piensan pedirla solo en la clase 9 y todavía no compraron el dominio movituc.com.ar.", "pista": "Giro del PPT (slide 34): principio atributivo (art. 4) vs. uso previo sin registro; período de oposiciones; clases 9, 39, 42 (y 35); dominio y @ por separado; uso y mantenimiento.", "preguntas": [{"q": "¿Quién tiene mejor derecho sobre la marca? Fundamente.", "respuesta": "En principio, los egresados, si obtienen el registro. Argentina adopta el principio atributivo: el art. 4 de la Ley 22.362 dice que la propiedad de una marca y la exclusividad de uso se obtienen con su registro, así que dos años de uso sin registro no hacen dueña a la empresa cordobesa. Eso no la deja sin defensa: publicada la solicitud en el Boletín de Marcas, tiene treinta días para oponerse; si lo hace, hay 3 meses para negociar (acuerdo de coexistencia, limitar productos o retirar la solicitud) y, sin acuerdo, resuelve el INPI. El material agrega que el uso previo puede servir para oponerse, pero es una posición mucho más débil que la de quien tiene el título. Cómo resolvería el INPI esa oposición concreta no lo dicen las fuentes.", "conceptos": ["Nacimiento del derecho marcario (principio atributivo)", "Pasos del registro de una marca"], "dudosa": false}, {"q": "¿Alcanza con pedir la clase 9? ¿Qué más deben hacer para proteger y conservar la marca?", "respuesta": "No alcanza. El error típico del PPT es registrar una app solo en clase 9 y dejar afuera el servicio que presta (42) o lo que vende (35); la actividad del PPT sugiere además la 39 (transporte), porque la marca vale solo para lo que se registró (principio de especialidad). El dominio movituc.com.ar se pide aparte en NIC Argentina, que lo asigna al primero que lo pide sin revisar marcas, y los @ se toman en cada red; si se demoran, se exponen a la ciberocupación. Una vez concedida, la marca dura 10 años renovables; deben usarla (5 años sin uso habilitan la caducidad), presentar la DJ de uso de medio término, renovarla a tiempo y vigilar el Boletín de Marcas.", "conceptos": ["Clases que importan en tecnología", "Clasificación de Niza y principio de especialidad", "Marcas y nombres de dominio (ciberocupación)", "Vigencia y mantenimiento"], "dudosa": false}], "nota": null, "agregado": true, "fuentes": "PPT B10 slides 4, 19, 22-26, 29, 34; material B10 §3, §7"}, {"id": "inv10-sabores", "titulo": "Sabores del Jardín S.R.L.: origen, caducidad y venta de la marca", "bolillas": [10, 1], "origen": "Inventado", "pie": "Sabores del Jardín S.R.L., de Tafí Viejo, quiere ampliar su negocio. (1) Pide registrar en el INPI la marca \"Salame de Tandil Tucumano\" para salames elaborados en Tucumán. (2) Es titular de la marca \"LIMONAR\" para jugos, concedida en 2018, pero dejó de venderlos a fines de 2019; en 2026 un competidor que quiere lanzar jugos con ese nombre pide la caducidad. (3) Los socios evalúan vender a otra empresa su marca \"Dulce Jardín\", que sí usan, por medio de un contrato.", "pista": "Denominación de origen y marca engañosa (art. 3); caducidad por falta de uso (5 años, vía administrativa INPI); la marca es un bien que se cede (caso Maradona) + contrato (art. 957 CCyC, 1er parcial).", "preguntas": [{"q": "¿Es registrable \"Salame de Tandil Tucumano\"? Fundamente.", "respuesta": "No. El PPT da \"Salame de Tandil\" como ejemplo argentino de DO/IG y aclara que no se pueden registrar como marca (art. 3, Ley 22.362): no pertenecen a una empresa sino a todos los productores de la zona que cumplen las reglas, y están atadas al lugar. Además, usarla para salames hechos en Tucumán sería una marca engañosa sobre el origen del producto, también prohibida por el art. 3. El INPI puede rechazarla en el examen de fondo, que hace de oficio.", "conceptos": ["Denominación de origen e indicación geográfica", "Qué no se puede registrar (arts. 2 y 3)", "Pasos del registro de una marca"], "dudosa": false}, {"q": "¿Puede el competidor quedarse con \"LIMONAR\"? Fundamente.", "respuesta": "Sí, probablemente. Según el PPT, si la marca no se usa en los 5 años anteriores a que alguien lo pida, puede declararse su caducidad, y el pedido de caducidad por falta de uso es una de las vías administrativas ante el INPI. Entre fines de 2019 y 2026 pasaron más de 5 años sin uso, aunque el registro de 2018 siga vigente (10 años desde la concesión). Además, la S.R.L. no podría haber presentado con veracidad la DJ de uso de medio término ni podrá renovar, porque solo se renueva si hubo uso en los últimos 5 años. Declarada la caducidad, el signo queda disponible y el competidor puede registrarlo. Que la S.R.L. tenga alguna defensa depende de pruebas de uso que el caso no menciona.", "conceptos": ["Vigencia y mantenimiento", "Declaración jurada de uso de medio término", "Defensa de la marca: vías ante la copia"], "dudosa": false}, {"q": "¿Pueden vender la marca \"Dulce Jardín\"? ¿Qué figura jurídica usarían? Fundamente.", "respuesta": "Sí. El PPT enseña que la marca es un bien: se cede, se hereda y se puede administrar mal (caso Maradona), y que, a diferencia de una IG/DO, se puede vender, ceder o licenciar. Lo harían mediante un contrato, acto jurídico por el que dos o más partes manifiestan su consentimiento para transferir relaciones jurídicas patrimoniales (art. 957 CCyC), con sus elementos de capacidad, consentimiento, objeto, forma y causa. El objeto es un bien inmaterial: la marca no es una cosa (art. 16 CCyC llama cosas a los bienes materiales). Las fuentes de B10 no detallan el trámite de inscripción de la cesión en el INPI, así que no se desarrolla.", "conceptos": ["Nombres de personas famosas como marca", "Denominación de origen e indicación geográfica", "Beneficios de registrar una marca"], "dudosa": false}], "nota": null, "agregado": true, "fuentes": "PPT B10 slides 13-14, 26, 28, 32; material B10 §9, §11; conceptos 1er parcial (art. 957 y art. 16 CCyC) de parciales_viejos.md"}, {"id": "tp6-1", "titulo": "El consultorio que se digitaliza", "bolillas": [11], "origen": "TP6", "pie": "Un centro odontológico de Yerba Buena decide informatizar su atención. Para ello celebra cuatro acuerdos distintos:\n- Compra cinco computadoras a una casa de informática, que pasan a ser de su propiedad.\n- Alquila una impresora multifunción por un canon mensual. La impresora sigue siendo del proveedor.\n- Contrata a Valentina, programadora freelance, para que desarrolle un sistema de turnos a medida del consultorio.\n- Contrata a una empresa para que aloje el sistema en sus servidores (hosting) y le brinde soporte técnico por un abono mensual.\nLa dueña del consultorio sostiene que ninguno de esos acuerdos es un \"contrato informático\", porque todos se firmaron en papel y no por internet.", "pista": "Contrato informático se define por el OBJETO, no por el medio. Doble clasificación: objeto (equipamiento/software/servicios) y negocio jurídico (5 tipos). Cuadro servicios vs. intelectuales.", "preguntas": [{"q": "¿Tiene razón la dueña del consultorio? Expliquen qué define a un contrato como informático.", "respuesta": "No tiene razón. Un contrato informático es un acuerdo legal entre dos o más partes para establecer derechos y obligaciones sobre bienes o servicios informáticos como hardware y software: lo que lo define es su objeto. Los cuatro acuerdos recaen sobre hardware (computadoras, impresora), software (sistema de turnos) o servicios informáticos (hosting y soporte), así que los cuatro son contratos informáticos. Que se hayan firmado en papel es irrelevante: la dueña confunde el contrato informático con el electrónico, que se define por el medio de celebración (material); son clasificaciones independientes.", "conceptos": ["Contrato informático", "Contrato informático vs. contrato electrónico", "Objeto de los contratos informáticos"], "dudosa": false}, {"q": "Clasifiquen cada uno de los cuatro acuerdos según su objeto (equipamiento, software o servicios) y según el negocio jurídico (compraventa, leasing, locación, prestaciones intelectuales o prestación de servicios).", "respuesta": "1) Computadoras: de equipamiento (adquisición de hardware) y compraventa, porque se transmiten derechos de propiedad sobre un bien informático. 2) Impresora: de equipamiento y locación, porque se concede el uso del bien sin transferir la propiedad (el PPT da como ejemplo el alquiler mensual de impresoras); no es leasing porque no hay opción de compra. 3) Sistema de turnos: de software (desarrollo de un programa a medida) y de prestaciones intelectuales, porque su objeto es el trabajo intelectual de una programadora (ejemplo del PPT: el freelance que crea una app). 4) Hosting y soporte: de servicios informáticos (servicios vinculados al uso o soporte de tecnología) y de prestación de servicios, porque busca una actividad o resultado técnico, no la entrega de un bien.", "conceptos": ["Clasificación según el objeto", "Clasificación según el negocio jurídico"], "dudosa": false}, {"q": "El contrato con Valentina y el contrato de hosting, ¿son del mismo tipo? Señalen al menos dos diferencias entre ambos.", "respuesta": "No: el de Valentina es de prestaciones intelectuales y el de hosting es de prestación de servicios. Según el cuadro del PPT difieren en: la naturaleza del trabajo (intelectual o creativa en el desarrollo; técnica o material en el hosting); el grado de especialización (alto nivel técnico o profesional; puede ser bajo o medio); y el resultado esperado (innovador o analítico, como el desarrollo; funcional, como mantenimiento o soporte). El propio PPT pone como ejemplo típico de cada uno el desarrollo de software y el servicio de hosting.", "conceptos": ["Prestación de servicios vs. prestaciones intelectuales"], "dudosa": false}], "nota": null, "agregado": false, "fuentes": "PPT B11; material B11 (contrato electrónico)"}, {"id": "tp6-2", "titulo": "La tienda online que no aguantó el Hot Sale", "bolillas": [11], "origen": "TP6", "pie": "Una tienda tucumana de ropa deportiva vende unos 100 pedidos por mes y planea llegar a 5.000 en el próximo Hot Sale. Para eso contrata a una empresa de software un sistema de comercio electrónico. El proveedor le envía un contrato modelo, igual para todos sus clientes, que la tienda firma sin poder modificar ninguna cláusula.\nEn las reuniones previas, el vendedor aseguró que el sistema era \"súper robusto\". La tienda, por su parte, nunca le comentó cuántos pedidos esperaba. El contrato solo dice que el proveedor \"pondrá sus mejores esfuerzos para que la tienda funcione correctamente\".\nEl sistema se instaló un viernes y ese mismo día la tienda firmó el acta de conformidad, sin haber hecho ninguna prueba. Durante el Hot Sale la página se cayó al superar los 300 pedidos diarios. Además, los clientes que entraban desde iPhone no podían pagar porque el sistema no funcionaba en Safari.", "pista": "Adhesión; deberes de información y consejo vs. colaboración del usuario; medios vs. resultado; escalabilidad y compatibilidad; test de aceptación salteado.", "preguntas": [{"q": "¿Qué tipo de contrato firmó la tienda por la forma en que se celebró? ¿Por qué la desigualdad entre las partes es mayor en los contratos informáticos?", "respuesta": "Un contrato de adhesión: lo redactó unilateralmente el proveedor (predisponente) y la tienda (adherente) solo pudo aceptarlo o rechazarlo en bloque, sin modificar cláusulas; es el «contrato modelo, igual para todos». El CCyC los contempla en su art. 984 (material). En la práctica ya hay desigualdad económica y técnica, pero en los contratos informáticos se agrava porque el usuario carece del conocimiento técnico para evaluar el producto o servicio: el proveedor domina la tecnología y la tienda no sabía si el sistema aguantaría su crecimiento.", "conceptos": ["Contratos de adhesión", "Distancia proveedor-usuario y deber de información"], "dudosa": false}, {"q": "En la etapa precontractual, ¿qué deberes tenía el proveedor? ¿Y qué omitió hacer la tienda?", "respuesta": "El proveedor tenía el deber de información (comunicar con veracidad las características, funciones y limitaciones del sistema) y el deber de consejo (orientar al cliente hacia la opción más adecuada a sus necesidades), ambos derivados de la buena fe en la etapa precontractual (art. 961 CCyC). Decir que el sistema era «súper robusto» sin informar sus límites de carga ni de navegadores no cumple ese deber. La tienda, por su parte, omitió colaborar: el PPT exige que el usuario también precise el objeto, detallando sus necesidades y especificaciones, y nunca dijo cuántos pedidos esperaba. Responsabilidad compartida.", "conceptos": ["Distancia proveedor-usuario y deber de información", "Objetivos perseguidos por las partes", "Principio de buena fe"], "dudosa": false}, {"q": "La cláusula \"pondrá sus mejores esfuerzos\", ¿genera una obligación de medios o de resultado? Reescríbanla en uno o dos renglones para que sea una obligación de resultado.", "respuesta": "De medios: el proveedor solo se compromete a trabajar con diligencia, y cumple aunque el sistema no sirva (es el ejemplo del material). Esto contradice lo que el PPT señala como habitual en informática, donde las obligaciones del proveedor suelen ser de resultado porque un sistema que no cumple sus objetivos funcionales pierde valor económico; el usuario busca resultados (contracting for results) y el proveedor tiende a comprometer recursos. Redacción propuesta (agregada): «El proveedor garantiza que el sistema procesará al menos 5.000 pedidos durante el Hot Sale sin interrupciones y permitirá pagar desde Chrome, Firefox, Edge y Safari».", "conceptos": ["Obligación de medios vs. de resultado", "Objetivos perseguidos por las partes"], "dudosa": false}, {"q": "¿Qué dos características técnicas debieron quedar especificadas en el contrato para evitar estos problemas? ¿Qué etapa del contrato se salteó la tienda al firmar el acta de conformidad el mismo día de la instalación?", "respuesta": "La escalabilidad (capacidad de mantener el rendimiento cuando aumenta la carga y crecer sin rediseñar todo): el PPT dice que hay que fijar niveles de servicio y pruebas que demuestren que el proveedor soporta el crecimiento previsto, y el sistema cayó a los 300 pedidos diarios. Y la compatibilidad, en su dimensión de navegadores (Chrome, Firefox, Edge, Safari): hay que detallar versiones y protocolos que deben soportarse. Al firmar el acta el mismo día, la tienda se salteó la etapa de verificación o test de aceptación, en la que el usuario prueba que el sistema cumple los objetivos funcionales y el proveedor corrige las fallas antes de la aceptación definitiva; pasó directo a la etapa de aceptación, que inicia la garantía.", "conceptos": ["Escalabilidad", "Compatibilidad", "Test de aceptación", "Etapas del contrato informático"], "dudosa": false}], "nota": null, "agregado": false, "fuentes": "PPT B11; material B11 (art. 984 CCyC, ejemplo «mejores esfuerzos»)"}, {"id": "tp6-3", "titulo": "Las credenciales que nadie dio de baja", "bolillas": [12], "origen": "TP6", "pie": "Lucas trabajó tres años como administrador de sistemas en una cooperativa de crédito de San Miguel de Tucumán. En septiembre lo despidieron, pero nadie desactivó su usuario. Dos semanas después, desde su casa, Lucas ingresa al sistema de la cooperativa con su contraseña de siempre \"para ver cómo andaba todo sin él\".\nYa adentro, lee varios correos de la casilla del gerente, descarga la base de datos con nombre, DNI y deudas de los socios, y antes de salir borra el módulo de facturación, que deja de funcionar durante tres días.\nAl detectar el problema, un empleado del área propone \"formatear el servidor y reinstalar todo rápido para que nadie se entere\".", "pista": "Art. 153 bis «sin la debida autorización» (el permiso terminó con la relación) + agravante financiero; 153, 157 bis, 183 2º párr.; «por cualquier medio»; preservar la prueba y cadena de custodia.", "preguntas": [{"q": "El ingreso de Lucas, ¿es un acceso \"sin la debida autorización\" o \"excediendo la que posee\"? ¿En qué artículo encuadra? ¿Se aplica algún agravante por tratarse de una cooperativa de crédito?", "respuesta": "Es un acceso sin la debida autorización: su permiso terminó con el despido, igual que en el ejemplo del PPT del desarrollador que conserva sus credenciales y entra meses después «para ver cómo anda el sistema». Encuadra en el art. 153 bis CP, que castiga a quien a sabiendas accede por cualquier medio, sin la debida autorización o excediendo la que posea, a un sistema o dato informático de acceso restringido; Lucas sabía que ya no trabajaba allí (dolo) y el sistema tenía una barrera (contraseña). Se aplica el agravante del 2º párrafo, previsto cuando el acceso es en perjuicio de un sistema de un proveedor de servicios públicos o financieros: una cooperativa de crédito presta servicios financieros.", "conceptos": ["Acceso no autorizado a un sistema (art. 153 bis)", "Sin la debida autorización vs excediendo la autorización"], "dudosa": false}, {"q": "Además del acceso, Lucas realizó otras tres conductas (leer los correos, descargar la base de datos y borrar el módulo). Indiquen qué figura penal y qué artículo corresponde a cada una.", "respuesta": "Leer los correos del gerente: violación de comunicación electrónica (art. 153 CP), porque accedió indebidamente a comunicaciones que no le estaban dirigidas y sin autorización. Descargar la base con nombre, DNI y deudas: violación a bancos de datos (art. 157 bis CP), que castiga acceder a sabiendas e ilegítimamente a un banco de datos personales; conecta con la Ley 25.326 (B13). Borrar el módulo de facturación: daño o sabotaje informático (art. 183, 2º párrafo CP), que castiga alterar, destruir o inutilizar datos, programas o sistemas informáticos. Además, por la faceta civil, puede tener que indemnizar a la cooperativa por los tres días sin facturar.", "conceptos": ["Violación de comunicación electrónica (art. 153)", "Violación a bancos de datos (art. 157 bis)", "Daño o sabotaje informático (arts. 183 y 184)"], "dudosa": false}, {"q": "Lucas dice que no hizo nada grave porque \"no hackeó nada, entró con su propia contraseña\". ¿Tiene razón? Fundamenten.", "respuesta": "No. El art. 153 bis dice «por cualquier medio»: la técnica da igual (contraseña robada, vulnerabilidad o ingeniería social), y la bisagra del tipo es entrar sin permiso o salirse del que se tiene. El PPT lo dice para estos dos casos del oficio: la conducta puede ser delictiva aunque nadie haya «roto» nada en sentido técnico. Que la contraseña fuera «suya» no le da autorización, porque la autorización terminó con la relación laboral. Y el derecho penal castiga conductas, no etiquetas.", "conceptos": ["Acceso no autorizado a un sistema (art. 153 bis)", "El derecho penal castiga conductas, no etiquetas"], "dudosa": false}, {"q": "¿Es correcta la propuesta del empleado de formatear el servidor? Expliquen qué riesgo implica y qué debería hacer el área de sistemas en su lugar.", "respuesta": "No. Formatear destruye la prueba informática (logs de conexión, metadatos, contenido del disco), que es valiosísima y facilísima de borrar; y borrarla deliberadamente puede ser en sí mismo un delito contra la administración de justicia (art. 255 CP castiga a quien destruye o inutiliza objetos destinados a servir de prueba ante la autoridad), además de arruinar la causa contra Lucas. El área debe preservar, no limpiar: 1) aislar el equipo, cortando la red sin borrar ni reinstalar; 2) resguardar los registros, copiando logs antes de que se roten; 3) documentar qué se hizo, quién y cuándo; 4) tocar lo mínimo. Así se respeta la cadena de custodia, que es la diferencia entre una prueba que sirve ante un juez y una que se cae.", "conceptos": ["Destrucción de prueba informática (arts. 254 y 255)", "Cadena de custodia: preservar, no limpiar"], "dudosa": false}], "nota": null, "agregado": false, "fuentes": "PPT B12 (slides de art. 153 bis, 153, 157 bis, 183, prueba informática)"}, {"id": "tp6-4", "titulo": "Tres situaciones en una misma semana", "bolillas": [12], "origen": "TP6", "pie": "En la misma semana, tres estudiantes de la facultad tienen problemas con la tecnología:\n- Camila recibe un correo con el logo de su banco que dice \"Tu cuenta fue bloqueada, validá tus datos en 24 horas\". Hace clic, ingresa su usuario y contraseña en una página idéntica a la del banco y al día siguiente le vacían la cuenta.\n- Joaquín descarga gratis una versión \"desbloqueada\" de un videojuego. El programa funciona, pero sin que él lo note registra todo lo que teclea, incluida la clave de su billetera virtual.\n- Tomás, \"como broma\", ejecuta un script que envía miles de solicitudes por segundo a la página de inscripciones de la facultad, que queda fuera de servicio durante toda la tarde del cierre de inscripción. Cuando lo descubren, dice: \"Soy hacker, no delincuente; no robé ni rompí nada\".", "pista": "Phishing vs. pharming; troyano; ninguna modalidad tiene artículo propio (172, 173 incs. 15-16, 153 bis); robo de identidad sin figura autónoma; DoS = art. 197; conductas, no etiquetas.", "preguntas": [{"q": "¿Qué modalidad sufrió Camila y cuál Joaquín? Si Camila hubiera escrito ella misma la dirección correcta del banco y aun así hubiera llegado a la página falsa, ¿de qué modalidad se trataría?", "respuesta": "Camila sufrió phishing: un correo con una excusa de urgencia («tu cuenta fue bloqueada, validá tus datos») que la lleva a una página que cree que es la de su banco, diseñada para robarle las claves; el atacante necesitaba el clic. Joaquín sufrió un troyano: un programa que parece legítimo e inofensivo y, al ejecutarlo, registra lo que la víctima teclea, incluidas sus claves, sin que lo note (también encaja en la descripción de spyware). Si Camila hubiera escrito la dirección correcta y aun así llegara a la página falsa, sería pharming: se adultera el DNS o el archivo hosts, sin que el usuario haga clic en nada, y por eso es más difícil de detectar.", "conceptos": ["Phishing y pharming", "Troyano", "Ingeniería social"], "dudosa": false}, {"q": "¿En qué figuras penales podrían encuadrarse las maniobras que perjudicaron a Camila y a Joaquín? ¿Existe en nuestro Código Penal un delito autónomo de \"robo de identidad\"?", "respuesta": "Ninguna modalidad tiene un artículo con su nombre: se encuadran según cómo se concrete la maniobra. Vaciar la cuenta de Camila con sus credenciales encuadra en la estafa (art. 172 genérica y art. 173 inc. 16, manipulación informática), sumado muchas veces al acceso ilegítimo del art. 153 bis; el pharming el PPT lo ubica en el art. 173 inc. 16. En el caso de Joaquín, instalar el troyano en un equipo ajeno ya puede ser acceso ilegítimo (art. 153 bis) y distribuirlo puede encuadrar en el art. 183, 2º párrafo; si con la clave se defrauda, vuelve a ser estafa. El robo de identidad todavía no tiene figura penal autónoma: se lo persigue a través de la estafa (arts. 172 y 173) y de los demás delitos que se cometen al usar la identidad usurpada.", "conceptos": ["Estafa informática (arts. 172 y 173)", "Acceso no autorizado a un sistema (art. 153 bis)", "Robo de identidad", "Fraude por manipulación informática (art. 173 inc. 16)"], "dudosa": false}, {"q": "¿Qué ataque realizó Tomás y en qué artículo encuadra? ¿Lo exime de responsabilidad llamarse \"hacker\" o decir que fue una broma?", "respuesta": "Realizó un ataque de denegación de servicio (DoS): saturó el servidor con solicitudes hasta que dejó de responder al tráfico legítimo, lo que jurídicamente es interrumpir o entorpecer una comunicación (art. 197 CP). No lo exime: el derecho penal castiga conductas, no etiquetas, y lo que importa es si su conducta encaja en un tipo penal. Además actuó con dolo, porque sabía lo que hacía y quería el resultado (dejar la página fuera de servicio), aunque su motivo fuera «una broma». Ni siquiera un hacker de sombrero blanco puede hacerlo: el hacker ético trabaja con permiso del dueño, y Tomás no lo tenía.", "conceptos": ["Interrupción de comunicaciones (art. 197)", "Hacker", "Dolo y culpa", "El derecho penal castiga conductas, no etiquetas"], "dudosa": false}], "nota": null, "agregado": false, "fuentes": "PPT B12 (modalidades, encuadres, art. 197, hacker)"}, {"id": "tp6-5", "titulo": "La startup de la helada", "bolillas": [17], "origen": "TP6", "pie": "Tres estudiantes de Ingeniería en Computación crean una startup que alerta a productores de limón y frutilla sobre heladas. Su ventaja frente a la competencia es un modelo predictivo propio, con variables y umbrales que les llevó dos años ajustar. Además, la startup tiene:\n- una lista de 40 fincas clientes, con el precio especial pactado con cada una;\n- una planilla con sus costos, márgenes de ganancia y proyección de ventas para 2027;\n- un registro de 25 configuraciones de sensores que probaron y no funcionaron.\nToda esa información está en una carpeta de Google Drive compartida \"con cualquier persona que tenga el enlace\". Nadie firmó un acuerdo de confidencialidad, ni siquiera un cuarto colaborador que trabajó con ellos seis meses y luego se fue a una empresa del rubro.", "pista": "Cuatro tipos (técnica, comercial, financiera, negativa); tres requisitos simultáneos: falla el de medidas razonables; decisión estratégica (ingeniería inversa, revelación de la patente, ejemplo del algoritmo antifraude).", "preguntas": [{"q": "Clasifiquen la información de la startup según los cuatro tipos de información que pueden constituir un secreto comercial. ¿Por qué el registro de sensores que fallaron también tiene valor?", "respuesta": "El modelo predictivo es información técnica y científica: conocimientos aplicados al diseño o mejora de productos y procesos (el PPT incluye los algoritmos de software). La lista de 40 fincas con su precio especial es información comercial: da ventaja en la gestión del negocio y en las relaciones con clientes. La planilla de costos, márgenes y proyección de ventas es información financiera: datos económicos o contables que muestran la situación y estrategias de la empresa. El registro de las 25 configuraciones fallidas es información negativa: conocimiento sobre lo que no funciona. Tiene valor porque saber «qué no sirve» ahorra tiempo y dinero: un competidor que accede a él evita los mismos errores sin invertir en esas pruebas (como la lista de materiales que no le sirvieron a Edison).", "conceptos": ["Tipos de información confidencial", "Información negativa"], "dudosa": false}, {"q": "Analicen si el modelo predictivo reúne los tres requisitos de la Ley 24.766. ¿Cuál de ellos está en riesgo y por qué?", "respuesta": "La Ley 24.766 protege la información que reúne tres requisitos a la vez (art. 1 según el material). Es secreta: es propia y no la conoce la competencia. Tiene valor comercial por ser secreta: es su ventaja frente a la competencia y les llevó dos años ajustarla, lo que un competidor se ahorraría si accediera a ella. Pero el requisito de medidas razonables de protección no se cumple: la carpeta está abierta a «cualquier persona que tenga el enlace», no hay acceso restringido y nadie firmó un NDA, ni siquiera el colaborador que se fue a una empresa del rubro. Como dice el PPT, si no hay protección, no hay secreto; y como el enlace abierto la hace fácilmente accesible, también queda en riesgo el carácter secreto. Si falta un requisito, no hay protección legal.", "conceptos": ["Información confidencial (requisitos)", "Requisito 3: protección razonable", "Requisito 1: que la información sea secreta"], "dudosa": false}, {"q": "Los socios dudan entre patentar el modelo o mantenerlo en secreto. Teniendo en cuenta los factores de la decisión estratégica de protección (por ejemplo, la posibilidad de ingeniería inversa y la divulgación que exige la patente), ¿qué les recomendarían?", "respuesta": "Mantenerlo como secreto comercial, con acuerdos de confidencialidad. Por el tipo de resultado: no toda innovación puede patentarse, y un algoritmo o método puede no cumplir los requisitos de patentabilidad (el material agrega que el software en sí no se patenta en Argentina). Por la ingeniería inversa: si los productores solo reciben la alerta, no pueden descubrir las variables y umbrales analizando el servicio (supuesto del caso), así que el secreto es sostenible. Y la patente exige revelación pública, que acá sería perjudicial porque el valor está en lo que no se ve. Es el ejemplo del PPT del algoritmo antifraude: si el valor está en un modelo matemático o método no evidente, conviene el secreto comercial firmando NDA con todos los colaboradores; el código puede además registrarse como obra (software).", "conceptos": ["Decisión estratégica de protección", "Alternativas de protección jurídica"], "dudosa": false}, {"q": "Propongan dos medidas concretas que la startup debería adoptar de inmediato para proteger su información.", "respuesta": "1) Restringir el acceso: sacar la carpeta del modo «cualquier persona con el enlace» y darle acceso solo a quienes la necesitan, con contraseñas o permisos por persona. 2) Firmar acuerdos de confidencialidad (NDA) entre los socios y con todo colaborador, proveedor o socio futuro, definiendo qué información es confidencial. Son los ejemplos de medidas razonables del PPT; el material agrega marcar los documentos como «CONFIDENCIAL» y revocar los accesos el mismo día en que alguien se va (el cuarto colaborador debería haber perdido el acceso al irse).", "conceptos": ["Requisito 3: protección razonable", "Acuerdo de confidencialidad (NDA)"], "dudosa": false}], "nota": null, "agregado": false, "fuentes": "PPT B17; material B17 (art. 1, software no patentable, política de protección)"}, {"id": "tp6-6", "titulo": "El pendrive de la última semana", "bolillas": [17], "origen": "TP6", "pie": "Martina es analista en una empresa de software tucumana. Durante su última semana de trabajo, antes de pasar a una empresa competidora, copia en un pendrive el repositorio del sistema principal y la lista de clientes \"por las dudas\". La empresa lo descubre porque los registros de acceso muestran la descarga.\nEn paralelo, la misma empresa había negociado con una firma de logística la venta de su sistema. Durante las reuniones le mostró la arquitectura del sistema y su estructura de precios. La negociación no prosperó y el contrato nunca se firmó, pero meses después la firma de logística lanzó un sistema propio casi idéntico, basado en lo que había visto.\nA raíz de ambos episodios, la empresa decide que, de ahora en adelante, todo empleado y todo potencial cliente firme un acuerdo de confidencialidad.", "pista": "Deber de fidelidad art. 85 LCT y triple consecuencia; CCyC: confidencialidad en las tratativas aun sin contrato (⚠ 991 PPT / 992 material); estructura del NDA y excepciones.", "preguntas": [{"q": "Mientras seguía trabajando, ¿qué deber tenía Martina como trabajadora y en qué norma está previsto? ¿A qué consecuencias laborales, civiles y penales podría enfrentarse?", "respuesta": "El deber de fidelidad del art. 85 de la Ley de Contrato de Trabajo: el trabajador debe «observar todos los deberes de fidelidad» hacia el empleador, lo que incluye no revelar información confidencial o estratégica, incluso después de terminada la relación cuando se trata de datos sensibles. Copiar el repositorio y la lista de clientes para llevárselos a la competencia lo viola. Consecuencias según el PPT: laborales, despido con causa; civiles, acción de daños y perjuicios (la Ley 24.766 hace responsable a quien obtiene o utiliza información confidencial de forma contraria a los usos comerciales honestos); penales, posible denuncia si la información está protegida por la Ley 24.766, ya que el PPT castiga a quien por un medio indebido la obtiene con intención de beneficiarse o beneficiar a un tercero (es casi el ejemplo del ex empleado que copia la base de clientes). Los registros de acceso le sirven a la empresa como prueba de que protegía la información.", "conceptos": ["Confidencialidad en el ámbito laboral", "Responsabilidad civil por violación de la confidencialidad", "Responsabilidad penal (Ley 24.766)"], "dudosa": true}, {"q": "La firma de logística sostiene que no le debe nada a nadie porque \"nunca firmó ningún contrato\". ¿Tiene razón? Indiquen qué norma del Código Civil y Comercial resulta aplicable.", "respuesta": "No tiene razón. El CCyC reconoce el deber de reserva dentro del principio de buena fe: «Las partes deben conducirse de buena fe durante las tratativas y guardar confidencialidad sobre la información que reciban, aun cuando el contrato no llegue a celebrarse». El PPT lo cita como art. 991 CCyC; ⚠ el material aclara que el 991 regula la buena fe en las tratativas en general y que el deber de confidencialidad es el art. 992, por el cual quien recibió la información no debe revelarla ni usarla inapropiadamente y, si obtuvo una ventaja, debe indemnizar en la medida de su enriquecimiento. La arquitectura y la estructura de precios se recibieron en la negociación y se usaron para lanzar un sistema casi idéntico: hay responsabilidad aunque no exista contrato. Puede sumarse la acción de daños de la Ley 24.766.", "conceptos": ["Deber de confidencialidad en las negociaciones (CCyC)", "Principio de buena fe"], "dudosa": true}, {"q": "Enumeren los elementos básicos que debería contener el acuerdo de confidencialidad (NDA) que la empresa piensa usar, y redacten en no más de cuatro renglones la cláusula que define qué se considera información confidencial, incluyendo al menos una excepción.", "respuesta": "Elementos (PPT): 1) identificación de las partes (Parte Reveladora y Parte Receptora); 2) definición de información confidencial; 3) obligaciones de la parte receptora (usarla solo para el propósito autorizado, no divulgarla a terceros, adoptar medidas razonables de seguridad); 4) excepciones; 5) plazo de vigencia, que puede extenderse después del contrato principal; 6) sanciones o consecuencias por incumplimiento; 7) jurisdicción o ley aplicable. Cláusula propuesta (agregada): «Se considera Información Confidencial la información técnica (arquitectura, código fuente), comercial (listas de clientes) y financiera (estructura de precios) que la Parte Reveladora entregue a la Parte Receptora por cualquier medio. No lo es la que ya era pública, la que la Receptora ya conocía o la que obtenga por otros medios lícitos». El material advierte que una definición demasiado amplia («toda la información de la empresa») es difícil de hacer valer.", "conceptos": ["Acuerdo de confidencialidad (NDA)"], "dudosa": false}], "nota": "Dudosas por contradicción de artículos PPT vs material: penal (PPT art. 10 Ley 24.766 con prisión; material art. 12 + art. 156 CP con multa e inhabilitación) y tratativas (PPT art. 991; material art. 992). En el examen: el contenido sin arriesgar el número, o el del PPT con la aclaración.", "agregado": false, "fuentes": "PPT B17; material B17 (art. 992, NDA amplio)"}, {"id": "inv11-1", "titulo": "El sistema de stock acordado por WhatsApp", "bolillas": [11], "origen": "Inventado", "pie": "Una S.R.L. que distribuye golosinas en Concepción contrata a un estudio de desarrollo tucumano para que le haga un sistema de stock a medida. Todo se acuerda por WhatsApp y el «pliego» del estudio tiene dos renglones: «sistema de stock adecuado para la empresa». El gerente nunca explicó cuántos depósitos tienen ni que ya usan un sistema de facturación que el nuevo sistema debía alimentar.\nAl entregar, el gerente dice «esto no es lo que pedí» y se niega a pagar. El estudio responde que la S.R.L. nunca dijo qué necesitaba. Además, el sistema nuevo no puede intercambiar datos con el de facturación.", "pista": "Elementos del contrato (validez sin papel); clasificación software + prestaciones intelectuales; objeto cierto y determinado, colaboración del usuario, pliego técnico, deberes de información y consejo; compatibilidad/interoperabilidad.", "preguntas": [{"q": "¿Hay un contrato informático válido aunque se haya acordado por WhatsApp? ¿Qué clase de contrato es según su objeto y según el negocio jurídico?", "respuesta": "Sí. Es un contrato (art. 957 CCyC): dos partes con capacidad (una S.R.L. y un estudio) manifestaron su consentimiento sobre un objeto, y la forma fue la exteriorización por mensajes; el material aclara que los soportes informáticos son aceptados como forma válida de celebrar un contrato. Es informático porque establece derechos y obligaciones sobre un bien informático (software), sin importar el medio. Según el objeto es de software (desarrollo de un programa a medida) y según el negocio jurídico es de prestaciones intelectuales, porque su objeto es el trabajo intelectual de programadores y analistas.", "conce
